<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151e"><title>WAYMARK | Website Library</title>
<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#19212e;--panel2:#222d3d;--line:#334052;--text:#f2f5fa;--muted:#9eafc4;--accent:#7cc8b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850;letter-spacing:2px}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:12px;letter-spacing:1px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 90px)}aside{border-right:1px solid var(--line);padding:18px;background:#131b26}.main{padding:24px;min-width:0}.toprow,.tools,.cardactions,.group-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toprow{justify-content:space-between;margin-bottom:20px}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 13px}.btn.primary{background:var(--accent);color:#0c1b20;border-color:var(--accent);font-weight:750}.btn:hover{filter:brightness(1.12)}.btn.small{font-size:12px;padding:6px 9px}.search{width:100%;background:#111924;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent)}.toolbar{display:flex;gap:10px;margin:16px 0 22px;justify-content:space-between;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.tree-item{display:flex;align-items:center;gap:4px;border-radius:8px;margin:3px 0}.tree-item.active{background:#2b403e}.tree-item button{background:none;border:0;color:var(--text);text-align:left;padding:9px 5px;min-width:0}.tree-item .folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-item .count{color:var(--muted);font-size:11px;margin-right:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.tile{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden;min-width:0}.thumb{height:150px;background:linear-gradient(130deg,#243b4b,#35463e);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.fallback{font-size:54px;font-weight:850;color:#c2e5d8}.tilebody{padding:14px}.tile h3{font-size:16px;margin:0 0 6px;overflow-wrap:anywhere}.tile p{color:var(--muted);font-size:13px;line-height:1.45;min-height:36px;max-height:57px;overflow:hidden;margin:0 0 12px}.domain{font-size:12px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px}.tile .cardactions{justify-content:space-between}.tile a{color:#102021;background:var(--accent);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:700}.listview{display:flex;flex-direction:column}.listview .tile{display:flex}.listview .thumb{width:125px;min-width:125px;height:auto;min-height:130px}.listview .tilebody{flex:1}.empty{border:1px dashed var(--line);border-radius:16px;padding:50px 20px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(520px,calc(100% - 24px));max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}form{display:grid;gap:13px}label{display:grid;gap:6px;font-weight:650;font-size:13px}input,textarea,select{background:#101824;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);width:100%}textarea{min-height:90px;resize:vertical}.preview{width:100%;height:140px;object-fit:cover;border:1px dashed var(--line);border-radius:10px;display:none}.modalbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sidefoot{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;display:grid;gap:8px}.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29473f;color:#e9fff6;padding:10px 16px;border-radius:10px;display:none;z-index:10}@media(max-width:740px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.main{padding:16px}.tree{max-height:170px;overflow:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:115px}.tilebody{padding:10px}.tile h3{font-size:14px}.tile p{font-size:12px}.btn{padding:9px}.listview .thumb{width:100px;min-width:100px}.subtitle{display:none}}@media(max-width:390px){.grid{grid-template-columns:1fr}.thumb{height:170px}}
</style></head><body>
<header><div><div class="brand">WAY<span>MARK</span> ◈</div><div class="subtitle">YOUR CORNER OF THE WEB</div></div><div class="tools"><button class="btn" id="newGroupTop">＋ Group</button><button class="btn primary" id="newSite">＋ Save Website</button></div></header>
<div class="layout"><aside><div class="sidehead"><strong>COLLECTIONS</strong><button class="btn small" id="newGroup">＋</button></div><div id="tree" class="tree"></div><div class="sidefoot"><strong class="muted">YOUR LIBRARY</strong><button class="btn small" id="export">↓ Export backup</button><button class="btn small" id="import">↑ Import backup</button><input type="file" id="importFile" accept="application/json,.json" hidden><div class="muted" style="font-size:12px">Saved on this device. Export a backup to move between devices or browsers.</div></div></aside>
<main class="main"><div class="toprow"><div><div id="crumb" class="crumb">All websites</div><h1 id="heading" style="margin:0;font-size:26px">All websites</h1></div><div class="tools"><button class="btn small" id="editGroup" hidden>Rename group</button><button class="btn small" id="deleteGroup" hidden>Delete group</button></div></div><input class="search" id="search" type="search" placeholder="⌕ Search names, descriptions, web addresses, groups…"><div class="toolbar"><span class="muted" id="results"></span><div class="tools"><select id="sort" aria-label="Sort websites" style="width:auto"><option value="recent">Recently added</option><option value="az">Name A–Z</option><option value="domain">Web address</option></select><button class="btn small" id="view">☷ List</button></div></div><div id="cards" class="grid"></div></main></div>
<dialog id="siteDialog"><form id="siteForm"><h2 id="siteDialogTitle" style="margin:0">Save a website</h2><label>Website name<input name="name" required maxlength="120" placeholder="e.g. My favorite design tool"></label><label>Web address<input name="url" required placeholder="https://example.com" inputmode="url"></label><label>Description<textarea name="description" placeholder="What is this website for?"></textarea></label><label>Group<select name="group" id="siteGroup"></select></label><label>Cover image (choose from your device)<input type="file" id="cover" accept="image/*"></label><img id="preview" class="preview" alt="Selected cover preview"><button type="button" id="clearImage" class="btn small">Remove image</button><div class="modalbuttons"><button type="button" class="btn cancel">Cancel</button><button type="submit" class="btn primary">Save website</button></div></form></dialog>
<dialog id="groupDialog"><form id="groupForm"><h2 id="groupDialogTitle" style="margin:0">New group</h2><label>Group name<input name="name" required maxlength="80" placeholder="e.g. Art & Inspiration"></label><label>Inside group<select id="parentGroup" name="parent"></select></label><div class="modalbuttons"><button type="button" class="btn cancel">Cancel</button><button type="submit" class="btn primary">Save group</button></div></form></dialog>
<div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='waymark-web-library-v1';let data={sites:[],groups:[]},selected='all',query='',view='grid',editSite=null,editGroup=null,pendingImage=null;
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.sites)&&Array.isArray(old.groups))data=old}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Storage is full. Try smaller cover images or export a backup.');return false}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function descendants(id){const out=new Set([id]);let changed=true;while(changed){changed=false;for(const g of data.groups)if(out.has(g.parent)&&!out.has(g.id)){out.add(g.id);changed=true}}return out}
function path(id){const parts=[],seen=new Set();while(id&&id!=='all'&&!seen.has(id)){seen.add(id);const g=data.groups.find(x=>x.id===id);if(!g)break;parts.unshift(g.name);id=g.parent}return parts.join(' / ')}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validUrl(s){try{const u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);return ['http:','https:'].includes(u.protocol)&&u.hostname.includes('.')?u.href:null}catch{return null}}
function renderTree(){const root=$('tree');root.replaceChildren();function add(id,name,depth){const row=document.createElement('div');row.className='tree-item'+(selected===id?' active':'');row.style.paddingLeft=(depth*13)+'px';const b=document.createElement('button');b.className='folder-name';b.textContent=(id==='all'?'◈ ':'▸ ')+name;b.onclick=()=>{selected=id;render()};const n=document.createElement('span');n.className='count';n.textContent=id==='all'?data.sites.length:data.sites.filter(s=>descendants(id).has(s.group)).length;row.append(b,n);root.append(row);for(const g of data.groups.filter(x=>x.parent===id).sort((a,b)=>a.name.localeCompare(b.name)))add(g.id,g.name,depth+1)}add('all','All websites',0)}
function render(){renderTree();const active=data.groups.find(g=>g.id===selected);$('heading').textContent=active?.name||'All websites';$('crumb').textContent=active?path(selected):'Your complete collection';$('editGroup').hidden=!active;$('deleteGroup').hidden=!active;let sites=data.sites.filter(s=>selected==='all'||descendants(selected).has(s.group));const q=query.toLocaleLowerCase().trim();if(q)sites=sites.filter(s=>[s.name,s.url,s.description,path(s.group)].join(' ').toLocaleLowerCase().includes(q));const sort=$('sort').value;sites.sort((a,b)=>sort==='az'?a.name.localeCompare(b.name):sort==='domain'?a.url.localeCompare(b.url):(b.created||0)-(a.created||0));$('results').textContent=sites.length+' website'+(sites.length===1?'':'s');const cards=$('cards');cards.className=view==='grid'?'grid':'grid listview';cards.replaceChildren();if(!sites.length){const empty=document.createElement('div');empty.className='empty';empty.style.gridColumn='1/-1';empty.textContent=query?'No websites match your search.':'Nothing here yet. Save a website to get started.';cards.append(empty)}
for(const s of sites){const tile=document.createElement('article');tile.className='tile';const thumb=document.createElement('div');thumb.className='thumb';if(s.image){const img=document.createElement('img');img.src=s.image;img.alt='Cover for '+s.name;thumb.append(img)}else{const f=document.createElement('div');f.className='fallback';f.textContent=(s.name||'?').slice(0,1).toUpperCase();thumb.append(f)}const body=document.createElement('div');body.className='tilebody';const h=document.createElement('h3');h.textContent=s.name;const d=document.createElement('div');d.className='domain';try{d.textContent=new URL(s.url).hostname}catch{d.textContent=s.url}const p=document.createElement('p');p.textContent=s.description||'No description';const actions=document.createElement('div');actions.className='cardactions';const open=document.createElement('a');open.href=s.url;open.target='_blank';open.rel='noopener noreferrer';open.textContent='Visit ↗';const edit=document.createElement('button');edit.className='btn small';edit.textContent='Edit';edit.onclick=()=>openSite(s.id);const del=document.createElement('button');del.className='btn small';del.textContent='×';del.title='Delete website';del.setAttribute('aria-label','Delete '+s.name);del.onclick=()=>{if(confirm('Delete '+s.name+'?')){data.sites=data.sites.filter(x=>x.id!==s.id);save();render()}};actions.append(open,edit,del);body.append(h,d,p,actions);tile.append(thumb,body);cards.append(tile)}}
function groupOptions(select,current,excluded){select.replaceChildren();const all=document.createElement('option');all.value='all';all.textContent='Top level / All websites';select.append(all);function walk(parent,depth){for(const g of data.groups.filter(x=>x.parent===parent).sort((a,b)=>a.name.localeCompare(b.name))){if(excluded?.has(g.id))continue;const o=document.createElement('option');o.value=g.id;o.textContent='　'.repeat(depth)+'↳ '+g.name;select.append(o);walk(g.id,depth+1)}}walk('all',0);select.value=current||'all'}
function openSite(id){editSite=id||null;const s=data.sites.find(x=>x.id===id);$('siteDialogTitle').textContent=s?'Edit website':'Save a website';const f=$('siteForm');f.reset();f.elements.name.value=s?.name||'';f.elements.url.value=s?.url||'';f.elements.description.value=s?.description||'';groupOptions($('siteGroup'),s?.group||(selected==='all'?'all':selected));pendingImage=s?.image||null;updatePreview();$('siteDialog').showModal()}
function updatePreview(){$('preview').style.display=pendingImage?'block':'none';$('preview').src=pendingImage||''}
$('cover').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Choose an image file.');try{const img=await createImageBitmap(file);const scale=Math.min(1,960/img.width,640/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',.78);img.close();updatePreview()}catch{alert('Could not read that image. Try JPEG or PNG.')}};
$('clearImage').onclick=()=>{pendingImage=null;$('cover').value='';updatePreview()};
$('siteForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const url=validUrl(f.elements.url.value.trim());if(!url)return alert('Enter a valid http or https website address.');const obj={id:editSite||uid(),name:f.elements.name.value.trim(),url,description:f.elements.description.value.trim(),group:$('siteGroup').value,image:pendingImage,created:editSite?(data.sites.find(x=>x.id===editSite)?.created||Date.now()):Date.now()};if(!obj.name)return;if(editSite)data.sites=data.sites.map(x=>x.id===editSite?obj:x);else data.sites.push(obj);if(save()){$('siteDialog').close();render();toast(editSite?'Website updated':'Website saved')}};
function openGroup(id){editGroup=id||null;const g=data.groups.find(x=>x.id===id);$('groupDialogTitle').textContent=g?'Edit group':'New group';$('groupForm').reset();$('groupForm').elements.name.value=g?.name||'';groupOptions($('parentGroup'),g?.parent||(selected==='all'?'all':selected),id?descendants(id):null);$('groupDialog').showModal()}
$('groupForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const name=f.elements.name.value.trim();if(!name)return;const parent=$('parentGroup').value;if(editGroup){const g=data.groups.find(x=>x.id===editGroup);if(!g)return;g.name=name;g.parent=parent}else data.groups.push({id:uid(),name,parent});if(save()){$('groupDialog').close();render();toast('Group saved')}};
$('newSite').onclick=()=>openSite();$('newGroup').onclick=()=>openGroup();$('newGroupTop').onclick=()=>openGroup();$('editGroup').onclick=()=>openGroup(selected);$('deleteGroup').onclick=()=>{const g=data.groups.find(x=>x.id===selected);if(!g)return;const ids=descendants(g.id);if(!confirm('Delete '+g.name+' and its subgroups? Websites inside will move to All websites.'))return;data.groups=data.groups.filter(x=>!ids.has(x.id));for(const s of data.sites)if(ids.has(s.group))s.group='all';selected='all';save();render()};$('search').oninput=e=>{query=e.target.value;render()};$('sort').onchange=render;$('view').onclick=()=>{view=view==='grid'?'list':'grid';$('view').textContent=view==='grid'?'☷ List':'▦ Grid';render()};document.querySelectorAll('.cancel').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'waymark-v1',exported:new Date().toISOString(),...data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='waymark-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.sites)||!Array.isArray(obj.groups))throw Error('Invalid backup');if(!confirm('Replace your current library with this backup? Export your current library first if you want to keep it.'))return;const groups=obj.groups.filter(g=>g&&typeof g.id==='string'&&typeof g.name==='string').map(g=>({id:g.id,name:g.name,parent:typeof g.parent==='string'?g.parent:'all'}));const ids=new Set(groups.map(g=>g.id));for(const g of groups)if(g.parent!=='all'&&!ids.has(g.parent))g.parent='all';const sites=obj.sites.filter(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&validUrl(s.url)).map(s=>({id:s.id,name:s.name,url:validUrl(s.url),description:String(s.description||''),group:ids.has(s.group)?s.group:'all',image:typeof s.image==='string'&&s.image.startsWith('data:image/')?s.image:null,created:Number(s.created)||Date.now()}));data={groups,sites};selected='all';query='';$('search').value='';save();render();toast('Backup imported')}catch(err){alert('Could not import: '+err.message)}finally{e.target.value=''}};
render();
})();
</script></body></html>
