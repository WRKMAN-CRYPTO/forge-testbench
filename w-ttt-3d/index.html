<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>W Cube — 3D Tic-Tac-Toe</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111821;--line:#2b3846;--text:#eef4f8;--muted:#90a0ae;--accent:#75dda1;--x:#72b8ff;--o:#e9b86d;--win:#f27f79}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
body{padding:12px 10px calc(18px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
main{max-width:820px;margin:auto}
header{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:4px 0 10px}
h1{font-size:1.08rem;margin:0}.sub{font-size:.76rem;color:var(--muted);margin-top:2px}.badge{font-size:.72rem;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 5px;text-align:center}
.stat b{display:block;font-size:1.02rem}.stat span{font-size:.66rem;color:var(--muted)}
.stage{position:relative;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#04070a}
canvas{display:block;width:100%;aspect-ratio:1.1/1;touch-action:manipulation}
.corner{position:absolute;left:9px;bottom:8px;background:#05080bcc;border:1px solid #24303a;color:#d7e0e6;padding:5px 7px;border-radius:8px;font-size:.7rem;pointer-events:none}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
button{min-height:46px;border-radius:13px;border:1px solid var(--line);background:#151e27;color:var(--text);font:700 .9rem system-ui;padding:8px;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px)}button.sel{background:#10281c;border-color:#387652;color:#c7f6d5}.wide{grid-column:1/-1}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.layers button{min-height:42px;font-size:.82rem}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:.75rem;color:var(--muted);line-height:1.35}
#msg{text-align:right;max-width:52%}
@media(max-width:380px){.stat b{font-size:.92rem}.stat span{font-size:.61rem}button{font-size:.82rem}}
</style>
</head>
<body>
<main id="app"><div id="booterr" style="display:none;margin:0 0 10px;padding:10px;border:1px solid #7f3b39;border-radius:10px;color:#ffd8d5;background:#2a1111;font:600 13px system-ui"></div>
<header>
  <div><h1>W Cube</h1><div class="sub">3×3×3 tic-tac-toe · coordinates are addresses</div></div>
  <div class="badge"><span id="lines">0</span> geometric lines</div>
</header>
<section class="stats">
  <div class="stat"><b id="turn">X</b><span>Turn</span></div>
  <div class="stat"><b id="moves">0 / 27</b><span>Moves</span></div>
  <div class="stat"><b id="addr">—</b><span>Last address</span></div>
</section>
<section class="stage">
  <canvas id="c" aria-label="Rotatable three dimensional tic tac toe board"></canvas>
  <div class="corner" id="state">PLAY · W51001</div>
</section>
<section class="controls">
  <button id="left" type="button">↶ Left</button>
  <button id="up" type="button">↑ Tilt</button>
  <button id="right" type="button">Right ↷</button>
  <button id="down" type="button">↓ Tilt</button>
  <button id="home" type="button">Home view</button>
  <button id="clear" type="button">Reset</button>
</section>
<section class="layers" aria-label="Layer filter">
  <button id="z1" type="button">Z1</button>
  <button id="z2" type="button">Z2</button>
  <button id="z3" type="button">Z3</button>
</section>
<div class="foot">
  <div><b>Tap a node to play.</b><br>Rotate the view. Addresses never move.</div>
  <div id="msg" aria-live="polite">X to move.</div>
</div>
</main>
<script>
(()=>{const booterr=document.getElementById('booterr');window.addEventListener('error',e=>{booterr.style.display='block';booterr.textContent='Startup error: '+(e.message||'unknown error')});const root=document.getElementById('app');if(root.dataset.w==='3416')return;root.dataset.w='3416';
const c=document.getElementById('c'),g=c.getContext('2d'),$=id=>document.getElementById(id);
const ui={turn:$('turn'),moves:$('moves'),addr:$('addr'),lines:$('lines'),state:$('state'),msg:$('msg'),z1:$('z1'),z2:$('z2'),z3:$('z3')};
const W=Object.freeze({X:50001,O:50002,PLAY:51001,XWIN:51011,OWIN:51012,DRAW:51020,ALL:52000,Z1:52001,Z2:52002,Z3:52003});
const MARK=new Map([[W.X,'X'],[W.O,'O']]),COLOR=new Map([[W.X,'#72b8ff'],[W.O,'#e9b86d']]);
const S={turnW:W.X,gameW:W.PLAY,layerW:W.ALL,ax:-.52,ay:.68,w:640,h:580,lastW:0,moves:0,cells:[],wins:[],winLine:[]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const enc=(x,y,z)=>x*100+y*10+z;
const dec=w=>[Math.floor(w/100),Math.floor(w/10)%10,w%10];
for(let x=1;x<=3;x++)for(let y=1;y<=3;y++)for(let z=1;z<=3;z++)S.cells.push({w:enc(x,y,z),markW:0,px:0,py:0,d:0});

function midpoint(a,b,c){return a[0]+c[0]===2*b[0]&&a[1]+c[1]===2*b[1]&&a[2]+c[2]===2*b[2]}
function discoverLines(){const out=[],seen=new Set();for(let i=0;i<S.cells.length;i++)for(let j=0;j<S.cells.length;j++)for(let k=i+1;k<S.cells.length;k++){if(i===j||j===k||i===k)continue;const a=dec(S.cells[i].w),b=dec(S.cells[j].w),cc=dec(S.cells[k].w);if(!midpoint(a,b,cc))continue;const key=[S.cells[i].w,S.cells[j].w,S.cells[k].w].sort((p,q)=>p-q).join('-');if(seen.has(key))continue;seen.add(key);out.push(key.split('-').map(Number))}return out}
S.wins=discoverLines();ui.lines.textContent=S.wins.length;

function project(w){const q=dec(w),x=(q[0]-2)*1.1,y=(q[1]-2)*1.1,z=(q[2]-2)*1.1;
const cy=Math.cos(S.ay),sy=Math.sin(S.ay),cx=Math.cos(S.ax),sx=Math.sin(S.ax);
const x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y;
const y2=y1*cx-z1*sx,z2=y1*sx+z1*cx;
const scale=Math.min(S.w,S.h)*.165,p=1/(1+z2*.11);
return{x:S.w*.5+x1*scale*p,y:S.h*.48+y2*scale*p,d:z2,p}}
function visible(o){if(S.layerW===W.ALL)return 1;const z=dec(o.w)[2];return z===S.layerW-W.ALL?1:0}
function stateLabel(){if(S.gameW===W.PLAY)return'PLAY · W51001';if(S.gameW===W.XWIN)return'X WINS · W51011';if(S.gameW===W.OWIN)return'O WINS · W51012';return'DRAW · W51020'}
function layerName(){if(S.layerW===W.ALL)return'ALL';return'Z'+(S.layerW-W.ALL)}
function render(){
  g.clearRect(0,0,S.w,S.h);g.fillStyle='#04070a';g.fillRect(0,0,S.w,S.h);
  const projected=S.cells.map(o=>{const p=project(o.w);o.px=p.x;o.py=p.y;o.d=p.d;return o}).sort((a,b)=>a.d-b.d);
  const edges=[];for(const a of S.cells){if(!visible(a))continue;const A=dec(a.w);for(const b of S.cells){if(a.w>=b.w||!visible(b))continue;const B=dec(b.w),dist=Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1])+Math.abs(A[2]-B[2]);if(dist===1)edges.push([a,b])}}
  g.strokeStyle='#263440';g.lineWidth=1;g.globalAlpha=.72;for(const [a,b] of edges){g.beginPath();g.moveTo(a.px,a.py);g.lineTo(b.px,b.py);g.stroke()}
  const winSet=new Set(S.winLine);
  for(const o of projected){if(!visible(o))continue;const near=1-clamp((o.d+2.4)/4.8,0,1),r=10+near*3;
    g.globalAlpha=.96;g.fillStyle=winSet.has(o.w)?'#341716':'#0c1319';g.strokeStyle=winSet.has(o.w)?'#f27f79':'#526474';g.lineWidth=winSet.has(o.w)?3:1.3;
    g.beginPath();g.arc(o.px,o.py,r,0,6.283);g.fill();g.stroke();
    if(o.markW){g.fillStyle=COLOR.get(o.markW);g.font='700 '+Math.round(r*1.45)+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(MARK.get(o.markW),o.px,o.py+.5)}
  }
  g.globalAlpha=1;g.fillStyle='#8fa0ad';g.font='600 11px system-ui';g.textAlign='left';g.fillText('View '+layerName(),10,18)
}
function winning(markW){for(const line of S.wins){let n=0;for(const w of line){const o=S.cells.find(c=>c.w===w);if(o&&o.markW===markW)n++}if(n===3)return line}return[]}
function hud(){ui.turn.textContent=S.gameW===W.PLAY?MARK.get(S.turnW):'—';ui.moves.textContent=S.moves+' / 27';ui.addr.textContent=S.lastW||'—';ui.state.textContent=stateLabel();ui.z1.className=S.layerW===W.Z1?'sel':'';ui.z2.className=S.layerW===W.Z2?'sel':'';ui.z3.className=S.layerW===W.Z3?'sel':''}
function play(o){if(S.gameW!==W.PLAY||o.markW)return;o.markW=S.turnW;S.lastW=o.w;S.moves++;const line=winning(S.turnW);if(line.length){S.winLine=line;S.gameW=S.turnW===W.X?W.XWIN:W.OWIN;ui.msg.textContent=MARK.get(S.turnW)+' wins through '+line.join(' → ')+'.';hud();render();return}if(S.moves===27){S.gameW=W.DRAW;ui.msg.textContent='Draw. Cube exhausted.';hud();render();return}S.turnW=S.turnW===W.X?W.O:W.X;ui.msg.textContent=MARK.get(S.turnW)+' to move.';hud();render()}
function nearest(x,y){let best=0,bd=26*26;const sorted=[...S.cells].sort((a,b)=>b.d-a.d);for(const o of sorted){if(!visible(o))continue;const dx=x-o.px,dy=y-o.py,q=dx*dx+dy*dy;if(q<bd){bd=q;best=o}}return best}
function resize(){const r=c.getBoundingClientRect(),d=clamp(devicePixelRatio||1,1,1.4),nw=Math.max(300,Math.round(r.width*d)),nh=Math.max(300,Math.round(r.width*.91*d));if(nw===c.width&&nh===c.height)return;S.w=nw;S.h=nh;c.width=nw;c.height=nh;render()}
function reset(){for(const o of S.cells)o.markW=0;S.turnW=W.X;S.gameW=W.PLAY;S.layerW=W.ALL;S.lastW=0;S.moves=0;S.winLine=[];ui.msg.textContent='X to move.';hud();render()}
function rotate(dx,dy){S.ay+=dx;S.ax=clamp(S.ax+dy,-1.2,1.2);render()}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height,o=nearest(x,y);if(o)play(o)});
$('left').addEventListener('click',()=>rotate(-.22,0));$('right').addEventListener('click',()=>rotate(.22,0));$('up').addEventListener('click',()=>rotate(0,-.18));$('down').addEventListener('click',()=>rotate(0,.18));$('home').addEventListener('click',()=>{S.ax=-.52;S.ay=.68;render()});$('clear').addEventListener('click',reset);
ui.z1.addEventListener('click',()=>{S.layerW=S.layerW===W.Z1?W.ALL:W.Z1;hud();render()});ui.z2.addEventListener('click',()=>{S.layerW=S.layerW===W.Z2?W.ALL:W.Z2;hud();render()});ui.z3.addEventListener('click',()=>{S.layerW=S.layerW===W.Z3?W.ALL:W.Z3;hud();render()});
window.addEventListener('resize',resize,{passive:true});resize();reset();
})();
</script>
</body>
</html>
