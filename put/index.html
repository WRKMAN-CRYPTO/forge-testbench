<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11130f">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="PUT">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PUT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>PUT — remember where things are</title>
<style>
:root{color-scheme:dark;--bg:#11130f;--panel:#1a1d17;--panel2:#22261e;--ink:#f4f0df;--muted:#aaa997;--accent:#d6f36a;--danger:#ff8c79;--line:#34392d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html{background:var(--bg)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none;-webkit-touch-callout:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
.shell{max-width:620px;margin:auto;min-height:100dvh;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:2px solid var(--accent);border-radius:12px;display:grid;place-items:center;font-weight:900;color:var(--accent)}
h1{font-size:20px;margin:0;letter-spacing:.08em}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconBtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:44px;height:44px;border-radius:14px;font-size:20px}
.hero{background:linear-gradient(180deg,#20251c,#191c16);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 40px #0004}
.heroLabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.heroTitle{font-size:30px;line-height:1.02;margin:0 0 16px;font-weight:900}
.capture{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}
.photoBtn{position:relative;height:86px;border:1px dashed #667052;border-radius:18px;background:#151811;color:var(--accent);display:grid;place-items:center;font-size:30px;overflow:hidden}
.photoBtn img{width:100%;height:100%;object-fit:cover;display:none}.photoBtn.has img{display:block}.photoBtn.has span{display:none}
.fields{display:grid;gap:10px}.inputWrap{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.inputWrap input{width:100%;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:#11140f;color:var(--ink);padding:0 12px;outline:none}.inputWrap input:focus{border-color:#829047}.mic{height:40px;min-width:76px;padding:0 10px;border:1px solid #404638;border-radius:12px;background:#1a1d17;color:var(--muted);font-size:12px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.mic.listening{color:#171911;background:var(--accent);border-color:var(--accent)}
.save{width:100%;height:50px;border-radius:15px;border:0;background:var(--accent);color:#181b12;font-weight:900;font-size:16px;margin-top:12px}
.save:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.search{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:3;background:var(--bg);padding:2px 0 6px}.search input{width:100%;height:50px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:0 16px;font-size:16px;outline:none}.search input:focus{border-color:#829047}
.sectionHead{display:flex;justify-content:space-between;align-items:end}.sectionHead h2{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 18px;color:var(--muted);text-align:center;line-height:1.5}
.card{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}.thumb{width:72px;height:72px;border-radius:13px;background:var(--panel2);object-fit:cover}.thing{font-weight:850;font-size:16px;line-height:1.2}.where{font-size:13px;color:var(--accent);margin-top:5px;line-height:1.25}.when{font-size:11px;color:var(--muted);margin-top:5px}.more{border:0;background:transparent;color:var(--muted);font-size:21px;padding:12px 8px}
.suggestions{display:flex;gap:7px;overflow:auto;padding-bottom:2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:12px}.chip:active{border-color:var(--accent);color:var(--accent)}
.backup{border-top:1px solid var(--line);padding-top:14px;margin-top:2px}.backupHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:9px}.backupTitle{font-size:12px;font-weight:850;letter-spacing:.08em;color:var(--muted)}.backupNote{font-size:11px;color:var(--muted)}.backupBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.backupBtn{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:800}.backupBtn:active{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f0f1d8;color:#171911;padding:11px 15px;border-radius:999px;font-weight:750;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:calc(100vw - 28px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:22px;padding:18px;width:min(92vw,430px)}dialog::backdrop{background:#0009}.dlgTitle{font-weight:900;font-size:18px}.dlgBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.secondary,.danger{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}.danger{color:var(--danger)}
@media(max-width:430px){.capture{grid-template-columns:78px 1fr}.photoBtn{height:78px}.mic{min-width:68px;padding:0 8px;font-size:11px}}
@media(min-width:700px){.shell{padding-top:28px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><div class="mark">P</div><div><h1>PUT</h1><div class="sub">memory for physical things</div></div></div><button class="iconBtn" id="focusSearch" aria-label="Find something">⌕</button></header>
<section class="hero">
<div class="heroLabel">I'm putting this here</div>
<p class="heroTitle">Snap it. Say where. Forget it.</p>
<div class="capture">
<label class="photoBtn" id="photoBtn"><span>＋</span><img id="preview" alt="Selected object"><input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
<div class="fields">
<div class="inputWrap"><input id="thing" autocomplete="off" placeholder="What is it?" aria-label="What is it"><button class="mic" data-target="thing" aria-label="Speak item name"><span aria-hidden="true">🎙</span><span>Speak</span></button></div>
<div class="inputWrap"><input id="where" autocomplete="off" placeholder="Where are you putting it?" aria-label="Where are you putting it"><button class="mic" data-target="where" aria-label="Speak location"><span aria-hidden="true">🎙</span><span>Speak</span></button></div>
</div>
</div>
<div class="suggestions" id="suggestions"></div>
<button class="save" id="save">REMEMBER THIS</button>
<div class="hint">No setup. Locations become suggestions only after you actually use them.</div>
</section>
<div class="search"><input id="q" type="search" autocomplete="off" placeholder="Where are my wire cutters?" aria-label="Search remembered things"></div>
<div class="sectionHead"><h2 id="listTitle">RECENT MEMORY</h2><span class="count" id="count"></span></div>
<section class="list" id="list"></section>
<section class="backup"><div class="backupHead"><div class="backupTitle">YOUR MEMORY, YOUR FILE</div><div class="backupNote">photos included</div></div><div class="backupBtns"><button class="backupBtn" id="exportBtn">↑ EXPORT</button><button class="backupBtn" id="importBtn">↓ IMPORT</button></div><input id="importFile" type="file" accept="application/json,.json" hidden></section>
</main>
<dialog id="itemDialog"><div class="dlgTitle" id="dlgThing"></div><div class="where" id="dlgWhere"></div><div class="when" id="dlgWhen"></div><div class="dlgBtns"><button class="secondary" id="closeDlg">Close</button><button class="danger" id="deleteItem">Forget</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
const DB='put-memory-v1', STORE='items';
let db, photoData=null, activeId=null, items=[], activeRecognition=null, voiceTimer=null;
const $=s=>document.querySelector(s);
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(v){return new Promise((res,rej)=>{const r=tx('readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600)}
function age(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';const d=Math.floor(s/86400);return d===1?'yesterday':d+'d ago'}
function esc(v=''){return v.replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\b(where|are|is|my|the|did|i|put|find|show|me|a|an)\b/g,' ').replace(/\s+/g,' ').trim()}
function score(item,query){if(!query)return 1;const q=normalize(query);if(!q)return 1;const hay=normalize(item.thing+' '+item.where);if(hay.includes(q))return 100;return q.split(' ').reduce((n,w)=>n+(hay.includes(w)?1:0),0)}
function render(){const query=$('#q').value.trim();const ranked=items.map(x=>[x,score(x,query)]).filter(x=>query?x[1]>0:true).sort((a,b)=>query?b[1]-a[1]||b[0].ts-a[0].ts:b[0].ts-a[0].ts).map(x=>x[0]);$('#listTitle').textContent=query?'FOUND':'RECENT MEMORY';$('#count').textContent=ranked.length+(ranked.length===1?' thing':' things');const list=$('#list');if(!ranked.length){list.innerHTML='<div class="empty">'+(query?'Nothing remembered matches that yet.':'Nothing remembered yet.<br>Your first tiny memory goes here.')+'</div>';return}list.innerHTML=ranked.map(x=>`<article class="card" data-id="${x.id}">${x.photo?`<img class="thumb" src="${x.photo}" alt="">`:`<div class="thumb"></div>`}<div><div class="thing">${esc(x.thing)}</div><div class="where">↳ ${esc(x.where)}</div><div class="when">remembered ${age(x.ts)}</div></div><button class="more" aria-label="More">•••</button></article>`).join('');list.querySelectorAll('.card').forEach(c=>c.onclick=()=>showItem(c.dataset.id))}
function renderSuggestions(){const counts={};items.forEach(x=>counts[x.where]=(counts[x.where]||0)+1);const locs=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);$('#suggestions').innerHTML=locs.map(([v,n])=>`<button class="chip" data-v="${esc(v)}">${esc(v)}${n>1?' · '+n:''}</button>`).join('');$('#suggestions').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('#where').value=b.dataset.v;$('#where').focus()})}
async function refresh(){items=await getAll();render();renderSuggestions()}
function compress(file){return new Promise((res,rej)=>{const img=new Image(),fr=new FileReader();fr.onload=()=>img.src=fr.result;fr.onerror=rej;img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;fr.readAsDataURL(file)})}
$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photoData=await compress(f);$('#preview').src=photoData;$('#photoBtn').classList.add('has');if(!$('#thing').value)$('#thing').focus()}catch{toast('Could not read photo')}};
$('#save').onclick=async()=>{const thing=$('#thing').value.trim(),where=$('#where').value.trim();if(!thing){toast('Tell me what it is');$('#thing').focus();return}if(!where){toast('Tell me where it went');$('#where').focus();return}await put({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),thing,where,photo:photoData,ts:Date.now()});$('#thing').value='';$('#where').value='';$('#photo').value='';photoData=null;$('#preview').removeAttribute('src');$('#photoBtn').classList.remove('has');await refresh();toast('Remembered ✓');$('#thing').focus()};
$('#q').oninput=render;$('#focusSearch').onclick=()=>{$('#q').focus();$('#q').scrollIntoView({behavior:'smooth',block:'start'})};
function showItem(id){const x=items.find(v=>v.id===id);if(!x)return;activeId=id;$('#dlgThing').textContent=x.thing;$('#dlgWhere').textContent='↳ '+x.where;$('#dlgWhen').textContent='Remembered '+new Date(x.ts).toLocaleString();$('#itemDialog').showModal()}
$('#closeDlg').onclick=()=>$('#itemDialog').close();$('#deleteItem').onclick=async()=>{if(!activeId)return;await del(activeId);$('#itemDialog').close();activeId=null;await refresh();toast('Forgotten')};
function resetVoiceButton(button){button.classList.remove('listening');button.innerHTML='<span aria-hidden="true">🎙</span><span>Speak</span>';button.setAttribute('aria-pressed','false')}
function stopVoice(){clearTimeout(voiceTimer);voiceTimer=null;if(activeRecognition){try{activeRecognition.stop()}catch{}activeRecognition=null}document.querySelectorAll('.mic.listening').forEach(resetVoiceButton)}
function voiceErrorMessage(code){switch(code){case'not-allowed':return'Microphone access was blocked here. Allow microphone access, or try Safari / the Home Screen app.';case'service-not-allowed':return'Speech-to-text is not available in this browser. Try Safari or add PUT to your Home Screen.';case'audio-capture':return'PUT could not access the microphone. Check this browser’s microphone permission.';case'network':return'Speech-to-text could not reach the recognition service. Check your connection and try again.';case'no-speech':return'I didn’t hear anything. Try again.';case'aborted':return'';default:return'Speech-to-text failed'+(code?' ('+code+')':'')+'. Try Safari or the Home Screen app.'}}
function startVoice(target,button){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Speech-to-text is not available in this browser. Try Safari or add PUT to your Home Screen.');target.focus();return}stopVoice();const r=new SR();activeRecognition=r;r.lang='en-US';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;button.classList.add('listening');button.innerHTML='<span aria-hidden="true">🎙</span><span>Listening…</span>';button.setAttribute('aria-pressed','true');r.onresult=e=>{const result=e.results[e.results.length-1];if(result&&result.isFinal!==false){target.value=result[0].transcript.replace(/[.]$/,'');target.dispatchEvent(new Event('input'));try{r.stop()}catch{}}};r.onerror=e=>{const msg=voiceErrorMessage(e&&e.error);if(msg)toast(msg);stopVoice()};r.onend=()=>{if(activeRecognition===r)activeRecognition=null;clearTimeout(voiceTimer);voiceTimer=null;resetVoiceButton(button)};try{r.start();toast('Listening…');voiceTimer=setTimeout(()=>{if(activeRecognition===r){try{r.stop()}catch{}toast('Stopped listening')}},8000)}catch(e){resetVoiceButton(button);activeRecognition=null;toast('Could not start speech-to-text in this browser. Try Safari or the Home Screen app.')}}
document.querySelectorAll('.mic').forEach(b=>b.onclick=()=>{if(b.classList.contains('listening')){stopVoice();return}startVoice(document.getElementById(b.dataset.target),b)});
function validItem(x){return x&&typeof x.id==='string'&&typeof x.thing==='string'&&typeof x.where==='string'&&typeof x.ts==='number'&&(x.photo==null||typeof x.photo==='string')}
function backupName(){return 'put-backup-'+new Date().toISOString().slice(0,10)+'.json'}
$('#exportBtn').onclick=async()=>{try{const payload={app:'PUT',version:1,exportedAt:new Date().toISOString(),items:await getAll()},text=JSON.stringify(payload),file=new File([text],backupName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'PUT backup'});toast('Backup ready ✓');return}catch(e){if(e&&e.name==='AbortError')return}}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported ✓')}catch(e){console.error(e);toast('Could not export backup')}};
$('#importBtn').onclick=()=>{$('#importFile').value='';$('#importFile').click()};
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),incoming=Array.isArray(data)?data:data&&data.items;if(!Array.isArray(incoming))throw new Error('No items array');const clean=incoming.filter(validItem);if(clean.length!==incoming.length)throw new Error('Invalid memory');for(const x of clean)await put(x);await refresh();toast('Imported '+clean.length+(clean.length===1?' memory':' memories')+' ✓')}catch(err){console.error(err);toast('That is not a PUT backup')}};
(async()=>{try{await openDB();await refresh()}catch(e){console.error(e);$('#list').innerHTML='<div class="empty">Storage could not start in this browser.</div>'}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body>
</html>
