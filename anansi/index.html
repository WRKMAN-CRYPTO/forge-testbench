label('ACT '+(scene+1)+'  •  '+chapter.tag,panel.x+5,panel.y+14,clamp(wide?W*.017:W*.034,10,13),chapter.tone,'bold','left','system-ui');
label(chapter.title,panel.x+4,panel.y+42,clamp(wide?W*.026:W*.052,18,27),CREAM,'bold');
const prompt=(dialog&&time<dialogUntil)?dialog:current.prompt;
const msgSize=wide?clamp(W*.018,13,17):clamp(W*.041,14,18);
const top=panel.y+66;
wrap(prompt,panel.x+5,top,panel.w-12,msgSize,CREAM,1.32,wide?4:4);
const optTop=wide?Math.max(top+95,H-162):H-160;
const gap=8,cellW=(panel.w-gap)/2,cellH=wide?Math.min(72,(H-optTop-15-gap)/2):66;
for(let i=0;i<4;i++){const col=i%2,row=Math.floor(i/2);actionButton(current.options[i],{x:panel.x+col*(cellW+gap),y:optTop+row*(cellH+gap),w:cellW,h:cellH},i);}
if(!wide&&H-optTop<145){/* compact screens retain four equal hit targets */}
}
function drawInterlude(){c.fillStyle='#091d21de';c.fillRect(0,0,W,H);const pw=Math.min(W-38,530),ph=Math.min(H-55,335),x=(W-pw)/2,y=(H-ph)/2;roundRect(x,y,pw,ph,20,'#18383b','#d9bc81',2);
label('THREAD '+(scene+1)+' WOVEN',W/2,y+47,13,GOLD,'bold','center','system-ui');
label(['The hornets','The python','The leopard'][scene],W/2,y+104,36,CREAM,'bold','center');
wrap(['Nyame accepts Mmօboro, the hornets. Two gifts remain.','Onini is delivered to Nyame. One gift remains.','Osebo is delivered. Anansi has paid the full price.'][scene],x+28,y+147,pw-56,17,CREAM,1.4,4);
const ry=y+ph-74;roundRect(x+22,ry,pw-44,51,11,'#d5ad71','#fce4b4');label(scene===2?'MEET NYAME  →':'CONTINUE  →',W/2,ry+26,15,'#132a2d','bold','center','system-ui');register(x+22,ry,pw-44,51,()=>{interlude=false;if(scene<2){scene++;beat=0;}else scene=3;dialog='';});}
function drawFinal(){const wide=W/H>1.28;const art=wide?{x:16,y:64,w:W*.58,h:H-82}:{x:14,y:64,w:W-28,h:Math.max(185,H*.42)};drawFinalArt(art);const x=wide?W*.62:23,y=wide?H*.15:art.y+art.h+27,w=wide?W*.34:W-46;
label('NYAME\'S GIFT',x,y,14,GOLD,'bold','left','system-ui');label('All stories',x,y+48,clamp(wide?W*.048:W*.088,31,54),CREAM,'bold');label('belong to Anansi.',x,y+90,clamp(wide?W*.027:W*.062,19,29),GOLD,'bold');wrap('The spider has claimed what mighty chiefs could not. His strength was never in his legs. It was in the stories he could make others believe.',x,y+114,w,clamp(wide?W*.019:W*.04,13,17),CREAM,1.4,6);
const by=wide?H-79:H-112;roundRect(x,by,w,55,12,'#d6b476','#f9e0aa');label('WEAVE THE TALE AGAIN  ↻',x+w/2,by+27,14,'#142b2c','bold','center','system-ui');register(x,by,w,55,()=>{scene=-1;beat=0;totalSolved=0;dialog='';});label('Inspired by the photographed retelling by Harold Courlander.',x,wide?H-14:H-20,Math.min(11,W*.026),'#b7c6b6','400');}
function choose(index){if(scene<0||scene>2||interlude)return;const b=chapters[scene].beats[beat];if(index===b.ok){dialog='';totalSolved++;beat++;if(beat>=chapters[scene].beats.length){interlude=true;beat=chapters[scene].beats.length;}else{dialog=b.success;dialogUntil=time+4200;}}else{dialog=b.miss[index]||'Anansi studies this idea, then thinks of another.';dialogUntil=time+4300;}}
function frame(t){time=t;buttons=[];c.setTransform(dpr,0,0,dpr,0,0);decor();drawHeader();if(scene===-1)drawIntro();else if(scene===3)drawFinal();else if(interlude)drawSceneArt(W/H>1.28?{x:15,y:63,w:W*.60-24,h:H-80}:{x:13,y:63,w:W-26,h:Math.max(160,Math.min(H*.47,H-335))},scene,chapters[scene].beats.length);else drawGame();if(interlude)drawInterlude();requestAnimationFrame(frame);}
function pointer(ev){ev.preventDefault();const x=ev.clientX,y=ev.clientY;for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.action();break;}}}
canvas.addEventListener('pointerdown',pointer,{passive:false});
window.addEventListener('keydown',ev=>{if(scene>=0&&scene<3&&!interlude&&['1','2','3','4'].includes(ev.key))choose(Number(ev.key)-1);else if(ev.key==='Enter'){if(scene===-1){scene=0;beat=0;}else if(interlude){interlude=false;if(scene<2){scene++;beat=0;}else scene=3;}}});
document.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(frame);
})();
</script></body></html>
