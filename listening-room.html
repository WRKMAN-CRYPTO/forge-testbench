<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1118"><title>Listening Room 001</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1118;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
(()=>{'use strict';
const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,dpr=1,audio=null,enabled=false,run=false,mode='PLAY',phase=0,last=0,events=[],history=[],memory=[],baseline=[],hits=[],cycle=0,listenPos=0,mut=0.22,tempo=0.48,selected='LEARNER',menu=false,paused=false;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sound(v=.6,ghost=false){if(!audio||!enabled)return;const t=audio.currentTime,o=audio.createOscillator(),gain=audio.createGain(),noise=audio.createBuffer(1,Math.floor(audio.sampleRate*.12),audio.sampleRate),d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*10);const src=audio.createBufferSource(),ng=audio.createGain();src.buffer=noise;src.connect(ng).connect(audio.destination);ng.gain.setValueAtTime(v*(ghost?.06:.13),t);ng.gain.exponentialRampToValueAtTime(.001,t+.12);src.start(t);src.stop(t+.13);o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);o.connect(gain).connect(audio.destination);gain.gain.setValueAtTime(v*(ghost?.12:.28),t);gain.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)}
function strike(v,ghost=false){sound(v,ghost);hits.push({t:performance.now(),v,ghost});if(hits.length>90)hits.shift()}
function makeSequence(){const n=3+Math.floor(Math.random()*5),seq=[];let t=rnd(.1,.35);for(let i=0;i<n;i++){t+=rnd(.18,.95);if(t<3.9)seq.push({t,v:rnd(.35,1)})}return seq}
function alter(seq){return seq.map(e=>({t:clamp(e.t+rnd(-mut,mut),.05,3.92),v:clamp(e.v+rnd(-.15,.15),.2,1)})).sort((a,b)=>a.t-b.t)}
function startCycle(){cycle++;phase=0;mode='PLAY';events=[];const prior=selected==='LEARNER'?memory:baseline;const source=prior.length&&Math.random()<.76?prior[Math.floor(Math.random()*prior.length)]:makeSequence();events=selected==='LEARNER'?alter(source):makeSequence();listenPos=0}
function tick(dt){if(!run||paused)return;const prev=phase;phase+=dt;const length=mode==='PLAY'?4:4.5;if(mode==='PLAY'){for(const e of events)if(e.t>prev&&e.t<=phase)strike(e.v);if(phase>=length){history=events.map(e=>({...e}));if(selected==='LEARNER'){memory.push(history);if(memory.length>12)memory.shift()}else{baseline.push(history);if(baseline.length>12)baseline.shift()}mode='LISTEN';phase=0;listenPos=0}}else{for(const e of history)if(e.t>prev&&e.t<=phase)strike(e.v,true);if(phase>=length)startCycle()}}
function stats(){const bank=selected==='LEARNER'?memory:baseline;if(bank.length<2)return 'Collecting performances';const intervals=bank.flatMap(s=>s.slice(1).map((e,i)=>e.t-s[i].t));if(!intervals.length)return 'Not enough strikes';const mean=intervals.reduce((a,b)=>a+b,0)/intervals.length,sd=Math.sqrt(intervals.reduce((a,b)=>a+(b-mean)**2,0)/intervals.length);return 'Mean gap '+mean.toFixed(2)+'s  •  gap spread '+sd.toFixed(2)+'s'}
function rect(x,y,w,h,r=12,fill='#1b2735'){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function txt(s,x,y,size=14,color='#dbe8f4',align='left',weight='500'){g.fillStyle=color;g.font=weight+' '+size+'px system-ui';g.textAlign=align;g.fillText(s,x,y)}
function button(s,x,y,w,h,active=false){rect(x,y,w,h,10,active?'#365e67':'#1c2b39');txt(s,x+w/2,y+h/2+5,13,active?'#a8ffdb':'#e5eff7','center','700')}
function draw(){g.fillStyle='#0c1118';g.fillRect(0,0,W,H);const pad=18;txt('LISTENING ROOM  /  001',pad,38,14,'#9fe4cf','left','800');txt('One surface. One memory.',pad,61,12,'#91a7b8');const cy=H*.35,r=Math.min(W*.24,105);g.beginPath();g.arc(W/2,cy,r,0,Math.PI*2);g.fillStyle=performance.now()-((hits.at(-1)||{}).t||0)<130?'#457f8d':'#233f52';g.fill();g.strokeStyle='#7bc7bf';g.lineWidth=3;g.stroke();txt('PERCUSSION',W/2,cy+5,14,'#d3f5eb','center','800');txt(run?(paused?'PAUSED':mode):'READY',W/2,cy+r+35,17,'#e9d2a2','center','800');
const x0=pad,y0=cy+r+60,width=W-2*pad;rect(x0,y0,width,70,12,'#14202c');txt('RECENT STRIKES  •  4 SECOND WINDOW',x0+12,y0+20,10,'#91a7b8');g.strokeStyle='#334454';g.beginPath();g.moveTo(x0+12,y0+51);g.lineTo(x0+width-12,y0+51);g.stroke();const now=performance.now();for(const h of hits){const age=(now-h.t)/1000;if(age>4)continue;const xx=x0+width-12-age/4*(width-24);g.strokeStyle=h.ghost?'#d2a96a':'#7fe0c3';g.lineWidth=2;g.beginPath();g.moveTo(xx,y0+51);g.lineTo(xx,y0+51-h.v*25);g.stroke()}
txt('Cycle '+cycle+'   •   '+selected,pad,y0+98,13,'#b4c7d6');txt(stats(),pad,y0+120,Math.min(12,W/31),'#9bb0c0');
const by=H-118;button(run?(paused?'RESUME':'PAUSE'):'START',pad,by,(W-3*pad)/2,48,run&&!paused);button('RESET',pad+(W-pad)/2,by,(W-3*pad)/2,48);button(selected==='LEARNER'?'LEARNER ✓':'LEARNER',pad,H-60,(W-3*pad)/2,43,selected==='LEARNER');button(selected==='CONTROL'?'CONTROL ✓':'CONTROL',pad+(W-pad)/2,H-60,(W-3*pad)/2,43,selected==='CONTROL');
if(menu){rect(12,80,W-24,130,14,'#263646');txt('Tap the surface to hear a strike.',25,112,13);txt('PLAY → LISTEN → PLAY',25,140,13);txt('Control uses fresh random sequences.',25,168,12);txt('Tap here to close',25,194,11,'#9fe4cf')}
requestAnimationFrame(frame)}
function frame(now){const dt=Math.min((now-last)/1000||0,.06);last=now;tick(dt);draw()}
async function unlock(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()}await audio.resume();enabled=true}
c.addEventListener('pointerdown',async e=>{e.preventDefault();await unlock();const x=e.clientX,y=e.clientY,pad=18,by=H-118;if(y<76){menu=!menu;return}if(menu){menu=false;return}if(y>H-60){selected=x<W/2?'LEARNER':'CONTROL';run=false;paused=false;cycle=0;memory=[];baseline=[];hits=[];return}if(y>by){if(x<W/2){if(!run){run=true;paused=false;startCycle()}else paused=!paused}else{run=false;paused=false;cycle=0;memory=[];baseline=[];hits=[];mode='PLAY'}return}strike(rnd(.4,1))});
requestAnimationFrame(frame);
})();
</script></body></html>
