<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c19"><title>WAVE//ORBIT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a14;color:#e9f2ff;font:14px system-ui,-apple-system,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:calc(15px + env(safe-area-inset-top)) 18px 10px;pointer-events:none;background:linear-gradient(#070b19ed,transparent)}h1{font-size:16px;letter-spacing:.18em;margin:0;color:#8ce7f5}header small{color:#91a6c0;font-size:11px;letter-spacing:.08em}.stats{margin-top:9px;display:flex;gap:13px;font-size:11px;color:#a6b6cf;flex-wrap:wrap}.stats b{color:#c7f7ff}.bottom{position:absolute;bottom:0;left:0;right:0;padding:12px 13px calc(13px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#080d1df5 17%);display:grid;gap:8px}.compose{display:flex;gap:8px;align-items:stretch}textarea{resize:none;min-height:55px;max-height:100px;flex:1;border:1px solid #35516a;border-radius:13px;padding:12px;background:#111c30;color:#f4fbff;font:15px system-ui;outline:none}textarea:focus{border-color:#73dce8}button{border:1px solid #45617d;border-radius:12px;padding:10px 13px;background:#192a42;color:#e8f7ff;font-weight:700;cursor:pointer}button.primary{background:#1e697d;border-color:#62d5e6}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tools button{font-size:11px;padding:8px 10px}.tools .hint{margin-left:auto;font-size:10px;color:#92a5bd}.detail{position:absolute;left:13px;right:13px;top:100px;max-width:420px;background:#0d1729ed;border:1px solid #426078;border-radius:14px;padding:12px;display:none;box-shadow:0 12px 40px #0008}.detail.show{display:block}.detail strong{color:#99edf4}.detail p{margin:8px 0;color:#e3efff;line-height:1.4}.detail small{color:#a6b7cc}.detail button{float:right;padding:3px 8px}.legend{position:absolute;right:13px;top:95px;font-size:10px;color:#91a6c0;text-align:right;pointer-events:none}.legend div{margin-bottom:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.notice{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);color:#8a9db8;font-size:12px;pointer-events:none;text-align:center;opacity:.85;max-width:230px} @media(min-width:800px){.bottom{max-width:760px;left:50%;transform:translateX(-50%)}}
</style></head><body>
<canvas id="space"></canvas><header><h1>WAVE//ORBIT <span style="color:#536d88">/ MEMORY GRAVITY</span></h1><small>TEXT → SIGNAL → ASSOCIATION</small><div class="stats"><span>MEMORIES <b id="count">0</b></span><span>AGENTS <b id="agents">0</b></span><span>CONTACTS <b id="contacts">0</b></span><span>LINKS <b id="links">0</b></span><span>STABLE <b id="stable">0</b></span><span>ENERGY <b id="energy">—</b></span><span>STRONGEST <b id="strong">—</b></span></div></header>
<div class="legend"><div><i class="dot" style="background:#7de8d5"></i>NEAR</div><div><i class="dot" style="background:#a88bf8"></i>MIDDLE</div><div><i class="dot" style="background:#e2a96b"></i>FAR</div></div>
<div id="detail" class="detail"><button id="close">×</button><strong id="dt"></strong><p id="body"></p><small id="meta"></small></div>
<div class="notice" id="notice">Type a thought to disturb the memory field.</div>
<div class="bottom"><div class="tools"><button id="seed">SEED MEMORIES</button><button id="save">STORE MESSAGE</button><button id="clear">CLEAR MEMORY</button><button id="pause">PAUSE</button><span class="hint">Faint links decay · bright links survive · drag to pan</span></div><div class="compose"><textarea id="entry" placeholder="What are you thinking about?" rows="2"></textarea><button id="send" class="primary">PULSE ↗</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('space'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,now=0,last=0,paused=false,decayClock=0,saveClock=0,contacts=0,panX=0,panY=0,drag=null,query='',mem=[],agents=[],sparks=[],selected=null,sequence=0,typingTimer,links=new Map();
const KEY='wave-orbit-memories-v1',LINKKEY='wave-orbit-links-v2',TAU=Math.PI*2;
const samples=['The sun warmed the stones beside the river.','I clicked Seven and saw the Sun.','The moon reflected on a quiet ocean.','A machine learned by trying unfamiliar buttons.','A red laptop explores its own desktop.','Fire meets ice and becomes steam.','Lightning crosses a cloud of vapor.','A small creature remembers the way home.','The forest grows around an abandoned tower.','Music emerges when independent agents listen.','A water sphere floats in deep space.','A forgotten childhood drawing resembles ocean waves.','Memory forms from experience rather than instructions.','An old computer plays a card game.','Gravity bends the paths of distant objects.','A sprinkler releases water into a hot room.','A violin sings above a slow drumbeat.','A stone skips across the lake at dusk.','The sun and moon hang above the horizon.','A curious mind builds a world from scratch.','Two agents exchange signals across a network.','A river freezes under winter stars.','The forest hides a little village.','A wave carries information across space.'];
const stop=new Set('a an and are as at be been but by can do for from had has have i in into is it its me my of on or our so than that the their them there these they this to was we were what when where which who why will with you your how about'.split(' '));
function tokens(s){return (s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>w.length>2&&!stop.has(w))}
function vec(s){let a=new Float32Array(48),t=tokens(s);for(const w of t){for(let i=0;i<w.length;i++){let h=2166136261;const gram='^'+w.slice(Math.max(0,i-1),i+3)+'$';for(let j=0;j<gram.length;j++)h=Math.imul(h^gram.charCodeAt(j),16777619);a[(h>>>0)%48]+=1/Math.sqrt(t.length||1)}}let norm=Math.hypot(...a)||1;return Array.from(a,v=>v/norm)}
function similarity(a,b){let dot=0;for(let i=0;i<a.length;i++)dot+=a[i]*b[i];return dot}
function rnd(a,b){return a+Math.random()*(b-a)}
function addMemory(s){s=s.trim();if(!s||mem.some(m=>m.text===s))return;mem.push({id:++sequence,text:s,v:vec(s),angle:rnd(0,TAU),jitter:rnd(-25,25),radius:rnd(900,1450),score:0,tier:3,phase:rnd(0,TAU),energy:0,hits:0});if(mem.length>220)mem.shift();persist()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(mem.map(m=>m.text)))}catch(e){}$('count').textContent=mem.length}
function linkKey(a,b){return [a.text,b.text].sort().join(' ⟷ ')}
function linkStats(){ $('links').textContent=links.size;$('stable').textContent=[...links.values()].filter(v=>v>=3).length }
function storeLinks(){try{localStorage.setItem(LINKKEY,JSON.stringify([...links]))}catch(e){}linkStats()}
function recordLink(a,b){if(!a||!b||a===b)return;const k=linkKey(a,b);links.set(k,Math.min(12,(links.get(k)||0)+.65));linkStats()}
function restoreLinks(){try{const saved=JSON.parse(localStorage.getItem(LINKKEY)||'[]');if(Array.isArray(saved))links=new Map(saved.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&Number.isFinite(x[1])).map(([k,v])=>[k,Math.min(12,Math.max(.1,v))]))}catch(e){}storeLinks()}
function overlap(a,b){const x=new Set(tokens(a.text)),y=new Set(tokens(b.text));let n=0;for(const t of x)if(y.has(t))n++;return n/Math.max(1,Math.sqrt(x.size*y.size))}
function chooseNext(from,visited,energy){const options=mem.filter(m=>m!==from&&!visited.has(m.id)).map(m=>{const distance=Math.abs(m.current-from.current),cost=12+distance*.065;const old=links.get(linkKey(from,m))||0;return {m,cost,weight:energy>=cost?Math.max(0,overlap(from,m)*.8+similarity(from.v,m.v)*.35+Math.min(.3,old*.035)) / (1+distance/700):0}}).filter(o=>o.weight>.12);if(!options.length)return null;options.sort((a,b)=>b.weight-a.weight);const top=options.slice(0,6);let sum=top.reduce((n,o)=>n+o.weight*o.weight,0),r=Math.random()*sum;for(const o of top){r-=o.weight*o.weight;if(r<=0)return o.m}return top[0].m}
function restore(){try{const arr=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(arr))arr.slice(0,220).forEach(addMemory)}catch(e){}}
function center(){return{x:W/2+panX,y:H*.47+panY}}
function scoreAll(){const q=vec(query),qt=new Set(tokens(query));let best=0;for(const m of mem){const mt=new Set(tokens(m.text));let shared=0;for(const w of qt)if(mt.has(w))shared++;const overlap=shared/Math.max(1,Math.sqrt(qt.size*mt.size));m.score=query?Math.min(1,similarity(q,m.v)*.68+overlap*.45):0;m.tier=m.score>.44?1:m.score>.21?2:3;m.radius=(m.tier===1?rnd(165,225):m.tier===2?rnd(360,450):rnd(610,820))+m.jitter;best=Math.max(best,m.score)}$('strong').textContent=query?Math.round(best*100)+'%':'—';$('notice').style.display=query?'none':'block'}
function pulse(){const v=$('entry').value.trim();if(!v)return;query=v;contacts=0;agents=[];sparks=[];panX=0;panY=0;scoreAll();$('contacts').textContent=0;for(let i=0;i<34;i++)spawn(true)}
function spawn(initial=false){if(!query)return;let r=Math.random(),reach=r<.54?rnd(180,275):r<.86?rnd(380,510):rnd(690,910);agents.push({angle:rnd(0,TAU),dist:initial?rnd(0,20):0,reach,speed:rnd(95,210),life:0,turn:rnd(-.14,.14),hit:new Set(),previous:null,target:null,trail:[],energy:reach<300?85:reach<560?125:175,hue:reach<300?175:reach<560?265:35})}
function ringColor(t){return t===1?'#7de8d5':t===2?'#a88bf8':'#e2a96b'}
function fit(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}
function line(x1,y1,x2,y2,color,alpha=1){ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1}
function drawWave(m,x,y){const col=ringColor(m.tier),amp=5+m.energy*9;ctx.save();ctx.translate(x,y);ctx.rotate(m.angle+Math.PI/2);ctx.shadowBlur=9+m.energy*16;ctx.shadowColor=col;ctx.lineWidth=1.5+m.energy;ctx.strokeStyle=col;ctx.globalAlpha=.55+m.energy*.4;ctx.beginPath();for(let j=-16;j<=16;j++){let yy=Math.sin(j*.52+m.phase)*amp*Math.exp(-Math.abs(j)/17)+Math.sin(j*1.3+m.phase*.6)*2; if(j===-16)ctx.moveTo(j*1.25,yy);else ctx.lineTo(j*1.25,yy)}ctx.stroke();ctx.restore()}
function contact(a,m,c){const travelCost=12+Math.abs(a.dist-(a.previous?a.previous.current:0))*.065;if(a.energy<travelCost){a.energy=0;return}a.energy-=travelCost;a.hit.add(m.id);m.energy=1;m.hits++;contacts++;$('contacts').textContent=contacts;sparks.push({x:c.x+Math.cos(m.angle)*m.current,y:c.y+Math.sin(m.angle)*m.current,life:.7,col:ringColor(m.tier)});if(a.previous)recordLink(a.previous,m);a.previous=m;a.target=chooseNext(m,a.hit,a.energy);if(a.target){a.reach=Math.max(a.reach,a.target.current+60);a.life=0;a.dist=0;a.angle=m.angle;a.trail=[]}else a.energy=0}
function update(dt){now+=dt;decayClock+=dt;saveClock+=dt;if(decayClock>=1){const elapsed=decayClock;decayClock=0;for(const [key,v] of links){const next=v*Math.exp(-elapsed/240);if(next<.24)links.delete(key);else links.set(key,next)}linkStats()}if(saveClock>=8){saveClock=0;storeLinks()}const c=center();for(const m of mem){m.phase+=dt*(1+m.score*2);m.energy=Math.max(0,m.energy-dt*.8);const target=query?m.radius:rndStatic(m.id);m.current??=target;m.current+=(target-m.current)*Math.min(1,dt*1.7)}if(query){for(let k=0;k<Math.min(4,Math.ceil(dt*32));k++)if(agents.length<75&&Math.random()<dt*24)spawn();for(let i=agents.length-1;i>=0;i--){const a=agents[i];a.life+=dt;a.dist+=a.speed*dt;a.energy-=dt*(1.2+a.speed*.006);const candidates=mem.filter(m=>Math.abs(m.current-a.dist)<95&&m.current<a.reach+55&&!a.hit.has(m.id));let closest=null,delta=.24;for(const m of candidates){let d=Math.atan2(Math.sin(m.angle-a.angle),Math.cos(m.angle-a.angle));if(Math.abs(d)<delta){closest=m;delta=Math.abs(d)}}if(a.target){const target=a.target;const d=Math.atan2(Math.sin(target.angle-a.angle),Math.cos(target.angle-a.angle));a.angle+=d*Math.min(.22,dt*5);if(Math.abs(d)<.17&&Math.abs(target.current-a.dist)<36)contact(a,target,c)}else if(closest){const d=Math.atan2(Math.sin(closest.angle-a.angle),Math.cos(closest.angle-a.angle));a.angle+=d*Math.min(.16,dt*3)*(1+closest.score);if(Math.abs(d)<.12&&Math.abs(closest.current-a.dist)<30)contact(a,closest,c)}else a.angle+=a.turn*dt;a.trail.push({x:c.x+Math.cos(a.angle)*a.dist,y:c.y+Math.sin(a.angle)*a.dist});if(a.trail.length>11)a.trail.shift();if(a.dist>a.reach||a.life>9||a.energy<=0)agents.splice(i,1)} }$('agents').textContent=agents.length;$('energy').textContent=agents.length?Math.round(agents.reduce((n,a)=>n+a.energy,0)/agents.length):'—';for(let i=sparks.length-1;i>=0;i--){sparks[i].life-=dt;if(sparks[i].life<=0)sparks.splice(i,1)}}
function rndStatic(id){return 680+(id*127.7)%360}
function draw(){ctx.clearRect(0,0,W,H);const c=center();const bg=ctx.createRadialGradient(c.x,c.y,5,c.x,c.y,Math.max(W,H));bg.addColorStop(0,'#14223b');bg.addColorStop(.5,'#091226');bg.addColorStop(1,'#050912');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let i=0;i<90;i++){const x=((i*397.37)%W),y=((i*223.13)%H);ctx.fillStyle='#8ca3c2';ctx.globalAlpha=.08+(i%7)*.022;ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1;
const radii=[200,400,720];radii.forEach((r,i)=>{ctx.beginPath();ctx.ellipse(c.x,c.y,r,r*.84,0,0,TAU);ctx.strokeStyle=['#5bc4b7','#7961b6','#9d744a'][i];ctx.lineWidth=1;ctx.globalAlpha=.16;ctx.setLineDash([3,10]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1});
for(const [key,strength] of links){const parts=key.split(' ⟷ '),a=mem.find(m=>m.text===parts[0]),b=mem.find(m=>m.text===parts[1]);if(!a||!b)continue;const ax=c.x+Math.cos(a.angle)*a.current,ay=c.y+Math.sin(a.angle)*a.current,bx=c.x+Math.cos(b.angle)*b.current,by=c.y+Math.sin(b.angle)*b.current;if(Math.max(Math.abs(ax),Math.abs(bx))>W+1100)continue;ctx.lineWidth=Math.min(2.5,.4+strength*.13);line(ax,ay,bx,by,strength>=3?'#80e9d5':'#647e9e',Math.min(.48,.025+strength*.035))}ctx.lineWidth=1;
for(const m of mem){const x=c.x+Math.cos(m.angle)*m.current,y=c.y+Math.sin(m.angle)*m.current; if(x< -70||x>W+70||y< -70||y>H+70)continue;drawWave(m,x,y);if(m.energy>.3){ctx.font='10px system-ui';ctx.fillStyle='#c7eaf5';ctx.textAlign='center';ctx.fillText(m.text.slice(0,30)+(m.text.length>30?'…':''),x,y-19)}}
for(const a of agents){for(let j=1;j<a.trail.length;j++)line(a.trail[j-1].x,a.trail[j-1].y,a.trail[j].x,a.trail[j].y,a.hue===175?'#6be5d8':a.hue===265?'#a48cf5':'#e5a56d',j/a.trail.length*.55);const p=a.trail.at(-1);if(p){ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fillStyle=a.energy<30?'#e9a56d':'#e3fbff';ctx.fill()}}
for(const s of sparks){ctx.beginPath();ctx.arc(s.x,s.y,(1-s.life)*20,0,TAU);ctx.strokeStyle=s.col;ctx.globalAlpha=s.life;ctx.stroke();ctx.globalAlpha=1}
const glow=ctx.createRadialGradient(c.x,c.y,4,c.x,c.y,95);glow.addColorStop(0,'#65ddeb36');glow.addColorStop(1,'#65ddeb00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(c.x,c.y,95,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(c.x,c.y,7+Math.sin(now*2)*1.5,0,TAU);ctx.fillStyle='#83eff3';ctx.shadowColor='#83eff3';ctx.shadowBlur=22;ctx.fill();ctx.shadowBlur=0;
ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#e4faff';const label=query.length>70?query.slice(0,67)+'…':query;const words=label.match(/.{1,32}(?:\s|$)/g)||[];words.slice(0,3).forEach((w,i)=>ctx.fillText(w.trim(),c.x,c.y+29+i*16));ctx.font='10px system-ui';ctx.fillStyle='#7195ae';ctx.fillText(query?'ACTIVE THOUGHT':'AWAITING SIGNAL',c.x,c.y-23)}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
$('send').onclick=pulse;$('entry').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();pulse()}});$('entry').addEventListener('input',()=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>{if($('entry').value.trim())pulse()},650)});
$('save').onclick=()=>{const s=$('entry').value.trim();if(!s)return;addMemory(s);scoreAll()};$('seed').onclick=()=>{samples.forEach(addMemory);scoreAll()};$('clear').onclick=()=>{if(!confirm('Erase all stored wave memories AND learned links from this browser?'))return;mem=[];links.clear();storeLinks();persist();selected=null;$('detail').classList.remove('show')};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};$('close').onclick=()=>$('detail').classList.remove('show');
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)drag.moved=true;panX=drag.px+dx;panY=drag.py+dy});canvas.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const c=center();let nearest=null,dist=28;for(const m of mem){const x=c.x+Math.cos(m.angle)*m.current,y=c.y+Math.sin(m.angle)*m.current;const d=Math.hypot(e.clientX-x,e.clientY-y);if(d<dist){dist=d;nearest=m}}if(nearest){$('dt').textContent='MEMORY / '+['','INNER','MIDDLE','OUTER'][nearest.tier]+' RING';$('body').textContent=nearest.text;$('meta').textContent='Similarity '+Math.round(nearest.score*100)+'% · agent contacts '+nearest.hits;$('detail').classList.add('show')}}drag=null});
window.addEventListener('resize',fit);window.addEventListener('pagehide',storeLinks);document.addEventListener('visibilitychange',()=>{if(document.hidden)storeLinks()});fit();restore();restoreLinks();scoreAll();requestAnimationFrame(frame);
})();
</script></body></html>
