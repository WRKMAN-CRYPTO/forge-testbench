<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <title>WRKMAN IDE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar chrome">
      <div class="brand"><span class="mark">W</span><div><strong>WRKMAN IDE</strong><small id="saveStatus">READY</small></div></div>
      <button id="runBtn" class="run-btn" type="button">▶ RUN</button>
    </header>

    <section class="workspace">
      <nav class="file-tabs chrome" aria-label="Project files">
        <button class="file-tab active" data-file="html" type="button">HTML</button>
        <button class="file-tab" data-file="css" type="button">CSS</button>
        <button class="file-tab" data-file="js" type="button">JS</button>
        <button id="toolsBtn" class="file-tab tools-tab" type="button">TOOLS</button>
      </nav>

      <section class="editor-pane" aria-label="Code editor">
        <div class="editor-head chrome"><span id="fileName">index.html</span><span id="lineCount">1 LINE</span></div>
        <textarea id="editor" aria-label="Source editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      </section>

      <section id="previewPane" class="preview-pane collapsed" aria-label="Preview">
        <div class="panel-head chrome"><strong>PREVIEW</strong><button data-close="preview" type="button">×</button></div>
        <iframe id="preview" title="App preview" sandbox="allow-scripts"></iframe>
      </section>

      <section id="consolePane" class="console-pane collapsed" aria-label="Console">
        <div class="panel-head chrome"><strong>CONSOLE</strong><div><button id="clearConsole" type="button">CLEAR</button><button data-close="console" type="button">×</button></div></div>
        <div id="consoleOutput" class="console-output" role="log" aria-live="polite"></div>
      </section>
    </section>

    <footer class="bottombar chrome">
      <button id="previewBtn" type="button">▣ PREVIEW</button>
      <button id="consoleBtn" type="button">⌁ CONSOLE <span id="errorBadge" hidden>0</span></button>
    </footer>

    <aside id="toolsSheet" class="tools-sheet" aria-hidden="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><strong>PROJECT TOOLS</strong><button id="closeTools" type="button">×</button></div>
      <button id="resetProject" class="danger-soft" type="button">RESET STARTER PROJECT</button>
      <p>Source autosaves on this device. Run executes the current HTML, CSS, and JavaScript inside an isolated preview.</p>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
