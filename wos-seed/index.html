 bottom();}

function contentGeometry(){const top=safeT+110,bottom=vh-safeB-98;const wide=vw>vh;const reserved=wide?115:198;let side=Math.max(96,Math.min(vw-36,bottom-top-reserved,500));if(wide)side=Math.max(110,Math.min((vw-40)*.56,bottom-top-14));return {x:(vw-side)/2,y:top+2,s:side,n:24};}
function drawEditor(){const f=os.active;if(!f){nav(W.shell.FILES);return;}backButton(requestExit,'EXIT');text('PIXEL STUDIO',126,safeT+27,13,C.white,780);btn('SAVE',vw-92,safeT+8,73,40,saveActive,'primary',12);text(f.name,20,safeT+76,17,C.white,740);const ds=os.W.document;const sv=ds===W.document.DIRTY?'● UNSAVED':ds===W.document.SAVING?'◌ SAVING':ds===W.document.ERROR?'! ERROR':'✓ ON DISK';text(sv,vw-19,safeT+75,11,ds===W.document.DIRTY?C.gold:ds===W.document.ERROR?C.red:C.mint,650,'right',true);

 g.save();g.beginPath();g.rect(b.x,b.y,b.s,b.s);g.clip();g.strokeStyle='rgba(12,25,38,.19)';g.lineWidth=.5;for(let i=0;i<=24;i++){line(b.x+i*px,b.y,b.x+i*px,b.y+b.s,'rgba(8,18,30,.20)',.5);line(b.x,b.y+i*px,b.x+b.s,b.y+i*px,'rgba(8,18,30,.20)',.5);}g.restore();

// W//Keys is drawn in this same canvas. No native text inputs or keyboard overlays.
function noteBodyRows(body,maxChars){const rows=[];let start=0;
 for(const lineText of body.split('\n')){if(!lineText.length)rows.push({start,text:''});else for(let j=0;j<lineText.length;j+=maxChars)rows.push({start:start+j,text:lineText.slice(j,j+maxChars)});start+=lineText.length+1;}
 return rows;
}
function noteLayout(){const keyH=Math.max(190,Math.min(270,vh*.36)),keyTop=vh-safeB-78-keyH,editTop=safeT+104,editBottom=keyTop-10;
 const pitch=Math.max(8,Math.min(9.1, (vw-72)/29)),chars=Math.max(12,Math.floor((vw-70)/pitch)),rowH=21;
 return {keyH,keyTop,editTop,editBottom,chars,rowH,visible:Math.max(1,Math.floor((editBottom-editTop-34)/rowH))};}
function noteCursorRow(rows,cursor){let index=0,col=0;
 for(let i=0;i<rows.length;i++){const r=rows[i],end=r.start+r.text.length;if(cursor>=r.start&&cursor<=end){index=i;col=cursor-r.start;if(cursor===end&&rows[i+1]?.start===cursor){index=i+1;col=0;}else if(cursor===end&&rows[i+1]?.start===cursor+1){index=i;col=r.text.length;} }}
 return {index,col};}
function syncNoteScroll(){if(!os.active||os.active.type!=='text/x-wnote')return;const n=os.note,l=noteLayout(),rows=noteBodyRows(os.active.body||'',l.chars);const cr=noteCursorRow(rows,n.cursor).index;
 n.scroll=Math.max(0,Math.min(n.scroll,Math.max(0,rows.length-l.visible)));if(cr<n.scroll)n.scroll=cr;if(cr>=n.scroll+l.visible)n.scroll=cr-l.visible+1;
}
function noteKeyCell(t,x,y,w,h,fn,sty='base'){
 const bg=sty==='action'?'#1d4050':sty==='hot'?'#27645e':sty==='space'?'#213748':'#172b40';
 rect(x,y,w,h,bg,7,sty==='hot'?C.mint:'#304d64');text(t,x+w/2,y+h/2,sty==='base'?Math.min(16,w*.48):Math.min(12,w*.3+3),sty==='hot'?'#ddfff6':C.white,sty==='base'?600:710,'center');hotspot(x,y,w,h,fn);
}
function drawWKeys(l){const n=os.note,keyTop=l.keyTop,h=l.keyH;

 text(n.rename?'EDITING FILE NAME':'PRIVATE CANVAS KEYBOARD',vw-16,keyTop+11,9,C.dim,620,'right',true);
 const rows=n.page==='abc'?[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['SHIFT','z','x','c','v','b','n','m','BACK']]:[['1','2','3','4','5','6','7','8','9','0'],['@','#','$','%','&','-','+','(',')'],['ABC','*','"',"'",':',';','!','?','BACK']];
 const top=keyTop+25,gap=4,available=h-32,kh=Math.max(31,(available-gap*3)/4);
 rows.forEach((keys,r)=>{const yy=top+r*(kh+gap),inset=r===1?13:5,baseW=(vw-inset*2-gap*(keys.length-1))/(keys.length+(r===2?.7:0));let x=inset;
  const totalW=keys.reduce((acc,k)=>acc+baseW*((k==='SHIFT'||k==='BACK'||k==='ABC')?1.35:1),0)+gap*(keys.length-1);x=(vw-totalW)/2;
  keys.forEach(key=>{const action=key==='SHIFT'||key==='BACK'||key==='ABC';const w=baseW*(action?1.35:1);const txt=key==='BACK'?'⌫':key==='SHIFT'?'⇧':key==='ABC'?'ABC':n.shift&&n.page==='abc'?key.toUpperCase():key;
   noteKeyCell(txt,x,yy,w,kh,()=>noteInput(key),key==='SHIFT'&&n.shift?'hot':action?'action':'base');x+=w+gap;});});
 const yy=top+3*(kh+gap),wide=(vw-10-gap*5),ratios=[1.15,.9,1,3.3,1.15,1.35],unit=(wide/ratios.reduce((a,b)=>a+b,0));let x=5;
 const bottomKeys=[[n.page==='abc'?'123':'ABC','action'],['←','action'],['→','action'],['SPACE','space'],['.','base'],['↵','hot']];
