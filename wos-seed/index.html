function makePixels(){const p=Array(24*24).fill(0);for(let y=0;y<24;y++)for(let x=0;x<24;x++){
  if(y>=19)p[y*24+x]=1;else if(y>15&&((x*5+y*7)%17)<4)p[y*24+x]=5;

function markDirty(){if(os.W.document===W.document.CLEAN)track('document',W.document.DIRTY,'edit');}
function addUndo(){if(!os.active)return;os.undo.push(os.active.pixels.slice());if(os.undo.length>30)os.undo.shift();}
function setPx(x,y){const b=paintRect;if(!b||!os.active||os.pending)return;const a=Math.floor((x-b.x)/b.s*24),j=Math.floor((y-b.y)/b.s*24);if(a<0||j<0||a>=24||j>=24)return;const i=j*24+a,p=os.active.pixels;const val=os.brush;if(os.tool==='fill'){if(p[i]===val)return;addUndo();const old=p[i],q=[i];p[i]=val;while(q.length){const id=q.pop(),xx=id%24,yy=Math.floor(id/24);for(const n of [[xx-1,yy],[xx+1,yy],[xx,yy-1],[xx,yy+1]]){if(n[0]>=0&&n[0]<24&&n[1]>=0&&n[1]<24){const ix=n[1]*24+n[0];if(p[ix]===old){p[ix]=val;q.push(ix);}}}}markDirty();invalidate();return;}
 if(p[i]!==val){if(drawing&&!drawing.changed){addUndo();drawing.changed=true;}p[i]=val;markDirty();invalidate();}}
function undo(){if(!os.active||!os.undo.length)return notify('Nothing to undo');os.active.pixels=os.undo.pop();markDirty();invalidate();}
async function saveActive(){if(!os.active)return false;if(os.W.document===W.document.SAVING)return false;if(os.W.document===W.document.CLEAN){notify('Already saved to WDrive');return true;}if(os.W.document===W.document.ERROR)track('document',W.document.DIRTY,'retry');track('document',W.document.SAVING,'persist file');const doc=cloneDoc(os.active);doc.rev++;doc.updatedAt=stamp();try{await disk.put(doc);os.active=cloneDoc(doc);const i=os.files.findIndex(x=>x.id===doc.id);if(i>=0)os.files[i]=cloneDoc(doc);track('document',W.document.CLEAN,'write committed');notify(`Saved • revision ${doc.rev}`);return true;}catch(e){track('document',W.document.ERROR,'write failed');os.error=String(e);notify('Save failed • check storage');console.error(e);return false;}}
async function shutdown(){if(os.W.system!==W.system.READY)return;if(os.W.document===W.document.DIRTY){askExit('POWER_OFF');return;}track('system',W.system.SHUT,'power off');os.loading='SHUTTING DOWN';os.active=null;os.undo=[];if(os.W.document!==W.document.UNBOUND)track('document',W.document.UNBOUND,'power off');if(os.W.shell!==W.shell.HOME)shell(W.shell.HOME);os.pending=null;setTimeout(()=>track('system',W.system.OFF,'power off complete'),420);}
async function boot(){if(os.W.system!==W.system.OFF)return;track('system',W.system.BOOT,'power on');os.bootAt=performance.now();os.loading='MOUNTING WDRIVE';try{await disk.open();os.files=(await disk.all()).filter(x=>x?.type==='image/x-wimg'&&Array.isArray(x.pixels)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));os.selected=null;os.active=null;os.undo=[];os.pending=null;os.loading='REGISTERING WIMG HANDLER';const rest=Math.max(0,1150-(performance.now()-os.bootAt));setTimeout(()=>{if(os.W.system===W.system.BOOT){track('system',W.system.READY,'disk mounted');invalidate();}},rest);}catch(e){os.loading='STORAGE FAILED';os.error=String(e);console.error(e);setTimeout(()=>{track('system',W.system.OFF,'mount failed');notify('Storage initialization failed');},950);}invalidate();}
const disk={db:null,mode:'idb',async open(){if(this.db)return;try{if(!indexedDB)throw new Error('No indexedDB');this.db=await new Promise((resolve,reject)=>{const r=indexedDB.open('WOS_WDRIVE_V1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});os.storage='IndexedDB';}catch(e){this.mode='local';os.storage='Local storage fallback';let k='WOS_WDRIVE_V1_FILES';try{localStorage.setItem('_wos_probe','1');localStorage.removeItem('_wos_probe');}catch(err){throw new Error('Both IndexedDB and local storage unavailable');}}},async all(){if(this.mode==='local')return JSON.parse(localStorage.getItem('WOS_WDRIVE_V1_FILES')||'[]');return new Promise((resolve,reject)=>{let r=this.db.transaction('files','readonly').objectStore('files').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});},async put(doc){if(this.mode==='local'){const fs=await this.all();const i=fs.findIndex(x=>x.id===doc.id);if(i<0)fs.push(doc);else fs[i]=doc;localStorage.setItem('WOS_WDRIVE_V1_FILES',JSON.stringify(fs));return;}return new Promise((resolve,reject)=>{const tx=this.db.transaction('files','readwrite');tx.objectStore('files').put(doc);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}};
function pointerXY(e){const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*vw/b.width,(e.clientY-b.top)*vh/b.height];}
let lastTap={at:0,key:''};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const [x,y]=pointerXY(e);if(os.W.shell===W.shell.EDIT&&os.W.system===W.system.READY&&!os.pending&&paintRect&&x>=paintRect.x&&x<=paintRect.x+paintRect.s&&y>=paintRect.y&&y<=paintRect.y+paintRect.s){drawing={pointer:e.pointerId,changed:false};canvas.setPointerCapture(e.pointerId);setPx(x,y);return;}const h=hit.slice().reverse().find(i=>x>=i.x&&x<=i.x+i.w&&y>=i.y&&y<=i.y+i.h);if(!h)return;if(h.kind==='paint')return;
 const key=[Math.round(h.x),Math.round(h.y),Math.round(h.w),Math.round(h.h)].join(':');const dbl=(lastTap.key===key&&performance.now()-lastTap.at<380);lastTap={key,at:performance.now()};if(dbl&&h.dbl){h.dbl();lastTap.at=0;}else if(h.tap)h.tap();});
canvas.addEventListener('pointermove',e=>{if(!drawing||drawing.pointer!==e.pointerId||os.tool!=='pencil')return;e.preventDefault();const [x,y]=pointerXY(e);setPx(x,y);});
function stop(e){if(drawing?.pointer===e.pointerId)drawing=null;}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)invalidate();});window.addEventListener('pageshow',()=>invalidate());
resize();boot();setInterval(()=>{if(os.W.system===W.system.READY)invalidate();},30000);
})();
