<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>WRKMAN First Sense</title><style>html,body{margin:0;overflow:hidden;background:#080e19;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none}</style></head><body><div id="status" style="position:fixed;top:8px;left:8px;color:#8af2da;font:13px system-ui;z-index:5;pointer-events:none">Starting First Sense...</div><canvas id="c"></canvas><script>window.onerror=function(m,src,line){document.getElementById('status').textContent='JS ERROR: '+m+' (line '+line+')';document.getElementById('status').style.color='#ff9a9a'};</script><script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,paused=false,push=false,menu=false,t=0,step=0,seed=1337,trail=[],hist=[],model=[0,0,0,0],counts=[0,0,0,0],pred=0,actual=0,agent={x:.5,y:.5};const lights=[{x:.2,y:.25,r:.11},{x:.77,y:.25,r:.13},{x:.6,y:.75,r:.1},{x:.25,y:.78,r:.08}],dirs=[[-1,0],[1,0],[0,-1],[0,1]];let hits=[];function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function reset(){seed=1337;t=step=pred=actual=0;agent={x:.5,y:.5};trail=[];hist=[];model=[0,0,0,0];counts=[0,0,0,0];lights.splice(0,4,{x:.2,y:.25,r:.11},{x:.77,y:.25,r:.13},{x:.6,y:.75,r:.1},{x:.25,y:.78,r:.08})}function sense(x,y){return Math.max(...lights.map(o=>Math.exp(-1.4*((x-o.x)**2+(y-o.y)**2)/o.r**2)))}function resize(){W=innerWidth;H=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function text(s,x,y,z=12,col='#d8e7f7',align='left'){g.fillStyle=col;g.font='600 '+z+'px system-ui';g.textAlign=align;g.fillText(s,x,y)}function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function btn(s,x,y,w,h,fn){box(x,y,w,h,'#20354c');text(s,x+w/2,y+h/2+4,12,'#c6f8e9','center');hits.push({x,y,w,h,fn})}function tick(){if(paused)return;if(++t%9)return;const a=step++%4,old=sense(agent.x,agent.y),dir=dirs[a];pred=model[a];agent.x=clamp(agent.x+dir[0]*.028,.04,.96);agent.y=clamp(agent.y+dir[1]*.028,.04,.96);if(push&&step%5===0){agent.x=clamp(agent.x+(rng()-.5)*.2,.04,.96);agent.y=clamp(agent.y+(rng()-.5)*.2,.04,.96)}actual=sense(agent.x,agent.y)-old;model[a]+=.13*(actual-model[a]);counts[a]++;trail.push([agent.x,agent.y]);if(trail.length>150)trail.shift();hist.push(Math.abs(actual-pred));if(hist.length>100)hist.shift()}function render(){hits=[];box(0,0,W,H,'#080e19');const mobile=W<650,top=65,ah=mobile?Math.max(170,H*.43):Math.max(240,H*.65),aw=mobile?W-28:W*.62,ax=14,ay=top; text('WRKMAN / FIRST SENSE',14,25,16,'#8af2da');text('One sensor. Movement. Memory. No map.',14,45,11,'#91a9c1');box(ax,ay,aw,ah,'#101d2d');g.save();g.beginPath();g.rect(ax,ay,aw,ah);g.clip();for(let x=ax;x<ax+aw;x+=22){g.strokeStyle='#1b2c40';g.beginPath();g.moveTo(x,ay);g.lineTo(x,ay+ah);g.stroke()}for(let y=ay;y<ay+ah;y+=22){g.strokeStyle='#1b2c40';g.beginPath();g.moveTo(ax,y);g.lineTo(ax+aw,y);g.stroke()}for(const o of lights){const x=ax+o.x*aw,y=ay+o.y*ah,r=o.r*Math.min(aw,ah)*2.5,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'#ffc878aa');gr.addColorStop(1,'#ffc87800');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}g.beginPath();trail.forEach((p,i)=>i?g.lineTo(ax+p[0]*aw,ay+p[1]*ah):g.moveTo(ax+p[0]*aw,ay+p[1]*ah));g.strokeStyle='#55ddc8';g.lineWidth=2;g.stroke();g.fillStyle='#9fffe5';g.beginPath();g.arc(ax+agent.x*aw,ay+agent.y*ah,8,0,7);g.fill();g.restore();const sy=mobile?ay+ah+10:ay,sx=mobile?14:ax+aw+12,sw=mobile?W-28:W-sx-14,sh=mobile?122:ah;box(sx,sy,sw,sh,'#13243a');text('SENSORY EXPERIENCE',sx+10,sy+22,12,'#b1cce5');text('Intensity',sx+10,sy+46);box(sx+90,sy+36,sw-105,12,'#29405b');box(sx+90,sy+36,(sw-105)*sense(agent.x,agent.y),12,'#efb66b');text('Prediction',sx+10,sy+72,12);text(pred.toFixed(3),sx+sw-10,sy+72,12,'#8bd5fc','right');text('Observation',sx+10,sy+95,12);text(actual.toFixed(3),sx+sw-10,sy+95,12,'#8af2da','right');if(!mobile){text('Error: '+Math.abs(pred-actual).toFixed(3),sx+10,sy+126);text('Actions: '+step,sx+10,sy+150);text('No consciousness inferred.',sx+10,sy+190,11,'#8ca5bf')}const by=mobile?sy+132:ay+ah+10,bw=(W-42)/3;btn(paused?'RESUME':'PAUSE',14,by,bw,38,()=>paused=!paused);btn('RESET',21+bw,by,bw,38,reset);btn('MENU',28+2*bw,by,bw,38,()=>menu=!menu);const iy=by+57;text(push?'MODE: UNPREDICTABLE PUSHES':'MODE: STABLE WORLD',14,iy,12,push?'#ffbe83':'#8af2da');text('Tap arena to relocate nearest light.',14,iy+21,11,'#91a9c1');text('Prediction error over time',14,iy+44,11,'#91a9c1');const cy=iy+54,ch=Math.max(25,Math.min(65,H-cy-12));box(14,cy,W-28,ch,'#13243a');g.beginPath();hist.forEach((e,i)=>{const x=16+i/99*(W-32),y=cy+ch-4-clamp(e/.5,0,1)*(ch-8);i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle='#e9b66d';g.lineWidth=2;g.stroke();if(menu){box(20,H/2-105,W-40,210,'#243a52');text('EXPERIMENT CONTROLS',W/2,H/2-77,15,'#d9f6f2','center');btn(push?'PUSHES: ON':'PUSHES: OFF',35,H/2-55,W-70,42,()=>{push=!push;menu=false});btn('RESTART SAME CONDITIONS',35,H/2-5,W-70,42,()=>{reset();menu=false});btn('CLOSE',35,H/2+45,W-70,42,()=>menu=false)}}requestAnimationFrame(loop)}function loop(){try{tick();tick();render();document.getElementById('status').textContent=''}catch(e){document.getElementById('status').textContent='RUNTIME ERROR: '+e.message;document.getElementById('status').style.color='#ff9a9a'}}c.addEventListener('pointerdown',e=>{e.preventDefault();const x=e.clientX,y=e.clientY;for(let i=hits.length-1;i>=0;i--){const b=hits[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return}}if(menu)return;const aw=W<650?W-28:W*.62,ah=W<650?Math.max(170,H*.43):Math.max(240,H*.65);if(x>=14&&x<=14+aw&&y>=65&&y<=65+ah){const nx=(x-14)/aw,ny=(y-65)/ah;let best=lights[0],dist=Infinity;for(const o of lights){const q=Math.hypot(o.x-nx,o.y-ny);if(q<dist){dist=q;best=o}}best.x=clamp(nx,.08,.92);best.y=clamp(ny,.08,.92)}},{passive:false});loop()})();
</script></body></html>
