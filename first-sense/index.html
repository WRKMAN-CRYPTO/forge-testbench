<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080e19">
<title>WRKMAN / First Sense 0.6</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e19;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none}
#status{position:fixed;top:8px;left:8px;right:8px;z-index:9;color:#ff9696;font:13px system-ui;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="status"></div>
<canvas id="c" aria-label="First Sense: sensorimotor learning laboratory"></canvas>
<script>
window.onerror=function(message,source,line){var el=document.getElementById('status');el.textContent='JS ERROR: '+message+' (line '+line+')';};
</script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),g=canvas.getContext('2d');
var W=0,H=0,D=1,paused=false,menu=false,push=false,need=true,mode='quiet';
var tickCount=0,step=0,actionSeed=1337,pushSeed=7349,lastAction=-1;
var pred=0,actual=0,absError=0,agent={x:.5,y:.5},hits=[],trail=[],errors=[];
var actionNames=['LEFT','RIGHT','UP','DOWN'],dirs=[[-1,0],[1,0],[0,-1],[0,1]];
var modes=[
{id:'curious',title:'CURIOUS',hint:'Seek surprising, underexplored action outcomes'},
{id:'quiet',title:'QUIET',hint:'Prefer familiar, predictable action outcomes'},
{id:'random',title:'RANDOM',hint:'Unbiased movement control'},
{id:'cycle',title:'CYCLE',hint:'Original fixed left-right-up-down sequence'}];
var originLights=[
{x:.20,y:.25,r:.11},{x:.77,y:.25,r:.13},{x:.60,y:.75,r:.10},{x:.25,y:.78,r:.08}];
var lights=originLights.map(function(l){return {x:l.x,y:l.y,r:l.r};});
var memory=[],binVisits=[],lastBin=0,errTotal=0;
var energy=70,feedingSteps=0,emptySteps=0,highLight=0;
var searchDirection=-1,searchLeft=0,searchBouts=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function randomAction(){actionSeed=(Math.imul(actionSeed,1664525)+1013904223)>>>0;return actionSeed/4294967296;}
function randomPush(){pushSeed=(Math.imul(pushSeed,22695477)+1)>>>0;return pushSeed/4294967296;}
function reset(full){
  tickCount=0;step=0;actionSeed=1337;pushSeed=7349;lastAction=-1;
  pred=0;actual=0;absError=0;errTotal=0;
  energy=70;feedingSteps=0;emptySteps=0;highLight=0;
  searchDirection=-1;searchLeft=0;searchBouts=0;
  agent={x:.5,y:.5};trail=[];errors=[];
  memory=Array.from({length:8},function(){return Array.from({length:4},function(){return {mean:0,uncertainty:.03,n:0};});});
  binVisits=Array(8).fill(0);lastBin=0;
  if(full){lights=originLights.map(function(l){return {x:l.x,y:l.y,r:l.r};});}
}
function sense(x,y){
  var maximum=0;
  for(var i=0;i<lights.length;i++){
    var l=lights[i],dx=x-l.x,dy=y-l.y;
    maximum=Math.max(maximum,Math.exp(-1.4*(dx*dx+dy*dy)/(l.r*l.r)));
  }
  return maximum;
}
function bucket(value){return Math.min(7,Math.floor(value*8));}
function chooseAction(bin,oldSense){
  if(mode==='quiet' && need && energy<64 && oldSense<.35){
    // Survival search: a persistent motor bout, not knowledge of light positions.
    // It is a heuristic. The creature still cannot tell a wall from darkness.
    if(searchLeft<=0){
      var bestPred=.003,learned=-1;
      for(var j=0;j<4;j++){
        if(memory[bin][j].n>0 && memory[bin][j].mean>bestPred){
          bestPred=memory[bin][j].mean;learned=j;
        }
      }
      var heading=learned>=0 && randomAction()<.65?learned:Math.floor(randomAction()*4);
      if(heading===searchDirection && randomAction()<.75)heading=(heading+1+Math.floor(randomAction()*3))%4;
      searchDirection=heading;
      searchLeft=11+Math.floor(randomAction()*23);
      searchBouts++;
    }
    searchLeft--;
    return searchDirection;
  }
  searchLeft=0;
  if(mode==='cycle')return step%4;
  if(mode==='random')return Math.floor(randomAction()*4);
  var best=0,bestScore=-Infinity;
  for(var a=0;a<4;a++){
    var m=memory[bin][a];
    var novelty=1/Math.sqrt(1+m.n);
    var score;
    if(mode==='quiet'){
      // An untested action is not treated as proven safe.
      score=-3*Math.abs(m.mean)-2*m.uncertainty-.3*novelty;
      if(need){
        var urgency=1-energy/100;
        score+=urgency*(5*Math.max(0,m.mean)+1.15*novelty);
      }
    }else{
      // Uncertainty and sparse experience are only proxies for curiosity.
      score=3*m.uncertainty+.45*novelty;
      if(need){score+=(1-energy/100)*2.5*Math.max(0,m.mean);}
      if(lastAction>=0 && a===(lastAction^1))score-=.045;
    }
    score+=(randomAction()-.5)*.025;
    if(score>bestScore){bestScore=score;best=a;}
  }
  return best;
}
function move(){
  if(paused)return;
  tickCount++;
  if(tickCount%9!==0)return;
  var oldSense=sense(agent.x,agent.y);
  var bin=bucket(oldSense);
  var a=chooseAction(bin,oldSense),m=memory[bin][a],dir=dirs[a];
  pred=m.mean;
  agent.x=clamp(agent.x+dir[0]*.028,.04,.96);
  agent.y=clamp(agent.y+dir[1]*.028,.04,.96);
  step++;
  if(push && step%5===0){
    agent.x=clamp(agent.x+(randomPush()-.5)*.20,.04,.96);
    agent.y=clamp(agent.y+(randomPush()-.5)*.20,.04,.96);
  }
  var newSense=sense(agent.x,agent.y);
  actual=newSense-oldSense;
  if(need){
    energy=clamp(energy-.24+.65*newSense,0,100);
    if(energy<=0)emptySteps++;
    if(newSense>.37)feedingSteps++;
  }
  highLight=Math.max(highLight,newSense);
  absError=Math.abs(actual-pred);
  // Update experience only AFTER acting. The decision never uses x/y.
  m.mean+=.13*(actual-m.mean);
  m.uncertainty=.90*m.uncertainty+.10*absError;
  m.n++;
  binVisits[bin]++;
  lastBin=bin;lastAction=a;errTotal+=absError;
  trail.push([agent.x,agent.y]);
  if(trail.length>160)trail.shift();
  errors.push(absError);
  if(errors.length>120)errors.shift();
}
function size(){
  W=window.innerWidth;H=window.innerHeight;D=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);
  g.setTransform(D,0,0,D,0,0);
}
window.addEventListener('resize',size);
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);}
function text(s,x,y,size,color,align){
  g.fillStyle=color||'#dceaf8';
  g.font='600 '+(size||12)+'px system-ui';
  g.textAlign=align||'left';
  g.fillText(String(s),x,y);
}
function button(label,x,y,w,h,fn,active){
  rect(x,y,w,h,active?'#29615d':'#20354c');
  text(label,x+w/2,y+h/2+4,12,active?'#dffff2':'#cbf5ec','center');
  hits.push({x:x,y:y,w:w,h:h,fn:fn});
}
function point(x,y,r,color){
  g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
}
function render(){
  hits=[];rect(0,0,W,H,'#080e19');
  var mobile=W<650,ax=14,ay=65,aw=mobile?W-28:W*.62;
  var ah=mobile?Math.max(175,Math.min(H*.43,H-355)):Math.max(250,H*.65);
  text('WRKMAN / FIRST SENSE',14,25,16,'#8af2da');
  text('One sense · self-chosen actions · learned predictions',14,45,mobile?10:12,'#94aac3');
  rect(ax,ay,aw,ah,'#101d2d');
  g.save();g.beginPath();g.rect(ax,ay,aw,ah);g.clip();
  g.strokeStyle='#213349';g.lineWidth=1;
  for(var x=ax;x<ax+aw;x+=23){g.beginPath();g.moveTo(x,ay);g.lineTo(x,ay+ah);g.stroke();}
  for(var y=ay;y<ay+ah;y+=23){g.beginPath();g.moveTo(ax,y);g.lineTo(ax+aw,y);g.stroke();}
  for(var i=0;i<lights.length;i++){
    var l=lights[i],lx=ax+l.x*aw,ly=ay+l.y*ah,radius=l.r*Math.min(aw,ah)*2.5;
    var gradient=g.createRadialGradient(lx,ly,0,lx,ly,radius);
    gradient.addColorStop(0,'rgba(255,202,113,.65)');
    gradient.addColorStop(1,'rgba(255,202,113,0)');
    g.fillStyle=gradient;g.beginPath();g.arc(lx,ly,radius,0,Math.PI*2);g.fill();
  }
  if(trail.length){
    g.beginPath();
    trail.forEach(function(p,i){
      if(i===0)g.moveTo(ax+p[0]*aw,ay+p[1]*ah);
      else g.lineTo(ax+p[0]*aw,ay+p[1]*ah);
    });
    g.strokeStyle='#4cd4c9';g.lineWidth=2;g.stroke();
  }
  var px=ax+agent.x*aw,py=ay+agent.y*ah;
  point(px,py,8,'#a2ffe3');
  if(lastAction>=0){
    g.strokeStyle='#e2fff6';g.lineWidth=2;
    g.beginPath();g.moveTo(px,py);g.lineTo(px+dirs[lastAction][0]*14,py+dirs[lastAction][1]*14);g.stroke();
  }
  // Resource is internal state; the decision system never sees source coordinates.
  rect(ax+aw-135,ay+12,123,35,'rgba(5,14,25,.77)');
  text(need?'ENERGY '+energy.toFixed(0)+'%':'NEED OFF',ax+aw-125,ay+27,10,need?'#ffe1a2':'#a8baca');
  rect(ax+aw-125,ay+34,100,5,'#344b61');
  if(need)rect(ax+aw-125,ay+34,energy,5,energy>20?'#f3c478':'#ff7979');
  g.restore();
  var sy=mobile?ay+ah+10:ay,sx=mobile?14:ax+aw+12,sw=mobile?W-28:W-sx-14,sh=mobile?122:ah;
  rect(sx,sy,sw,sh,'#14243a');
  text('SENSORY EXPERIENCE',sx+10,sy+22,12,'#bdd5e8');
  text('Intensity',sx+10,sy+46);
  rect(sx+90,sy+36,Math.max(0,sw-105),12,'#2c435d');
  rect(sx+90,sy+36,Math.max(0,sw-105)*sense(agent.x,agent.y),12,'#efb66b');
  text('Prediction',sx+10,sy+72);
  text(pred.toFixed(3),sx+sw-10,sy+72,12,'#90d6ff','right');
  text('Observation',sx+10,sy+95);
  text(actual.toFixed(3),sx+sw-10,sy+95,12,'#8af2da','right');
  if(!mobile){
    text('Action: '+(lastAction<0?'NONE':actionNames[lastAction]),sx+10,sy+128);
    text('Steps: '+step,sx+10,sy+150);
    text('No claim of consciousness.',sx+10,sy+190,11,'#8ea5bc');
  }
  var by=mobile?sy+132:ay+ah+10,bw=(W-42)/3;
  button(paused?'RESUME':'PAUSE',14,by,bw,38,function(){paused=!paused;});
  button('RESET',21+bw,by,bw,38,function(){reset(false);});
  button('MENU',28+2*bw,by,bw,38,function(){menu=!menu;});
  var iy=by+55,visited=binVisits.filter(function(n){return n>0;}).length;
  var mean=errors.length?errors.reduce(function(a,b){return a+b;},0)/errors.length:0;
  var label=mode.toUpperCase()+'  ·  '+(need?'NEED ON':'NEED OFF')+(push?'  ·  PUSHES':'');
  text('DRIVE: '+label,14,iy,12,push?'#ffc085':'#8af2da');
  text('STEPS '+step+'   MAE '+mean.toFixed(3)+'   BINS '+visited+'/8   FED '+feedingSteps,14,iy+21,11,'#b8cde0');
  text('Tap arena to relocate a light.',14,iy+41,11,'#93a9be');
  text('Prediction error (recent 120 actions)',14,iy+61,11,'#93a9be');
  var cy=iy+70,ch=Math.max(23,Math.min(62,H-cy-12));
  rect(14,cy,W-28,ch,'#14243a');
  if(errors.length){
    var maxErr=Math.max(.08,Math.max.apply(null,errors));
    g.beginPath();
    errors.forEach(function(e,i){
      var ex=16+i/119*(W-32),ey=cy+ch-4-(e/maxErr)*(ch-8);
      if(i===0)g.moveTo(ex,ey);else g.lineTo(ex,ey);
    });
    g.strokeStyle='#e9b66d';g.lineWidth=2;g.stroke();
  }
  if(menu)renderMenu();
}
function renderMenu(){
  rect(0,0,W,H,'rgba(2,6,13,.82)');
  var mw=Math.min(W-28,470),mh=407,mx=(W-mw)/2,my=(H-mh)/2;
  rect(mx,my,mw,mh,'#20354b');
  text('BEHAVIOR LAB',mx+16,my+27,17,'#8af2da');
  text('Choosing a drive resets experience for comparison.',mx+16,my+48,10,'#a9c2d8');
  var gap=9,cw=(mw-41)/2,bx=mx+16;
  modes.forEach(function(item,i){
    var x=bx+(i%2)*(cw+gap),y=my+64+Math.floor(i/2)*52;
    button(item.title,x,y,cw,43,function(){mode=item.id;reset(false);menu=false;},mode===item.id);
  });
  var chosen=modes.filter(function(item){return item.id===mode;})[0];
  text(chosen.hint,mx+16,my+179,10,'#b7cde1');
  button(need?'ENERGY NEED: ON':'ENERGY NEED: OFF',mx+16,my+194,mw-32,40,function(){need=!need;reset(false);menu=false;},need);
  button(push?'DISTURBANCES: ON':'DISTURBANCES: OFF',mx+16,my+240,mw-32,40,function(){push=!push;reset(false);menu=false;},push);
  button('RESET LIGHT POSITIONS',mx+16,my+286,mw-32,40,function(){reset(true);menu=false;});
  button('CLOSE',mx+16,my+332,mw-32,40,function(){menu=false;});
  text('Light restores energy. Search bursts have no map.',mx+16,my+399,10,'#93a9be');
}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var x=e.clientX,y=e.clientY;
  for(var i=hits.length-1;i>=0;i--){
    var b=hits[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}
  }
  if(menu)return;
  var mobile=W<650,aw=mobile?W-28:W*.62,ah=mobile?Math.max(175,Math.min(H*.43,H-355)):Math.max(250,H*.65);
  if(x>=14&&x<=14+aw&&y>=65&&y<=65+ah){
    var nx=(x-14)/aw,ny=(y-65)/ah,best=null,distance=Infinity;
    lights.forEach(function(l){
      var dist=Math.hypot(l.x-nx,l.y-ny);
      if(dist<distance){distance=dist;best=l;}
    });
    if(best){best.x=clamp(nx,.08,.92);best.y=clamp(ny,.08,.92);}
  }
},{passive:false});
window.firstSenseDiagnostics=function(){
  return {mode:mode,push:push,need:need,energy:energy,feedingSteps:feedingSteps,emptySteps:emptySteps,peakLight:highLight,searchBouts:searchBouts,steps:step,binCoverage:binVisits.filter(function(n){return n>0;}).length,
    meanAbsError:errors.length?errors.reduce(function(a,b){return a+b;},0)/errors.length:0,
    allTimeMeanAbsoluteError:step?errTotal/step:0,
    modelSamples:memory.reduce(function(a,row){return a+row.filter(function(m){return m.n>0;}).length;},0)};
};
window.firstSenseChooseMode=function(v){if(modes.some(function(m){return m.id===v;})){mode=v;reset(false);}};
window.firstSenseSetNeed=function(v){need=!!v;reset(false);};
var status=document.getElementById('status');
function loop(){
  try{
    move();move();
    render();
    status.textContent='';
    requestAnimationFrame(loop);
  }catch(e){
    status.textContent='RUNTIME ERROR: '+e.message;
    throw e;
  }
}
reset(true);size();loop();
})();
</script>
</body>
</html>
