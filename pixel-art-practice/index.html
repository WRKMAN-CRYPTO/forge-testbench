<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--bg:#0b0f15;--panel:#151c27;--line:#2a3547;--ink:#f2f5fa;--muted:#9ba8bb;--accent:#79e6a5;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}header{padding:8px 2px}h1{margin:0;font-size:25px}header p{color:var(--muted);font-size:12px;line-height:1.5}.entry{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.thumb{width:92px;height:92px;background:#c7c0b5;border-radius:12px;image-rendering:pixelated}.hero h2{margin:0 0 4px;font-size:18px}.run{font-size:10px;color:var(--accent);letter-spacing:.12em}.principle{font-size:11px;color:var(--muted)}.play{display:inline-grid;place-items:center;min-height:46px;margin-top:9px;padding:0 14px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:12px;text-decoration:none;font-weight:900}.body{padding:12px;display:grid;gap:9px}.label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.08em}.body p{margin:3px 0 0;color:#c7d0dd;font-size:12px;line-height:1.5}.source{color:#9dc8ff}.rating{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rating button{width:45px;height:45px;border-radius:12px;border:1px solid var(--line);background:#101722;color:var(--ink);font:inherit;font-weight:900}.rating button.active{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:10px;color:var(--muted)}@media(min-width:500px){.hero{grid-template-columns:112px 1fr}.thumb{width:112px;height:112px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p>One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[{n:9,slug:'009-loadout-read',title:'Loadout Read',principle:'Asymmetry + equipment integration',attempt:'Four compact humanoids built from the Crew Call mass hierarchy, each given exactly one dominant off-center loadout: shield, hammer, bow, or staff. Rear limbs stay merged into the body so the equipment, not anatomy noise, owns the silhouette extension.',source:'Pedro Medeiros: Character Design 1; GameDev Academy: Create A Pixel Art Player Sprite',url:'https://www.patreon.com/saint11/posts/character-design-7530899',crit:'Shield is the strongest broad read because its equipment is unmistakably a separate designed mass. Hammer has strong asymmetry but the head/handle junction can still resemble a branch. Bow is the weakest: its thin arc risks becoming antenna-noise. Staff is clean but too generic. Progress: role identity is now being added without abandoning Crew Call’s compact body.',bench:'Estimated 37/53. No head-count ambiguity. Main hard-fail risk is thin equipment becoming limb-count ambiguity.'},{n:8,slug:'008-crew-call',title:'Crew Call',principle:'Proportion hierarchy at 16×16',attempt:'Scout, Hauler, Guard, and Miner used compressed 2–3-head proportions with role differences carried by body mass rather than handheld props.',source:'SpriteGen: How to Draw a Pixel Art Character (16×16 and 32×32)',url:'https://spritegen.io/guides/how-to-draw-a-pixel-art-character/',crit:'User review: best characters so far. Hauler remains the clearest mass hierarchy; Scout is too skeletal and Guard risks side-protrusion noise.',bench:'33/53. Current internal humanoid baseline.'},{n:7,slug:'007-hidden-limb',title:'Hidden Limb',principle:'Anatomical compression through occlusion',attempt:'Run, duck, brace, and jump poses deliberately swallowed rear limbs into the torso to reduce contour branches.',source:'GameDev Academy player sprite lesson',url:'https://gamedevacademy.org/player-pixelart-tutorial/',crit:'Run and brace read cleanest. Duck compresses toward a creature/blob; jump still has weak leg relationships.',bench:'Subtraction improved the contour, but did not yet solve body hierarchy.'},{n:6,slug:'006-skeleton-lock',title:'Skeleton Lock',principle:'Joint anchoring + believable weight',attempt:'Push, pull, reach, and run tested shoulder/hip anchors and line of action.',source:'Thomas Palef run-cycle breakdown (source retained from run notes)',url:'#',crit:'User review: reach was clearest but still resembled a bug with antennas. Too many contour branches created extra-limb/head ambiguity.',bench:'Hard fail discovered: limb-count ambiguity.'},{n:5,slug:'005-shape-ward',title:'Shape Ward',principle:'Shape language as gameplay role',attempt:'Creature roles were built around round, square, and triangular dominant masses.',source:'Source retained in original research pass; URL not recorded in current directory metadata.',url:'#',crit:'Round creature read soft fastest. Square brute bordered on a box with a face; triangular hunter was too symmetrical.',bench:'Useful shape-language lesson, weaker character construction.'},{n:4,slug:'004-pose-relay',title:'Pose Relay',principle:'Skeleton-first action poses',attempt:'Action silhouettes tested whether pose could communicate a verb before detail.',source:'Source retained in original research pass; URL not recorded in current directory metadata.',url:'#',crit:'User review: Carry had the strongest skeleton. Catch was distinct but its arms appeared attached too close to the head.',bench:'Carry remains an important structural reference.'},{n:3,slug:'003-edge-runner',title:'Edge Runner',principle:'Outline contrast across backgrounds',attempt:'Sprites crossed changing backgrounds to test outline visibility and selective outlining.',source:'Source retained in original research pass; URL not recorded in current directory metadata.',url:'#',crit:'Tinted outlines integrated better than pure black, but selective outlining was too conservative and some cave edges disappeared.',bench:'Established that grading backgrounds must not hide contour quality.'},{n:2,slug:'002-cluster-critters',title:'Cluster Critters',principle:'Clusters, not confetti',attempt:'Several creatures were assembled from connected color masses instead of isolated decorative pixels.',source:'Source retained in original research pass; URL not recorded in current directory metadata.',url:'#',crit:'Crab had the strongest broad silhouette. Some interior regions filled space instead of describing volume.',bench:'Cluster discipline improved, silhouette differentiation still limited.'},{n:1,slug:'001-silhouette-hunt',title:'Silhouette Hunt',principle:'Silhouette separation',attempt:'Knight, Mage, Archer, and Brute were identified from shape alone before color reveal.',source:'Source retained in original research pass; URL not recorded in current directory metadata.',url:'#',crit:'Archer read strongest; the four bodies shared too much central humanoid mass.',bench:'Established silhouette-only testing as the core practice constraint.'}];const icons={9:['.....0000.......','....000000..00..','....000000.0000.','.....0000..0000.','.....000...0000.','....00000..000..','...0000000......','...0000000......','....00000.......','....00000.......','...0000000......','...00..000......','..00....00......'],8:['.....00000......','....0000000.....','....0000000.....','.....00000......','......000.......','...000000000....','..00000000000...','..00000000000...','...000000000....','...000000000....','..00000000000...','..0000..0000....','...00....00.....'],7:['.....0000.......','....000000......','.....0000.......','...0000000......','..0000000000....','...0000000......','....00000.......','...00..000......','..00....00......'],6:['.........00.....','........0000....','.......00000....','....0000000.....','...00000000.....','.....0000.......','....00..00......'],5:['.....0000.......','...00000000.....','..0000000000....','...00000000.....','....00..00......'],4:['.........000....','........0000....','......0000......','....000000......','...0000000......','....00.000......','...00...00......'],3:['.....000........','....00000.......','....00000.......','...0000000......','...0000000......','....00.00.......','...00...00......'],2:['................','....00....00....','...0000000000...','..000000000000..','....00000000....','.....00..00.....'],1:['......00........','.....0000.......','......00........','....000000......','...00000000.....','....00..00......','...00....00.....']};const root=document.getElementById('runs');R.forEach(r=>{const a=document.createElement('article');a.className='entry';a.innerHTML=`<div class="hero"><canvas id="thumb${r.n}" class="thumb" width="112" height="112"></canvas><div><div class="run">EXPERIMENT ${String(r.n).padStart(3,'0')}</div><h2>${r.title}</h2><div class="principle">${r.principle}</div><a class="play" href="${r.slug}/">PLAY →</a></div></div><div class="body"><div><div class="label">PRINCIPLE STUDIED</div><p>${r.principle}</p></div><div><div class="label">WHAT I ATTEMPTED</div><p>${r.attempt}</p></div><div><div class="label">SOURCE / TUTORIAL</div><p>${r.url==='#'?r.source:`<a class="source" href="${r.url}" target="_blank" rel="noopener">${r.source}</a>`}</p></div><div><div class="label">SELF-CRITIQUE</div><p>${r.crit}</p></div><div><div class="label">BENCHMARK</div><p>${r.bench}</p></div><div><div class="label">YOUR RATING</div><div class="rating" data-key="pixelArtPracticeRating${String(r.n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(a)});function drawThumb(n){const c=document.getElementById('thumb'+n),x=c.getContext('2d'),s=7;x.imageSmoothingEnabled=false;x.fillStyle='#c7c0b5';x.fillRect(0,0,112,112);const p=icons[n];x.fillStyle='#243040';const oy=Math.floor((16-p.length)/2);p.forEach((r,y)=>{for(let xx=0;xx<r.length;xx++)if(r[xx]==='0')x.fillRect(xx*s,(y+oy)*s,s,s)})}R.forEach(r=>drawThumb(r.n));document.querySelectorAll('.rating').forEach(box=>{const key=box.dataset.key,buttons=[...box.querySelectorAll('button')];let v=localStorage.getItem(key);function paint(){buttons.forEach(b=>b.classList.toggle('active',b.textContent===v))}buttons.forEach(b=>b.onclick=()=>{v=b.textContent;localStorage.setItem(key,v);paint()});paint()});document.addEventListener('contextmenu',e=>e.preventDefault())})();</script></body></html>
