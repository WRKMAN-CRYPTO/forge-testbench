<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--bg:#0b0f15;--panel:#151c27;--line:#2a3547;--ink:#f2f5fa;--muted:#9ba8bb;--accent:#79e6a5;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}header{padding:8px 2px}h1{margin:0;font-size:25px}header p{color:var(--muted);font-size:12px;line-height:1.5}.entry{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.thumb{width:92px;height:92px;background:#d3cab9;border-radius:12px;image-rendering:pixelated}.hero h2{margin:0 0 4px;font-size:18px}.run{font-size:10px;color:var(--accent);letter-spacing:.12em}.principle{font-size:11px;color:var(--muted);line-height:1.35}.play{display:inline-grid;place-items:center;min-height:46px;margin-top:9px;padding:0 14px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:12px;text-decoration:none;font-weight:900}.body{padding:12px;display:grid;gap:9px}.label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.08em}.body p{margin:3px 0 0;color:#c7d0dd;font-size:12px;line-height:1.5}.source{color:#9dc8ff}.rating{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rating button{width:45px;height:45px;border-radius:12px;border:1px solid var(--line);background:#101722;color:var(--ink);font:inherit;font-weight:900}.rating button.active{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:10px;color:var(--muted)}@media(min-width:500px){.hero{grid-template-columns:112px 1fr}.thumb{width:112px;height:112px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p>One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[
[23,'023-windup-lane','Windup Lane','Anticipation silhouettes must predict the future hit','A three-lane dodge game uses a 16×16 boss with distinct left, center, and right startup silhouettes. CLEAR WINDUP points the whole body toward the future hit; MUDDY WINDUP compresses all startups toward one generic crouch.','Rivals Workshop Community Library: Anticipation, Action, Recovery; imonk: Sword Slash Animation','https://www.rivalslib.com/workshop_guide/art/anticipation_action_recovery.html','The left and right windups are strongest because torso lean, arm reach, and balance all agree. Center is weaker because a vertical threat has fewer asymmetric contour clues. The A/B test also exposes that anticipation must communicate direction, not merely effort.'],
[22,'022-machine-phase','Machine Phase','Hand-correct rigid-part animation after modular transforms','Four original 16×16 machines animate through four mechanical phases. PIXEL FIX hand-corrects thickness, joints, and contour anchors; RAW MODULE deliberately preserves integer-grid transform artifacts.','Pedro Medeiros: Modular Animation; Machines and Weird Tech','https://www.patreon.com/saint11/posts/modular-15160612','Fan exposes the principle fastest because thin rotating blades wobble badly under raw pixel transforms. Winch also benefits from correcting the crank attachment. Press is intentionally more stable, so the A/B difference is smaller. Pump shows how a rocker can drift into decorative noise if its pivot is not visually anchored.'],
[21,'021-depth-cheat','Depth Cheat','Foreshortening with readability-preserving projection cheats','Four 16×16 tools cycle through side, three-quarter, and near-camera silhouettes. READABLE CHEAT keeps one diagnostic contour anchor exposed as depth collapses; LITERAL allows overlap to swallow it.','Animworks: Silhouette in Animation; Wayline: Making a game-ready sprite','https://anim.works/silhouette-in-animation/','Hammer and Wrench benefit most because a small asymmetry prevents near views becoming anonymous bars. Shovel remains fairly readable from blade mass. Axe is the weak case because its broad head can converge toward Hammer.'],
[20,'020-motion-lock','Motion Lock','Identity invariants across animated key poses','Four compact 16×16 workers are redrawn through four locomotion key poses while core identity masses stay stable.','the-pixel.art: Animating a Pixel Walk Cycle; Animworks: Silhouette in Animation','https://the-pixel.art/articles/pixel-walk-cycle/','Hauler and Guard preserve identity best. Scout becomes generic during passing poses. Miner can drift toward Guard. Animation can spend silhouette pixels on motion only after deciding which masses may not drift.'],
[19,'019-contact-read','Contact Read','Contact-point negative space for overlapping forms','Four paired 16×16 setups deliberately touch or overlap. CLEAN preserves tiny air pockets and staggered seams; FUSED closes them.','Wayline: Making a game-ready sprite; Animworks: Silhouette in Animation','https://www.wayline.io/learn/pixel-art/4','Handoff and Clash show the principle most clearly. Rescue remains muddy even when CLEAN. Negative space can clarify ownership of good masses but cannot rescue confused mass organization.'],
[18,'018-anchor-drop','Anchor Drop','Diagnostic contour anchors through pixel subtraction','Four unrelated 16×16 objects spend pixels on one or two identity-bearing contour landmarks, then ANCHORS OFF removes those landmarks.','Wayline: Making a game-ready sprite; SpriteGen','https://www.wayline.io/learn/pixel-art/4','Key and Boot have strong anchor dependence. Fish stays readable because taper still carries category information. Can collapses without handle plus spout.'],
[17,'017-tuft-signal','Tuft Signal','Selective material clumps without silhouette noise','Four original 16×16 creatures compare bare broad masses with grouped directional fur and feather clumps.','imonk: Pixel Tutorial - Fur','https://itch.io/t/2173926/pixel-tutorial-fur','Wolf and Owl benefit most because texture follows existing masses. Boar gains little. Mammoth risks excess edge activity because the trunk already dominates identity.'],
[16,'016-shape-stack','Shape Stack','Big-medium-small mass hierarchy for prop recognition','Four original 16×16 props organize silhouettes around dominant, supporting, and accent masses.','PixelSanctuary: Big-Medium-Small; Wayline','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Anvil and Drill are strongest because hierarchy explains construction. Lantern crown is decorative. Cannon has competing barrel and carriage weight.'],
[15,'015-mass-signal','Mass Signal','Exaggerated proportion as semantic compression','Four workers remove equipment clues and bias body mass toward POWER, SPEED, LOAD, or REACH.','SpriteGen: How to Draw a Pixel Art Character','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Power and Load separate best because the whole body participates. Speed risks merely looking skinny. Reach risks false-limb noise.'],
[14,'014-action-read','Action Read','Action staging through one dominant line of force','One worker is redrawn as SWING, PUSH, LIFT, and SPRINT while compact anatomy survives.','Pixel Canvas Hub: Dynamic Poses; Wayline','https://pixelcanvashub.com/post/dynamic-poses-strong-characters-a-motion-first-guide-to-character-design','Sprint has the clearest force and Lift is structurally clear. Push merges arm and body somewhat. Swing risks branch-like tool contours.'],
[13,'013-value-crew','Value Crew','Large interior value blocks without contour noise','Four workers keep compact outer silhouettes while profession cues move inward into broad value regions.','Pedro Medeiros: Outlines','https://www.patreon.com/saint11/posts/outlines-14106192','Hauler has the strongest interior hierarchy. Welder is head-heavy, Medic leans on shorthand, and Scout is expressive but abstract.'],
[12,'012-facing-signal','Facing Signal','Directional facing cues through controlled asymmetry','Four side-facing workers use profile, brim or hood, lean, and toe direction while rear anatomy stays compressed.','Pixel Art Lab: side-view character pixel art','https://pixelartlab.net/tutorials/side-view-character-pixel-art','Courier and Miner are clearest. Guard is too upright. Scout hood peak risks horn or antenna ambiguity.'],
[11,'011-gap-beasts','Gap Beasts','Negative-space carving inside creature silhouettes','Four side-view creatures use deliberate empty-pixel channels to separate legs, tail, neck, horn, and body masses.','PixelSanctuary: creature silhouette and shape language','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Hound and Crane use gaps best. Ram benefits from one horn hook. Raptor leans too much on generic dinosaur shorthand.'],
[10,'010-armory-grammar','Armory Grammar','Weapon shape grammar through mass distribution','Sword, axe, spear, and mace are designed silhouette-first through taper, head placement, shaft length, guard width, and mass.','Wayline: Making a game-ready sprite','https://www.wayline.io/learn/pixel-art/4','Sword and axe are strongest. Spear risks generic pole read. Mace is distinct but slightly icon-like.'],
[9,'009-loadout-read','Loadout Read','Asymmetry plus equipment integration','Compact humanoids each receive one dominant off-center loadout while rear anatomy remains merged into the body.','Pedro Medeiros: Character Design 1','https://www.patreon.com/saint11/posts/character-design-7530899','Shield is strongest. Hammer can branch visually. Bow remains weakest because the thin arc becomes antenna noise.'],
[8,'008-crew-call','Crew Call','Proportion hierarchy at 16×16','Scout, Hauler, Guard, and Miner use compressed proportions with role differences carried by body mass rather than handheld props.','SpriteGen: How to Draw a Pixel Art Character','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Hauler has clearest hierarchy; Scout is too skeletal; Guard risks side-protrusion noise.'],
[7,'007-hidden-limb','Hidden Limb','Anatomical compression through occlusion','Run, duck, brace, and jump deliberately swallow rear limbs into torso mass to reduce contour branches.','GameDev Academy: player pixel-art tutorial','https://gamedevacademy.org/player-pixelart-tutorial/','Run and brace read cleanest. Duck compresses toward a blob. Jump still has weak leg relationships.'],
[6,'006-skeleton-lock','Skeleton Lock','Joint anchoring and believable weight','Push, pull, reach, and run test shoulder and hip anchors plus line of action before detail.','Thomas Palef run-cycle breakdown','#','Reach was clearest but still resembled a bug with antennas. Too many contour branches create false heads and limbs.'],
[5,'005-shape-ward','Shape Ward','Shape language as gameplay role','Creature roles are built around round, square, and triangular dominant masses.','Original research retained in run','#','Round creature read soft fastest. Square brute bordered on a box with a face. Triangular hunter was too symmetrical.'],
[4,'004-pose-relay','Pose Relay','Skeleton-first action poses','Action silhouettes test whether pose communicates a verb before detail.','Original research retained in run','#','Carry had the strongest skeleton. Catch was distinct but arms appeared attached too close to the head.'],
[3,'003-edge-runner','Edge Runner','Outline contrast across backgrounds','Sprites cross changing backgrounds to test outline visibility and selective outlining.','Original research retained in run','#','Tinted outlines integrated better than pure black, but selective outlining was conservative and some cave edges disappeared.'],
[2,'002-cluster-critters','Cluster Critters','Clusters, not confetti','Several creatures are assembled from connected color masses instead of isolated decorative pixels.','Original research retained in run','#','Crab had strongest broad silhouette. Some interior regions filled space instead of describing volume.'],
[1,'001-silhouette-hunt','Silhouette Hunt','Silhouette separation','Knight, Mage, Archer, and Brute are identified from shape alone before color reveal.','Original research retained in run','#','Archer read strongest. The four bodies shared too much central humanoid mass.']];
const I={23:[[8,2,4,3],[7,5,6,5],[4,6,4,2],[2,7,3,2],[8,10,2,4],[11,10,2,4]],22:[[3,6,8,6],[5,8,4,2],[10,5,2,3],[11,3,2,3],[4,12,2,2],[9,12,2,2]],21:[[3,3,8,2],[5,5,6,2],[7,7,4,2],[8,9,2,3]],20:[[6,2,4,3],[5,5,6,5],[3,8,3,2],[10,8,3,2],[4,10,2,4],[10,10,2,4]],19:[[2,3,4,7],[10,3,4,7],[5,6,6,2],[4,10,3,3],[9,10,3,3]],18:[[3,6,8,4],[10,4,3,2],[2,10,3,2]],17:[[2,6,10,5],[10,4,3,3],[3,4,2,2],[3,11,2,2],[9,11,2,2]],16:[[2,7,12,4],[4,4,6,3],[5,11,2,3],[10,11,2,3]],15:[[5,2,6,3],[4,5,8,6],[2,6,2,3],[12,6,2,3],[5,11,2,3],[9,11,2,3]],14:[[7,2,3,3],[6,5,5,5],[3,6,3,2],[10,7,4,2],[5,10,2,4],[9,10,2,4]],13:[[5,2,6,3],[4,5,8,6],[5,11,2,3],[9,11,2,3]],12:[[6,2,5,3],[5,5,7,6],[10,4,3,2],[5,11,2,3],[9,11,2,3]],11:[[2,6,11,5],[11,4,3,3],[4,11,2,3],[9,11,2,3]],10:[[2,7,12,2],[10,4,4,5],[2,6,3,4]],9:[[6,2,4,3],[5,5,6,6],[2,6,3,4],[9,10,2,4]],8:[[6,2,4,3],[5,5,6,6],[5,11,2,3],[9,11,2,3]],7:[[6,2,4,3],[5,5,6,6],[4,10,3,3],[9,11,2,3]],6:[[6,2,4,3],[5,5,6,6],[3,7,3,2],[10,6,3,2],[5,11,2,3],[9,11,2,3]],5:[[3,5,10,7],[6,2,4,3],[5,12,2,2],[9,12,2,2]],4:[[6,2,4,3],[5,5,6,5],[3,6,3,2],[10,5,3,2],[4,10,2,4],[10,10,2,4]],3:[[6,2,4,3],[5,5,6,6],[5,11,2,3],[9,11,2,3]],2:[[2,6,11,5],[11,4,3,3],[3,11,2,2],[9,11,2,2]],1:[[6,2,4,3],[5,5,6,6],[3,6,2,4],[11,6,2,4],[5,11,2,3],[9,11,2,3]]};
const root=document.getElementById('runs');for(const r of R){const[n,slug,title,principle,attempt,source,url,crit]=r,a=document.createElement('article');a.className='entry';a.innerHTML=`<div class="hero"><canvas id="thumb${n}" class="thumb" width="112" height="112"></canvas><div><div class="run">EXPERIMENT ${String(n).padStart(3,'0')}</div><h2>${title}</h2><div class="principle">${principle}</div><a class="play" href="${slug}/">PLAY →</a></div></div><div class="body"><div><div class="label">PRINCIPLE STUDIED</div><p>${principle}</p></div><div><div class="label">WHAT I ATTEMPTED</div><p>${attempt}</p></div><div><div class="label">SOURCE / TUTORIAL</div><p>${url==='#'?source:`<a class="source" href="${url}" target="_blank" rel="noopener">${source}</a>`}</p></div><div><div class="label">SELF-CRITIQUE</div><p>${crit}</p></div><div><div class="label">YOUR RATING</div><div class="rating" data-key="pixelArtPracticeRating${String(n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(a)}
for(const r of R){const n=r[0],cv=document.getElementById('thumb'+n),x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#d3cab9';x.fillRect(0,0,112,112);x.fillStyle='#26303d';for(const q of I[n]||[])x.fillRect(q[0]*7,q[1]*7,q[2]*7,q[3]*7)}
document.querySelectorAll('.rating').forEach(box=>{const key=box.dataset.key,buttons=[...box.querySelectorAll('button')],paint=v=>buttons.forEach((b,i)=>b.classList.toggle('active',i+1===Number(v)));paint(localStorage.getItem(key));buttons.forEach((b,i)=>b.addEventListener('click',()=>{localStorage.setItem(key,String(i+1));paint(i+1)}))});})();</script></body></html>
