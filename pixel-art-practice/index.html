<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--b:#0b0f15;--p:#151c27;--l:#2a3547;--i:#f2f5fa;--m:#9ba8bb;--a:#79e6a5;--g:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--b);color:var(--i);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}h1{margin:0}.intro{color:var(--m);font-size:12px;line-height:1.5}.e{border:1px solid var(--l);background:var(--p);border-radius:18px;overflow:hidden}.h{display:grid;grid-template-columns:78px 1fr;gap:11px;padding:11px;border-bottom:1px solid var(--l);align-items:center}.thumb{width:78px;height:78px;border-radius:12px;background:#d3cab9;display:grid;place-items:center;color:#26303d;font-size:21px;font-weight:1000;image-rendering:pixelated}.n{font-size:10px;color:var(--a);letter-spacing:.1em}.h h2{margin:2px 0 3px;font-size:18px}.pr{font-size:11px;color:var(--m);line-height:1.35}.play{display:inline-grid;place-items:center;min-height:44px;margin-top:8px;padding:0 13px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:11px;text-decoration:none;font-weight:900}.b{padding:11px;display:grid;gap:8px}.lab{font-size:9px;color:var(--g);font-weight:900;letter-spacing:.08em}.b p{margin:3px 0 0;color:#c7d0dd;font-size:11px;line-height:1.45}.src{color:#9dc8ff}.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rate button{width:43px;height:43px;border-radius:11px;border:1px solid var(--l);background:#101722;color:var(--i);font:inherit;font-weight:900}.rate button.on{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:9px;color:var(--m)}@media(min-width:500px){.h{grid-template-columns:96px 1fr}.thumb{width:96px;height:96px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p class="intro">One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device and are not visible to future automated runs.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[[33,"033-recovery-window","Recovery Window","Recovery-state readability through distinct post-action silhouettes","Four original 16×16 fighters cycle through strike, recovery, and ready poses. The player counters only during recovery; no color cue reveals the window, so the body/weapon relationship must communicate state.","Rivals Workshop Community Library: Anticipation, Action, Recovery","https://www.rivalslib.com/workshop_guide/art/anticipation_action_recovery.html","Maul has the clearest recovery because its heavy terminal mass visibly trails after impact. Cutter is the most fragile: its recovery can still resemble a forward-leaning attack if the sword trail is read before the torso."],[32,"032-edge-tempo","Edge Tempo","Contour rhythm: consistent stair-step diagonals and gradually changing curves","Four original 16×16 weapon/tool silhouettes are flashed from memory. Every object appears once with a clean contour and once with one localized out-of-rhythm jaggy while its diagnostic mass remains intact.","Wayline: Clean lines and shapes — Pixel Art for Games","https://www.wayline.io/learn/pixel-art/1","Sword and Pick carry the cleanest repeated diagonal rhythm. Bow is the hardest test because one pixel on a tiny curve can change both smoothness and apparent bend; repeated play is needed before treating any score difference as meaningful."],[31,"031-turntable-crew","Turntable Crew","Viewpoint consistency through invariant scale, ground anchor, and diagnostic mass ratios","Four original compact workers are drawn as front and side 16×16 silhouettes. Each round shows one front view and three clean side-view candidates; only one preserves the same body-width, depth, head/body, and grounded-height relationships.","Pixeldex Sprite Spec Builder — multi-direction consistency","https://pixeldex.dev/sprites/builder/","The wide Hauler and Guard contracts separate most clearly. Scout and Miner are harder because a one-pixel width change carries too much semantic weight."],[30,"030-core-beasts","Core Beasts","Species identity from torso, neck, and head proportions without appendage shortcuts","Four original 16×16 quadrupeds remove tails, ears, horns, and decorative tufts so Wolf, Boar, Bear, and Horse must read from core masses.","PixelSanctuary: Creature Design — Silhouette, Shape Language, and Readable Monsters","https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette","Boar and Bear separate most confidently. Wolf risks generic canine; Horse remains the hardest core-mass test."],[29,"029-phase-pack","Phase Pack","Quadruped gait phasing while preserving species identity","Four 16×16 quadrupeds compare offset fore/hind gait phases against synchronized legs.","Pedro Medeiros: Quadruped walk/trot cycle","https://www.patreon.com/saint11/posts/quadruped-walk-14012170","Wolf and Boar hold identity best. Goat leans too heavily on horns."],[28,"028-ground-shift","Ground Shift","Lower-body weight transfer over a fixed support foot","Compact workers shift upper mass over a planted foot while a control moves only the legs.","Animworks: Silhouette in Animation","https://anim.works/silhouette-in-animation/","Power and Loader read best; Runner can look merely offset rather than loaded."],[27,"027-heavy-hand","Heavy Hand","Follow-through communicates tool weight without sacrificing silhouette","A compact worker swings sledge, pick, axe, and shovel silhouettes with weighted follow-through versus dead stop.","D Source: Follow Through and Overlapping Action","https://dsource.in/course/principles-animation/follow-through-and-overlapping-action","Sledge and shovel carry weight most clearly; axe can merge with the arm."],[26,"026-joint-lock","Joint Lock","Stable anatomical pivots through animated arcs","Workers animate one arm while preserving or deliberately drifting the shoulder attachment.","Game Developer: 12 Principles for Game Animation","https://www.gamedeveloper.com/game-platforms/12-principles-for-game-animation","Compact 015-style bodies remain cleaner; broad torsos can hide one-pixel joint slips."],[25,"025-arc-yard","Arc Yard","Arc-consistent in-betweens preserve attachment and mechanical identity","Four machines compare stable-pivot arcs with chord-like drift.","Daniel Aktas: Timing + Arcs","https://www.danielaktas.com/middle-school/animation/adobe-animate/magic-doodle-timing-arcs","Hammer and Pump communicate the rule best; Grabber remains weakest."],[24,"024-volume-bounce","Volume Bounce","Squash and stretch while conserving apparent volume and identity","Four creatures compare volume-preserving deformation with bad one-axis scaling.","Pedro Medeiros: Squash and Stretch","https://www.patreon.com/saint11/posts/squash-and-11713421","Slime and Grub tolerate deformation best; Bat loses wing identity first."],[23,"023-windup-lane","Windup Lane","Anticipation silhouettes must predict the future hit","A three-lane dodge game uses distinct left, center, and right startup silhouettes.","Rivals Workshop: Anticipation, Action, Recovery","https://www.rivalslib.com/workshop_guide/art/anticipation_action_recovery.html","Left and right read strongest; center has fewer asymmetric cues."],[22,"022-machine-phase","Machine Phase","Hand-correct rigid-part animation after modular transforms","Machines compare corrected frames against raw modular transforms.","Pedro Medeiros: Modular Animation","https://www.patreon.com/saint11/posts/modular-15160612","Fan and Winch benefit most; Pump rocker still risks decorative noise."],[21,"021-depth-cheat","Depth Cheat","Foreshortening with readability-preserving projection cheats","Tools cycle side, three-quarter, and near-camera silhouettes.","Animworks: Silhouette in Animation","https://anim.works/silhouette-in-animation/","Hammer and Wrench benefit most; Axe can converge toward Hammer."],[20,"020-motion-lock","Motion Lock","Identity invariants across animated key poses","Workers retain selected identity masses across locomotion key poses.","the-pixel.art: Animating a Pixel Walk Cycle","https://the-pixel.art/articles/pixel-walk-cycle/","Hauler and Guard preserve identity best; Scout and Miner drift more."],[19,"019-contact-read","Contact Read","Contact-point negative space for overlapping forms","Paired setups compare separating gaps with fused contact.","Wayline: Making a game-ready sprite","https://www.wayline.io/learn/pixel-art/4","Handoff and Clash work best; gaps cannot rescue confused masses."],[18,"018-anchor-drop","Anchor Drop","Diagnostic contour anchors through pixel subtraction","Objects lose identity-bearing contour landmarks in an A/B test.","Wayline: Making a game-ready sprite","https://www.wayline.io/learn/pixel-art/4","Key, Boot, and Can depend strongly on anchors; Fish survives broader taper."],[17,"017-tuft-signal","Tuft Signal","Selective material clumps without silhouette noise","Creature silhouettes compare broad masses with grouped fur or feather clumps.","imonk: Pixel Tutorial - Fur","https://itch.io/t/2173926/pixel-tutorial-fur","Wolf is strongest, followed by Boar; solid animal mass matters more than texture."],[16,"016-shape-stack","Shape Stack","Big-medium-small mass hierarchy for prop recognition","Props organize dominant, supporting, and accent masses.","PixelSanctuary: Big-Medium-Small","https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette","Anvil is the clear winner; the other props remain much weaker."],[15,"015-mass-signal","Mass Signal","Exaggerated proportion as semantic compression","Workers remove equipment clues and bias body mass toward distinct roles.","SpriteGen: How to Draw a Pixel Art Character","https://spritegen.io/guides/how-to-draw-a-pixel-art-character/","Current humanoid design benchmark: clean head/limb count, good symmetry, readable construction, and clear role silhouettes."],[14,"014-action-read","Action Read","Action staging through one dominant line of force","One worker is redrawn as Swing, Push, Lift, and Sprint.","Pixel Canvas Hub: Dynamic Poses","https://pixelcanvashub.com/post/dynamic-poses-strong-characters-a-motion-first-guide-to-character-design","Push was strongest visually, but read too much like jumping rather than pushing."],[13,"013-value-crew","Value Crew","Large interior value blocks without contour noise","Workers preserve compact silhouettes while cues move into broad value regions.","Pedro Medeiros: Outlines","https://www.patreon.com/saint11/posts/outlines-14106192","Characters remain surprisingly readable even without arms."],[12,"012-facing-signal","Facing Signal","Directional facing cues through controlled asymmetry","Side-facing workers use profile, lean, and toe direction.","Pixel Art Lab: side-view character pixel art","https://pixelartlab.net/tutorials/side-view-character-pixel-art","Courier and Miner are clearest; Scout hood peak risks horn ambiguity."],[11,"011-gap-beasts","Gap Beasts","Negative-space carving inside creature silhouettes","Creatures use empty-pixel channels to separate legs, tail, neck, and horn.","PixelSanctuary: creature silhouette","https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette","Hound and Crane use gaps best; Raptor leans on dinosaur shorthand."],[10,"010-armory-grammar","Armory Grammar","Weapon shape grammar through mass distribution","Sword, axe, spear, and mace use taper, head placement, shaft length, and guards.","Wayline: Making a game-ready sprite","https://www.wayline.io/learn/pixel-art/4","Sword and Axe are strongest; Spear risks generic pole read."],[9,"009-loadout-read","Loadout Read","Asymmetry plus equipment integration","Humanoids receive one dominant off-center loadout.","Pedro Medeiros: Character Design 1","https://www.patreon.com/saint11/posts/character-design-7530899","Shield is strongest; Bow remains weakest due thin arc noise."],[8,"008-crew-call","Crew Call","Proportion hierarchy at 16×16","Scout, Hauler, Guard, and Miner differ by body mass rather than handheld props.","SpriteGen: How to Draw a Pixel Art Character","https://spritegen.io/guides/how-to-draw-a-pixel-art-character/","Hauler reads clearest; Scout is too skeletal."],[7,"007-hidden-limb","Hidden Limb","Anatomical compression through occlusion","Rear limbs are swallowed into torso mass to reduce contour branches.","GameDev Academy: player pixel-art tutorial","https://gamedevacademy.org/player-pixelart-tutorial/","Run and Brace read cleanest; Jump still has weak leg relationships."],[6,"006-skeleton-lock","Skeleton Lock","Joint anchoring and believable weight","Push, pull, reach, and run test shoulder and hip anchors.","Thomas Palef run-cycle breakdown","#","Reach was clearest but false antenna-like branches remained."],[5,"005-shape-ward","Shape Ward","Shape language as gameplay role","Creature roles use round, square, and triangular dominant masses.","Original research retained in run","#","Round read soft fastest; triangular hunter was too symmetrical."],[4,"004-pose-relay","Pose Relay","Skeleton-first action poses","Action silhouettes test whether pose communicates a verb before detail.","Original research retained in run","#","Carry had strongest skeleton; Catch attached arms too high."],[3,"003-edge-runner","Edge Runner","Outline contrast across backgrounds","Sprites cross changing backgrounds to test outline visibility.","Original research retained in run","#","Tinted outlines integrated better; some selective edges disappeared."],[2,"002-cluster-critters","Cluster Critters","Clusters, not confetti","Creatures are assembled from connected color masses.","Original research retained in run","#","Crab had strongest silhouette; some interior clusters described little."],[1,"001-silhouette-hunt","Silhouette Hunt","Silhouette separation","Knight, Mage, Archer, and Brute are identified from shape alone.","Original research retained in run","#","Archer read strongest; central humanoid masses were too similar."]];const root=document.getElementById('runs');for(const r of R){const[n,s,t,p,a,src,u,c]=r,e=document.createElement('article');e.className='e';const thumb=n>=32?`<canvas class="thumb" width="16" height="16" data-thumb="${n}"></canvas>`:`<div class="thumb">${String(n).padStart(3,'0')}</div>`;e.innerHTML=`<div class="h">${thumb}<div><div class="n">EXPERIMENT ${String(n).padStart(3,'0')}</div><h2>${t}</h2><div class="pr">${p}</div><a class="play" href="${s}/">PLAY →</a></div></div><div class="b"><div><div class="lab">PRINCIPLE STUDIED</div><p>${p}</p></div><div><div class="lab">WHAT I ATTEMPTED</div><p>${a}</p></div><div><div class="lab">SOURCE / TUTORIAL</div><p>${u==='#'?src:`<a class="src" href="${u}" target="_blank" rel="noopener">${src}</a>`}</p></div><div><div class="lab">SELF-CRITIQUE</div><p>${c}</p></div><div><div class="lab">YOUR RATING</div><div class="rate" data-k="pixelArtPracticeRating${String(n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(e)}function paintThumb(c,parts){const x=c.getContext('2d');x.fillStyle='#d3cab9';x.fillRect(0,0,16,16);x.fillStyle='#26303d';for(const q of parts)x.fillRect(...q)}const t32=document.querySelector('[data-thumb="32"]');if(t32)paintThumb(t32,[[3,12,2,2],[4,11,2,2],[5,10,2,2],[6,9,2,2],[7,8,2,2],[8,7,2,2],[9,6,2,2],[10,5,2,2],[11,3,2,3],[1,12,6,1],[2,13,2,2]]);const t33=document.querySelector('[data-thumb="33"]');if(t33)paintThumb(t33,[[4,3,4,3],[2,6,8,4],[3,10,2,4],[7,10,2,4],[2,5,2,2],[9,8,2,2],[10,9,2,2],[11,10,1,3],[10,12,5,3]]);document.querySelectorAll('.rate').forEach(box=>{const k=box.dataset.k,bs=[...box.querySelectorAll('button')],paint=v=>bs.forEach((b,i)=>b.classList.toggle('on',i+1===+v));paint(localStorage.getItem(k));bs.forEach((b,i)=>b.onclick=()=>{localStorage.setItem(k,String(i+1));paint(i+1)})})})();</script></body></html>
