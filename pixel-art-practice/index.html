<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--bg:#0b0f15;--panel:#151c27;--line:#2a3547;--ink:#f2f5fa;--muted:#9ba8bb;--accent:#79e6a5;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}header{padding:8px 2px}h1{margin:0;font-size:25px}header p{color:var(--muted);font-size:12px;line-height:1.5}.entry{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.thumb{width:92px;height:92px;background:#d3cab9;border-radius:12px;image-rendering:pixelated}.hero h2{margin:0 0 4px;font-size:18px}.run{font-size:10px;color:var(--accent);letter-spacing:.12em}.principle{font-size:11px;color:var(--muted)}.play{display:inline-grid;place-items:center;min-height:46px;margin-top:9px;padding:0 14px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:12px;text-decoration:none;font-weight:900}.body{padding:12px;display:grid;gap:9px}.label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.08em}.body p{margin:3px 0 0;color:#c7d0dd;font-size:12px;line-height:1.5}.source{color:#9dc8ff}.rating{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rating button{width:45px;height:45px;border-radius:12px;border:1px solid var(--line);background:#101722;color:var(--ink);font:inherit;font-weight:900}.rating button.active{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:10px;color:var(--muted)}@media(min-width:500px){.hero{grid-template-columns:112px 1fr}.thumb{width:112px;height:112px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p>One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[
[17,'017-tuft-signal','Tuft Signal','Selective material clumps without silhouette noise','Four original 16×16 creatures compare a bare broad-mass silhouette against a version with a few grouped directional fur/feather clumps. COLOR/INK and CLUMPS ON/OFF isolate whether surface character enriches the creature or damages the read.','imonk: Pixel Tutorial — Fur','https://itch.io/t/2173926/pixel-tutorial-fur','Wolf and Owl benefit most from clumps because the texture follows existing neck, tail, and wing masses. Boar gains only a modest shoulder/back rhythm. Mammoth is the risky one: brow/chest clumps add woolly weight, but the trunk already dominates identity, so extra edge activity must remain subordinate. Useful lesson: texture works best when it rides an existing mass instead of inventing new branches.'],
[16,'016-shape-stack','Shape Stack','Big–medium–small mass hierarchy for prop recognition','Four original 16×16 props organize their silhouettes around dominant, supporting, and accent masses, then face color, ink, and reduced-size tests.','PixelSanctuary: Big–Medium–Small for Creatures; Wayline: Making a game-ready sprite','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Anvil and Drill are strongest because hierarchy explains construction. Lantern reads but its crown is decorative. Cannon has competing barrel/carriage weight.'],
[15,'015-mass-signal','Mass Signal','Exaggerated proportion as semantic compression','Four original workers remove equipment clues and bias body mass toward POWER, SPEED, LOAD, or REACH.','SpriteGen: How to Draw a Pixel Art Character; Wayline: Making a game-ready sprite','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Power and Load separate best because the whole body participates. Speed risks merely skinny; Reach risks false-limb noise.'],
[14,'014-action-read','Action Read','Action staging through one dominant line of force','One worker is redrawn as SWING, PUSH, LIFT, and SPRINT while compact anatomy and silhouette hierarchy must survive.','Pixel Canvas Hub: Dynamic Poses, Strong Characters; Wayline','https://pixelcanvashub.com/post/dynamic-poses-strong-characters-a-motion-first-guide-to-character-design','Sprint has the clearest force; Lift is structurally clear. Push merges arm/body somewhat. Swing risks branch-like tool contours.'],
[13,'013-value-crew','Value Crew','Large interior value blocks without contour noise','Four workers keep compact outer silhouettes while profession cues move inward into broad connected value regions.','Pedro Medeiros: Outlines; Wayline','https://www.patreon.com/saint11/posts/outlines-14106192','Hauler has the strongest interior hierarchy. Welder is head-heavy; Medic leans on familiar shorthand; Scout is expressive but abstract.'],
[12,'012-facing-signal','Facing Signal','Directional facing cues through controlled asymmetry','Four side-facing workers use profile, brim/hood, lean, and toe direction while rear anatomy stays compressed.','Pixel Art Lab: side-view character pixel art','https://pixelartlab.net/tutorials/side-view-character-pixel-art','Courier and Miner are clearest. Guard is too upright. Scout hood peak risks horn/antenna ambiguity.'],
[11,'011-gap-beasts','Gap Beasts','Negative-space carving inside creature silhouettes','Four side-view creatures use deliberate empty-pixel channels to separate legs, tail, neck, horn, and body masses.','PixelSanctuary: creature silhouette and shape language','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Hound and Crane use gaps best. Ram benefits from one horn hook. Raptor leans too much on generic dinosaur shorthand.'],
[10,'010-armory-grammar','Armory Grammar','Weapon shape grammar through mass distribution','Sword, axe, spear, and mace are designed silhouette-first through taper, head placement, shaft length, guard width, and mass.','Wayline: Making a game-ready sprite','https://www.wayline.io/learn/pixel-art/4','Sword and axe are strongest. Spear risks generic-pole read. Mace is distinct but slightly icon-like.'],
[9,'009-loadout-read','Loadout Read','Asymmetry plus equipment integration','Compact humanoids each receive one dominant off-center loadout while rear anatomy remains merged into the body.','Pedro Medeiros: Character Design 1','https://www.patreon.com/saint11/posts/character-design-7530899','Shield is strongest. Hammer can branch visually. Bow remains weakest because the thin arc becomes antenna-noise.'],
[8,'008-crew-call','Crew Call','Proportion hierarchy at 16×16','Scout, Hauler, Guard, and Miner use compressed proportions with role differences carried by body mass rather than handheld props.','SpriteGen: How to Draw a Pixel Art Character','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Stephen judged these the best characters so far. Hauler has the clearest hierarchy; Scout is too skeletal; Guard risks side-protrusion noise.'],
[7,'007-hidden-limb','Hidden Limb','Anatomical compression through occlusion','Run, duck, brace, and jump deliberately swallow rear limbs into torso mass to reduce contour branches.','GameDev Academy: player pixel-art tutorial','https://gamedevacademy.org/player-pixelart-tutorial/','Run and brace read cleanest. Duck compresses toward a blob. Jump still has weak leg relationships.'],
[6,'006-skeleton-lock','Skeleton Lock','Joint anchoring and believable weight','Push, pull, reach, and run test shoulder/hip anchors and line of action before surface detail.','Thomas Palef run-cycle breakdown','#','Reach was clearest but still resembled a bug with antennas. Too many contour branches create false heads and limbs.'],
[5,'005-shape-ward','Shape Ward','Shape language as gameplay role','Creature roles are built around round, square, and triangular dominant masses.','Original research source retained in the run; URL not recorded','#','Round creature read soft fastest. Square brute bordered on a box with a face. Triangular hunter was too symmetrical.'],
[4,'004-pose-relay','Pose Relay','Skeleton-first action poses','Action silhouettes test whether pose communicates a verb before detail.','Original research source retained in the run; URL not recorded','#','Carry had the strongest skeleton. Catch was distinct but its arms appeared attached too close to the head.'],
[3,'003-edge-runner','Edge Runner','Outline contrast across backgrounds','Sprites cross changing backgrounds to test outline visibility and selective outlining.','Original research source retained in the run; URL not recorded','#','Tinted outlines integrated better than pure black, but selective outlining was conservative and some cave edges disappeared.'],
[2,'002-cluster-critters','Cluster Critters','Clusters, not confetti','Several creatures are assembled from connected color masses instead of isolated decorative pixels.','Original research source retained in the run; URL not recorded','#','Crab had the strongest broad silhouette. Some interior regions filled space instead of describing volume.'],
[1,'001-silhouette-hunt','Silhouette Hunt','Silhouette separation','Knight, Mage, Archer, and Brute are identified from shape alone before color reveal.','Original research source retained in the run; URL not recorded','#','Archer read strongest. The four bodies shared too much central humanoid mass.']];const I={17:['..........00....','.........0000...','..000000000000..','.00000000000000.','..00000000000...','...000000000....','...00....00.....'],16:['......0000......','.....000000.....','....00000000....','....00000000....','.....000000.....','......0000......'],15:['.....0000.......','....000000......','..0000000000....','.000000000000...','...00000000.....','....00..00......'],14:['..........00....','........000.....','....00000.......','...0000000......','....00000.......','...000.000......'],13:['.....0000.......','....000000......','....000000......','...00000000.....','....000000......','...000..000.....'],12:['.......00.......','......0000......','.....000000.....','....0000000.....','...00000000.....','....00.0000.....'],11:['............00..','...00....00000..','..00000000000...','.00000000000....','..00000000......','...00..00.......'],10:['..00............','.0000...........','..0000..........','...0000.........','....0000........','.....0000.......'],9:['.....0000.......','....000000..00..','....000000.0000.','.....0000..0000.','....00000..000..','...0000000......'],8:['.....00000......','....0000000.....','....0000000.....','...000000000....','..00000000000...','...000000000....'],7:['.....0000.......','....000000......','.....0000.......','...0000000......','..0000000000....','...0000000......'],6:['.........00.....','........0000....','.......00000....','....0000000.....','...00000000.....','....00..00......'],5:['.....0000.......','...00000000.....','..0000000000....','...00000000.....','....00..00......'],4:['.........000....','........0000....','......0000......','....000000......','...0000000......'],3:['.....000........','....00000.......','....00000.......','...0000000......','....00.00.......'],2:['....00....00....','...0000000000...','..000000000000..','....00000000....','.....00..00.....'],1:['......00........','.....0000.......','......00........','....000000......','...00000000.....','....00..00......']};const root=document.getElementById('runs');R.forEach(r=>{const[n,slug,title,principle,attempt,source,url,crit]=r,a=document.createElement('article');a.className='entry';a.innerHTML=`<div class="hero"><canvas id="thumb${n}" class="thumb" width="112" height="112"></canvas><div><div class="run">EXPERIMENT ${String(n).padStart(3,'0')}</div><h2>${title}</h2><div class="principle">${principle}</div><a class="play" href="${slug}/">PLAY →</a></div></div><div class="body"><div><div class="label">PRINCIPLE STUDIED</div><p>${principle}</p></div><div><div class="label">WHAT I ATTEMPTED</div><p>${attempt}</p></div><div><div class="label">SOURCE / TUTORIAL</div><p>${url==='#'?source:`<a class="source" href="${url}" target="_blank" rel="noopener">${source}</a>`}</p></div><div><div class="label">SELF-CRITIQUE</div><p>${crit}</p></div><div><div class="label">YOUR RATING</div><div class="rating" data-key="pixelArtPracticeRating${String(n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(a)});R.forEach(r=>{const n=r[0],c=document.getElementById('thumb'+n),x=c.getContext('2d'),p=I[n],s=7,oy=Math.floor((16-p.length)/2);x.imageSmoothingEnabled=false;x.fillStyle='#d3cab9';x.fillRect(0,0,112,112);x.fillStyle='#243040';p.forEach((row,y)=>{for(let xx=0;xx<row.length;xx++)if(row[xx]==='0')x.fillRect(xx*s,(y+oy)*s,s,s)})});document.querySelectorAll('.rating').forEach(box=>{const key=box.dataset.key,buttons=[...box.querySelectorAll('button')];let v=localStorage.getItem(key);const paint=()=>buttons.forEach(b=>b.classList.toggle('active',b.textContent===v));buttons.forEach(b=>b.onclick=()=>{v=b.textContent;localStorage.setItem(key,v);paint()});paint()});document.addEventListener('contextmenu',e=>e.preventDefault())})();</script></body></html>
