<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--bg:#0b0f15;--panel:#151c27;--line:#2a3547;--ink:#f2f5fa;--muted:#9ba8bb;--accent:#79e6a5;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}header{padding:8px 2px}h1{margin:0;font-size:25px}header p{color:var(--muted);font-size:12px;line-height:1.5}.entry{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.thumb{width:92px;height:92px;background:#d3cab9;border-radius:12px;image-rendering:pixelated}.hero h2{margin:0 0 4px;font-size:18px}.run{font-size:10px;color:var(--accent);letter-spacing:.12em}.principle{font-size:11px;color:var(--muted);line-height:1.35}.play{display:inline-grid;place-items:center;min-height:46px;margin-top:9px;padding:0 14px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:12px;text-decoration:none;font-weight:900}.body{padding:12px;display:grid;gap:9px}.label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.08em}.body p{margin:3px 0 0;color:#c7d0dd;font-size:12px;line-height:1.5}.source{color:#9dc8ff}.rating{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rating button{width:45px;height:45px;border-radius:12px;border:1px solid var(--line);background:#101722;color:var(--ink);font:inherit;font-weight:900}.rating button.active{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:10px;color:var(--muted)}@media(min-width:500px){.hero{grid-template-columns:112px 1fr}.thumb{width:112px;height:112px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p>One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[
[24,'024-volume-bounce','Volume Bounce','Squash and stretch while conserving apparent volume and identity','Four original 16×16 creatures animate through neutral, stretch, and squash silhouettes. VOLUME LOCK compensates height with width; BAD SCALE changes mostly one axis to expose mass drift.','Pedro Medeiros: Squash and Stretch; Toon Boom: Squash and Stretch Principle','https://www.patreon.com/saint11/posts/squash-and-11713421','Slime and Grub tolerate deformation best because their identity is broad mass. Frog is readable when its lateral leg mass survives. Bat is weakest because vertical stretch can shrink the wings into torso-like side noise.'],
[23,'023-windup-lane','Windup Lane','Anticipation silhouettes must predict the future hit','A three-lane dodge game uses distinct left, center, and right startup silhouettes.','Rivals Workshop Community Library: Anticipation, Action, Recovery','https://www.rivalslib.com/workshop_guide/art/anticipation_action_recovery.html','Left and right read strongest; center has fewer asymmetric contour clues.'],
[22,'022-machine-phase','Machine Phase','Hand-correct rigid-part animation after modular transforms','Four original 16×16 machines compare corrected frames against raw modular transforms.','Pedro Medeiros: Modular Animation','https://www.patreon.com/saint11/posts/modular-15160612','Fan and Winch benefit most; Press needs little correction; Pump rocker still risks decorative noise.'],
[21,'021-depth-cheat','Depth Cheat','Foreshortening with readability-preserving projection cheats','Four tools cycle side, three-quarter, and near-camera silhouettes.','Animworks: Silhouette in Animation','https://anim.works/silhouette-in-animation/','Hammer and Wrench benefit most; Axe can converge toward Hammer.'],
[20,'020-motion-lock','Motion Lock','Identity invariants across animated key poses','Four workers retain identity masses across locomotion key poses.','the-pixel.art: Animating a Pixel Walk Cycle','https://the-pixel.art/articles/pixel-walk-cycle/','Hauler and Guard preserve identity best; Scout and Miner drift more.'],
[19,'019-contact-read','Contact Read','Contact-point negative space for overlapping forms','Paired 16×16 setups compare clean separating gaps with fused contact.','Wayline: Making a game-ready sprite','https://www.wayline.io/learn/pixel-art/4','Handoff and Clash work best; Rescue shows gaps cannot rescue confused masses.'],
[18,'018-anchor-drop','Anchor Drop','Diagnostic contour anchors through pixel subtraction','Four objects lose identity-bearing contour landmarks in an A/B test.','Wayline: Making a game-ready sprite','https://www.wayline.io/learn/pixel-art/4','Key, Boot, and Can depend strongly on anchors; Fish survives on broader taper.'],
[17,'017-tuft-signal','Tuft Signal','Selective material clumps without silhouette noise','Creature silhouettes compare broad masses with grouped fur or feather clumps.','imonk: Pixel Tutorial - Fur','https://itch.io/t/2173926/pixel-tutorial-fur','Wolf and Owl benefit most; Mammoth risks excess contour activity.'],
[16,'016-shape-stack','Shape Stack','Big-medium-small mass hierarchy for prop recognition','Four props organize dominant, supporting, and accent masses.','PixelSanctuary: Big-Medium-Small','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Anvil and Drill are strongest; Cannon masses compete too evenly.'],
[15,'015-mass-signal','Mass Signal','Exaggerated proportion as semantic compression','Workers remove equipment clues and bias body mass toward distinct roles.','SpriteGen: How to Draw a Pixel Art Character','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Power and Load separate best; Reach risks false-limb noise.'],
[14,'014-action-read','Action Read','Action staging through one dominant line of force','One worker is redrawn as Swing, Push, Lift, and Sprint.','Pixel Canvas Hub: Dynamic Poses','https://pixelcanvashub.com/post/dynamic-poses-strong-characters-a-motion-first-guide-to-character-design','Sprint reads strongest; Swing risks branch-like tool contours.'],
[13,'013-value-crew','Value Crew','Large interior value blocks without contour noise','Workers preserve compact silhouettes while cues move into broad value regions.','Pedro Medeiros: Outlines','https://www.patreon.com/saint11/posts/outlines-14106192','Hauler has strongest hierarchy; some roles still lean on shorthand.'],
[12,'012-facing-signal','Facing Signal','Directional facing cues through controlled asymmetry','Side-facing workers use profile, lean, and toe direction.','Pixel Art Lab: side-view character pixel art','https://pixelartlab.net/tutorials/side-view-character-pixel-art','Courier and Miner are clearest; Scout hood peak risks horn ambiguity.'],
[11,'011-gap-beasts','Gap Beasts','Negative-space carving inside creature silhouettes','Creatures use empty-pixel channels to separate legs, tail, neck, and horn.','PixelSanctuary: creature silhouette','https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette','Hound and Crane use gaps best; Raptor leans on dinosaur shorthand.'],
[10,'010-armory-grammar','Armory Grammar','Weapon shape grammar through mass distribution','Sword, axe, spear, and mace use taper, head placement, shaft length, and guards.','Wayline: Making a game-ready sprite','https://www.wayline.io/learn/pixel-art/4','Sword and Axe are strongest; Spear risks generic pole read.'],
[9,'009-loadout-read','Loadout Read','Asymmetry plus equipment integration','Humanoids receive one dominant off-center loadout.','Pedro Medeiros: Character Design 1','https://www.patreon.com/saint11/posts/character-design-7530899','Shield is strongest; Bow remains weakest due thin arc noise.'],
[8,'008-crew-call','Crew Call','Proportion hierarchy at 16×16','Scout, Hauler, Guard, and Miner differ by body mass rather than handheld props.','SpriteGen: How to Draw a Pixel Art Character','https://spritegen.io/guides/how-to-draw-a-pixel-art-character/','Hauler reads clearest; Scout is too skeletal.'],
[7,'007-hidden-limb','Hidden Limb','Anatomical compression through occlusion','Rear limbs are swallowed into torso mass to reduce contour branches.','GameDev Academy: player pixel-art tutorial','https://gamedevacademy.org/player-pixelart-tutorial/','Run and Brace read cleanest; Jump still has weak leg relationships.'],
[6,'006-skeleton-lock','Skeleton Lock','Joint anchoring and believable weight','Push, pull, reach, and run test shoulder and hip anchors.','Thomas Palef run-cycle breakdown','#','Reach was clearest but false antenna-like branches remained.'],
[5,'005-shape-ward','Shape Ward','Shape language as gameplay role','Creature roles use round, square, and triangular dominant masses.','Original research retained in run','#','Round read soft fastest; triangular hunter was too symmetrical.'],
[4,'004-pose-relay','Pose Relay','Skeleton-first action poses','Action silhouettes test whether pose communicates a verb before detail.','Original research retained in run','#','Carry had strongest skeleton; Catch attached arms too high.'],
[3,'003-edge-runner','Edge Runner','Outline contrast across backgrounds','Sprites cross changing backgrounds to test outline visibility.','Original research retained in run','#','Tinted outlines integrated better; some selective edges disappeared.'],
[2,'002-cluster-critters','Cluster Critters','Clusters, not confetti','Creatures are assembled from connected color masses.','Original research retained in run','#','Crab had strongest silhouette; some interior clusters described little.'],
[1,'001-silhouette-hunt','Silhouette Hunt','Silhouette separation','Knight, Mage, Archer, and Brute are identified from shape alone.','Original research retained in run','#','Archer read strongest; central humanoid masses were too similar.']];
const I={24:[[4,5,8,7],[6,3,4,2],[5,12,2,1],[9,12,2,1]],23:[[8,2,4,3],[7,5,6,5],[4,6,4,2],[2,7,3,2],[8,10,2,4],[11,10,2,4]],22:[[3,6,8,6],[5,8,4,2],[10,5,2,3],[11,3,2,3],[4,12,2,2],[9,12,2,2]],21:[[3,3,8,2],[5,5,6,2],[7,7,4,2],[8,9,2,3]],20:[[6,2,4,3],[5,5,6,5],[3,8,3,2],[10,8,3,2],[4,10,2,4],[10,10,2,4]],19:[[2,3,4,7],[10,3,4,7],[5,6,6,2],[4,10,3,3],[9,10,3,3]],18:[[3,6,8,4],[10,4,3,2],[2,10,3,2]],17:[[2,6,10,5],[10,4,3,3],[3,4,2,2],[3,11,2,2],[9,11,2,2]],16:[[2,7,12,4],[4,4,6,3],[5,11,2,3],[10,11,2,3]],15:[[5,2,6,3],[4,5,8,6],[2,6,2,3],[12,6,2,3],[5,11,2,3],[9,11,2,3]],14:[[7,2,3,3],[6,5,5,5],[3,6,3,2],[10,7,4,2],[5,10,2,4],[9,10,2,4]],13:[[5,2,6,3],[4,5,8,6],[5,11,2,3],[9,11,2,3]],12:[[6,2,5,3],[5,5,7,6],[10,4,3,2],[5,11,2,3],[9,11,2,3]],11:[[2,6,11,5],[11,4,3,3],[4,11,2,3],[9,11,2,3]],10:[[2,7,12,2],[10,4,4,5],[2,6,3,4]],9:[[6,2,4,3],[5,5,6,6],[2,6,3,4],[9,10,2,4]],8:[[6,2,4,3],[5,5,6,6],[5,11,2,3],[9,11,2,3]],7:[[6,2,4,3],[5,5,6,6],[4,10,3,3],[9,11,2,3]],6:[[6,2,4,3],[5,5,6,6],[3,7,3,2],[10,6,3,2],[5,11,2,3],[9,11,2,3]],5:[[3,5,10,7],[6,2,4,3],[5,12,2,2],[9,12,2,2]],4:[[6,2,4,3],[5,5,6,5],[3,6,3,2],[10,5,3,2],[4,10,2,4],[10,10,2,4]],3:[[6,2,4,3],[5,5,6,6],[5,11,2,3],[9,11,2,3]],2:[[2,6,11,5],[11,4,3,3],[3,11,2,2],[9,11,2,2]],1:[[6,2,4,3],[5,5,6,6],[3,6,2,4],[11,6,2,4],[5,11,2,3],[9,11,2,3]]};
const root=document.getElementById('runs');for(const r of R){const[n,slug,title,principle,attempt,source,url,crit]=r,a=document.createElement('article');a.className='entry';a.innerHTML=`<div class="hero"><canvas id="thumb${n}" class="thumb" width="112" height="112"></canvas><div><div class="run">EXPERIMENT ${String(n).padStart(3,'0')}</div><h2>${title}</h2><div class="principle">${principle}</div><a class="play" href="${slug}/">PLAY →</a></div></div><div class="body"><div><div class="label">PRINCIPLE STUDIED</div><p>${principle}</p></div><div><div class="label">WHAT I ATTEMPTED</div><p>${attempt}</p></div><div><div class="label">SOURCE / TUTORIAL</div><p>${url==='#'?source:`<a class="source" href="${url}" target="_blank" rel="noopener">${source}</a>`}</p></div><div><div class="label">SELF-CRITIQUE</div><p>${crit}</p></div><div><div class="label">YOUR RATING</div><div class="rating" data-key="pixelArtPracticeRating${String(n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(a)}for(const r of R){const n=r[0],cv=document.getElementById('thumb'+n),x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#d3cab9';x.fillRect(0,0,112,112);x.fillStyle='#26303d';for(const q of I[n]||[])x.fillRect(q[0]*7,q[1]*7,q[2]*7,q[3]*7)}document.querySelectorAll('.rating').forEach(box=>{const key=box.dataset.key,buttons=[...box.querySelectorAll('button')],paint=v=>buttons.forEach((b,i)=>b.classList.toggle('active',i+1===Number(v)));paint(localStorage.getItem(key));buttons.forEach((b,i)=>b.addEventListener('click',()=>{localStorage.setItem(key,String(i+1));paint(i+1)}))});})();</script></body></html>
