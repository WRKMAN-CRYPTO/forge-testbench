<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Art Practice</title><style>:root{color-scheme:dark;--bg:#0b0f15;--panel:#151c27;--line:#2a3547;--ink:#f2f5fa;--muted:#9ba8bb;--accent:#79e6a5;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}main{max-width:760px;margin:auto;display:grid;gap:12px}header{padding:8px 2px}h1{margin:0;font-size:25px}header p{color:var(--muted);font-size:12px;line-height:1.5}.entry{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.thumb{width:92px;height:92px;background:#d3cab9;border-radius:12px;image-rendering:pixelated}.hero h2{margin:0 0 4px;font-size:18px}.run{font-size:10px;color:var(--accent);letter-spacing:.12em}.principle{font-size:11px;color:var(--muted)}.play{display:inline-grid;place-items:center;min-height:46px;margin-top:9px;padding:0 14px;border:1px solid #40644d;background:#173425;color:#c4f8d5;border-radius:12px;text-decoration:none;font-weight:900}.body{padding:12px;display:grid;gap:9px}.label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.08em}.body p{margin:3px 0 0;color:#c7d0dd;font-size:12px;line-height:1.5}.source{color:#9dc8ff}.rating{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rating button{width:45px;height:45px;border-radius:12px;border:1px solid var(--line);background:#101722;color:var(--ink);font:inherit;font-weight:900}.rating button.active{background:#4b3c12;border-color:#8c7225;color:#ffe494}.saved{font-size:10px;color:var(--muted)}@media(min-width:500px){.hero{grid-template-columns:112px 1fr}.thumb{width:112px;height:112px}}</style></head><body><main><header><h1>PIXEL ART PRACTICE</h1><p>One deliberate lesson per run. The central test is recognizable 16×16 form, especially in silhouette. Ratings stay only on this device.</p></header><div id="runs"></div></main><script>(()=>{'use strict';const R=[
{n:14,slug:'014-action-read',title:'Action Read',principle:'Action staging through one dominant line of force',attempt:'One original 16×16 worker is redrawn as SWING, PUSH, LIFT, and SPRINT. Each pose must preserve compact body hierarchy while one dominant directional gesture carries the verb.',source:'Pixel Canvas Hub: Dynamic Poses, Strong Characters; Wayline: Making a game-ready sprite',url:'https://pixelcanvashub.com/post/dynamic-poses-strong-characters-a-motion-first-guide-to-character-design',crit:'Sprint has the clearest diagonal force and Lift the clearest symmetric task. Push is readable but the forward arm/body mass risks merging. Swing is the ambitious one: the raised tool direction helps, but the upper contour can still become branch-like if the arc is pushed too thin.'},
{n:13,slug:'013-value-crew',title:'Value Crew',principle:'Large interior value blocks without contour noise',attempt:'Four original 16×16 workers keep compact Crew Call-style outer silhouettes while profession cues move inward into broad connected value regions.',source:'Pedro Medeiros: Outlines; Wayline: Making a game-ready sprite',url:'https://www.patreon.com/saint11/posts/outlines-14106192',crit:'Hauler has the strongest interior hierarchy. Welder is clean but head-heavy. Medic risks familiar-symbol shorthand. Scout is expressive but abstract. Structural gain: more identity without extra contour branches.'},
{n:12,slug:'012-facing-signal',title:'Facing Signal',principle:'Directional facing cues through controlled asymmetry',attempt:'Four original 16×16 workers use profile, brim or hood, lean, and toe direction while rear anatomy stays compressed.',source:'Pixel Art Lab: side-view character pixel art',url:'https://pixelartlab.net/tutorials/side-view-character-pixel-art',crit:'Courier and Miner are clearest. Guard is too upright. Scout hood peak helps direction but flirts with the old horn/antenna failure.'},
{n:11,slug:'011-gap-beasts',title:'Gap Beasts',principle:'Negative-space carving inside creature silhouettes',attempt:'Four original side-view creatures use a few projections plus deliberate empty-pixel gaps to separate legs, tail, neck, horn, and body masses.',source:'PixelSanctuary: creature silhouette and shape language',url:'https://www.pixelsanctuary.com/tutorials/creature-design-shape-language-silhouette',crit:'Hound and Crane use gaps best. Ram benefits from one dominant horn hook. Raptor remains too dependent on generic dinosaur shorthand.'},
{n:10,slug:'010-armory-grammar',title:'Armory Grammar',principle:'Weapon shape grammar through mass distribution',attempt:'Sword, axe, spear, and mace were designed silhouette-first so identity comes from taper, head placement, shaft length, guard width, and overall mass.',source:'Wayline: Making a game-ready sprite',url:'https://www.wayline.io/learn/pixel-art/4',crit:'Sword and axe are strongest. Spear risks generic-pole read. Mace is distinct but slightly icon-like.'},
{n:9,slug:'009-loadout-read',title:'Loadout Read',principle:'Asymmetry plus equipment integration',attempt:'Four compact humanoids each receive one dominant off-center loadout while rear anatomy remains merged into the body.',source:'Pedro Medeiros: Character Design 1',url:'https://www.patreon.com/saint11/posts/character-design-7530899',crit:'Shield is strongest. Hammer can branch visually. Bow remains weakest because the thin arc becomes antenna-noise.'},
{n:8,slug:'008-crew-call',title:'Crew Call',principle:'Proportion hierarchy at 16×16',attempt:'Scout, Hauler, Guard, and Miner use compressed proportions with role differences carried by body mass rather than handheld props.',source:'SpriteGen: How to Draw a Pixel Art Character',url:'https://spritegen.io/guides/how-to-draw-a-pixel-art-character/',crit:'Stephen judged these the best characters so far. Hauler has the clearest mass hierarchy. Scout is too skeletal and Guard risks side-protrusion noise.'},
{n:7,slug:'007-hidden-limb',title:'Hidden Limb',principle:'Anatomical compression through occlusion',attempt:'Run, duck, brace, and jump deliberately swallow rear limbs into torso mass to reduce contour branches.',source:'GameDev Academy: player pixel-art tutorial',url:'https://gamedevacademy.org/player-pixelart-tutorial/',crit:'Run and brace read cleanest. Duck compresses toward a blob. Jump still has weak leg relationships.'},
{n:6,slug:'006-skeleton-lock',title:'Skeleton Lock',principle:'Joint anchoring and believable weight',attempt:'Push, pull, reach, and run test shoulder/hip anchors and line of action before surface detail.',source:'Thomas Palef run-cycle breakdown',url:'#',crit:'Reach was clearest but still resembled a bug with antennas. This run exposed the major hard failure: too many contour branches create false heads and limbs.'},
{n:5,slug:'005-shape-ward',title:'Shape Ward',principle:'Shape language as gameplay role',attempt:'Creature roles were built around round, square, and triangular dominant masses.',source:'Original research source retained in the run; URL not recorded',url:'#',crit:'Round creature read soft fastest. Square brute bordered on a box with a face. Triangular hunter was too symmetrical.'},
{n:4,slug:'004-pose-relay',title:'Pose Relay',principle:'Skeleton-first action poses',attempt:'Action silhouettes test whether pose communicates a verb before detail.',source:'Original research source retained in the run; URL not recorded',url:'#',crit:'Carry had the strongest skeleton. Catch was distinct but its arms appeared attached too close to the head.'},
{n:3,slug:'003-edge-runner',title:'Edge Runner',principle:'Outline contrast across backgrounds',attempt:'Sprites cross changing backgrounds to test outline visibility and selective outlining.',source:'Original research source retained in the run; URL not recorded',url:'#',crit:'Tinted outlines integrated better than pure black, but selective outlining was conservative and some cave edges disappeared.'},
{n:2,slug:'002-cluster-critters',title:'Cluster Critters',principle:'Clusters, not confetti',attempt:'Several creatures are assembled from connected color masses instead of isolated decorative pixels.',source:'Original research source retained in the run; URL not recorded',url:'#',crit:'Crab had the strongest broad silhouette. Some interior regions filled space instead of describing volume.'},
{n:1,slug:'001-silhouette-hunt',title:'Silhouette Hunt',principle:'Silhouette separation',attempt:'Knight, Mage, Archer, and Brute are identified from shape alone before color reveal.',source:'Original research source retained in the run; URL not recorded',url:'#',crit:'Archer read strongest. The four bodies shared too much central humanoid mass.'}
];const I={14:['..........00....','.........000....','........00......','....00000.......','...0000000......','..00000000......','...000000.......','....00000.......','.....000........','....00000.......','...000.000......','..000...00......'],13:['.....0000.......','....000000......','....000000......','.....0000.......','....000000......','...00000000.....','...00000000.....','....000000......','...000..000.....'],12:['.......00.......','......0000......','.....000000.....','.....0000000....','......00000.....','....0000000.....','...00000000.....','....000000......','....00.0000.....'],11:['............00..','...........0000.','...00....00000..','..00000000000...','.00000000000....','0.000000000.....','..00000000......','...00..00.......'],10:['..00............','.0000...........','..0000..........','...0000.........','....0000........','.....0000.......','......0000......','.......0000.....'],9:['.....0000.......','....000000..00..','....000000.0000.','.....0000..0000.','....00000..000..','...0000000......'],8:['.....00000......','....0000000.....','....0000000.....','.....00000......','...000000000....','..00000000000...','...000000000....'],7:['.....0000.......','....000000......','.....0000.......','...0000000......','..0000000000....','...0000000......'],6:['.........00.....','........0000....','.......00000....','....0000000.....','...00000000.....','....00..00......'],5:['.....0000.......','...00000000.....','..0000000000....','...00000000.....','....00..00......'],4:['.........000....','........0000....','......0000......','....000000......','...0000000......'],3:['.....000........','....00000.......','....00000.......','...0000000......','....00.00.......'],2:['....00....00....','...0000000000...','..000000000000..','....00000000....','.....00..00.....'],1:['......00........','.....0000.......','......00........','....000000......','...00000000.....','....00..00......']};const root=document.getElementById('runs');R.forEach(r=>{const a=document.createElement('article');a.className='entry';a.innerHTML=`<div class="hero"><canvas id="thumb${r.n}" class="thumb" width="112" height="112"></canvas><div><div class="run">EXPERIMENT ${String(r.n).padStart(3,'0')}</div><h2>${r.title}</h2><div class="principle">${r.principle}</div><a class="play" href="${r.slug}/">PLAY →</a></div></div><div class="body"><div><div class="label">PRINCIPLE STUDIED</div><p>${r.principle}</p></div><div><div class="label">WHAT I ATTEMPTED</div><p>${r.attempt}</p></div><div><div class="label">SOURCE / TUTORIAL</div><p>${r.url==='#'?r.source:`<a class="source" href="${r.url}" target="_blank" rel="noopener">${r.source}</a>`}</p></div><div><div class="label">SELF-CRITIQUE</div><p>${r.crit}</p></div><div><div class="label">YOUR RATING</div><div class="rating" data-key="pixelArtPracticeRating${String(r.n).padStart(3,'0')}"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><span class="saved">stored on this device</span></div></div></div>`;root.appendChild(a)});R.forEach(r=>{const c=document.getElementById('thumb'+r.n),x=c.getContext('2d'),p=I[r.n],s=7,oy=Math.floor((16-p.length)/2);x.imageSmoothingEnabled=false;x.fillStyle='#d3cab9';x.fillRect(0,0,112,112);x.fillStyle='#243040';p.forEach((row,y)=>{for(let xx=0;xx<row.length;xx++)if(row[xx]==='0')x.fillRect(xx*s,(y+oy)*s,s,s)})});document.querySelectorAll('.rating').forEach(box=>{const key=box.dataset.key,buttons=[...box.querySelectorAll('button')];let v=localStorage.getItem(key);const paint=()=>buttons.forEach(b=>b.classList.toggle('active',b.textContent===v));buttons.forEach(b=>b.onclick=()=>{v=b.textContent;localStorage.setItem(key,v);paint()});paint()});document.addEventListener('contextmenu',e=>e.preventDefault())})();</script></body></html>
