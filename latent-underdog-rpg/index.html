<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ROOK // LATENT</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f7f1dc;background:#12131a}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12131a}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:7px}.hud{display:grid;grid-template-columns:1.15fr .85fr;gap:7px;font-size:11px}.card{background:#1d202a;border:1px solid #454b5b;border-radius:12px;padding:8px;box-shadow:inset 0 0 0 1px #0005}.screen{position:relative;flex:1;min-height:0}.screen canvas{width:100%;height:100%;display:block;border-radius:14px;background:#202735;border:1px solid #454b5b;image-rendering:pixelated}.msg{position:absolute;left:8px;right:8px;bottom:8px;background:#101219e8;border:1px solid #596174;border-radius:10px;padding:8px;font-size:11px;min-height:44px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px);justify-content:center}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{font:inherit;font-weight:700;color:#fff;background:#2a2f3c;border:1px solid #626b7d;border-radius:12px;min-height:42px}button:active{transform:scale(.98);background:#3a4252}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.battle{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;padding:8px;background:linear-gradient(#0002,#000b)}.battle.show{display:flex}.enemybox{margin-bottom:auto;margin-top:16px;align-self:center;width:min(285px,84%);text-align:center}.portrait{height:86px;display:grid;place-items:center}.battlelog{font-size:11px;min-height:58px;line-height:1.35}.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.win{font-weight:700;color:#f4d26e}.dead{color:#ff9a9a}.awaken{color:#8af7d3;font-weight:700}.tiny{opacity:.7}.potential{color:#9bb8ff}.title{font-weight:900;letter-spacing:.08em}</style></head><body><div class="app">
<div class="hud"><div class="card" id="stats"></div><div class="card" id="quest"></div></div>
<div class="screen"><canvas id="game" width="360" height="360"></canvas><div class="msg" id="msg">Nobody expects anything from Rook. Good.</div><div class="battle" id="battle"><div class="enemybox card"><div class="portrait"><canvas id="enemyArt" width="96" height="80"></canvas></div><div id="enemyName" class="title"></div><div id="enemyHp"></div></div><div class="card"><div class="battlelog" id="battleLog"></div><div class="menu"><button data-act="attack">SCRAP BLADE</button><button data-act="skill">SURGE</button><button data-act="guard">BRACE</button><button data-act="item">TONIC</button></div></div></div></div>
<div class="controls"><div class="dpad"><button data-move="0,-1">▲</button><button data-move="-1,0">◀</button><button id="talk">◎</button><button data-move="1,0">▶</button><button data-move="0,1" style="grid-column:2;grid-row:3">▼</button></div><div class="actions"><button id="potential">POTENTIAL</button><button id="save">SAVE</button><button id="rest">REST</button><button id="sound">SOUND</button></div></div>
</div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),ec=document.getElementById('enemyArt'),ex=ec.getContext('2d'); const $=id=>document.getElementById(id);
const map=['##################','#....rr....T.....#','#.H..rr....T..N..#','#....rr....T.....#','#..........T.....#','#..TTT...........#','#..T....~~~......#','#..T....~~~..TT..#','#.......~~~..T...#','#..rr........T...#','#..rr..TT........#','#......T.....N...#','#......T.........#','#..TT............#','#..T.......TT....#','#..........TT.A..#','#................#','##################'];
const SAVE='rook-latent-v1';
const start={px:2,py:2,hp:24,maxHp:24,mp:6,maxMp:6,lv:1,xp:0,gold:0,tonics:2,steps:0,boss:false,sound:true,battle:null,guard:false,msg:'Nobody expects anything from Rook. Good.',acts:{attack:0,skill:0,guard:0,lowWin:0,steps:0},traits:{edge:false,spark:false,nerve:false,last:false,way:false},discoveries:0};
let s=structuredClone(start),audio;
const enemies=[{n:'Rust Jackal',kind:'jackal',hp:13,atk:4,xp:5,g:4},{n:'Cinder Rat',kind:'rat',hp:16,atk:5,xp:6,g:5},{n:'Circuit Wisp',kind:'wisp',hp:19,atk:5,xp:8,g:6},{n:'Scrap Husk',kind:'husk',hp:22,atk:6,xp:9,g:8}];
function tone(f=440,d=.06){if(!s.sound)return;try{audio||(audio=new AudioContext());if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function tile(ch,px,py){const col={'#':'#343a47','.':'#515d4a','T':'#26352f','~':'#283f58','H':'#725d46','N':'#62536f','A':'#745039','r':'#5c5144'}[ch]||'#333';x.fillStyle=col;x.fillRect(px,py,20,20);if(ch==='T'){x.fillStyle='#355044';x.fillRect(px+4,py+2,12,15);x.fillStyle='#203027';x.fillRect(px+8,py+11,4,8)}if(ch==='~'){x.fillStyle='#365775';x.fillRect(px,py+6,20,3);x.fillRect(px+4,py+14,14,2)}if(ch==='H'){x.fillStyle='#b38b55';x.fillRect(px+3,py+7,14,10);x.fillStyle='#2c2220';x.fillRect(px+8,py+11,4,6)}if(ch==='N'){x.fillStyle='#d6bd9f';x.fillRect(px+6,py+5,8,9);x.fillStyle='#2c2530';x.fillRect(px+7,py+2,6,4)}if(ch==='A'){x.fillStyle='#c98a48';x.fillRect(px+3,py+3,14,15);x.fillStyle='#1a1516';x.fillRect(px+7,py+5,6,11)}if(ch==='r'){x.fillStyle='#716250';x.fillRect(px,py+8,20,4)}}
function drawRook(){const px=s.px*20,py=s.py*20;x.fillStyle='#d5c5a2';x.fillRect(px+7,py+4,6,6);x.fillStyle='#2d3442';x.fillRect(px+5,py+10,10,7);x.fillStyle='#946b43';x.fillRect(px+4,py+12,3,6);x.fillStyle='#b9c3d6';x.fillRect(px+13,py+11,2,7);x.fillStyle='#1b2029';x.fillRect(px+6,py+2,8,3);if(s.discoveries){x.fillStyle='#7ef0cb';x.fillRect(px+9,py+7,2,2)}}
function draw(){x.clearRect(0,0,c.width,c.height);for(let y=0;y<18;y++)for(let q=0;q<18;q++)tile(map[y][q],q*20,y*20);drawRook();renderHud()}
function traitList(){const t=[];if(s.traits.edge)t.push('EDGE');if(s.traits.spark)t.push('SPARK');if(s.traits.nerve)t.push('NERVE');if(s.traits.last)t.push('LAST');if(s.traits.way)t.push('WAY');return t.length?t.join(' · '):'???'}
function renderHud(){$('stats').innerHTML=`<span class="title">ROOK</span> L${s.lv} <span class="tiny">UNRANKED</span><br>HP ${s.hp}/${s.maxHp} · MP ${s.mp}/${s.maxMp}<br>XP ${s.xp}/${s.lv*12}`;$('quest').innerHTML=`${s.gold}c · tonic ${s.tonics}<br><span class="potential">${s.discoveries}/5 latent</span> · ${s.boss?'Crown broken':'Arena sealed'}`;$('msg').innerHTML=s.msg}
function walkable(ch){return ch!=='#'&&ch!=='T'&&ch!=='~'}
function awaken(key,name,text){if(s.traits[key])return false;s.traits[key]=true;s.discoveries++;s.msg=`<span class="awaken">LATENT AWAKENING: ${name}</span><br>${text}`;tone(980,.18);setTimeout(()=>tone(1240,.13),90);return true}
function checkPotential(){let a=false;if(s.acts.attack>=6)a=awaken('edge','EDGE SENSE','Scrap Blade critical chance increased.')||a;if(s.acts.skill>=3)a=awaken('spark','SPARKBLOOD','SURGE costs 1 less MP and hits harder.')||a;if(s.acts.guard>=3)a=awaken('nerve','IRON NERVE','BRACE now restores 1 MP.')||a;if(s.acts.lowWin>=1)a=awaken('last','LAST LIGHT','Low HP grants extra damage.')||a;if(s.acts.steps>=34)a=awaken('way','WAYFINDER','Rook gains +4 max HP from relentless wandering.')||a;if(s.traits.way&&!s._wayApplied){s._wayApplied=true;s.maxHp+=4;s.hp+=4}if(a)save(false)}
function move(dx,dy){if(s.battle)return;const nx=s.px+dx,ny=s.py+dy;if(!walkable(map[ny][nx])){s.msg='Blocked. Rook has hit enough walls already.';tone(145);draw();return}s.px=nx;s.py=ny;s.steps++;s.acts.steps++;tone(255,.025);checkPotential();const t=map[ny][nx];if(t==='A'&&!s.boss){startBattle({n:'Brass Crown',kind:'crown',hp:62,atk:9,xp:40,g:30,boss:true});return}if((t==='.'||t==='r'||t==='N')&&s.steps>3&&Math.random()<.145)startBattle(enemies[Math.floor(Math.random()*enemies.length)]);else{if(t==='N')s.msg='Someone from the Circuit is nearby. Tap ◎.';else if(t==='r')s.msg='Old rail lines point toward the Crown Circuit.';else s.msg='Rook keeps moving. Nobody is cheering. Yet.';draw()}}
function talk(){if(s.battle)return;let found=false;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(map[s.py+oy]?.[s.px+ox]==='N'){found=true;s.msg=s.py<8?'Courier: “Unranked? Then losing costs you nothing. Dangerous freedom.”':'Old fighter: “Talent is cheap. Pressure reveals the real thing.”'}if(map[s.py][s.px]==='H'||map[s.py-1]?.[s.px]==='H'){found=true;rest()}if(!found)s.msg='Only metal wind answers.';draw()}
function enemyArt(kind){ex.clearRect(0,0,96,80);ex.imageSmoothingEnabled=false;const p=(cx,cy,w,h,col)=>{ex.fillStyle=col;ex.fillRect(cx,cy,w,h)};if(kind==='jackal'){p(23,33,49,23,'#8f704c');p(56,20,18,18,'#8f704c');p(59,24,4,4,'#101217');p(25,56,7,14,'#443628');p(61,56,7,14,'#443628');p(17,36,10,5,'#c3a26d')}else if(kind==='rat'){p(26,35,45,22,'#6f665f');p(58,27,18,18,'#8e7b73');p(61,31,3,3,'#e7d06d');p(20,38,9,6,'#947f71');p(69,50,17,3,'#b38d82')}else if(kind==='wisp'){p(33,24,31,31,'#6a92b7');p(40,17,17,12,'#7cb4df');p(43,35,4,4,'#f5e27f');p(52,35,4,4,'#f5e27f');p(38,55,23,8,'#3e5876')}else if(kind==='husk'){p(34,17,28,16,'#635f59');p(28,32,40,30,'#4e4b48');p(38,22,5,4,'#d26751');p(52,22,5,4,'#d26751');p(19,36,12,7,'#80766b');p(65,36,12,7,'#80766b')}else{p(29,14,38,12,'#bd874c');p(22,27,52,37,'#80603e');p(34,33,8,8,'#1a1516');p(54,33,8,8,'#1a1516');p(42,47,14,5,'#d0a75f');p(17,34,8,21,'#b47d43');p(71,34,8,21,'#b47d43')}}
function startBattle(e){s.battle={...e,hpNow:e.hp};s.guard=false;$('battle').classList.add('show');$('enemyName').textContent=e.n;enemyArt(e.kind);log(`${e.n} sizes up the nobody.`);renderBattle();tone(105)}
function renderBattle(){$('enemyHp').textContent=`HP ${Math.max(0,s.battle.hpNow)}/${s.battle.hp}`;renderHud()}
function log(v){$('battleLog').innerHTML=v}
function playerAct(a){if(!s.battle)return;const b=s.battle;let msg='';if(a==='attack'){s.acts.attack++;let crit=s.traits.edge&&Math.random()<.28;let d=5+s.lv*2+Math.floor(Math.random()*4)+(s.traits.last&&s.hp<=s.maxHp*.3?4:0);if(crit)d=Math.floor(d*1.7);b.hpNow-=d;msg=`Scrap Blade hits for ${d}${crit?' CRIT':''}.`;tone(crit?720:500)}else if(a==='skill'){const cost=s.traits.spark?2:3;if(s.mp<cost){log('Not enough MP.');tone(120);return}s.acts.skill++;s.mp-=cost;let d=10+s.lv*3+Math.floor(Math.random()*4)+(s.traits.spark?4:0)+(s.traits.last&&s.hp<=s.maxHp*.3?4:0);b.hpNow-=d;msg=`SURGE tears through for ${d}.`;tone(780)}else if(a==='guard'){s.acts.guard++;s.guard=true;if(s.traits.nerve)s.mp=Math.min(s.maxMp,s.mp+1);msg=s.traits.nerve?'Rook braces. Nerve returns 1 MP.':'Rook braces for the counter.';tone(315)}else if(a==='item'){if(s.tonics<1){log('No tonic left.');return}s.tonics--;const h=Math.min(14,s.maxHp-s.hp);s.hp+=h;msg=`Black tonic restores ${h} HP.`;tone(650)}checkPotential();if(b.hpNow<=0){winBattle(msg);return}setTimeout(()=>enemyTurn(msg),260);renderBattle()}
function enemyTurn(prefix){const b=s.battle;if(!b)return;let d=Math.max(1,b.atk+Math.floor(Math.random()*3)-s.lv-(s.guard?4:0));s.guard=false;s.hp-=d;log(`${prefix}<br>${b.n} hits for ${d}.`);tone(165);if(s.hp<=0){s.hp=0;log(`<span class="dead">Rook drops. Nobody writes an obituary.</span>`);setTimeout(()=>{s.hp=s.maxHp;s.mp=s.maxMp;s.px=2;s.py=2;s.gold=Math.max(0,s.gold-3);endBattle();s.msg='Rook wakes under the scrap-house roof. Still breathing counts.';draw()},850)}renderBattle()}
function winBattle(prefix){const b=s.battle;if(s.hp<=Math.ceil(s.maxHp*.3))s.acts.lowWin++;s.xp+=b.xp;s.gold+=b.g;checkPotential();let out=`${prefix}<br><span class="win">Victory +${b.xp} XP · +${b.g}c</span>`;if(b.boss){s.boss=true;out+='<br><span class="awaken">THE CROWN CIRCUIT GOES SILENT.</span>'}while(s.xp>=s.lv*12){s.xp-=s.lv*12;s.lv++;s.maxHp+=5;s.maxMp+=2;s.hp=s.maxHp;s.mp=s.maxMp;out+=`<br>LEVEL ${s.lv}. The numbers finally notice.`;tone(900,.15)}log(out);setTimeout(()=>{endBattle();s.msg=s.boss?`Rook entered unranked and broke the Crown. Latent traits: ${traitList()}.`:'Rook gets stronger. More importantly, he gets stranger.';save(false);draw()},760)}
function endBattle(){s.battle=null;$('battle').classList.remove('show')}
function rest(){if(s.battle)return;s.hp=s.maxHp;s.mp=s.maxMp;s.msg='Scrap-house rest. HP and MP restored.';tone(590);draw()}
function showPotential(){if(s.battle)return;const clues=[];if(!s.traits.edge)clues.push('Blade instinct: use what everyone calls junk.');if(!s.traits.spark)clues.push('Sparkblood: push power through your limits.');if(!s.traits.nerve)clues.push('Iron Nerve: stand there and take the pressure.');if(!s.traits.last)clues.push('Last Light: win when you should be finished.');if(!s.traits.way)clues.push('Wayfinder: keep walking past the obvious route.');s.msg=clues.length?`<b>LATENT // ${s.discoveries}/5</b><br>${clues[Math.floor(Math.random()*clues.length)]}`:`<span class="awaken">ALL FIVE LATENT TRAITS ARE AWAKE.</span>`;draw()}
function save(message=true){localStorage.setItem(SAVE,JSON.stringify({...s,battle:null}));if(message){s.msg='Game saved locally.';draw()}}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE));if(v)s={...start,...v,battle:null,acts:{...start.acts,...v.acts},traits:{...start.traits,...v.traits}}}catch{}draw()}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...b.dataset.move.split(',').map(Number))}));document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();playerAct(b.dataset.act)}));$('talk').addEventListener('pointerdown',e=>{e.preventDefault();talk()});$('potential').addEventListener('pointerdown',e=>{e.preventDefault();showPotential()});$('save').addEventListener('pointerdown',e=>{e.preventDefault();save()});$('rest').addEventListener('pointerdown',e=>{e.preventDefault();rest()});$('sound').addEventListener('pointerdown',e=>{e.preventDefault();s.sound=!s.sound;s.msg=`Sound ${s.sound?'on':'off'}.`;tone(440);draw()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false)});window.addEventListener('pointerdown',()=>{if(audio?.state==='suspended')audio.resume()},{once:false});load();
</script></body></html>
