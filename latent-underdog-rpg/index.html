<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ROOK // LATENT</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f7f1dc;background:#12131a}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12131a}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:7px}.hud{display:grid;grid-template-columns:1.15fr .85fr;gap:7px;font-size:11px}.card{background:#1d202a;border:1px solid #454b5b;border-radius:12px;padding:8px;box-shadow:inset 0 0 0 1px #0005}.screen{position:relative;flex:1;min-height:0;transform:translateZ(0)}#game{width:100%;height:100%;display:block;border-radius:14px;background:#202735;border:1px solid #454b5b;image-rendering:pixelated}#enemyArt{width:96px;height:80px;display:block;background:transparent;border:none;border-radius:0;image-rendering:pixelated;margin:0 auto}.msg{position:absolute;left:8px;right:8px;bottom:8px;background:#101219e8;border:1px solid #596174;border-radius:10px;padding:8px;font-size:11px;min-height:44px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px);justify-content:center}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{font:inherit;font-weight:700;color:#fff;background:#2a2f3c;border:1px solid #626b7d;border-radius:12px;min-height:42px}button:active{transform:scale(.98);background:#3a4252}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.battle{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;padding:8px;background:linear-gradient(#0001,#000c)}.battle.show{display:flex}.enemybox{margin-bottom:auto;margin-top:12px;align-self:center;width:min(285px,84%);text-align:center;transform-origin:center}.portrait{height:86px;display:grid;place-items:center;overflow:hidden}.battlelog{font-size:11px;min-height:62px;line-height:1.35}.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.win{font-weight:700;color:#f4d26e}.dead{color:#ff9a9a}.awaken{color:#8af7d3;font-weight:700}.danger{color:#ffb07c;font-weight:700}.tiny{opacity:.7}.potential{color:#9bb8ff}.title{font-weight:900;letter-spacing:.08em}.screen.shake{animation:shake .16s linear}.enemybox.hit{animation:enemyhit .14s ease-out}.battle.flash{animation:flash .13s ease-out}.battle.crit{animation:critflash .18s ease-out}.msg.announce{animation:announce .36s ease-out}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-1px)}}@keyframes enemyhit{50%{transform:scale(.94) translateY(3px)}}@keyframes flash{50%{background:#ffffff22}}@keyframes critflash{40%{background:#ffe26b33}}@keyframes announce{50%{transform:scale(1.02);border-color:#8af7d3}}
</style></head><body><div class="app">
<div class="hud"><div class="card" id="stats"></div><div class="card" id="quest"></div></div>
<div class="screen" id="screen"><canvas id="game" width="360" height="360"></canvas><div class="msg" id="msg">Nobody expects anything from Rook. Good.</div><div class="battle" id="battle"><div class="enemybox card" id="enemybox"><div class="portrait"><canvas id="enemyArt" width="96" height="80"></canvas></div><div id="enemyName" class="title"></div><div id="enemyHp"></div></div><div class="card"><div class="battlelog" id="battleLog"></div><div class="menu"><button data-act="attack">SCRAP BLADE</button><button data-act="skill">SURGE</button><button data-act="guard">BRACE</button><button data-act="item">TONIC</button></div></div></div></div>

</div><script>
const c=$('game'),x=c.getContext('2d'),ec=$('enemyArt'),ex=ec.getContext('2d');function $(id){return document.getElementById(id)}
const map=['##################','#....rr....T.....#','#.H..rr..N.T.C...#','#....rr....T.....#','#..........T.....#','#..TTT....rr.....#','#..T....~~~..M...#','#..T....~~~..rr..#','#....C..~~~..rr..#','#..rrrrrrr.......#','#..r..TT..N......#','#..r..TT.....B...#','#..r.......ssss..#','#..TT..C...ssss..#','#..T......ssss...#','#....N.....ss.A..#','#................#','##################'];
const SAVE='rook-latent-v1',CONTENT=2;
const start={contentVersion:CONTENT,px:2,py:2,hp:24,maxHp:24,mp:6,maxMp:6,lv:1,xp:0,gold:0,tonics:2,steps:0,boss:false,mini1:false,mini2:false,sound:true,battle:null,guard:false,msg:'Nobody expects anything from Rook. Good.',bladeRank:0,coil:false,caches:{},gifts:{},acts:{attack:0,skill:0,guard:0,lowWin:0,steps:0},traits:{edge:false,spark:false,nerve:false,last:false,way:false},discoveries:0};
let s=structuredClone(start),audio;
const tables={
0:[{n:'Rust Jackal',kind:'jackal',hp:18,atk:5,xp:6,g:5},{n:'Cinder Rat',kind:'rat',hp:20,atk:5,xp:7,g:6},{n:'Circuit Wisp',kind:'wisp',hp:22,atk:6,xp:8,g:7,drain:true}],
1:[{n:'Rail Hound',kind:'jackal',hp:30,atk:7,xp:10,g:8,fast:true},{n:'Scrap Husk',kind:'husk',hp:34,atk:8,xp:11,g:10,armor:3},{n:'Voltage Wisp',kind:'wisp',hp:28,atk:7,xp:12,g:9,drain:true}],
2:[{n:'Crown Lancer',kind:'lancer',hp:42,atk:9,xp:14,g:12,pierce:true},{n:'Kiln Husk',kind:'husk',hp:48,atk:10,xp:15,g:13,armor:5},{n:'Gold-Eye Wisp',kind:'wisp',hp:38,atk:9,xp:16,g:14,drain:true}]
};
function zone(){return s.py<6?0:s.py<12?1:2}function zoneName(){return ['RUST FRINGE','DEAD RAILS','CROWN YARD'][zone()]}
function tone(f=440,d=.06,type='square'){if(!s.sound)return;try{audio||(audio=new AudioContext());if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type=type;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function impact(kind='hit'){const scr=$('screen'),box=$('enemybox'),battle=$('battle');if(kind==='hurt'){scr.classList.remove('shake');void scr.offsetWidth;scr.classList.add('shake')}else{box.classList.remove('hit');battle.classList.remove('flash','crit');void box.offsetWidth;box.classList.add('hit');battle.classList.add(kind==='crit'?'crit':'flash')}}
function announce(html){s.msg=html;const m=$('msg');m.classList.remove('announce');draw();void m.offsetWidth;m.classList.add('announce')}
function tile(ch,px,py){const col={'#':'#343a47','.':'#515d4a','T':'#26352f','~':'#283f58','H':'#725d46','N':'#62536f','A':'#8a5b32','M':'#6d4c3b','B':'#54466c','C':'#7a6c3c','r':'#5c5144','s':'#4e433f'}[ch]||'#333';x.fillStyle=col;x.fillRect(px,py,20,20);if(ch==='T'){x.fillStyle='#355044';x.fillRect(px+4,py+2,12,15);x.fillStyle='#203027';x.fillRect(px+8,py+11,4,8)}if(ch==='~'){x.fillStyle='#365775';x.fillRect(px,py+6,20,3);x.fillRect(px+4,py+14,14,2)}if(ch==='H'){x.fillStyle='#b38b55';x.fillRect(px+3,py+7,14,10);x.fillStyle='#2c2220';x.fillRect(px+8,py+11,4,6)}if(ch==='N'){x.fillStyle='#d6bd9f';x.fillRect(px+6,py+5,8,9);x.fillStyle='#2c2530';x.fillRect(px+7,py+2,6,4)}if(ch==='C'){x.fillStyle='#d1b75b';x.fillRect(px+5,py+7,10,8);x.fillStyle='#352c1c';x.fillRect(px+7,py+9,6,2)}if(ch==='M'||ch==='B'||ch==='A'){x.fillStyle=ch==='A'?'#d0934d':ch==='M'?'#bb7450':'#8d77ba';x.fillRect(px+3,py+3,14,14);x.fillStyle='#161319';x.fillRect(px+7,py+7,6,6)}if(ch==='r'){x.fillStyle='#716250';x.fillRect(px,py+8,20,4);x.fillStyle='#352f2b';x.fillRect(px+3,py,2,20);x.fillRect(px+15,py,2,20)}if(ch==='s'){x.fillStyle='#6a554b';x.fillRect(px+3,py+4,4,4);x.fillRect(px+12,py+11,5,3)}}
function drawRook(){const px=s.px*20,py=s.py*20;x.fillStyle='#d5c5a2';x.fillRect(px+7,py+4,6,6);x.fillStyle='#2d3442';x.fillRect(px+5,py+10,10,7);x.fillStyle='#946b43';x.fillRect(px+4,py+12,3,6);x.fillStyle='#b9c3d6';x.fillRect(px+13,py+11,2,7);x.fillStyle='#1b2029';x.fillRect(px+6,py+2,8,3);if(s.discoveries){x.fillStyle='#7ef0cb';x.fillRect(px+9,py+7,2,2)}}
function draw(){x.clearRect(0,0,c.width,c.height);for(let y=0;y<18;y++)for(let q=0;q<18;q++)tile(map[y][q],q*20,y*20);drawRook();renderHud()}
function xpNeed(){return 10+s.lv*8}function traitList(){const t=[];if(s.traits.edge)t.push('EDGE');if(s.traits.spark)t.push('SPARK');if(s.traits.nerve)t.push('NERVE');if(s.traits.last)t.push('LAST');if(s.traits.way)t.push('WAY');return t.length?t.join(' · '):'???'}
function renderHud(){$('stats').innerHTML=`<span class="title">ROOK</span> L${s.lv} <span class="tiny">UNRANKED</span><br>HP ${s.hp}/${s.maxHp} · MP ${s.mp}/${s.maxMp}<br>XP ${s.xp}/${xpNeed()} · BLADE +${s.bladeRank}`;$('quest').innerHTML=`${s.gold}c · tonic ${s.tonics}<br><span class="potential">${s.discoveries}/5 latent</span> · ${zoneName()}<br>${s.boss?'Crown broken':`${s.mini1?'◆':'◇'}${s.mini2?'◆':'◇'} Crown locks`}`;$('msg').innerHTML=s.msg}
function walkable(ch){return ch!=='#'&&ch!=='T'&&ch!=='~'}
function awaken(key,name,text){if(s.traits[key])return false;s.traits[key]=true;s.discoveries++;announce(`<span class="awaken">LATENT AWAKENING: ${name}</span><br>${text}`);tone(980,.18);setTimeout(()=>tone(1240,.13),90);return true}
function checkPotential(){let a=false;if(s.acts.attack>=7)a=awaken('edge','EDGE SENSE','Scrap Blade critical chance increased.')||a;if(s.acts.skill>=4)a=awaken('spark','SPARKBLOOD','SURGE costs less MP and breaks armor.')||a;if(s.acts.guard>=4)a=awaken('nerve','IRON NERVE','BRACE restores 1 MP and hardens heavy hits.')||a;if(s.acts.lowWin>=1)a=awaken('last','LAST LIGHT','Low HP grants extra damage.')||a;if(s.acts.steps>=45)a=awaken('way','WAYFINDER','Rook gains +5 max HP from relentless wandering.')||a;if(s.traits.way&&!s._wayApplied){s._wayApplied=true;s.maxHp+=5;s.hp+=5}if(a)save(false);return a}
function scaleEnemy(e){const z=zone(),bonus=Math.max(0,s.lv-(z+1));return {...e,hp:e.hp+bonus*4,atk:e.atk+Math.floor(bonus/2),hpNow:e.hp+bonus*4,turn:0,guardBroken:false}}
function move(dx,dy){if(s.battle)return;const nx=s.px+dx,ny=s.py+dy;if(!walkable(map[ny][nx])){s.msg='Blocked. Rook has hit enough walls already.';tone(145);draw();return}const t=map[ny][nx];if(t==='A'&&!s.boss&&(!s.mini1||!s.mini2)){s.msg='Two Crown locks are still burning. Something out here owns each key.';tone(120);draw();return}s.px=nx;s.py=ny;s.steps++;s.acts.steps++;tone(255,.025);const awakened=checkPotential();if(t==='M'&&!s.mini1){startBattle({n:'Iron Maw',kind:'maw',hp:86,atk:9,xp:28,g:24,bossTag:'mini1',pattern:'crusher',armor:4});return}if(t==='B'&&!s.mini2){startBattle({n:'Null Saint',kind:'saint',hp:112,atk:10,xp:34,g:30,bossTag:'mini2',pattern:'saint',drain:true});return}if(t==='A'&&!s.boss){startBattle({n:'Brass Crown',kind:'crown',hp:132,atk:11,xp:70,g:60,bossTag:'brass',phase:1,pattern:'crown',armor:5});return}if(t==='C'){openCache(nx,ny);return}if((t==='.'||t==='r'||t==='s'||t==='N')&&s.steps>3&&Math.random()<.14){const table=tables[zone()];startBattle(scaleEnemy(table[Math.floor(Math.random()*table.length)]));return}if(!awaken){if(t==='N')s.msg='Someone is waiting nearby. Tap ◎.';else if(t==='r')s.msg='Dead rail. The metal still remembers trains.';else if(t==='s')s.msg='Crown slag crunches under Rook’s boots.';else s.msg=`${zoneName()}. Rook keeps moving.`;draw()}}
function openCache(px,py){const key=`${px},${py}`;if(s.caches[key]){s.msg='The cache is already stripped clean.';draw();return}s.caches[key]=true;const roll=Object.keys(s.caches).length;if(roll===1){s.tonics+=2;s.msg='Cache cracked: +2 black tonics.'}else if(roll===2){s.maxHp+=4;s.hp+=4;s.msg='Cache cracked: reinforced coat. +4 max HP.'}else{s.maxMp+=2;s.mp=s.maxMp;s.msg='Cache cracked: live coil. +2 max MP.'}tone(840,.12);save(false);draw()}
function talk(){if(s.battle)return;let found=false;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(map[s.py+oy]?.[s.px+ox]==='N'){found=true;const y=s.py+oy,key=y<6?'fringe':y<13?'rails':'yard';if(key==='fringe'){if(!s.gifts.fringe){s.gifts.fringe=true;s.tonics++;s.msg='Courier: “Unranked means nobody plans for you.” She slips Rook a tonic.'}else s.msg='Courier: “The rails get meaner south of here.”'}else if(key==='rails'){s.msg=s.mini1?'Old fighter: “You broke the Maw. The Saint is worse because it thinks.”':'Old fighter: “Iron Maw telegraphs the crush. Brace when it winds up.”'}else{s.msg=s.mini2?'Arena rat: “Both locks dead. Brass won’t fight fair twice.”':'Arena rat: “The Null Saint steals strength. Don’t let the fight drag.”'}}if(map[s.py][s.px]==='H'||map[s.py-1]?.[s.px]==='H'){found=true;rest()}if(!found)s.msg='Only metal wind answers.';save(false);draw()}
function enemyArt(kind){ex.clearRect(0,0,96,80);ex.imageSmoothingEnabled=false;const p=(cx,cy,w,h,col)=>{ex.fillStyle=col;ex.fillRect(cx,cy,w,h)};if(kind==='jackal'){p(23,33,49,23,'#8f704c');p(56,20,18,18,'#8f704c');p(59,24,4,4,'#101217');p(25,56,7,14,'#443628');p(61,56,7,14,'#443628');p(17,36,10,5,'#c3a26d')}else if(kind==='rat'){p(26,35,45,22,'#6f665f');p(58,27,18,18,'#8e7b73');p(61,31,3,3,'#e7d06d');p(20,38,9,6,'#947f71');p(69,50,17,3,'#b38d82')}else if(kind==='wisp'){p(33,24,31,31,'#6a92b7');p(40,17,17,12,'#7cb4df');p(43,35,4,4,'#f5e27f');p(52,35,4,4,'#f5e27f');p(38,55,23,8,'#3e5876')}else if(kind==='husk'){p(34,17,28,16,'#635f59');p(28,32,40,30,'#4e4b48');p(38,22,5,4,'#d26751');p(52,22,5,4,'#d26751');p(19,36,12,7,'#80766b');p(65,36,12,7,'#80766b')}else if(kind==='lancer'){p(38,13,20,18,'#b69457');p(31,31,34,32,'#635744');p(56,24,5,47,'#d1c6a5');p(41,18,4,4,'#1a1516');p(51,18,4,4,'#1a1516')}else if(kind==='maw'){p(19,24,58,38,'#825b43');p(27,16,12,16,'#a67550');p(58,16,12,16,'#a67550');p(31,38,35,15,'#171316');p(35,39,5,11,'#d7cab0');p(56,39,5,11,'#d7cab0')}else if(kind==='saint'){p(34,12,28,18,'#a596c2');p(26,29,44,35,'#625875');p(42,17,4,5,'#f2e986');p(52,17,4,5,'#f2e986');p(18,34,10,4,'#a596c2');p(68,34,10,4,'#a596c2')}else{p(29,14,38,12,kind==='crown2'?'#e4bc62':'#bd874c');p(22,27,52,37,kind==='crown2'?'#a26844':'#80603e');p(34,33,8,8,'#1a1516');p(54,33,8,8,'#1a1516');p(42,47,14,5,'#d0a75f');p(17,34,8,21,'#b47d43');p(71,34,8,21,'#b47d43')}}
function startBattle(e){s.battle=e.hpNow?e:{...e,hpNow:e.hp,turn:0};s.guard=false;$('battle').classList.add('show');$('enemyName').textContent=s.battle.n;enemyArt(s.battle.kind);log(`${s.battle.n} steps into Rook’s road.`);renderBattle();tone(105,.08,'sawtooth')}
function renderBattle(){const b=s.battle;$('enemyHp').textContent=`HP ${Math.max(0,b.hpNow)}/${b.hp}${b.armor?` · ARM ${b.armor}`:''}${b.phase?` · P${b.phase}`:''}`;renderHud()}
function log(v){$('battleLog').innerHTML=v}
function damageEnemy(raw,source){const b=s.battle;let d=raw;if(b.armor&&source==='attack')d=Math.max(1,d-b.armor);if(source==='skill'&&b.armor){const broken=Math.min(b.armor,s.traits.spark?3:2);b.armor-=broken;d+=broken;log(`SURGE tears ${broken} armor away.`)}b.hpNow-=d;return d}
function playerAct(a){if(!s.battle)return;const b=s.battle;let msg='',crit=false;if(a==='attack'){s.acts.attack++;crit=s.traits.edge&&Math.random()<.30;let raw=6+s.lv*2+s.bladeRank*2+Math.floor(Math.random()*5)+(s.traits.last&&s.hp<=s.maxHp*.3?5:0);if(crit)raw=Math.floor(raw*1.75);const d=damageEnemy(raw,'attack');msg=`Scrap Blade hits for ${d}${crit?' CRIT':''}.`;tone(crit?760:500,.07);impact(crit?'crit':'hit')}else if(a==='skill'){const cost=Math.max(1,(s.traits.spark?2:3)-(s.coil?1:0));if(s.mp<cost){log('Not enough MP.');tone(120);return}s.acts.skill++;s.mp-=cost;let raw=12+s.lv*3+Math.floor(Math.random()*5)+(s.traits.spark?5:0)+(s.traits.last&&s.hp<=s.maxHp*.3?5:0);const d=damageEnemy(raw,'skill');msg=`SURGE tears through for ${d}.`;tone(800,.08,'sawtooth');impact('hit')}else if(a==='guard'){s.acts.guard++;s.guard=true;if(s.traits.nerve)s.mp=Math.min(s.maxMp,s.mp+1);msg=s.traits.nerve?'Rook braces. Nerve returns 1 MP.':'Rook braces for the counter.';tone(315)}else if(a==='item'){if(s.tonics<1){log('No tonic left.');return}s.tonics--;const h=Math.min(16+s.lv,s.maxHp-s.hp);s.hp+=h;msg=`Black tonic restores ${h} HP.`;tone(650)}const awakened=checkPotential();if(b.hpNow<=0){resolveEnemyDown(msg);return}setTimeout(()=>enemyTurn(msg),280);if(!awakened)log(msg);renderBattle()}
function resolveEnemyDown(prefix){const b=s.battle;if(b.bossTag==='brass'&&b.phase===1){b.phase=2;b.n='Brass Crown // UNCROWNED';b.kind='crown2';b.hp=168+Math.max(0,s.lv-4)*8;b.hpNow=b.hp;b.atk+=2;b.armor=2;b.turn=0;enemyArt(b.kind);$('enemyName').textContent=b.n;log(`${prefix}<br><span class="danger">The crown splits. Something underneath stands up.</span>`);tone(120,.18,'sawtooth');setTimeout(()=>tone(70,.24,'sawtooth'),100);impact('hurt');renderBattle();return}winBattle(prefix)}
function enemyTurn(prefix){const b=s.battle;if(!b)return;b.turn=(b.turn||0)+1;let telegraph='',mult=1,bonus=0;if(b.pattern==='crusher'&&b.turn%3===2){b.charged=true;log(`${prefix}<br><span class="danger">Iron Maw lowers its head. THE NEXT HIT WILL CRUSH.</span>`);tone(95,.12);renderBattle();return}if(b.charged){mult=1.8;b.charged=false;telegraph=' CRUSH';}if(b.pattern==='crown'&&b.phase===2&&b.turn%4===0){mult=1.65;telegraph=' CROWN BREAKER';}if(b.fast&&Math.random()<.25)bonus=2;if(b.drain&&Math.random()<.28){const drained=Math.min(1,s.mp);s.mp-=drained;bonus+=drained?2:0;telegraph+=' DRAIN';}let armor=s.guard?(s.traits.nerve?6:4):0;if(b.pierce)armor=Math.floor(armor/2);let d=Math.max(1,Math.floor((b.atk+Math.floor(Math.random()*4)+bonus)*mult)-s.lv-armor);s.guard=false;s.hp-=d;impact('hurt');log(`${prefix}<br>${b.n}${telegraph} hits for ${d}.`);tone(mult>1.2?105:165,.08);if(s.hp<=0){s.hp=0;log(`<span class="dead">Rook drops. Nobody writes an obituary.</span>`);setTimeout(()=>{s.hp=s.maxHp;s.mp=s.maxMp;s.px=2;s.py=2;s.gold=Math.max(0,s.gold-5);endBattle();s.msg='Rook wakes under the scrap-house roof. Still breathing counts.';draw()},900)}renderBattle()}
function winBattle(prefix){const b=s.battle;if(s.hp<=Math.ceil(s.maxHp*.3))s.acts.lowWin++;s.xp+=b.xp;s.gold+=b.g;let out=`${prefix}<br><span class="win">Victory +${b.xp} XP · +${b.g}c</span>`;if(b.bossTag==='mini1'){s.mini1=true;s.bladeRank++;out+='<br><span class="awaken">IRON MAW KEY CLAIMED · SCRAP BLADE +1</span>'}if(b.bossTag==='mini2'){s.mini2=true;s.coil=true;s.maxMp+=2;s.mp=s.maxMp;out+='<br><span class="awaken">NULL KEY CLAIMED · SURGE COIL ONLINE</span>'}if(b.bossTag==='brass'){s.boss=true;out+='<br><span class="awaken">THE CROWN CIRCUIT GOES SILENT.</span>'}while(s.xp>=xpNeed()){s.xp-=xpNeed();s.lv++;s.maxHp+=6;s.maxMp+=2;s.hp=s.maxHp;s.mp=s.maxMp;out+=`<br>LEVEL ${s.lv}. The numbers finally notice.`;tone(900,.15)}checkPotential();log(out);setTimeout(()=>{endBattle();if(s.boss)s.msg=`Rook broke the second Crown. Latent traits: ${traitList()}.`;else if(s.mini1&&!s.mini2)s.msg='One Crown lock is dead. The Null Saint holds the other.';else if(s.mini2&&!s.mini1)s.msg='One Crown lock is dead. Iron Maw holds the other.';else s.msg='Rook gets stronger. More importantly, he gets stranger.';save(false);draw()},900)}
function endBattle(){s.battle=null;$('battle').classList.remove('show')}
function rest(){if(s.battle)return;s.hp=s.maxHp;s.mp=s.maxMp;s.msg='Scrap-house rest. HP and MP restored.';tone(590);save(false);draw()}
function showPotential(){if(s.battle)return;const clues=[];if(!s.traits.edge)clues.push('Blade instinct: keep trusting the junk blade.');if(!s.traits.spark)clues.push('Sparkblood: push power through your limits.');if(!s.traits.nerve)clues.push('Iron Nerve: brace when pressure is coming.');if(!s.traits.last)clues.push('Last Light: survive a win you had no business surviving.');if(!s.traits.way)clues.push('Wayfinder: keep walking past the obvious route.');s.msg=clues.length?`<b>LATENT // ${s.discoveries}/5</b><br>${clues[Math.floor(Math.random()*clues.length)]}`:`<span class="awaken">ALL FIVE LATENT TRAITS ARE AWAKE.</span>`;draw()}
function save(message=true){localStorage.setItem(SAVE,JSON.stringify({...s,battle:null}));if(message){s.msg='Game saved locally.';draw()}}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE));if(v){const legacy=!v.contentVersion||v.contentVersion<CONTENT;s={...start,...v,battle:null,acts:{...start.acts,...v.acts},traits:{...start.traits,...v.traits},caches:{...start.caches,...v.caches},gifts:{...start.gifts,...v.gifts},contentVersion:CONTENT};if(legacy){s.boss=false;s.mini1=false;s.mini2=false;s.px=2;s.py=2;s.msg='The Crown Circuit rebuilt itself meaner overnight. Rook kept everything he earned.'}}}catch{}draw()}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...b.dataset.move.split(',').map(Number))}));document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();playerAct(b.dataset.act)}));$('talk').addEventListener('pointerdown',e=>{e.preventDefault();talk()});$('potential').addEventListener('pointerdown',e=>{e.preventDefault();showPotential()});$('save').addEventListener('pointerdown',e=>{e.preventDefault();save()});$('rest').addEventListener('pointerdown',e=>{e.preventDefault();rest()});$('sound').addEventListener('pointerdown',e=>{e.preventDefault();s.sound=!s.sound;s.msg=`Sound ${s.sound?'on':'off'}.`;tone(440);draw()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false)});window.addEventListener('pointerdown',()=>{if(audio?.state==='suspended')audio.resume()},{once:false});load();
</script></body></html>
