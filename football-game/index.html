<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FORGE Football Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}body{display:grid;place-items:center}#app{position:relative;width:100vw;height:100dvh;max-width:760px;background:#0b2315;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:8px}.panel{background:rgba(3,12,7,.76);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 11px;backdrop-filter:blur(8px)}.big{font-weight:900;font-size:18px}.small{font-size:12px;opacity:.82}.score{text-align:right}.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}#stickBase{width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);position:relative;pointer-events:none}#stickKnob{position:absolute;width:58px;height:58px;border-radius:50%;left:37px;top:37px;background:rgba(255,255,255,.8)}#snap{pointer-events:auto;border:0;border-radius:18px;padding:18px 23px;font:900 18px system-ui;background:#f4d35e;color:#151515;box-shadow:0 7px 0 #8f7624;min-width:120px;touch-action:manipulation}#snap:active{transform:translateY(4px);box-shadow:0 3px 0 #8f7624}#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(28px,8vw,56px);text-align:center;text-shadow:0 4px 16px #000;opacity:0;transition:opacity .12s;pointer-events:none;width:90%}#debug{position:absolute;right:10px;top:82px;font:11px ui-monospace,monospace;background:rgba(0,0,0,.48);padding:5px 7px;border-radius:8px;pointer-events:none;opacity:.7}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="top"><div class="panel"><div id="down" class="big">1ST &amp; 10</div><div id="field" class="small">BALL ON OWN 20</div></div><div class="panel score"><div class="big"><span id="pts">0</span> PTS</div><div class="small">BEST <span id="best">0</span></div></div></div><div class="bottom"><div id="stickBase"><div id="stickKnob"></div></div><button id="snap">SNAP</button></div></div><div id="message"></div><div id="debug">DEBUG · football-game</div></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),downEl=$('down'),fieldEl=$('field'),ptsEl=$('pts'),bestEl=$('best'),snapBtn=$('snap'),msgEl=$('message'),base=$('stickBase'),knob=$('stickKnob');
let W=0,H=0,dpr=1,last=performance.now(),flash=0;const S={phase:'ready',down:1,toGo:10,ball:20,seriesStart:20,points:0,best:+localStorage.getItem('forgeFootballBest')||0,playStart:20,playYards:0};const P={x:0,y:0,r:15,speed:250};let defenders=[],input={x:0,y:0,active:false,pointer:null};bestEl.textContent=S.best;
function F(){return{x:W*.08,y:H*.08,w:W*.84,h:H*.84}}function yardY(y){const f=F();return f.y+f.h-(y/100)*f.h}function yardAtY(y){const f=F();return(f.y+f.h-y)/f.h*100}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);spawn(false)}addEventListener('resize',resize,{passive:true});
function spawn(make=true){const f=F();P.x=W/2;P.y=yardY(S.ball);if(!make)return;defenders=[];const lanes=[.22,.5,.78];for(let i=0;i<3;i++)defenders.push({x:f.x+f.w*lanes[i],y:P.y-78,r:15,speed:128+Math.random()*16,kind:'front'});defenders.push({x:f.x+24,y:P.y-18,r:15,speed:142,kind:'side'});defenders.push({x:f.x+f.w-24,y:P.y-18,r:15,speed:142,kind:'side'});}
function hud(){downEl.textContent=S.phase==='gameover'?'TURNOVER':`${['1ST','2ND','3RD','4TH'][Math.min(3,S.down-1)]} & ${Math.max(1,Math.ceil(S.toGo))}`;fieldEl.textContent=S.ball<50?`BALL ON OWN ${Math.round(S.ball)}`:S.ball===50?'MIDFIELD':`BALL ON OPP ${Math.round(100-S.ball)}`;ptsEl.textContent=S.points;bestEl.textContent=S.best;snapBtn.textContent=S.phase==='ready'?'SNAP':S.phase==='gameover'?'NEW DRIVE':'LIVE';snapBtn.disabled=S.phase==='live'}
function msg(t,ms=700){msgEl.textContent=t;msgEl.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>msgEl.style.opacity=0,ms)}function newDrive(){Object.assign(S,{phase:'ready',down:1,toGo:10,ball:20,seriesStart:20,points:0});spawn();hud();msg('NEW DRIVE',550)}function snap(){if(S.phase==='gameover'){newDrive();return}if(S.phase!=='ready')return;S.phase='live';S.playStart=S.ball;S.playYards=0;spawn();hud();msg('GO!',350)}
function finish(reason){if(S.phase!=='live')return;S.phase='ready';S.ball=Math.max(1,Math.min(100,S.ball+S.playYards));if(reason==='td'||S.ball>=100){S.points+=7;S.best=Math.max(S.best,S.points);localStorage.setItem('forgeFootballBest',S.best);msg('TOUCHDOWN! +7',1000);Object.assign(S,{down:1,toGo:10,ball:20,seriesStart:20});spawn();hud();return}const gained=S.ball-S.seriesStart;if(gained>=10){S.down=1;S.seriesStart=S.ball;S.toGo=Math.min(10,100-S.ball);msg('FIRST DOWN!',700)}else{S.down++;S.toGo=Math.max(1,10-gained);if(S.down>4){S.phase='gameover';S.best=Math.max(S.best,S.points);localStorage.setItem('forgeFootballBest',S.best);msg('TURNOVER',1000)}else msg(reason==='out'?'OUT OF BOUNDS':`GAIN ${Math.max(0,Math.round(S.playYards))}`,550)}spawn();hud()}
function update(dt){flash=Math.max(0,flash-dt);if(S.phase!=='live')return;const f=F();P.x+=input.x*P.speed*dt;P.y+=input.y*P.speed*dt;if(P.x-P.r<f.x||P.x+P.r>f.x+f.w){finish('out');return}P.x=Math.max(f.x+P.r,Math.min(f.x+f.w-P.r,P.x));const centerYard=yardAtY(P.y),leadingEdgeY=P.y-P.r;S.playYards=Math.max(0,centerYard-S.playStart);if(leadingEdgeY<=f.y){S.playYards=100-S.playStart;finish('td');return}P.y=Math.max(f.y+P.r,Math.min(f.y+f.h-P.r,P.y));for(const d of defenders){const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy)||1;let speed=d.speed;if(d.kind==='side'&&Math.abs(dy)>90)speed*=.82;if(dist<140)speed*=1.18;d.x+=dx/dist*speed*dt;d.y+=dy/dist*speed*dt;if(dist<P.r+d.r){flash=.12;finish('tackle');return}}}
function field(){const f=F();ctx.fillStyle='#155b2f';ctx.fillRect(f.x,f.y,f.w,f.h);ctx.fillStyle='#0d3d21';ctx.fillRect(f.x,f.y,f.w,f.h*.1);ctx.fillRect(f.x,f.y+f.h*.9,f.w,f.h*.1);ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=2;ctx.strokeRect(f.x,f.y,f.w,f.h);ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.72)';for(let y=10;y<100;y+=10){const py=yardY(y);ctx.beginPath();ctx.moveTo(f.x,py);ctx.lineTo(f.x+f.w,py);ctx.strokeStyle=y===50?'rgba(255,255,255,.9)':'rgba(255,255,255,.38)';ctx.stroke();const n=y<=50?y:100-y;ctx.fillText(n,f.x+22,py-4);ctx.fillText(n,f.x+f.w-22,py-4)}ctx.lineWidth=4;ctx.strokeStyle='#2da8ff';ctx.beginPath();ctx.moveTo(f.x,yardY(S.phase==='live'?S.playStart:S.ball));ctx.lineTo(f.x+f.w,yardY(S.phase==='live'?S.playStart:S.ball));ctx.stroke();ctx.strokeStyle='#ffd23f';ctx.beginPath();ctx.moveTo(f.x,yardY(Math.min(100,S.seriesStart+10)));ctx.lineTo(f.x+f.w,yardY(Math.min(100,S.seriesStart+10)));ctx.stroke()}
function actors(){for(const d of defenders){ctx.fillStyle='#d94a4a';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(d.x-9,d.y-3,18,6)}ctx.save();ctx.translate(P.x,P.y);ctx.fillStyle='#f4d35e';ctx.beginPath();ctx.arc(0,0,P.r+2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171717';ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(4,-1,11,6,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);field();actors();if(S.phase==='ready'){ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(0,0,W,H)}if(flash){ctx.fillStyle=`rgba(255,255,255,${flash*3})`;ctx.fillRect(0,0,W,H)}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}
function center(){const r=base.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,rad:r.width/2}}function setStick(x,y){const c=center(),dx=x-c.x,dy=y-c.y,dist=Math.hypot(dx,dy)||1,mag=Math.min(1,dist/(c.rad*.72));input.x=dx/dist*mag;input.y=dy/dist*mag;knob.style.transform=`translate(${input.x*36}px,${input.y*36}px)`}function release(id){if(input.pointer!==id)return;Object.assign(input,{pointer:null,active:false,x:0,y:0});knob.style.transform='translate(0,0)'}canvas.addEventListener('pointerdown',e=>{const c=center();if(Math.hypot(e.clientX-c.x,e.clientY-c.y)<c.rad*1.55){input.pointer=e.pointerId;input.active=true;canvas.setPointerCapture?.(e.pointerId);setStick(e.clientX,e.clientY)}});canvas.addEventListener('pointermove',e=>{if(input.pointer===e.pointerId)setStick(e.clientX,e.clientY)});canvas.addEventListener('pointerup',e=>release(e.pointerId));canvas.addEventListener('pointercancel',e=>release(e.pointerId));for(const ev of ['contextmenu','dragstart','selectstart'])document.addEventListener(ev,e=>{if(!e.target.closest('button'))e.preventDefault()});const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();snap()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));setInterval(()=>{if(input.active)return;let x=0,y=0;if(keys.has('arrowleft')||keys.has('a'))x--;if(keys.has('arrowright')||keys.has('d'))x++;if(keys.has('arrowup')||keys.has('w'))y--;if(keys.has('arrowdown')||keys.has('s'))y++;const m=Math.hypot(x,y)||1;input.x=x/m;input.y=y/m},16);snapBtn.addEventListener('pointerdown',e=>{e.preventDefault();snap()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.phase==='live'){input.x=input.y=0;finish('tackle')}});resize();hud();requestAnimationFrame(loop)})();
</script></body></html>
