<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><title>FORGE Football Test</title><style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}body{display:grid;place-items:center}#app{position:relative;width:100vw;height:100dvh;max-width:760px;background:#0b2315;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.panel{background:rgba(3,12,7,.76);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 11px;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(8px)}.big{font-weight:900;font-size:18px;letter-spacing:.02em}.small{font-size:12px;opacity:.82}.score{text-align:right}.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}#stickBase{width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);position:relative;pointer-events:none}#stickKnob{position:absolute;width:58px;height:58px;border-radius:50%;left:37px;top:37px;background:rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(0,0,0,.3)}#snap{pointer-events:auto;border:0;border-radius:18px;padding:18px 23px;font:900 18px system-ui;background:#f4d35e;color:#151515;box-shadow:0 7px 0 #8f7624;min-width:120px;touch-action:manipulation}#snap:active{transform:translateY(4px);box-shadow:0 3px 0 #8f7624}#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(28px,8vw,56px);text-align:center;text-shadow:0 4px 16px #000;opacity:0;transition:opacity .12s;pointer-events:none;width:90%}#debug{position:absolute;right:10px;top:82px;font:11px ui-monospace,monospace;background:rgba(0,0,0,.48);padding:5px 7px;border-radius:8px;pointer-events:none;opacity:.7}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="top"><div class="panel"><div id="down" class="big">1ST &amp; 10</div><div id="field" class="small">BALL ON OWN 20</div></div><div class="panel score"><div class="big"><span id="pts">0</span> PTS</div><div class="small">BEST <span id="best">0</span></div></div></div><div class="bottom"><div id="stickBase"><div id="stickKnob"></div></div><button id="snap">SNAP</button></div></div><div id="message"></div><div id="debug">DEBUG · football-game</div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),downEl=document.getElementById('down'),fieldEl=document.getElementById('field'),ptsEl=document.getElementById('pts'),bestEl=document.getElementById('best'),snapBtn=document.getElementById('snap'),msgEl=document.getElementById('message'),base=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');let W=0,H=0,dpr=1,last=performance.now(),flash=0;const state={phase:'ready',down:1,toGo:10,ball:20,seriesStart:20,points:0,best:+localStorage.getItem('forgeFootballBest')||0,playStart:20,playYards:0};const player={x:0,y:0,r:15,speed:250,vx:0,vy:0};let defenders=[],input={x:0,y:0,active:false,pointer:null};bestEl.textContent=state.best;
function fieldRect(){return{x:W*.08,y:H*.08,w:W*.84,h:H*.84}}function yardToY(y){const f=fieldRect();return f.y+f.h-(y/100)*f.h}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);resetPositions(false)}addEventListener('resize',resize,{passive:true});
function resetPositions(respawn=true){const f=fieldRect();player.x=W/2;player.y=yardToY(state.ball);if(respawn){defenders=[];for(let i=0;i<6;i++){const row=Math.floor(i/3),col=i%3;defenders.push({x:f.x+f.w*(.22+col*.28),y:player.y-70-row*105,r:15,speed:115+row*18+Math.random()*18})}}}
function hud(){downEl.textContent=state.phase==='gameover'?'TURNOVER':`${['1ST','2ND','3RD','4TH'][Math.min(3,state.down-1)]} & ${Math.max(1,Math.ceil(state.toGo))}`;fieldEl.textContent=state.ball<50?`BALL ON OWN ${Math.round(state.ball)}`:state.ball===50?'MIDFIELD':`BALL ON OPP ${Math.round(100-state.ball)}`;ptsEl.textContent=state.points;bestEl.textContent=state.best;snapBtn.textContent=state.phase==='ready'?'SNAP':state.phase==='gameover'?'NEW DRIVE':'LIVE';snapBtn.disabled=state.phase==='live'}
function showMsg(t,ms=700){msgEl.textContent=t;msgEl.style.opacity=1;clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>msgEl.style.opacity=0,ms)}function newDrive(){state.phase='ready';state.down=1;state.toGo=10;state.ball=20;state.seriesStart=20;state.points=0;resetPositions();hud();showMsg('NEW DRIVE',550)}function startPlay(){if(state.phase==='gameover'){newDrive();return}if(state.phase!=='ready')return;state.phase='live';state.playStart=state.ball;state.playYards=0;resetPositions();hud();showMsg('GO!',350)}
function endPlay(reason){if(state.phase!=='live')return;state.phase='ready';state.ball=Math.max(1,Math.min(100,state.ball+state.playYards));if(state.ball>=100){state.points+=7;state.best=Math.max(state.best,state.points);localStorage.setItem('forgeFootballBest',state.best);showMsg('TOUCHDOWN! +7',1000);state.down=1;state.toGo=10;state.ball=20;state.seriesStart=20;resetPositions();hud();return}const gained=state.ball-state.seriesStart;if(gained>=10){state.down=1;state.seriesStart=state.ball;state.toGo=Math.min(10,100-state.ball);showMsg('FIRST DOWN!',700)}else{state.down++;state.toGo=Math.max(1,10-gained);if(state.down>4){state.phase='gameover';state.best=Math.max(state.best,state.points);localStorage.setItem('forgeFootballBest',state.best);showMsg('TURNOVER',1000)}else showMsg(reason==='out'?'OUT OF BOUNDS':`GAIN ${Math.max(0,Math.round(state.playYards))}`,550)}resetPositions();hud()}
function update(dt){flash=Math.max(0,flash-dt);if(state.phase!=='live')return;const f=fieldRect();player.vx=input.x*player.speed;player.vy=input.y*player.speed;player.x+=player.vx*dt;player.y+=player.vy*dt;if(player.x-player.r<f.x||player.x+player.r>f.x+f.w){endPlay('out');return}player.x=Math.max(f.x+player.r,Math.min(f.x+f.w-player.r,player.x));const cy=(f.y+f.h-player.y)/f.h*100;state.playYards=Math.max(0,cy-state.playStart);if(cy>=100){state.playYards=100-state.playStart;endPlay('td');return}player.y=Math.max(f.y+player.r,Math.min(f.y+f.h-player.r,player.y));for(const d of defenders){const dx=player.x-d.x,dy=player.y-d.y,dist=Math.hypot(dx,dy)||1,chase=d.speed*(dist<150?1.22:1);d.x+=dx/dist*chase*dt;d.y+=dy/dist*chase*dt;if(dist<player.r+d.r){flash=.12;endPlay('tackle');return}}}
function drawField(){const f=fieldRect();ctx.fillStyle='#155b2f';ctx.fillRect(f.x,f.y,f.w,f.h);ctx.fillStyle='#0d3d21';ctx.fillRect(f.x,f.y,f.w,f.h*.1);ctx.fillRect(f.x,f.y+f.h*.9,f.w,f.h*.1);ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=2;ctx.strokeRect(f.x,f.y,f.w,f.h);ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.72)';for(let y=10;y<100;y+=10){const py=yardToY(y);ctx.beginPath();ctx.moveTo(f.x,py);ctx.lineTo(f.x+f.w,py);ctx.strokeStyle=y===50?'rgba(255,255,255,.9)':'rgba(255,255,255,.38)';ctx.stroke();const label=y<=50?y:100-y;ctx.fillText(label,f.x+22,py-4);ctx.fillText(label,f.x+f.w-22,py-4)}const los=yardToY(state.phase==='live'?state.playStart:state.ball);ctx.strokeStyle='#2da8ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(f.x,los);ctx.lineTo(f.x+f.w,los);ctx.stroke();const first=yardToY(Math.min(100,state.seriesStart+10));ctx.strokeStyle='#ffd23f';ctx.beginPath();ctx.moveTo(f.x,first);ctx.lineTo(f.x+f.w,first);ctx.stroke()}
function drawPlayers(){for(const d of defenders){ctx.save();ctx.translate(d.x,d.y);ctx.fillStyle='#d94a4a';ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-9,-3,18,6);ctx.restore()}ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#f4d35e';ctx.beginPath();ctx.arc(0,0,player.r+2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171717';ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(4,-1,11,6,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(1,-4);ctx.lineTo(7,2);ctx.stroke();ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);drawField();drawPlayers();if(state.phase==='ready'){ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(0,0,W,H)}if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*3})`;ctx.fillRect(0,0,W,H)}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}
function stickCenter(){const r=base.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,rad:r.width/2}}function setStick(x,y){const c=stickCenter(),dx=x-c.x,dy=y-c.y,dist=Math.hypot(dx,dy)||1,max=c.rad*.72,mag=Math.min(1,dist/max);input.x=dx/dist*mag;input.y=dy/dist*mag;knob.style.transform=`translate(${input.x*36}px,${input.y*36}px)`}function release(id){if(input.pointer!==id)return;input.pointer=null;input.active=false;input.x=input.y=0;knob.style.transform='translate(0,0)'}
canvas.addEventListener('pointerdown',e=>{const c=stickCenter();if(Math.hypot(e.clientX-c.x,e.clientY-c.y)<c.rad*1.55){input.pointer=e.pointerId;input.active=true;canvas.setPointerCapture?.(e.pointerId);setStick(e.clientX,e.clientY)}});canvas.addEventListener('pointermove',e=>{if(input.pointer===e.pointerId)setStick(e.clientX,e.clientY)});canvas.addEventListener('pointerup',e=>release(e.pointerId));canvas.addEventListener('pointercancel',e=>release(e.pointerId));for(const ev of ['contextmenu','dragstart','selectstart'])document.addEventListener(ev,e=>{if(!e.target.closest('button'))e.preventDefault()});const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();startPlay()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));setInterval(()=>{if(input.active)return;let x=0,y=0;if(keys.has('arrowleft')||keys.has('a'))x--;if(keys.has('arrowright')||keys.has('d'))x++;if(keys.has('arrowup')||keys.has('w'))y--;if(keys.has('arrowdown')||keys.has('s'))y++;const m=Math.hypot(x,y)||1;input.x=x/m;input.y=y/m},16);snapBtn.addEventListener('pointerdown',e=>{e.preventDefault();startPlay()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='live'){input.x=input.y=0;endPlay('tackle')}});resize();hud();requestAnimationFrame(loop)})();
</script></body></html>
