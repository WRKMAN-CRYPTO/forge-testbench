<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b0c"><title>PETRI DISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0c;color:#dfe8df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;letter-spacing:2px;opacity:.8}.title{font-weight:800}.hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:10px;letter-spacing:2px;opacity:.55;pointer-events:none;transition:opacity 1s}.legend{position:fixed;right:15px;top:max(42px,calc(env(safe-area-inset-top) + 42px));font-size:9px;line-height:1.8;opacity:.5;pointer-events:none}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}</style></head><body><canvas id="c"></canvas><div class="hud"><span class="title">PETRI DISH</span><span id="clock">DAY 1</span></div><div class="legend"><div><i class="dot" style="background:#9cff79"></i>GRAZER</div><div><i class="dot" style="background:#ff6f68"></i>HUNTER</div><div><i class="dot" style="background:#e6d77b"></i>SEED</div></div><div class="hint" id="hint">TOUCH THE WORLD · HOLD TO FEED</div><script>(()=>{'use strict';const C=document.getElementById('c'),X=C.getContext('2d'),hint=document.getElementById('hint'),clock=document.getElementById('clock');let W,H,D=Math.min(devicePixelRatio||1,2),t=0,last=performance.now(),touch=null,first=true;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const seeds=[],bugs=[];function seed(x=rand(20,W-20),y=rand(60,H-30),e=rand(35,70)){seeds.push({x,y,e,r:rand(2.2,4.2),age:0})}for(let i=0;i<45;i++)seed();function bug(type,x=rand(30,W-30),y=rand(80,H-50)){let a=rand(0,Math.PI*2);bugs.push({type,x,y,vx:Math.cos(a),vy:Math.sin(a),energy:type==='g'?rand(55,90):rand(70,110),age:0,fear:0,turn:rand(-1,1),cool:rand(0,4),flash:0})}for(let i=0;i<13;i++)bug('g');for(let i=0;i<3;i++)bug('h');function nearest(o,list,range,pred=()=>true){let best=null,bd=range;for(const q of list){if(q===o||!pred(q))continue;let d=dist(o,q);if(d<bd){bd=d;best=q}}return best}function norm(x,y){let m=Math.hypot(x,y)||1;return[x/m,y/m]}function update(dt){t+=dt;clock.textContent='DAY '+(1+Math.floor(t/18));if(Math.random()<dt*.42&&seeds.length<90)seed();if(touch&&touch.down&&Math.random()<dt*7&&seeds.length<110)seed(touch.x+rand(-18,18),touch.y+rand(-18,18),rand(22,42));for(const s of seeds){s.age+=dt;s.e=Math.min(80,s.e+dt*.35)}for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];b.age+=dt;b.cool-=dt;b.flash=Math.max(0,b.flash-dt);b.energy-=dt*(b.type==='g'?1.7:2.2);let ax=0,ay=0;if(touch){let dx=b.x-touch.x,dy=b.y-touch.y,d=Math.hypot(dx,dy);if(d<85){let k=(1-d/85)*(touch.down?2.8:1.2);ax+=dx/(d||1)*k;ay+=dy/(d||1)*k;b.fear=Math.min(1,b.fear+dt*3)}}b.fear=Math.max(0,b.fear-dt*.6);if(b.type==='g'){let hunter=nearest(b,bugs,95,q=>q.type==='h');if(hunter){let dx=b.x-hunter.x,dy=b.y-hunter.y,[nx,ny]=norm(dx,dy);ax+=nx*3.5;ay+=ny*3.5;b.fear=1}else{let food=nearest(b,seeds,150);if(food){let[nx,ny]=norm(food.x-b.x,food.y-b.y);ax+=nx*1.5;ay+=ny*1.5}}let mate=nearest(b,bugs,55,q=>q.type==='g'&&q.energy>70&&q.cool<=0);if(mate&&b.energy>75&&b.cool<=0&&bugs.length<48){b.energy-=24;mate.energy-=14;b.cool=mate.cool=8;bug('g',(b.x+mate.x)/2+rand(-4,4),(b.y+mate.y)/2+rand(-4,4));bugs[bugs.length-1].energy=45}}else{let prey=nearest(b,bugs,210,q=>q.type==='g');if(prey){let[nx,ny]=norm(prey.x-b.x,prey.y-b.y);ax+=nx*1.9;ay+=ny*1.9}else{b.turn+=rand(-.4,.4)*dt;ax+=Math.cos(b.turn)*.3;ay+=Math.sin(b.turn)*.3}if(b.energy>125&&b.cool<=0&&bugs.length<48){b.energy-=45;b.cool=12;bug('h',b.x+rand(-8,8),b.y+rand(-8,8));bugs[bugs.length-1].energy=55}}ax+=rand(-.3,.3);ay+=rand(-.3,.3);b.vx+=ax*dt*5;b.vy+=ay*dt*5;let sp=Math.hypot(b.vx,b.vy),max=b.type==='g'?(b.fear>.2?74:45):58;if(sp>max){b.vx=b.vx/sp*max;b.vy=b.vy/sp*max}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.88,dt*10);b.vy*=Math.pow(.88,dt*10);if(b.x<8){b.x=8;b.vx=Math.abs(b.vx)}if(b.x>W-8){b.x=W-8;b.vx=-Math.abs(b.vx)}if(b.y<48){b.y=48;b.vy=Math.abs(b.vy)}if(b.y>H-12){b.y=H-12;b.vy=-Math.abs(b.vy)}if(b.type==='g'){for(let j=seeds.length-1;j>=0;j--){if(dist(b,seeds[j])<9){b.energy+=seeds[j].e*.42;seeds.splice(j,1);b.flash=.12;break}}}else{let p=nearest(b,bugs,9,q=>q.type==='g');if(p){let pi=bugs.indexOf(p);if(pi>=0){b.energy+=34;bugs.splice(pi,1);if(pi<i)i--;b.flash=.18}}}if(b.energy<=0||b.age>(b.type==='g'?rand(70,110):rand(90,130))){bugs.splice(i,1)}}if(!bugs.some(b=>b.type==='g')&&Math.random()<dt*.7)bug('g');if(!bugs.some(b=>b.type==='h')&&bugs.filter(b=>b.type==='g').length>5&&Math.random()<dt*.15)bug('h')}function drawBug(b){X.save();X.translate(b.x,b.y);let a=Math.atan2(b.vy,b.vx);X.rotate(a);if(b.type==='g'){X.fillStyle=b.flash?'#fff':'#9cff79';X.fillRect(-4,-3,7,6);X.fillRect(3,-2,3,4);X.fillStyle='#08100a';X.fillRect(4,-1,1,1);X.strokeStyle='#9cff79';X.lineWidth=1;for(let k=-1;k<=1;k+=2){X.beginPath();X.moveTo(-1,k*3);X.lineTo(-4,k*6);X.stroke()}}else{X.fillStyle=b.flash?'#fff':'#ff6f68';X.beginPath();X.moveTo(7,0);X.lineTo(-5,-5);X.lineTo(-3,0);X.lineTo(-5,5);X.closePath();X.fill();X.fillStyle='#130707';X.fillRect(1,-2,1,1)}X.restore()}function draw(){X.fillStyle='rgba(8,11,12,.34)';X.fillRect(0,0,W,H);X.strokeStyle='rgba(150,190,170,.055)';X.lineWidth=1;for(let y=48;y<H;y+=44){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}for(const s of seeds){X.globalAlpha=.35+.55*s.e/80;X.fillStyle='#e6d77b';X.beginPath();X.arc(s.x,s.y,s.r,0,7);X.fill()}X.globalAlpha=1;for(const b of bugs)drawBug(b);if(touch){X.strokeStyle=touch.down?'rgba(255,255,255,.18)':'rgba(255,255,255,.08)';X.lineWidth=1;X.beginPath();X.arc(touch.x,touch.y,touch.down?28:18,0,7);X.stroke()}X.fillStyle='rgba(220,235,225,.38)';X.font='9px ui-monospace,monospace';X.fillText('POP '+bugs.length+'  FOOD '+seeds.length,16,H-18)}function pointer(e,down){let p=e.touches?e.touches[0]:e;touch={x:p.clientX,y:p.clientY,down};if(first){first=false;hint.style.opacity=0}}C.addEventListener('pointerdown',e=>pointer(e,true));C.addEventListener('pointermove',e=>{if(touch)pointer(e,touch.down)});addEventListener('pointerup',()=>{if(touch)touch.down=false});function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
