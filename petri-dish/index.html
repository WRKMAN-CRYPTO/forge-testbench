<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b0c"><title>PETRI DISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0c;color:#dfe8df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;letter-spacing:2px;opacity:.84}.title{font-weight:800}.hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:10px;letter-spacing:2px;opacity:.58;pointer-events:none;transition:opacity 1s}.legend{position:fixed;right:15px;top:max(42px,calc(env(safe-area-inset-top) + 42px));font-size:9px;line-height:1.8;opacity:.5;pointer-events:none}.stats{position:fixed;left:14px;top:max(44px,calc(env(safe-area-inset-top) + 44px));font-size:8px;line-height:1.65;opacity:.48;pointer-events:none;white-space:pre}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}</style></head><body><canvas id="c"></canvas><div class="hud"><span class="title">PETRI DISH · HEREDITY</span><span id="clock">DAY 1</span></div><div class="stats" id="stats"></div><div class="legend"><div><i class="dot" style="background:#9cff79"></i>GRAZER</div><div><i class="dot" style="background:#ff6f68"></i>HUNTER</div><div><i class="dot" style="background:#e6d77b"></i>SEED</div></div><div class="hint" id="hint">TOUCH = DISTURB · HOLD = FEED</div><script>(()=>{'use strict';const C=document.getElementById('c'),X=C.getContext('2d'),hint=document.getElementById('hint'),clock=document.getElementById('clock'),stats=document.getElementById('stats');let W,H,D=Math.min(devicePixelRatio||1,2),t=0,last=performance.now(),touch=null,first=true,statClock=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const seeds=[],bugs=[];function seed(x=rand(20,W-20),y=rand(60,H-30),e=rand(35,70)){seeds.push({x,y,e,r:rand(2.2,4.2),age:0})}for(let i=0;i<52;i++)seed();const baseG={speed:66,sight:125,food:1.8,fear:2.9,met:1.5,fert:1,agility:1};const baseH={speed:61,sight:190,food:1.75,fear:0,met:2.05,fert:1,agility:.9};function mutate(v,scale=.09){return v*(1+rand(-scale,scale))}function childGenes(a,b,type){const src={};for(const k in a)src[k]=mutate((a[k]+b[k])/2,k==='speed'||k==='sight'? .07:.11);src.speed=clamp(src.speed,type==='g'?42:45,type==='g'?92:88);src.sight=clamp(src.sight,55,260);src.food=clamp(src.food,.55,3.8);src.fear=clamp(src.fear,.5,5);src.met=clamp(src.met,.75,3.7);src.fert=clamp(src.fert,.55,1.7);src.agility=clamp(src.agility,.45,1.6);return src}function bug(type,x=rand(30,W-30),y=rand(80,H-50),genes=null,gen=0){let a=rand(0,Math.PI*2),g=genes||Object.fromEntries(Object.entries(type==='g'?baseG:baseH).map(([k,v])=>[k,mutate(v,.08)]));bugs.push({type,x,y,vx:Math.cos(a),vy:Math.sin(a),energy:type==='g'?rand(62,90):rand(76,108),age:0,fear:0,turn:rand(-1,1),cool:rand(1,5),flash:0,g,gen})}for(let i=0;i<16;i++)bug('g');for(let i=0;i<4;i++)bug('h');function nearest(o,list,range,pred=()=>true){let best=null,bd=range;for(const q of list){if(q===o||!pred(q))continue;let d=dist(o,q);if(d<bd){bd=d;best=q}}return best}function norm(x,y){let m=Math.hypot(x,y)||1;return[x/m,y/m]}function breed(a,b,type){if(bugs.length>=65)return;a.energy-=type==='g'?23:38;b.energy-=type==='g'?14:22;a.cool=b.cool=(type==='g'?7.5:12)/((a.g.fert+b.g.fert)/2);const g=childGenes(a.g,b.g,type);bug(type,(a.x+b.x)/2+rand(-5,5),(a.y+b.y)/2+rand(-5,5),g,Math.max(a.gen,b.gen)+1);bugs[bugs.length-1].energy=type==='g'?46:60}function update(dt){t+=dt;statClock-=dt;clock.textContent='DAY '+(1+Math.floor(t/18));if(Math.random()<dt*.46&&seeds.length<105)seed();if(touch&&touch.down&&Math.random()<dt*8&&seeds.length<125)seed(touch.x+rand(-20,20),touch.y+rand(-20,20),rand(25,45));for(const s of seeds){s.age+=dt;s.e=Math.min(82,s.e+dt*.38)}for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(!b)continue;b.age+=dt;b.cool-=dt;b.flash=Math.max(0,b.flash-dt);b.energy-=dt*b.g.met;let ax=0,ay=0;if(touch){let dx=b.x-touch.x,dy=b.y-touch.y,d=Math.hypot(dx,dy);if(d<95){let k=(1-d/95)*(touch.down?3.1:1.25);ax+=dx/(d||1)*k;ay+=dy/(d||1)*k;b.fear=Math.min(1,b.fear+dt*3)}}b.fear=Math.max(0,b.fear-dt*.7);if(b.type==='g'){let hunter=nearest(b,bugs,b.g.sight,q=>q.type==='h');let food=nearest(b,seeds,b.g.sight*1.15);const hunger=clamp((66-b.energy)/44,0,1.6);if(hunter){let dx=b.x-hunter.x,dy=b.y-hunter.y,[nx,ny]=norm(dx,dy);ax+=nx*b.g.fear*(1.05-.38*hunger);ay+=ny*b.g.fear*(1.05-.38*hunger);b.fear=1}if(food){let[nx,ny]=norm(food.x-b.x,food.y-b.y);const urge=b.g.food*(.45+hunger*1.55);ax+=nx*urge;ay+=ny*urge}let mate=nearest(b,bugs,60,q=>q.type==='g'&&q.energy>72&&q.cool<=0);if(mate&&b.energy>78&&b.cool<=0)breed(b,mate,'g')}else{let prey=nearest(b,bugs,b.g.sight,q=>q.type==='g');const hunger=clamp((85-b.energy)/65,.3,1.7);if(prey){let[nx,ny]=norm(prey.x-b.x,prey.y-b.y);ax+=nx*b.g.food*hunger;ay+=ny*b.g.food*hunger}else{b.turn+=rand(-.55,.55)*dt;ax+=Math.cos(b.turn)*.45;ay+=Math.sin(b.turn)*.45}let mate=nearest(b,bugs,55,q=>q.type==='h'&&q.energy>112&&q.cool<=0);if(mate&&b.energy>118&&b.cool<=0)breed(b,mate,'h')}ax+=rand(-.25,.25);ay+=rand(-.25,.25);b.vx+=ax*dt*5.3*b.g.agility;b.vy+=ay*dt*5.3*b.g.agility;let sp=Math.hypot(b.vx,b.vy),max=b.g.speed*(b.type==='g'&&b.fear>.15?1.12:1);if(sp>max){b.vx=b.vx/sp*max;b.vy=b.vy/sp*max}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.875,dt*10);b.vy*=Math.pow(.875,dt*10);if(b.x<8){b.x=8;b.vx=Math.abs(b.vx)}if(b.x>W-8){b.x=W-8;b.vx=-Math.abs(b.vx)}if(b.y<48){b.y=48;b.vy=Math.abs(b.vy)}if(b.y>H-12){b.y=H-12;b.vy=-Math.abs(b.vy)}if(b.type==='g'){for(let j=seeds.length-1;j>=0;j--){if(dist(b,seeds[j])<9){b.energy+=seeds[j].e*.48;seeds.splice(j,1);b.flash=.12;break}}}else{let p=nearest(b,bugs,8.5,q=>q.type==='g');if(p){let pi=bugs.indexOf(p);if(pi>=0){b.energy+=44;bugs.splice(pi,1);if(pi<i)i--;b.flash=.18}}}const life=(b.type==='g'?85:105)*(1.15-.13*b.g.met);if(b.energy<=0||b.age>life){bugs.splice(i,1)}}const gc=bugs.filter(b=>b.type==='g').length,hc=bugs.filter(b=>b.type==='h').length;if(gc===0&&Math.random()<dt*.28)bug('g',rand(30,W-30),rand(80,H-50),null,0);if(hc===0&&gc>6&&Math.random()<dt*.09)bug('h',rand(30,W-30),rand(80,H-50),null,0);if(statClock<=0){statClock=.7;renderStats()}}function avg(arr,k){return arr.length?arr.reduce((s,b)=>s+b.g[k],0)/arr.length:0}function renderStats(){const g=bugs.filter(b=>b.type==='g'),h=bugs.filter(b=>b.type==='h'),gg=g.length?Math.max(...g.map(b=>b.gen)):0,hg=h.length?Math.max(...h.map(b=>b.gen)):0;stats.textContent=`G ${g.length}  GEN ${gg}\nSPD ${avg(g,'speed').toFixed(0)}  FOOD ${avg(g,'food').toFixed(2)}\nFEAR ${avg(g,'fear').toFixed(2)}  MET ${avg(g,'met').toFixed(2)}\n\nH ${h.length}  GEN ${hg}\nSPD ${avg(h,'speed').toFixed(0)}  HUNT ${avg(h,'food').toFixed(2)}\nSIGHT ${avg(h,'sight').toFixed(0)}  MET ${avg(h,'met').toFixed(2)}`}function drawBug(b){X.save();X.translate(b.x,b.y);let a=Math.atan2(b.vy,b.vx);X.rotate(a);const drift=(b.g.speed-(b.type==='g'?baseG.speed:baseH.speed))/(b.type==='g'?45:43);if(b.type==='g'){let l=clamp(78+drift*25,58,92);X.fillStyle=b.flash?'#fff':`hsl(103 92% ${l}%)`;X.fillRect(-4,-3,7,6);X.fillRect(3,-2,3,4);X.fillStyle='#08100a';X.fillRect(4,-1,1,1);X.strokeStyle='#9cff79';X.lineWidth=1;for(let k=-1;k<=1;k+=2){X.beginPath();X.moveTo(-1,k*3);X.lineTo(-4,k*(5+b.g.fear*.35));X.stroke()}}else{let l=clamp(63+drift*22,48,78);X.fillStyle=b.flash?'#fff':`hsl(2 100% ${l}%)`;X.beginPath();X.moveTo(7,0);X.lineTo(-5,-5);X.lineTo(-3,0);X.lineTo(-5,5);X.closePath();X.fill();X.fillStyle='#130707';X.fillRect(1,-2,1,1)}X.restore()}function draw(){X.fillStyle='rgba(8,11,12,.37)';X.fillRect(0,0,W,H);X.strokeStyle='rgba(150,190,170,.05)';X.lineWidth=1;for(let y=48;y<H;y+=44){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}for(const s of seeds){X.globalAlpha=.35+.55*s.e/82;X.fillStyle='#e6d77b';X.beginPath();X.arc(s.x,s.y,s.r,0,7);X.fill()}X.globalAlpha=1;for(const b of bugs)drawBug(b);if(touch){X.strokeStyle=touch.down?'rgba(255,255,255,.2)':'rgba(255,255,255,.07)';X.lineWidth=1;X.beginPath();X.arc(touch.x,touch.y,touch.down?30:18,0,7);X.stroke()}X.fillStyle='rgba(220,235,225,.35)';X.font='9px ui-monospace,monospace';X.fillText('POP '+bugs.length+'  FOOD '+seeds.length,16,H-18)}function pointer(e,down){touch={x:e.clientX,y:e.clientY,down};if(first){first=false;hint.style.opacity=0}}C.addEventListener('pointerdown',e=>pointer(e,true));C.addEventListener('pointermove',e=>{if(touch)pointer(e,touch.down)});addEventListener('pointerup',()=>{if(touch)touch.down=false});function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}renderStats();requestAnimationFrame(loop)})();</script></body></html>
