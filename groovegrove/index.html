// A persistent, single-record world memory. IndexedDB preferred, localStorage fallback.
const STORAGE_KEY='groovegrove.pass001.memory';
let database=null,lastMemoryStamp=0;
async function openMemory(){
  if(!('indexedDB' in window))return;
  try{
    database=await new Promise((resolve,reject)=>{
      const req=indexedDB.open('GrooveGroveMemory',1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('world'))req.result.createObjectStore('world');};
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
  }catch(e){database=null;}
}
// Phone calls can interrupt an IndexedDB write. Prefer whichever complete
// checkpoint has the newest timestamp, including our synchronous local fallback.
async function loadMemory(){
  let local=null,idb=null;
  try{local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){}
  if(database){
    try{idb=await new Promise((resolve,reject)=>{
      const tx=database.transaction('world','readonly');const req=tx.objectStore('world').get('pass001');
      req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error);
    });}catch(e){}
  }
  const age=value=>Number.isFinite(value?.savedAt)?value.savedAt:0;
  const saved=local && (!idb || age(local)>age(idb))?local:idb||local;
  lastMemoryStamp=Math.max(age(local),age(idb));
  return saved;
}
function saveMemory(value){
  const snap=JSON.parse(JSON.stringify(value));
  // Monotonic even when several actions happen within the same millisecond.
  snap.savedAt=lastMemoryStamp=Math.max(Date.now(),lastMemoryStamp+1);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(snap));}catch(e){}
  if(database){try{database.transaction('world','readwrite').objectStore('world').put(snap,'pass001');}catch(e){}}
}

class SoundEngine {
  constructor(){this.context=null;this.master=null;this.noise=null;this.timer=null;this.beat=0;this.nextTime=0;}
  makeContext(){
    // Never reset the musical beat when rebuilding the AUDIO graph.
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    const old=this.context;
    this.context=null;
    // Closing can hang in WebKit after a phone call. Do not await it.
    if(old && old.state!=='closed'){try{Promise.resolve(old.close()).catch(()=>{});}catch(e){}}
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)throw new Error('Web Audio is not supported on this device.');
    const ctx=new Ctx();
    this.context=ctx;
    this.master=ctx.createGain();this.master.gain.value=0.58;
    const limiter=ctx.createDynamicsCompressor();
    limiter.threshold.value=-12;limiter.knee.value=15;limiter.ratio.value=3.5;
    this.master.connect(limiter);limiter.connect(ctx.destination);
    const len=Math.round(ctx.sampleRate*.3);
    this.noise=ctx.createBuffer(1,len,ctx.sampleRate);
    const data=this.noise.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  }
  async start(onBeat,{fresh=false,chime=false,passive=false}={}){
    this.onBeat=onBeat;
    // WebKit may fall back to its ringer/ambient channel after an iOS call,
    // silently muting a perfectly "running" AudioContext. Use media playback.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(fresh || !this.context || this.context.state==='closed')this.makeContext();
    const ctx=this.context;
    // Called directly from the pointerdown handler; don't defer resume()
    // past the user-activation window on iOS.
    if(ctx.state!=='running'){
      const attempt=ctx.resume();
      const resumed=await Promise.race([
        Promise.resolve(attempt).then(()=>true),
        new Promise(resolve=>setTimeout(()=>resolve(false),1600))
      ]);
      if(!resumed && ctx.state!=='running')throw new Error('Audio is blocked by iOS. Tap AUDIO again.');
    }
    if(ctx!==this.context)return;
    if(ctx.state!=='running')throw new Error('Audio is '+ctx.state+'. Tap AUDIO to reconnect.');
    if(passive && this.timer){clearInterval(this.timer);this.timer=null;}
    if(!passive && !this.timer){
      this.nextTime=ctx.currentTime+.12;
      this.timer=setInterval(()=>this.schedule(),23);
      this.schedule();
    }
    // An audible soft confirmation note when the player explicitly repairs audio.
    if(chime)this.tone(587.33,ctx.currentTime+.035,.17,.065,'sine',0);
  }
  schedule(){
    const ctx=this.context;
    if(!ctx || ctx.state!=='running')return;
    // Skip old beats before scheduling after iOS audio interruptions.
    if(this.nextTime<ctx.currentTime-.15)this.nextTime=ctx.currentTime+.08;
    let steps=0;
    while(this.nextTime<ctx.currentTime+.18 && steps++<32){
      this.onBeat(this.beat,this.nextTime);
      this.beat++;this.nextTime+=beatDur;
    }
  }
  tone(freq,time,duration,level,shape='triangle',pan=0){
    const ctx=this.context;if(!ctx)return;
    const t=Math.max(ctx.currentTime+.002,time);
    const osc=ctx.createOscillator(),gain=ctx.createGain(),low=ctx.createBiquadFilter();
    osc.type=shape;osc.frequency.setValueAtTime(freq,t);
    low.type='lowpass';low.frequency.setValueAtTime(shape==='sine'?4000:2400,t);
    low.frequency.exponentialRampToValueAtTime(500,t+duration);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),t+.009);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(low);low.connect(gain);
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;gain.connect(p);p.connect(this.master);}else gain.connect(this.master);
    osc.start(t);osc.stop(t+duration+.02);
  }
  noiseHit(time,duration,level,highpass=1200,pan=-.25){
    const ctx=this.context,src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),env=ctx.createGain();
    const t=Math.max(ctx.currentTime+.002,time);
    src.buffer=this.noise;filter.type='highpass';filter.frequency.value=highpass;
    env.gain.setValueAtTime(Math.max(.001,level),t);

  kick(t,volume=1){
    const ctx=this.context,osc=ctx.createOscillator(),gain=ctx.createGain();

  }

  hat(t,volume=1){this.noiseHit(t,.045,.055*volume,5400,-.25);}
  guitar(freq,t,volume=1,duration=.34){
    this.tone(freq,t,duration,.12*volume,'triangle',.34);
    this.tone(freq*2,t+.003,Math.min(duration,.24),.025*volume,'sine',.35);
  }
}

// One authority for both the WebGL drawing buffer and GrooveGrove's scene layout.
// On iOS a rotation can update visualViewport and window sizes on different frames.
let viewportWidth=0,viewportHeight=0,resizeFrame=0,settleTimer=0;
function measuredViewport(){
  const visual=window.visualViewport;
  return {
    width:Math.max(1,Math.round(visual?.width || window.innerWidth || document.documentElement.clientWidth || 1)),
    height:Math.max(1,Math.round(visual?.height || window.innerHeight || document.documentElement.clientHeight || 1))
  };
}
function applyViewportSize(force=false){
  const {width,height}=measuredViewport();
  if(!force && width===viewportWidth && height===viewportHeight)return;
  viewportWidth=width;viewportHeight=height;
  // Resize renderer FIRST, then rebuild all positions from app.screen.
  app.renderer.resize(width,height);
  app.canvas.style.width=width+'px';
  app.canvas.style.height=height+'px';
  buildCanvas();
}
function scheduleViewportSize(){
  cancelAnimationFrame(resizeFrame);
  // Two frames allow Safari's viewport geometry to settle after rotation.
  resizeFrame=requestAnimationFrame(()=>{resizeFrame=requestAnimationFrame(()=>applyViewportSize());});
  clearTimeout(settleTimer);
  settleTimer=setTimeout(()=>applyViewportSize(),330);
}

function moveReaders(){
  if(!grove || !ui.homePositions || !ui.readPads)return;
  const smoothing=Math.min(1,app.ticker.deltaMS/16.667*.065);
  for(const name of ['Pip','Riff']){
    const task=grove.library.status(name);
    const home=ui.homePositions[name];
    const position=task && task.stage!=='returning'?ui.readPads[name]:home;
    const avatar=name==='Pip'?ui.pip:ui.riff;
    if(!avatar?.group)continue;
    const displayed=name==='Pip'?ui.pipPos:ui.riffPos;
    displayed.x+=(position.x-displayed.x)*smoothing;
    displayed.y+=(position.y-displayed.y)*smoothing;
    avatar.group.position.set(displayed.x,displayed.y);
  }
}

function refreshText(){

    ui.inspect.text=who.name.toUpperCase()+' · '+who.currentGoal+(grove.library.known[who.name].length?' · '+grove.library.known[who.name].length+' book skills':'')+'  |  tap either musician';
  }else ui.inspect.text='Tap a musician to follow their decisions';
  ui.badgeText.text=(remoteLive && returnReport && Date.now()<returnReportUntil)?('+'+returnReport.bars+' BARS WHILE AWAY'):!started?(grove?.library.anyBusy()?'TAP TO CONTINUE READING':'TAP ANYWHERE TO START'):(soundNeedsRefresh || (sound.context && sound.context.state!=='running'))?'TAP TO RECONNECT AUDIO':grove?.library.anyBusy()?'STUDYING  ·  LISTENING':mode==='lesson'?'LISTENING  ·  LEARNING':mode==='jam'?'PLAYING TOGETHER':'INDEPENDENT PRACTICE';

  if(ui.audioWidget)ui.audioWidget.visible=!deliveryOpen && !journalOpen;
  if(ui.shelfCounter)ui.shelfCounter.text='LIBRARY  '+grove.library.books.length+' / 6';
  if(ui.deliveryTray)ui.deliveryTray.visible=deliveryOpen && !journalOpen;
  if(ui.journalOverlay)ui.journalOverlay.visible=journalOpen;
  if(ui.journalHeading && grove){
    const report=grove.understanding.report(journalName);
    ui.journalHeading.text=journalName.toUpperCase()+" · PERSONAL NOTES";
    ui.journalInfo.text=report.observations+" lifetime observed bars  ·  "+report.experiments+" total experiments";
    ui.journalTexture.text="Partner's last texture: "+report.partnerTexture+"  ·  Last measured overlap: "+(report.latest?Math.round(report.latest.overlap*100)+"%":"collecting");
    ui.journalRows.forEach((field,i)=>{

  if(ui.shelfStatus)ui.shelfStatus.text=reading.join(' · ')||(grove.library.books.length?'Tap shelf to deliver books':'Empty shelves · tap to deliver books');
}
function renderMeter(){
  if(!ui.meter)return;
  const g=ui.meter;g.clear();
  const x=ui.panelX+19,y=ui.panelY+(landscape?124:145);
  const width=landscape?ui.panelW*.42:ui.panelW-40;
  line(g,x,y,x+width,y,0x7b9b8a,1,.55);
  const ticks=[-100,-50,0,50,100];
  ticks.forEach(ms=>{
    const tx=x+(ms+100)/200*width;
    line(g,tx,y-6,tx,y+7,ms===0?PALETTE.gold:0x628780,ms===0?2:1,.6);
  });
  const errors=(grove?.relativeErrors||[]).slice(-14);
  errors.forEach((value,i)=>{
    const tx=x+(clamp(value,-100,100)+100)/200*width;
    circle(g,tx,y-15-(i%3)*5,3.3,PALETTE.mint,.2+i/errors.length*.77);
  });
}

function emitVisualNote(e){
  const p=e.agent==='Pip'?ui.pipPos:e.agent==='Riff'?ui.riffPos:ui.vocalPos;
  if(!p)return;
  const tone=e.agent==='Pip'?PALETTE.mint:e.agent==='Riff'?PALETTE.lilac:0xf5cf9c;
  floatingNotes.push({x:p.x+rand(-20,18),y:p.y-110+(landscape?0:25),vx:rand(-.38,.38),born:performance.now(),color:tone,size:rand(6,10)});
  if(floatingNotes.length>24)floatingNotes.shift();
  noteFlash[e.agent]=performance.now();
}
function showSpeech(from,message){
  talkBubble={from,message,born:performance.now()};
}
function renderEffects(time){
  if(!ui.fx)return;
  const fx=ui.fx;fx.clear();
  const pulse=(grove?.beat||0);
  const elapsed=(time-(noteFlash.Pip||0))/1000;
  const elapsedR=(time-(noteFlash.Riff||0))/1000;
  [ ['Pip',elapsed,PALETTE.mint],['Riff',elapsedR,PALETTE.lilac] ].forEach(([name,dt,color])=>{
    if(dt<.38 && dt>=0){
      const p=name==='Pip'?ui.pipPos:ui.riffPos;
      fx.circle(p.x,p.y+54,38+dt*170).stroke({color,width:3,alpha:(1-dt/.38)*.45});
    }
  });
  floatingNotes=floatingNotes.filter(n=>time-n.born<1200);
  floatingNotes.forEach(n=>{
    const age=(time-n.born)/1000;
    const x=n.x+n.vx*age*36,y=n.y-age*45;
    const fade=(1-age/1.2);
    circle(fx,x,y,n.size*.47,n.color,fade*.83);
    line(fx,x+n.size*.3,y-7,x+n.size*.3,y,n.color,2,fade);
  });
  moveReaders();
  renderPhysicalBooks();
  for(const a of ambient){
    const t=time/1000*a.speed+a.phase;
    a.sprite.position.set(a.x+Math.cos(t)*9,a.y+Math.sin(t*.77)*13);
    a.sprite.alpha=.12+.45*(Math.sin(t*1.8)**2);
  }
  // Simple real-time drumstick motion and guitar strum animation.
  const motionP=clamp(1-elapsedP(elapsed)/.24,0,1),motionR=clamp(1-elapsedP(elapsedR)/.3,0,1);
  if(ui.pip?.sticks){
    const d=ui.pip.sticks;d.clear();
    line(d,-67,13,-28+(motionP*8),65-motionP*38,0xf9d28e,5);
    line(d,68,12,22-(motionP*8),64-motionP*40,0xf9d28e,5);
    circle(d,-67,13,6,PALETTE.mint);circle(d,68,12,6,PALETTE.mint);
    ui.pip.group.y=ui.pipPos.y+Math.sin(time/380)*1.5;
  }
  if(ui.riff?.arm){
    const a=ui.riff.arm;a.clear();
    line(a,-35,11,20,35+motionR*19,0xa68dcd,15);
    circle(a,20,35+motionR*19,8,0xe0c7e0);
    ui.riff.group.y=ui.riffPos.y+Math.sin(time/470+2)*2;
  }
  ui.bubbleLayer.visible=!!(talkBubble && time-talkBubble.born<4300);
  if(ui.bubbleLayer.visible){
    const age=(time-talkBubble.born)/1000;
    const pos=talkBubble.from==='Pip'?ui.pipPos:ui.riffPos;
    const boxW=landscape?230:182;
    const boxY=pos.y-(landscape?195:151);
    const x=clamp(pos.x-boxW/2,12,W-boxW-12);
    if(ui.lastBubble!==talkBubble){
      const b=ui.bubbleShape;b.clear();
      rect(b,x,boxY,boxW,landscape?74:78,13,0x082527,.93);
      b.roundRect(x,boxY,boxW,landscape?74:78,13).stroke({color:talkBubble.from==='Pip'?PALETTE.mint:PALETTE.lilac,width:1,alpha:.5});
      const text=ui.bubbleText;text.text=talkBubble.message;text.position.set(x+11,boxY+11);
      text.style.wordWrap=true;text.style.wordWrapWidth=boxW-22;
      ui.lastBubble=talkBubble;
    }
    ui.bubbleLayer.alpha=Math.min(1,(4.3-age)*3);
  }
}
function elapsedP(x){return Math.max(0,x);}
// Remote is optional until a Railway service exists. No client secret is
// published in source; pairing lives in the URL fragment and local phone store.
let remoteLive=false,remoteOnline=false,remotePolling=false,remoteSequence=0;
const liveConductor=new LiveNoteConductor({delayMs:1900});
const pendingVisualNotes=[];
let lastRemoteWorldAt=0;
let remoteTimer=null,serverMessage='',serverKey='',returnReport=null,returnReportUntil=0,serverLastBeat=0;
const SERVER_KEY_STORE='groovegrove.private.server.key';
const serverBase=(GROVE_SERVER_URL||'').replace(/\/+$/,'');
function readPairingKey(){
  try{
    const params=new URLSearchParams(location.hash.replace(/^#/,''));
    const key=params.get('grove-key');
    if(key && /^[a-zA-Z0-9_-]{16,120}$/.test(key)){
      localStorage.setItem(SERVER_KEY_STORE,key);
      history.replaceState(null,'',location.pathname+location.search);
    }
    return localStorage.getItem(SERVER_KEY_STORE)||'';
  }catch(e){return '';}
}
async function serverRequest(path,{method='GET',body=null,privateAction=false}={}){
  const headers={};
  if(body)headers['Content-Type']='application/json';
  if(privateAction && serverKey)headers.Authorization='Bearer '+serverKey;
  const res=await fetch(serverBase+path,{
    method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store',
    signal:AbortSignal.timeout(8000)
  });
  const json=await res.json();
  if(!res.ok)throw Error(json.error||'Server HTTP '+res.status);
  return json;
}
function acceptRemoteWorld(snapshot){
  if(!snapshot)return;
  const updated=new Grove(snapshot,saveMemory);
  updated.onNote=emitVisualNote;updated.onTalk=showSpeech;
  grove=updated;
  // A local recovery copy survives temporary disconnection.
  saveMemory(snapshot);
  refreshText();
}
async function attachLivingServer(){
  if(!serverBase)return;
  serverKey=readPairingKey();
  try{
    let status=await serverRequest('/v1/state');
    if(!status.initialized && serverKey){
      // Browser profiles do not share localStorage. Never accidentally seed a
      // blank Grove from an in-app browser rather than the player's original.
      const known=(grove.library.known.Pip?.length||0)+(grove.library.known.Riff?.length||0);
      const heard=(grove.understanding.report('Pip').observations||0)+(grove.understanding.report('Riff').observations||0);
      if(!grove.library.books.length || (!known && !heard && !grove.familiarity)){
        serverMessage='PAIRING PAUSED · Open your private link in the SAME browser where Pip and Riff learned their books.';
        grove.push('Memory transfer needs the original browser with their library and journals.');
        refreshText();
        return;
      }
      // One-time transfer only. Actual books and music journals become the
      // server's authoritative world. No factory reset or replacement.
      await serverRequest('/v1/seed',{method:'POST',body:{world:grove.snapshot()},privateAction:true});
      status=await serverRequest('/v1/state');
    }
    if(!status.initialized){
      serverMessage='Waiting for private pairing key; offline Grove continues.';
      return;
    }
    // Compare the authoritative server clock with the phone's last local
    // checkpoint BEFORE replacing local Grove. Counts cannot be faked by UI.
    const priorBar=grove.bar||0;
    const priorPip=grove.understanding.report('Pip').observations||0;
    const priorRiff=grove.understanding.report('Riff').observations||0;
    const serverBar=status.world?.bar||0;
    if(serverBar>priorBar){
      returnReport={
        bars:serverBar-priorBar,
        pip:Math.max(0,(status.world.understanding?.totalBars?.Pip||0)-priorPip),
        riff:Math.max(0,(status.world.understanding?.totalBars?.Riff||0)-priorRiff)
      };
      returnReportUntil=Date.now()+120000;
    }
    remoteLive=true;remoteOnline=true;remoteSequence=status.seq;serverLastBeat=status.beat||0;
    acceptRemoteWorld(status.world);
    lastRemoteWorldAt=Date.now();
    grove.push('The grove now keeps playing when you close the page.');
    saveMemory(grove.snapshot());
    // Compact 450 ms note polls; detailed journals refresh every 5 seconds.
    remoteTimer=setInterval(pollLivingServer,450);
    await pollLivingServer();
  }catch(e){
    serverMessage='Server not ready · local Grove remains available';
    remoteOnline=false;
  }
}
function playLivingEvents(data,sentAtMs,receivedAtMs){
  if(!started || sound.context?.state!=='running')return;
  // One Web Audio clock determines all beat positions, independent of the
  // timing of HTTP responses. Never alter the musicians' scheduled notes.
  const playedKeys=new Set();
  liveConductor.receive(data,{
    context:sound.context,sentAtMs,receivedAtMs,
    play:(event,when)=>{
      const v=event.volume;
      if(event.kind==='guitar')sound.guitar(event.freq,when,v,Number(event.duration)||.3);
      else if(event.kind==='kick')sound.kick(when,v);
      else if(event.kind==='snare')sound.snare(when,v);
      else if(event.kind==='hat')sound.hat(when,v);
      else if(event.kind==='voice')sound.voice(event.freq,when,v,Number(event.duration)||.5);
    },
    onNote:(event,when)=>{
      const name=event.kind==='guitar'?'Riff':event.kind==='voice'?'Murmur':'Pip';
      const key=name+'/'+event.bar+'/'+event.beat;
      if(playedKeys.has(key))return;
      playedKeys.add(key);
      // Visible drum strikes and strums belong to the actual sound time.
      pendingVisualNotes.push({name,at:when,beat:event.beat});
      if(pendingVisualNotes.length>240)pendingVisualNotes.splice(0,pendingVisualNotes.length-240);
    }
  });
}
function flushLiveVisuals(){
  if(!remoteLive||!pendingVisualNotes.length)return;
  const ctx=sound.context;
  if(!ctx||ctx.state!=='running'){pendingVisualNotes.length=0;return;}
  const now=ctx.currentTime;
  for(let i=0;i<pendingVisualNotes.length;){
    const note=pendingVisualNotes[i];
    if(note.at>now+.04){i++;continue;}
    pendingVisualNotes.splice(i,1);
    if(note.at>=now-.18)emitVisualNote({agent:note.name,beat:note.beat});
  }
}
async function pollLivingServer(){
  if(!remoteLive||remotePolling)return;
  remotePolling=true;
  try{
    const wantWorld=Date.now()-lastRemoteWorldAt>5000;
    const sendAt=performance.now();
    const data=await serverRequest('/v1/poll?since='+remoteSequence+'&compact=1'+(wantWorld?'&world=1':''));
    const receivedAt=performance.now();
    if(Number.isFinite(data.seq) && data.seq<remoteSequence){
      // Railway restart: sequence numbers roll over to a fresh session.
      remoteSequence=0;
      liveConductor.reset();pendingVisualNotes.length=0;
      lastRemoteWorldAt=0;
    }
    remoteSequence=data.seq;
    serverLastBeat=data.beat||serverLastBeat;
    remoteOnline=true;serverMessage='';
    playLivingEvents(data,sendAt,receivedAt);
    if(data.world){
      lastRemoteWorldAt=Date.now();
      acceptRemoteWorld(data.world);
    }else refreshText();
  }catch(e){
    remoteOnline=false;serverMessage='Connection interrupted; the server keeps its own journal.';
    refreshText();
  }finally{remotePolling=false;}
}
async function deliverRemoteBook(type){
  try{
    if(!serverKey)throw Error('Open your private pairing link to donate books.');
    await serverRequest('/v1/donate',{method:'POST',body:{type},privateAction:true});
    lastRemoteWorldAt=0;
    await pollLivingServer();
  }catch(e){
    grove.push('Book delivery failed: '+e.message);
    refreshText();
  }
}
function onScheduledBeat(beat,time){
  grove.onBeatEvent(beat,time,sound);
  if(beat%4===0)refreshText();
}
async function startAudio(force=false){
  if(audioStartPending)return;
  if(started && !force && !soundNeedsRefresh && sound.context?.state==='running')return;
  audioStartPending=true;
  const first=!started;
  const repair=force || soundNeedsRefresh || (started && sound.context?.state==='closed');
  try{
    await sound.start(remoteLive?null:onScheduledBeat,{fresh:repair,chime:repair,passive:remoteLive});
    if(remoteLive){liveConductor.reset();pendingVisualNotes.length=0;}
    started=true;startError='';soundNeedsRefresh=false;
    if(repair)grove.push('The audio engine was reconnected without resetting the musicians.');
    else if(first)grove.push(grove.library.anyBusy()?'The music resumes. Interrupted reading continues.':'Pip and Riff begin playing. Neither has been told to form a band.');
  }catch(err){
    soundNeedsRefresh=true;
    startError='Sound needs attention: '+(err?.message||'tap ↻ AUDIO to retry');
  }finally{
    audioStartPending=false;refreshText();
  }
}
let pressTimer=null,pressStart=null;
app.canvas.addEventListener('pointerdown',(ev)=>{
  const bounds=app.canvas.getBoundingClientRect();
  const lx=(ev.clientX-bounds.left)/scale,ly=(ev.clientY-bounds.top)/scale;
  // Modal layers own gestures. Never let a long-press through a journal or
  // delivery overlay reset the pond and erase the musicians' memories.
  if(journalOpen || deliveryOpen)return;
  // Audio repair executes synchronously from the same user gesture.
  const button=ui.audioRect;
  if(!deliveryOpen && button && lx>=button.x && lx<=button.x+button.w && ly>=button.y && ly<=button.y+button.h){
    startAudio(true);
    return;
  }
  startAudio(soundNeedsRefresh);
  // Press-and-hold the painted pond, not a DOM control, to begin a fresh study.
  const d=Math.hypot(lx-ui.pond.x,ly-ui.pond.y);
  if(d<40){
    pressStart=performance.now();
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{
      if(!grove)return;
      grove=new Grove(null,saveMemory);
      grove.onNote=emitVisualNote;grove.onTalk=showSpeech;
      saveMemory(grove.snapshot());
      grove.push('A fresh study begins. The pond remembers nothing.');
      refreshText();
    },1800);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(name=>app.canvas.addEventListener(name,()=>{clearTimeout(pressTimer);pressTimer=null;}));
function checkpointAndRecover(){
  if(grove)saveMemory(grove.snapshot());
  // A WebKit AudioContext can remain 'running' but silent after a phone call.
  if(started)soundNeedsRefresh=true;
  if(remoteLive){liveConductor.reset();pendingVisualNotes.length=0;lastRemoteWorldAt=0;}
}
function recoverAudioAfterInterruption(){
  if(!document.hidden && started && sound.context){
    // Reassert playback routing even if WebKit does not report interruption.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(sound.context.state!=='running'){
      soundNeedsRefresh=true;
      try{sound.context.resume().catch(()=>{});}catch(e){}
    }
  }
  refreshText();
}
window.addEventListener('pagehide',checkpointAndRecover);
document.addEventListener('visibilitychange',()=>{
  // Store the precise current book page before iOS suspends the tab.
  if(document.hidden)checkpointAndRecover();
  else recoverAudioAfterInterruption();
});
window.addEventListener('focus',recoverAudioAfterInterruption,{passive:true});
window.addEventListener('pageshow',recoverAudioAfterInterruption,{passive:true});

window.addEventListener('resize',scheduleViewportSize,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleViewportSize,{passive:true});
window.addEventListener('orientationchange',()=>{
  scheduleViewportSize();
  setTimeout(scheduleViewportSize,170);
  setTimeout(scheduleViewportSize,500);
},{passive:true});
window.addEventListener('pageshow',scheduleViewportSize,{passive:true});
const saved=await (async()=>{await openMemory();return loadMemory();})();
grove=new Grove(saved,saveMemory);
grove.onNote=emitVisualNote;
grove.onTalk=showSpeech;
applyViewportSize(true);
await attachLivingServer();
app.ticker.add(()=>{
  const t=performance.now();
  flushLiveVisuals();
  renderEffects(t);
  redrawAccum+=app.ticker.deltaMS;
  if(redrawAccum>150){redrawAccum=0;renderMeter();refreshText();}
});
// Inspectable test hooks; not part of the rendered interface.
window.GrooveGroveDebug={get state(){return grove.snapshot();},get library(){return grove.library.snapshot();},get journal(){return grove.understanding.snapshot();},get server(){return {connected:remoteLive,online:remoteOnline,message:serverMessage,beat:serverLastBeat,sequence:remoteSequence,returnReport,url:serverBase,audioBuffer:liveConductor.stats};},journalReport(name){return grove.understanding.report(name==='Riff'?'Riff':'Pip');},get knowledgePlayed(){return {...grove.playedKnowledge};},addBook(type){const result=grove.library.donate(type);if(result.ok){grove.push('A copy of '+LIBRARY_CATALOG[type].title+' was delivered.');saveMemory(grove.snapshot());refreshText();}return result;},get errorSeries(){return [...grove.sessionMeasurements];},get logs(){return grove.logs.map(x=>x.message);},get mode(){return grove.mode;},get audioState(){return sound.context?.state||'not started';},get audioNeedsRefresh(){return soundNeedsRefresh;},get audioError(){return startError;},get lastBeat(){return sound.beat;},repairAudio(){return startAudio(true);},get viewport(){return {width:viewportWidth,height:viewportHeight,landscape,scale};},restart(){grove=new Grove(null,saveMemory);grove.onNote=emitVisualNote;grove.onTalk=showSpeech;saveMemory(grove.snapshot());refreshText();}};
