<script type="module">
/*
  GROOVEGROVE  /  PASS 002
  One visible PixiJS canvas. No DOM interface. All sound is synthesized locally.
  Musical onset listening is via timestamped note events, NOT microphone recognition.
  Agent intentions are independently selected by simple, inspectable decision policies.
  No LLM, network inference, external sound files, or predetermined band-forming script.
*/
import { Application, Container, Graphics, Text, Rectangle } from 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';
import { MusicLibrary, LIBRARY_CATALOG, BOOK_IDS } from './music-library.js';
import { ListeningJournal, VARIATIONS } from './listening-journal.js';

document.documentElement.style.cssText = 'margin:0;width:100%;height:100%;overflow:hidden;background:#081b1d';
document.body.style.cssText = 'margin:0;width:100%;height:100%;overflow:hidden;touch-action:none';

const PALETTE = {
  ink:0x0a2022, navy:0x0d292a, grove:0x123830, green:0x1e5142,
  mint:0x90dfc1, cyan:0x7dd4c5, gold:0xffd18a, orange:0xea986f,
  lilac:0xbfa5e8, cream:0xfff5d9, muted:0x9ab4ad, panel:0x10302f,
  dark:0x06181b, bark:0x5d4037, soil:0x183c36
};
const BPM=98;
const beatDur=60/BPM;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rand=(a,b)=>a+(b-a)*Math.random();
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const rms=a=>a.length?Math.sqrt(avg(a.map(x=>x*x))):null;
const fmt=v=>v==null?'collecting...':Math.round(v)+' ms';
function seeded(n){let x=n>>>0; return ()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296;};}
function txt(content,size=18,color=PALETTE.cream,weight='normal',letterSpacing=0){
  return new Text({text:content,style:{fontFamily:'Trebuchet MS, Avenir Next, Arial, sans-serif',fontSize:size,fill:color,fontWeight:weight,letterSpacing,breakWords:true}});
}
function textAt(parent,content,x,y,size=18,color=PALETTE.cream,weight='normal',spacing=0,anchorX=0){
  const t=txt(content,size,color,weight,spacing);t.position.set(x,y);t.anchor.x=anchorX;parent.addChild(t);return t;
}
function rect(g,x,y,w,h,r,color,alpha=1){g.roundRect(x,y,w,h,r).fill({color,alpha});return g;}
function line(g,x1,y1,x2,y2,color,width=3,alpha=1){g.moveTo(x1,y1).lineTo(x2,y2).stroke({color,width,alpha,cap:'round'});return g;}
function circle(g,x,y,r,color,alpha=1){g.circle(x,y,r).fill({color,alpha});return g;}
function ellipse(g,x,y,rx,ry,color,alpha=1){g.ellipse(x,y,rx,ry).fill({color,alpha});return g;}

// A persistent, single-record world memory. IndexedDB preferred, localStorage fallback.
const STORAGE_KEY='groovegrove.pass001.memory';
let database=null,lastMemoryStamp=0;
async function openMemory(){
  if(!('indexedDB' in window))return;
  try{
    database=await new Promise((resolve,reject)=>{
      const req=indexedDB.open('GrooveGroveMemory',1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('world'))req.result.createObjectStore('world');};
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
  }catch(e){database=null;}
}
// Phone calls can interrupt an IndexedDB write. Prefer whichever complete
// checkpoint has the newest timestamp, including our synchronous local fallback.
async function loadMemory(){
  let local=null,idb=null;
  try{local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){}
  if(database){
    try{idb=await new Promise((resolve,reject)=>{
      const tx=database.transaction('world','readonly');const req=tx.objectStore('world').get('pass001');
      req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error);
    });}catch(e){}
  }
  const age=value=>Number.isFinite(value?.savedAt)?value.savedAt:0;
  const saved=local && (!idb || age(local)>age(idb))?local:idb||local;
  lastMemoryStamp=Math.max(age(local),age(idb));
  return saved;
}
function saveMemory(value){
  const snap=JSON.parse(JSON.stringify(value));
  // Monotonic even when several actions happen within the same millisecond.
  snap.savedAt=lastMemoryStamp=Math.max(Date.now(),lastMemoryStamp+1);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(snap));}catch(e){}
  if(database){try{database.transaction('world','readwrite').objectStore('world').put(snap,'pass001');}catch(e){}}
}

// Sound synthesis and accurate, ahead-of-time Web Audio scheduling.
class SoundEngine {
  constructor(){this.context=null;this.master=null;this.noise=null;this.timer=null;this.beat=0;this.nextTime=0;}
  makeContext(){
    // Never reset the musical beat when rebuilding the AUDIO graph.
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    const old=this.context;
    this.context=null;
    // Closing can hang in WebKit after a phone call. Do not await it.
    if(old && old.state!=='closed'){try{Promise.resolve(old.close()).catch(()=>{});}catch(e){}}
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)throw new Error('Web Audio is not supported on this device.');
    const ctx=new Ctx();
    this.context=ctx;
    this.master=ctx.createGain();this.master.gain.value=0.58;
    const limiter=ctx.createDynamicsCompressor();
    limiter.threshold.value=-12;limiter.knee.value=15;limiter.ratio.value=3.5;
    this.master.connect(limiter);limiter.connect(ctx.destination);
    const len=Math.round(ctx.sampleRate*.3);
    this.noise=ctx.createBuffer(1,len,ctx.sampleRate);
    const data=this.noise.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  }
  async start(onBeat,{fresh=false,chime=false}={}){
    this.onBeat=onBeat;
    // WebKit may fall back to its ringer/ambient channel after an iOS call,
    // silently muting a perfectly "running" AudioContext. Use media playback.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(fresh || !this.context || this.context.state==='closed')this.makeContext();
    const ctx=this.context;
    // Called directly from the pointerdown handler; don't defer resume()
    // past the user-activation window on iOS.
    if(ctx.state!=='running'){
      const attempt=ctx.resume();
      const resumed=await Promise.race([
        Promise.resolve(attempt).then(()=>true),
        new Promise(resolve=>setTimeout(()=>resolve(false),1600))
      ]);
      if(!resumed && ctx.state!=='running')throw new Error('Audio is blocked by iOS. Tap AUDIO again.');
    }
    if(ctx!==this.context)return;
    if(ctx.state!=='running')throw new Error('Audio is '+ctx.state+'. Tap AUDIO to reconnect.');
    if(!this.timer){
      this.nextTime=ctx.currentTime+.12;
      this.timer=setInterval(()=>this.schedule(),23);
      this.schedule();
    }
    // An audible soft confirmation note when the player explicitly repairs audio.
    if(chime)this.tone(587.33,ctx.currentTime+.035,.17,.065,'sine',0);
  }
  schedule(){
    const ctx=this.context;
    if(!ctx || ctx.state!=='running')return;
    // Skip old beats before scheduling after iOS audio interruptions.
    if(this.nextTime<ctx.currentTime-.15)this.nextTime=ctx.currentTime+.08;
    let steps=0;
    while(this.nextTime<ctx.currentTime+.18 && steps++<32){
      this.onBeat(this.beat,this.nextTime);
      this.beat++;this.nextTime+=beatDur;
    }
  }
  tone(freq,time,duration,level,shape='triangle',pan=0){
    const ctx=this.context;if(!ctx)return;
    const t=Math.max(ctx.currentTime+.002,time);
    const osc=ctx.createOscillator(),gain=ctx.createGain(),low=ctx.createBiquadFilter();
    osc.type=shape;osc.frequency.setValueAtTime(freq,t);
    low.type='lowpass';low.frequency.setValueAtTime(shape==='sine'?4000:2400,t);
    low.frequency.exponentialRampToValueAtTime(500,t+duration);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),t+.009);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(low);low.connect(gain);
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;gain.connect(p);p.connect(this.master);}else gain.connect(this.master);
    osc.start(t);osc.stop(t+duration+.02);
  }
  noiseHit(time,duration,level,highpass=1200,pan=-.25){
    const ctx=this.context,src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),env=ctx.createGain();
    const t=Math.max(ctx.currentTime+.002,time);
    src.buffer=this.noise;filter.type='highpass';filter.frequency.value=highpass;
    env.gain.setValueAtTime(Math.max(.001,level),t);
    env.gain.exponentialRampToValueAtTime(.0001,t+duration);
    src.connect(filter);filter.connect(env);
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;env.connect(p);p.connect(this.master);}else env.connect(this.master);
    src.start(t);src.stop(t+duration+.005);
  }
  kick(t,volume=1){
    const ctx=this.context,osc=ctx.createOscillator(),gain=ctx.createGain();
    t=Math.max(ctx.currentTime+.002,t);osc.type='sine';
    osc.frequency.setValueAtTime(160,t);osc.frequency.exponentialRampToValueAtTime(48,t+.17);
    gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.65*volume,t+.008);
    gain.gain.exponentialRampToValueAtTime(.001,t+.28);
    osc.connect(gain);gain.connect(this.master);osc.start(t);osc.stop(t+.3);
  }
  snare(t,volume=1){this.noiseHit(t,.16,.23*volume,900,-.35);this.tone(185,t,.12,.13*volume,'triangle',-.35);}
  hat(t,volume=1){this.noiseHit(t,.045,.055*volume,5400,-.25);}
  guitar(freq,t,volume=1,duration=.34){
    this.tone(freq,t,duration,.12*volume,'triangle',.34);
    this.tone(freq*2,t+.003,Math.min(duration,.24),.025*volume,'sine',.35);
  }
}

// Agent communication is through a shared note-event bus and structured intentions.
// This pass does not pretend to use speech recognition or a language model.
class MusicalAgent {
  constructor(name,role,initial){
    this.name=name;this.role=role;
    this.biasMs=initial.biasMs;this.jitterMs=initial.jitterMs;
    this.curiosity=role==='drummer'?.83:.74;
    this.generosity=role==='guitarist'?.89:.65;
    this.currentGoal='practicing';this.observations=[];
    this.ownOnsets=[];this.experiences=[];
  }
  rhythmOffset(){
    // Gaussian-ish but clamped. Skill determines audible deviations, not a fake UI score.
    const z=(Math.random()+Math.random()+Math.random()+Math.random()-2)*1.73;
    return clamp(this.biasMs+this.jitterMs*z,-155,155);
  }
  observe(event){this.observations.push(event);if(this.observations.length>128)this.observations.shift();}
  remember(description){this.experiences.unshift(description);if(this.experiences.length>8)this.experiences.length=8;}
}
class Grove {
  constructor(saved=null){
    this.pip=new MusicalAgent('Pip','drummer',{biasMs:clamp(saved?.pipBias??78,-100,150),jitterMs:clamp(saved?.pipJitter??34,7,75)});
    this.riff=new MusicalAgent('Riff','guitarist',{biasMs:0,jitterMs:7});
    this.familiarity=clamp(saved?.familiarity??0,0,99);
    this.lessons=saved?.lessons??0;this.jams=saved?.jams??0;
    this.mode='solo';this.modeBars=0;this.bar=0;this.beat=0;
    this.logs=[];this.lastRiffOnsets=new Map();this.lastPipOnsets=new Map();
    this.relativeErrors=[];this.barErrors=[];this.priorErrors=[];this.sessionMeasurements=[];
    this.pipPlayed=0;this.riffPlayed=0;this.lastLearning=null;
    this.library=new MusicLibrary(saved?.library);
    this.understanding=new ListeningJournal(saved?.understanding);
    for(const name of ['Pip','Riff']){
      const task=this.library.status(name),book=task&&this.library.copyById(task.copyId);
      if(book)(name==='Pip'?this.pip:this.riff).currentGoal='finishing '+LIBRARY_CATALOG[book.type].title;
    }
    this.playedKnowledge={Pip:0,Riff:0};
    this.highlight='Two musicians, one little clearing.';
    this.onSound=null;this.onNote=null;
    this.push('The grove is quiet. Two musicians are finding their sound.');
    if(saved){this.push('Their memories survived the last visit.');}
  }
  push(message){this.logs.unshift({message,bar:this.bar});this.logs=this.logs.slice(0,12);this.highlight=message;}
  exchange(from,to,message){
    this.push(from.name+' → '+to.name+': '+message);
    if(this.onTalk)this.onTalk(from.name,message);
  }
  baseline(){return rms(this.relativeErrors.slice(-16));}
  snapshot(){return {pipBias:this.pip.biasMs,pipJitter:this.pip.jitterMs,familiarity:this.familiarity,lessons:this.lessons,jams:this.jams,library:this.library.snapshot(),understanding:this.understanding.snapshot()};}
  onBeatEvent(index,t,audio){
    const beat=index%4,bar=Math.floor(index/4);
    if(beat===0 && index>0)this.finishBar();
    this.beat=beat;this.bar=bar;
    const solo=this.mode==='solo';
    // A practice room can hold two soloists without making them a duo.
    // They exchange turns every two bars. Only a mutual choice creates joint music.
    const pipActive=(!solo || bar%4<2 || this.library.busy('Riff')) && !this.library.busy('Pip');
    const riffActive=(!solo || bar%4>=2 || this.library.busy('Pip')) && !this.library.busy('Riff');
    const riffOffset=this.riff.rhythmOffset();
    const guitarOnset=t+riffOffset/1000;
    const originalChords=[[196,246.94,293.66],[174.61,220,261.63],[164.81,196,246.94],[146.83,185,220]];
    const newChords=[[220,261.63,329.63],[146.83,174.61,220],[196,246.94,349.23],[174.61,261.63,349.23]];
    const usesNewChords=this.library.has('Riff','openChords') && bar%4>=2;
    const pitches=(usesNewChords?newChords:originalChords)[Math.floor(bar/2)%4];
    const onLesson=this.mode==='lesson';
    const onJam=this.mode==='jam';
    const dynamic=onJam?.9:onLesson?.69:.51;
    // Live onset bus: every heard note corresponds to an actual scheduled
    // Web Audio event. Extra notes are marked so timing drift is not faked.
    const drumOffset=this.pip.rhythmOffset();
    const drumOnset=t+drumOffset/1000;
    if(beat===0){
      this.understanding.beginBar({bar,mode:this.mode,active:{Pip:pipActive,Riff:riffActive},skills:this.library.known});
    }
    const riffChoice=this.understanding.variation('Riff');
    const pipChoice=this.understanding.variation('Pip');
    const play={
      guitar:(freq,at,volume,duration,extra=false)=>{
        audio.guitar(freq,at,volume,duration);
        this.understanding.hear({who:'Riff',kind:'guitar',time:at,bar,beat,velocity:volume,offsetMs:riffOffset,extra,pitch:freq});
      },
      kick:(at,volume,extra=false)=>{
        audio.kick(at,volume);
        this.understanding.hear({who:'Pip',kind:'kick',time:at,bar,beat,velocity:volume,offsetMs:drumOffset,extra});
      },
      snare:(at,volume,extra=false)=>{
        audio.snare(at,volume);
        this.understanding.hear({who:'Pip',kind:'snare',time:at,bar,beat,velocity:volume,offsetMs:drumOffset,extra});
      },
      hat:(at,volume,extra=false)=>{
        audio.hat(at,volume);
        this.understanding.hear({who:'Pip',kind:'hat',time:at,bar,beat,velocity:volume,offsetMs:drumOffset,extra});
      }
    };
    if(riffActive){
      const feeling=riffChoice==='soft'?.7:1;
      const voicing=riffChoice==='voicing'?[pitches[1],pitches[2],pitches[0]*2]:pitches;
      if(beat===0||beat===2){
        voicing.forEach((p,i)=>play.guitar(p,guitarOnset+i*.026,dynamic*feeling*(i===0?1:.72),.42));
      }else if(!(riffChoice==='breath' && beat===3)){
        play.guitar(voicing[(beat+bar)%3]*2,guitarOnset,dynamic*.72*feeling,.23);
      }
      if(usesNewChords && beat===0)this.playedKnowledge.Riff++;
      if(onJam && beat===3 && this.library.has('Riff','callResponse')){
        play.guitar(voicing[(bar+1)%3]*2,guitarOnset+beatDur*.47,dynamic*.42*feeling,.2,true);
        this.playedKnowledge.Riff++;
      }
      if(riffChoice==='answer' && beat===3){
        play.guitar(voicing[bar%3]*2,guitarOnset+beatDur*.73,dynamic*.24,.16,true);
      }
      this.riffPlayed++;
      this.pip.observe({type:'heard-guitar',bar,beat,time:guitarOnset});
      this.riff.ownOnsets.push({bar,beat,time:guitarOnset});
    }
    if(pipActive){
      if(beat===0||beat===2)play.kick(drumOnset,beat===0?.9:.68);
      else play.snare(drumOnset,.7);
      play.hat(drumOnset+.017,.6);
      if(!(pipChoice==='breath' && beat===3))play.hat(drumOnset+beatDur*.5+.017,.32);
      if(onJam && beat===3 && this.pip.curiosity>.7 && bar%4===0)play.snare(drumOnset+beatDur*.74,.28,true);
      // Book-learned motor vocabulary remains playable even without an experiment.
      if(this.library.has('Pip','offbeatPulse') && beat===1 && bar%2===0){
        play.kick(drumOnset+beatDur*.5,.32,true);play.snare(drumOnset+beatDur*.75,.18,true);
        this.playedKnowledge.Pip++;
      }
      if(onJam && beat===3 && this.library.has('Pip','callResponse')){
        play.snare(drumOnset+beatDur*.5,.31,true);this.playedKnowledge.Pip++;
      }
      // Mild optional variations: core four-beat pulse is never removed.
      if(pipChoice==='ghost' && beat===2)play.snare(drumOnset+beatDur*.5,.17,true);
      if(pipChoice==='offbeat' && beat===2)play.kick(drumOnset+beatDur*.53,.23,true);
      this.pipPlayed++;
      this.riff.observe({type:'heard-drum',bar,beat,time:drumOnset});
      this.pip.ownOnsets.push({bar,beat,time:drumOnset});
      // The partner's reliable reference pulse exists even while the guitar is silent.
      // Difference is measured from actual synthesized drum onsets, not a cosmetic score.
      const delta=(drumOnset-guitarOnset)*1000;
      this.relativeErrors.push(delta);this.barErrors.push(delta);
      this.sessionMeasurements.push({bar,beat,errorMs:delta,mode:this.mode});
      if(this.relativeErrors.length>96)this.relativeErrors.shift();
      if(this.sessionMeasurements.length>1000)this.sessionMeasurements.shift();
    }
    if(this.onNote){
      if(pipActive)this.onNote({agent:'Pip',time:drumOnset,beat,delta:drumOffset-riffOffset});
      if(riffActive)this.onNote({agent:'Riff',time:guitarOnset,beat,delta:riffOffset});
    }
  }
  finishBar(){
    const findings=this.understanding.finishBar(this.bar);
    for(const f of findings){
      // Event-based observations, not claims that the music is objectively good.
      this.push(f.who+' tried '+f.label+' · '+Math.round(f.driftMs)+' ms attack drift, '+Math.round(f.overlap*100)+'% onset overlap.');
    }
    const last4=this.barErrors;
    this.barErrors=[];
    const before=rms(last4)??this.baseline();
    if(last4.length){
      const correction=avg(last4);
      const oldBias=this.pip.biasMs,oldJitter=this.pip.jitterMs;
      // The partner's live reference yields a stronger correction than solo rehearsal.
      const gain=this.mode==='lesson'?.59:(this.mode==='jam'?.16:.035);
      this.pip.biasMs=clamp(this.pip.biasMs-clamp(correction*gain,-48,48),-105,145);
      // Reading supplies an exercise; only subsequent practice affects timing.
      const pulseExercise=this.library.has('Pip','offbeatPulse') && this.mode==='solo' && !this.library.busy('Pip');
      this.pip.jitterMs=clamp(this.pip.jitterMs*(this.mode==='lesson'?.927:(this.mode==='jam'?.987:(pulseExercise?.991:.997))),7,75);
      this.lastLearning={bar:this.bar,observedErrorMs:before,correctionMs:oldBias-this.pip.biasMs,precisionChangeMs:oldJitter-this.pip.jitterMs,mode:this.mode};
    }
    this.modeBars++;
    if(this.mode==='solo')this.considerNewActivity(before);
    else if(this.mode==='lesson'){
      const clearProgress=this.modeBars>=3 && (before<36||this.modeBars>=7);
      if(clearProgress){
        this.lessons++;this.familiarity++;
        this.pip.remember('Riff demonstrated a steady pulse.');
        this.riff.remember('Pip worked through a timing lesson.');
        this.exchange(this.pip,this.riff,before<36?'I can feel the beat settling!':'I want to try that in a song.');
        this.mode='solo';this.modeBars=0;
        this.pip.currentGoal='trying new patterns';this.riff.currentGoal='looking for a new idea';
      }
    }else if(this.mode==='jam'){
      if(this.modeBars>=6 && Math.random()<.46){
        this.jams++;this.familiarity++;
        this.exchange(this.riff,this.pip,'That groove was worth remembering.');
        this.pip.remember('Shared a jam with Riff; familiar grooves feel easier.');
        this.riff.remember('Pip adds playful offbeat accents.');
        this.mode='solo';this.modeBars=0;
        this.pip.currentGoal='practicing';this.riff.currentGoal='experimenting';
      }
    }
    this.library.tick(this);
    // Save every bar (about 2.45 s), including each reading page and return.
    // The old four-bar cadence could preserve a 75% book checkpoint indefinitely
    // when iOS interrupted the audio clock before the next checkpoint.
    saveMemory(this.snapshot());
  }
  considerNewActivity(measuredError){
    if(this.modeBars<3 || this.library.anyBusy())return;
    // Riff recognizes a timing problem from HEARD onset differences, then chooses whether to help.
    const needsHelp=measuredError!=null && measuredError>40;
    const teachUtility=(needsHelp?.65:0)+this.riff.generosity*.26+rand(-.1,.1);
    const jamUtility=.26+this.familiarity*.08+(measuredError!=null&&measuredError<56?.24:0)+this.pip.curiosity*.16+rand(-.1,.1);
    const soloUtility=.46+rand(-.08,.16);
    const candidate=teachUtility>jamUtility&&teachUtility>soloUtility?'lesson':jamUtility>soloUtility?'jam':'solo';
    if(candidate==='lesson' && needsHelp){
      this.exchange(this.riff,this.pip,'Your notes drift a little. Want to follow my pulse?');
      const pipWillingness=.55+clamp(measuredError/150,0,.34)+(this.familiarity*.025);
      if(Math.random()<pipWillingness){
        this.exchange(this.pip,this.riff,'Play it steady. I’ll listen.');
        this.mode='lesson';this.modeBars=0;
        this.pip.currentGoal='listening and correcting timing';
        this.riff.currentGoal='demonstrating the pulse';
      }else this.push('Pip chooses to keep experimenting alone.');
    }else if(candidate==='jam'){
      this.exchange(this.pip,this.riff,'Want to see what these rhythms do together?');
      const riffWillingness=.49+this.riff.curiosity*.24+this.familiarity*.025;
      if(Math.random()<riffWillingness){
        this.exchange(this.riff,this.pip,'Let’s find out.');
        this.mode='jam';this.modeBars=0;
        this.pip.currentGoal='improvising with Riff';

function measuredViewport(){

  return {
    width:Math.max(1,Math.round(visual?.width || window.innerWidth || document.documentElement.clientWidth || 1)),
    height:Math.max(1,Math.round(visual?.height || window.innerHeight || document.documentElement.clientHeight || 1))

function applyViewportSize(force=false){
  const {width,height}=measuredViewport();
  if(!force && width===viewportWidth && height===viewportHeight)return;
  viewportWidth=width;viewportHeight=height;
  // Resize renderer FIRST, then rebuild all positions from app.screen.

  ui.modeLabel=textAt(world,'TWO SOLO PRACTICES',landscape?panelX+20:W*.5,panelY+15,landscape?14:13,PALETTE.gold,'bold',2,landscape?0:.5);

    ui.log.forEach(t=>{t.style.wordWrap=true;t.style.wordWrapWidth=panelW*.21;});
  }else{
    ui.pipMetric=textAt(world,'PIP   collecting...',panelX+18,panelY+179,15,PALETTE.mint,'bold');
    ui.riffMetric=textAt(world,'RIFF   steady guide',panelX+18,panelY+202,13,PALETTE.lilac);
    ui.memoryMetric=textAt(world,'0 shared sessions',panelX+18,panelY+226,12,PALETTE.muted);
    textAt(world,'LISTENING LOG',panelX+18,panelY+247,10,PALETTE.muted,'bold',1.2);
    ui.log=[textAt(world,'',panelX+134,panelY+246,12,PALETTE.cream)];
    ui.log[0].style.wordWrap=true;ui.log[0].style.wordWrapWidth=panelW-154;
  }
  const badgeX=landscape?W*.5:W*.5,badgeY=landscape?panelY-44:panelY-51;
  ui.badge=new Graphics();rect(ui.badge,badgeX-124,badgeY-13,248,36,18,0x102d2d,.92);
  world.addChild(ui.badge);
  ui.badgeText=textAt(world,'TAP ANYWHERE TO START',badgeX,badgeY-4,12,PALETTE.gold,'bold',1.7,.5);
  ui.inspect=textAt(world,'',landscape?W*.5:W*.5,landscape?panelY-84:panelY-93,landscape?13:12,PALETTE.cream,'normal',0,.5);
  makeDeliveryTray(world);
  makeAudioControl(world);
  refreshText();
}
function refreshText(){
  if(!ui.modeLabel)return;
  const mode=grove?.mode||'solo';
  ui.modeLabel.text=grove?.library.anyBusy()?'READING IN THE GROVE':mode==='lesson'?'A LESSON IS EMERGING':mode==='jam'?'AN UNSCRIPTED JAM':'TWO SOLO PRACTICES';
  ui.statusLine.text=startError?startError:!started?(grove?.library.anyBusy()?'Tap the clearing to continue the interrupted reading':'Tap the clearing to hear their first notes'):soundNeedsRefresh?'Audio route may be muted · tap ↻ AUDIO to reconnect':(sound.context && sound.context.state!=='running'?'Audio paused · tap ↻ AUDIO to reconnect':grove.highlight);
  if(grove){
    const error=grove.baseline();
    ui.pipMetric.text='PIP   '+(error==null?'collecting timing...':fmt(error)+' RMS drift');
    ui.riffMetric.text='RIFF   guitar pulse · ~7 ms spread';
    ui.memoryMetric.text=grove.familiarity+' shared sessions  ·  '+grove.lessons+' lessons  ·  '+grove.jams+' jams';
    if(landscape){
      const rows=grove.logs.slice(0,3);
      ui.log.forEach((t,i)=>{t.text=rows[i]?.message||'';});
    }else ui.log[0].text=grove.logs[0]?.message||'';
    const who=selected==='Pip'?grove.pip:grove.riff;
    ui.inspect.text=who.name.toUpperCase()+' · '+who.currentGoal+(grove.library.known[who.name].length?' · '+grove.library.known[who.name].length+' book skills':'')+'  |  tap either musician';
  }else ui.inspect.text='Tap a musician to follow their decisions';
  ui.badgeText.text=!started?(grove?.library.anyBusy()?'TAP TO CONTINUE READING':'TAP ANYWHERE TO START'):(soundNeedsRefresh || (sound.context && sound.context.state!=='running'))?'TAP TO RECONNECT AUDIO':grove?.library.anyBusy()?'STUDYING  ·  LISTENING':mode==='lesson'?'LISTENING  ·  LEARNING':mode==='jam'?'PLAYING TOGETHER':'INDEPENDENT PRACTICE';
  ui.badgeText.style.fill=mode==='jam'?PALETTE.mint:PALETTE.gold;
  if(ui.audioLabel)ui.audioLabel.text=!started?'▶ AUDIO':soundNeedsRefresh?'↻ REPAIR':'↻ AUDIO';
  if(ui.audioWidget)ui.audioWidget.visible=!deliveryOpen;
  if(ui.shelfCounter)ui.shelfCounter.text='LIBRARY  '+grove.library.books.length+' / 6';
  if(ui.deliveryTray)ui.deliveryTray.visible=deliveryOpen;
  if(ui.deliveryBookLabels)for(const [id,label] of Object.entries(ui.deliveryBookLabels)){
    label.visible=grove.library.books.some(b=>b.type===id);
  }
  const reading=['Pip','Riff'].map(name=>{
    const task=grove.library.status(name);
    if(!task)return null;
    const book=grove.library.copyById(task.copyId);
    return name+' '+task.stage+' '+(book?LIBRARY_CATALOG[book.type].title:'');
  }).filter(Boolean);
  if(ui.shelfStatus)ui.shelfStatus.text=reading.join(' · ')||(grove.library.books.length?'Tap shelf to deliver books':'Empty shelves · tap to deliver books');
}
function renderMeter(){
  if(!ui.meter)return;
  const g=ui.meter;g.clear();
  const x=ui.panelX+19,y=ui.panelY+(landscape?124:145);
  const width=landscape?ui.panelW*.42:ui.panelW-40;
  line(g,x,y,x+width,y,0x7b9b8a,1,.55);
  const ticks=[-100,-50,0,50,100];
  ticks.forEach(ms=>{
    const tx=x+(ms+100)/200*width;
    line(g,tx,y-6,tx,y+7,ms===0?PALETTE.gold:0x628780,ms===0?2:1,.6);
  });
  const errors=(grove?.relativeErrors||[]).slice(-14);
  errors.forEach((value,i)=>{
    const tx=x+(clamp(value,-100,100)+100)/200*width;
    circle(g,tx,y-15-(i%3)*5,3.3,PALETTE.mint,.2+i/errors.length*.77);
  });
}

function emitVisualNote(e){
  const p=e.agent==='Pip'?ui.pipPos:ui.riffPos;
  if(!p)return;
  const tone=e.agent==='Pip'?PALETTE.mint:PALETTE.lilac;
  floatingNotes.push({x:p.x+rand(-20,18),y:p.y-110+(landscape?0:25),vx:rand(-.38,.38),born:performance.now(),color:tone,size:rand(6,10)});
  if(floatingNotes.length>24)floatingNotes.shift();
  noteFlash[e.agent]=performance.now();
}
function showSpeech(from,message){
  talkBubble={from,message,born:performance.now()};
}
function renderEffects(time){
  if(!ui.fx)return;
  const fx=ui.fx;fx.clear();
  const pulse=(grove?.beat||0);
  const elapsed=(time-(noteFlash.Pip||0))/1000;
  const elapsedR=(time-(noteFlash.Riff||0))/1000;
  [ ['Pip',elapsed,PALETTE.mint],['Riff',elapsedR,PALETTE.lilac] ].forEach(([name,dt,color])=>{
    if(dt<.38 && dt>=0){
      const p=name==='Pip'?ui.pipPos:ui.riffPos;
      fx.circle(p.x,p.y+54,38+dt*170).stroke({color,width:3,alpha:(1-dt/.38)*.45});
    }
  });
  floatingNotes=floatingNotes.filter(n=>time-n.born<1200);
  floatingNotes.forEach(n=>{
    const age=(time-n.born)/1000;
    const x=n.x+n.vx*age*36,y=n.y-age*45;
    const fade=(1-age/1.2);
    circle(fx,x,y,n.size*.47,n.color,fade*.83);
    line(fx,x+n.size*.3,y-7,x+n.size*.3,y,n.color,2,fade);
  });
  moveReaders();
  renderPhysicalBooks();
  for(const a of ambient){
    const t=time/1000*a.speed+a.phase;
    a.sprite.position.set(a.x+Math.cos(t)*9,a.y+Math.sin(t*.77)*13);
    a.sprite.alpha=.12+.45*(Math.sin(t*1.8)**2);
  }
  // Simple real-time drumstick motion and guitar strum animation.
  const motionP=clamp(1-elapsedP(elapsed)/.24,0,1),motionR=clamp(1-elapsedP(elapsedR)/.3,0,1);
  if(ui.pip?.sticks){
    const d=ui.pip.sticks;d.clear();
    line(d,-67,13,-28+(motionP*8),65-motionP*38,0xf9d28e,5);
    line(d,68,12,22-(motionP*8),64-motionP*40,0xf9d28e,5);
    circle(d,-67,13,6,PALETTE.mint);circle(d,68,12,6,PALETTE.mint);
    ui.pip.group.y=ui.pipPos.y+Math.sin(time/380)*1.5;
  }
  if(ui.riff?.arm){
    const a=ui.riff.arm;a.clear();
    line(a,-35,11,20,35+motionR*19,0xa68dcd,15);
    circle(a,20,35+motionR*19,8,0xe0c7e0);
    ui.riff.group.y=ui.riffPos.y+Math.sin(time/470+2)*2;
  }
  ui.bubbleLayer.visible=!!(talkBubble && time-talkBubble.born<4300);
  if(ui.bubbleLayer.visible){
    const age=(time-talkBubble.born)/1000;
    const pos=talkBubble.from==='Pip'?ui.pipPos:ui.riffPos;
    const boxW=landscape?230:182;
    const boxY=pos.y-(landscape?195:151);
    const x=clamp(pos.x-boxW/2,12,W-boxW-12);
    if(ui.lastBubble!==talkBubble){
      const b=ui.bubbleShape;b.clear();
      rect(b,x,boxY,boxW,landscape?74:78,13,0x082527,.93);
      b.roundRect(x,boxY,boxW,landscape?74:78,13).stroke({color:talkBubble.from==='Pip'?PALETTE.mint:PALETTE.lilac,width:1,alpha:.5});
      const text=ui.bubbleText;text.text=talkBubble.message;text.position.set(x+11,boxY+11);
      text.style.wordWrap=true;text.style.wordWrapWidth=boxW-22;
      ui.lastBubble=talkBubble;
    }
    ui.bubbleLayer.alpha=Math.min(1,(4.3-age)*3);
  }
}
function elapsedP(x){return Math.max(0,x);}
function onScheduledBeat(beat,time){
  grove.onBeatEvent(beat,time,sound);
  if(beat%4===0)refreshText();
}
async function startAudio(force=false){
  if(audioStartPending)return;
  if(started && !force && !soundNeedsRefresh && sound.context?.state==='running')return;
  audioStartPending=true;
  const first=!started;
  const repair=force || soundNeedsRefresh || (started && sound.context?.state==='closed');
  try{
    await sound.start(onScheduledBeat,{fresh:repair,chime:repair});
    started=true;startError='';soundNeedsRefresh=false;
    if(repair)grove.push('The audio engine was reconnected without resetting the musicians.');
    else if(first)grove.push(grove.library.anyBusy()?'The music resumes. Interrupted reading continues.':'Pip and Riff begin playing. Neither has been told to form a band.');
  }catch(err){
    soundNeedsRefresh=true;
    startError='Sound needs attention: '+(err?.message||'tap ↻ AUDIO to retry');
  }finally{
    audioStartPending=false;refreshText();
  }
}
let pressTimer=null,pressStart=null;
app.canvas.addEventListener('pointerdown',(ev)=>{
  const bounds=app.canvas.getBoundingClientRect();
  const lx=(ev.clientX-bounds.left)/scale,ly=(ev.clientY-bounds.top)/scale;
  // Audio repair executes synchronously from the same user gesture.
  const button=ui.audioRect;
  if(!deliveryOpen && button && lx>=button.x && lx<=button.x+button.w && ly>=button.y && ly<=button.y+button.h){
    startAudio(true);
    return;
  }
  startAudio(soundNeedsRefresh);
  // Press-and-hold the painted pond, not a DOM control, to begin a fresh study.
  const d=Math.hypot(lx-ui.pond.x,ly-ui.pond.y);
  if(d<40){
    pressStart=performance.now();
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{
      if(!grove)return;
      grove=new Grove(null);
      grove.onNote=emitVisualNote;grove.onTalk=showSpeech;
      saveMemory(grove.snapshot());
      grove.push('A fresh study begins. The pond remembers nothing.');
      refreshText();
    },1800);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(name=>app.canvas.addEventListener(name,()=>{clearTimeout(pressTimer);pressTimer=null;}));
function checkpointAndRecover(){
  if(grove)saveMemory(grove.snapshot());
  // A WebKit AudioContext can remain 'running' but silent after a phone call.
  if(started)soundNeedsRefresh=true;
}
function recoverAudioAfterInterruption(){
  if(!document.hidden && started && sound.context){
    // Reassert playback routing even if WebKit does not report interruption.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(sound.context.state!=='running'){
      soundNeedsRefresh=true;
      try{sound.context.resume().catch(()=>{});}catch(e){}
    }
  }
  refreshText();
}
window.addEventListener('pagehide',checkpointAndRecover);
document.addEventListener('visibilitychange',()=>{
  // Store the precise current book page before iOS suspends the tab.
  if(document.hidden)checkpointAndRecover();
  else recoverAudioAfterInterruption();
});
window.addEventListener('focus',recoverAudioAfterInterruption,{passive:true});
window.addEventListener('pageshow',recoverAudioAfterInterruption,{passive:true});

window.addEventListener('resize',scheduleViewportSize,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleViewportSize,{passive:true});
window.addEventListener('orientationchange',()=>{
  scheduleViewportSize();
  setTimeout(scheduleViewportSize,170);
  setTimeout(scheduleViewportSize,500);
},{passive:true});
window.addEventListener('pageshow',scheduleViewportSize,{passive:true});
const saved=await (async()=>{await openMemory();return loadMemory();})();
grove=new Grove(saved);
grove.onNote=emitVisualNote;
grove.onTalk=showSpeech;
applyViewportSize(true);
app.ticker.add(()=>{
  const t=performance.now();
  renderEffects(t);
  redrawAccum+=app.ticker.deltaMS;
  if(redrawAccum>150){redrawAccum=0;renderMeter();refreshText();}
});
// Inspectable test hooks; not part of the rendered interface.
window.GrooveGroveDebug={get state(){return grove.snapshot();},get library(){return grove.library.snapshot();},get knowledgePlayed(){return {...grove.playedKnowledge};},addBook(type){const result=grove.library.donate(type);if(result.ok){grove.push('A copy of '+LIBRARY_CATALOG[type].title+' was delivered.');saveMemory(grove.snapshot());refreshText();}return result;},get errorSeries(){return [...grove.sessionMeasurements];},get logs(){return grove.logs.map(x=>x.message);},get mode(){return grove.mode;},get audioState(){return sound.context?.state||'not started';},get audioNeedsRefresh(){return soundNeedsRefresh;},get audioError(){return startError;},get lastBeat(){return sound.beat;},repairAudio(){return startAudio(true);},get viewport(){return {width:viewportWidth,height:viewportHeight,landscape,scale};},restart(){grove=new Grove();grove.onNote=emitVisualNote;grove.onTalk=showSpeech;saveMemory(grove.snapshot());refreshText();}};
</script>
