// A persistent, single-record world memory. IndexedDB preferred, localStorage fallback.
const STORAGE_KEY='groovegrove.pass001.memory';
let database=null,lastMemoryStamp=0;
async function openMemory(){
  if(!('indexedDB' in window))return;
  try{
    database=await new Promise((resolve,reject)=>{
      const req=indexedDB.open('GrooveGroveMemory',1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('world'))req.result.createObjectStore('world');};
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
  }catch(e){database=null;}
}
// Phone calls can interrupt an IndexedDB write. Prefer whichever complete
// checkpoint has the newest timestamp, including our synchronous local fallback.
async function loadMemory(){
  let local=null,idb=null;
  try{local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){}
  if(database){
    try{idb=await new Promise((resolve,reject)=>{
      const tx=database.transaction('world','readonly');const req=tx.objectStore('world').get('pass001');
      req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(req.error);
    });}catch(e){}
  }
  const age=value=>Number.isFinite(value?.savedAt)?value.savedAt:0;
  const saved=local && (!idb || age(local)>age(idb))?local:idb||local;
  lastMemoryStamp=Math.max(age(local),age(idb));
  return saved;
}
function saveMemory(value){
  const snap=JSON.parse(JSON.stringify(value));
  // Monotonic even when several actions happen within the same millisecond.
  snap.savedAt=lastMemoryStamp=Math.max(Date.now(),lastMemoryStamp+1);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(snap));}catch(e){}
  if(database){try{database.transaction('world','readwrite').objectStore('world').put(snap,'pass001');}catch(e){}}
}

// Sound synthesis and accurate, ahead-of-time Web Audio scheduling.
class SoundEngine {
  constructor(){this.context=null;this.master=null;this.mix=null;this.noise=null;this.timer=null;this.beat=0;this.nextTime=0;}
  makeContext(){
    // Never reset the musical beat when rebuilding the AUDIO graph.
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    const old=this.context;
    this.context=null;
    // Closing can hang in WebKit after a phone call. Do not await it.
    if(old && old.state!=='closed'){try{Promise.resolve(old.close()).catch(()=>{});}catch(e){}}

    if(!Ctx)throw new Error('Web Audio is not supported on this device.');

    const limiter=ctx.createDynamicsCompressor();
    limiter.threshold.value=-12;limiter.knee.value=15;limiter.ratio.value=3.5;
    this.master.connect(limiter);limiter.connect(ctx.destination);
    // Technical balance, separate from musical dynamics chosen by agents.
    // Drum peaks no longer occupy the entire mix; melodic voices stay present.
    this.mix={};
    for(const [instrument,level] of Object.entries({drums:.57,guitar:1.34,voice:1.72,violin:1.08})){
      const bus=ctx.createGain();
      bus.gain.value=level;
      bus.connect(this.master);
      this.mix[instrument]=bus;
    }
    const len=Math.round(ctx.sampleRate*.3);
    this.noise=ctx.createBuffer(1,len,ctx.sampleRate);
    const data=this.noise.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  }
  async start(onBeat,{fresh=false,chime=false,passive=false}={}){
    this.onBeat=onBeat;
    // WebKit may fall back to its ringer/ambient channel after an iOS call,
    // silently muting a perfectly "running" AudioContext. Use media playback.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(fresh || !this.context || this.context.state==='closed')this.makeContext();
    const ctx=this.context;
    // Called directly from the pointerdown handler; don't defer resume()
    // past the user-activation window on iOS.
    if(ctx.state!=='running'){
      // Safari sometimes creates a suspended graph even during pointerdown.
      // Start a near-silent, short oscillator synchronously within that same
      // user gesture BEFORE awaiting resume(). Do not autoplay music.
      try{
        const pulse=ctx.createOscillator(),gain=ctx.createGain();
        gain.gain.value=.000001;pulse.frequency.value=440;
        pulse.connect(gain);gain.connect(ctx.destination);
        pulse.start(ctx.currentTime);pulse.stop(ctx.currentTime+.025);
      }catch(e){}

      const resumed=await Promise.race([
        Promise.resolve(attempt).then(()=>true),
        new Promise(resolve=>setTimeout(()=>resolve(false),2800))
      ]);
      if(!resumed && ctx.state!=='running')throw new Error('Audio is blocked by iOS. Tap AUDIO again.');
    }
    if(ctx!==this.context)return;
    if(ctx.state!=='running')throw new Error('Audio is '+ctx.state+'. Tap AUDIO to reconnect.');
    if(passive && this.timer){clearInterval(this.timer);this.timer=null;}
    if(!passive && !this.timer){
      this.nextTime=ctx.currentTime+.12;
      this.timer=setInterval(()=>this.schedule(),23);
      this.schedule();
    }
    // An audible soft confirmation note when the player explicitly repairs audio.
    if(chime)this.tone(587.33,ctx.currentTime+.035,.17,.065,'sine',0);
  }
  schedule(){
    const ctx=this.context;
    if(!ctx || ctx.state!=='running')return;
    // Skip old beats before scheduling after iOS audio interruptions.
    if(this.nextTime<ctx.currentTime-.15)this.nextTime=ctx.currentTime+.08;
    let steps=0;
    while(this.nextTime<ctx.currentTime+.18 && steps++<32){
      this.onBeat(this.beat,this.nextTime);

  tone(freq,time,duration,level,shape='triangle',pan=0,destination=null){
    const ctx=this.context;if(!ctx)return;
    const t=Math.max(ctx.currentTime+.002,time);
    const osc=ctx.createOscillator(),gain=ctx.createGain(),low=ctx.createBiquadFilter();
    osc.type=shape;osc.frequency.setValueAtTime(freq,t);
    low.type='lowpass';low.frequency.setValueAtTime(shape==='sine'?4000:2400,t);
    low.frequency.exponentialRampToValueAtTime(500,t+duration);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),t+.009);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(low);low.connect(gain);
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;gain.connect(p);p.connect(destination||this.master);}else gain.connect(destination||this.master);

    const ctx=this.context;if(!ctx||ctx.state!=='running')return;

    // No speech, recordings or text: this is a synthesized musical instrument.
    const vowels={

      u:[[360,.5],[760,.28],[2320,.11]],
      o:[[490,.54],[920,.25],[2500,.1]],
      a:[[810,.44],[1320,.3],[2720,.16]],

    const specs=vowels[choice];

    // The legacy path (Murmur) retains the exact original synthesis values.
    const profile=expression?.voiceprint;

      Number.isFinite(profile.brightness)&&Number.isFinite(profile.warmth)&&
      Number.isFinite(profile.air);

    const pitch=clamp(Number.isFinite(freq)?freq:220,100,750);

    const attack=clamp(Number.isFinite(expression?.attack)?expression.attack:.075,.025,Math.min(.26,len*.33));
    const release=clamp(Number.isFinite(expression?.release)?expression.release:.08,.035,Math.min(.42,len*.35));

    env.gain.linearRampToValueAtTime(peak*.75,onset+Math.max(attack+.004,len-release));
    env.gain.exponentialRampToValueAtTime(.0001,onset+len);
    env.connect(this.mix?.voice||this.master);
    for(const [index,[formant,mix]] of specs.entries()){
      const oscillator=ctx.createOscillator();
      const filter=ctx.createBiquadFilter();
      const weight=ctx.createGain();
      oscillator.type='sawtooth';
      oscillator.frequency.setValueAtTime(pitch*Math.pow(2,glide/12),onset);
      oscillator.frequency.linearRampToValueAtTime(pitch,onset+Math.min(.23,len*.55));
      if(len>1.15){
        // A restrained pitch breath is audible on a held vowel, not an
        // artificial constant vibrato imposed on every little hum.
        oscillator.frequency.linearRampToValueAtTime(pitch*1.003,onset+len*.72);
        oscillator.frequency.linearRampToValueAtTime(pitch,onset+len*.93);

      filter.frequency.setValueAtTime(formant*(distinct?clamp(profile.formant,.75,1.3):1),onset);
      filter.Q.value=choice==='m'?3.5:2.7;
      weight.gain.value=distinct?mix*(index===0?clamp(profile.warmth,.5,1.5):
        index===2?clamp(profile.brightness,.5,1.5):1):mix;

      oscillator.start(onset);oscillator.stop(onset+len+.025);
    }

    if(attack>.09 && this.noise){
      const breath=ctx.createBufferSource(),high=ctx.createBiquadFilter(),air=ctx.createGain();
      breath.buffer=this.noise;high.type='highpass';high.frequency.value=1700;
      air.gain.setValueAtTime(.0001,onset);
      air.gain.linearRampToValueAtTime(Math.max(.0002,volume*.035*(distinct?clamp(profile.air,.5,1.5):1)),onset+.025);
      air.gain.exponentialRampToValueAtTime(.0001,onset+attack);
      breath.connect(high);high.connect(air);air.connect(this.mix?.voice||this.master);

  }
  kick(t,volume=1){

// One authority for both the WebGL drawing buffer and GrooveGrove's scene layout.
// On iOS a rotation can update visualViewport and window sizes on different frames.
let viewportWidth=0,viewportHeight=0,resizeFrame=0,settleTimer=0;
function measuredViewport(){
  const visual=window.visualViewport;
  return {
    width:Math.max(1,Math.round(visual?.width || window.innerWidth || document.documentElement.clientWidth || 1)),
    height:Math.max(1,Math.round(visual?.height || window.innerHeight || document.documentElement.clientHeight || 1))
  };
}
function applyViewportSize(force=false){
  const {width,height}=measuredViewport();
  if(!force && width===viewportWidth && height===viewportHeight)return;
  viewportWidth=width;viewportHeight=height;
  // Resize renderer FIRST, then rebuild all positions from app.screen.
  app.renderer.resize(width,height);
  app.canvas.style.width=width+'px';
  app.canvas.style.height=height+'px';
  buildCanvas();
}
function scheduleViewportSize(){
  cancelAnimationFrame(resizeFrame);
  // Two frames allow Safari's viewport geometry to settle after rotation.
  resizeFrame=requestAnimationFrame(()=>{resizeFrame=requestAnimationFrame(()=>applyViewportSize());});
  clearTimeout(settleTimer);
  settleTimer=setTimeout(()=>applyViewportSize(),330);
}

function moveReaders(){
  if(!grove || !ui.scene)return;
  const smoothing=Math.min(1,Math.max(.06,app.ticker.deltaMS/16.667*.13));
  for(const name of ['Pip','Riff','Murmur']){
    const target=(remoteLive && liveLocations?.[name])||grove.space?.people[name];
    if(!target)continue;
    const avatar=name==='Pip'?ui.pip:name==='Riff'?ui.riff:ui.murmur;
    const displayed=name==='Pip'?ui.pipPos:name==='Riff'?ui.riffPos:ui.vocalPos;
    if(!avatar?.group||!displayed)continue;
    displayed.x+=(target.x-displayed.x)*smoothing;
    displayed.y+=(target.y-displayed.y)*smoothing;
    avatar.group.position.set(displayed.x,displayed.y);
  }
  let desired=null;
  if(camera.mode==='follow')desired=camera.target==='Pip'?ui.pipPos:
    camera.target==='Riff'?ui.riffPos:ui.vocalPos;
  if(camera.mode==='place')desired=PLACES[camera.target]||PLACES.clearing;
  if(desired){
    camera.x+=(desired.x-camera.x)*Math.min(1,smoothing*.92);
    camera.y+=(desired.y-camera.y)*Math.min(1,smoothing*.92);
  }
  const viewTop=landscape?152:187;
  // No fixed-bottom telemetry panel: the woodland owns the lower viewport.
  const viewBottom=H-24;
  const focusY=(viewTop+viewBottom)*.5;
  camera.x=clamp(camera.x,W*.5,WORLD_SIZE.width-W*.5);
  camera.y=clamp(camera.y,focusY-20,WORLD_SIZE.height-(H-focusY)*.5);
  ui.scene.position.set(W*.5-camera.x,focusY-camera.y);
}

function chosenTape(){
  const tapes=grove?.archive?.list()||[];
  tapeSelection=Math.min(Math.max(0,tapeSelection),Math.max(0,tapes.length-1));
  return tapes[tapeSelection]||null;
}
async function toggleTapePlayback(){
  if(tapePlayback){tapePlayback=null;refreshText();return;}
  const item=chosenTape();if(!item)return;
  await startAudio();
  const ctx=sound.context;
  if(!ctx||ctx.state!=='running'){refreshText();return;}
  // The phone's listening experience is separate from what the musicians
  // choose on Railway. Playback never affects simulation skill or memories.
  tapePlayback={id:item.id,next:0,started:ctx.currentTime+.12};
  refreshText();
}
function playRecordedNotes(){
  if(!tapePlayback||!tapesOpen)return;
  const ctx=sound.context,archive=grove?.archive;
  if(!ctx||ctx.state!=='running'||!archive){tapePlayback=null;return;}
  const tape=archive.get(tapePlayback.id);
  if(!tape){tapePlayback=null;refreshText();return;}
  while(tapePlayback.next<tape.events.length){
    const e=tape.events[tapePlayback.next],at=tapePlayback.started+e.ms/1000;
    if(at>ctx.currentTime+.22)break;
    if(at>=ctx.currentTime+.01){
      if(e.kind==='guitar')sound.guitar(e.freq,at,e.volume,e.duration);
      else if(e.kind==='voice')sound.voice(e.freq,at,e.volume,e.duration,e.expression||{});
      else if(e.kind==='violin')sound.violin(e.freq,at,e.volume,e.duration,e.expression||{});
      else sound[e.kind]?.(at,e.volume);
    }
    tapePlayback.next++;
  }
  if(tapePlayback.next===tape.events.length&&
     ctx.currentTime>tapePlayback.started+tape.durationMs/1000+.2){
    tapePlayback=null;refreshText();
  }
}
function refreshTapeViewer(){
  if(!ui.tapesOverlay)return;
  ui.tapesOverlay.visible=tapesOpen;
  const tapes=grove?.archive?.list()||[],clip=chosenTape();
  ui.tapeCount.text=tapes.length+' recorded jams saved · newest first';
  ui.tapeDetails.text=clip?
    'JAM '+(tapeSelection+1)+' / '+tapes.length+'  ·  BARS '+clip.startBar+'–'+clip.endBar+
    '\\n'+clip.participants.join(', ')+'  ·  '+clip.noteCount+' real notes':
    'No recordings yet. The next completed formal jam will become the first tape.';
  ui.tapeStatus.text=tapePlayback?
    'Now playing: '+tapePlayback.id+' · Tap STOP to return to live music':
    'Tap PLAY to hear the actual performance. No ratings, no skill bonuses.';
  if(ui.tapePlayLabel)ui.tapePlayLabel.text=tapePlayback?'■ STOP':'▶ PLAY';
}

function readPairingKey(){
  try{
    const params=new URLSearchParams(location.hash.replace(/^#/,''));
    const key=params.get('grove-key');
    if(key && /^[a-zA-Z0-9_-]{16,120}$/.test(key)){
      localStorage.setItem(SERVER_KEY_STORE,key);
      history.replaceState(null,'',location.pathname+location.search);
    }
    return localStorage.getItem(SERVER_KEY_STORE)||'';
  }catch(e){return '';}
}
async function serverRequest(path,{method='GET',body=null,privateAction=false}={}){
  const headers={};
  if(body)headers['Content-Type']='application/json';
  if(privateAction && serverKey)headers.Authorization='Bearer '+serverKey;
  const res=await fetch(serverBase+path,{
    method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store',
    signal:AbortSignal.timeout(8000)
  });
  const json=await res.json();
  if(!res.ok)throw Error(json.error||'Server HTTP '+res.status);
  return json;
}

async function attachLivingServer(){
  if(!serverBase||remoteLive||connectingServer)return;
  connectingServer=true;
  serverMessage='CONTACTING LIVE GROVE · THEIR MEMORIES ARE SAFE ON RAILWAY';
  refreshText();
  serverKey=readPairingKey();
  try{
    let status=await serverRequest('/v1/state');
    if(!status.initialized && serverKey){
      // Browser profiles do not share localStorage. Never accidentally seed a
      // blank Grove from an in-app browser rather than the player's original.
      const known=(grove.library.known.Pip?.length||0)+(grove.library.known.Riff?.length||0);
      const heard=(grove.understanding.report('Pip').observations||0)+(grove.understanding.report('Riff').observations||0);
      if(!grove.library.books.length || (!known && !heard && !grove.familiarity)){
        serverMessage='PAIRING PAUSED · Open your private link in the SAME browser where Pip and Riff learned their books.';
        grove.push('Memory transfer needs the original browser with their library and journals.');
        refreshText();
        return;
      }
      // One-time transfer only. Actual books and music journals become the
      // server's authoritative world. No factory reset or replacement.
      await serverRequest('/v1/seed',{method:'POST',body:{world:grove.snapshot()},privateAction:true});
      status=await serverRequest('/v1/state');
    }
    if(!status.initialized){
      serverMessage='Waiting for private pairing key; offline Grove continues.';
      return;
    }
    // Compare the authoritative server clock with the phone's last local
    // checkpoint BEFORE replacing local Grove. Counts cannot be faked by UI.
    const priorBar=grove.bar||0;
    const priorPip=grove.understanding.report('Pip').observations||0;
    const priorRiff=grove.understanding.report('Riff').observations||0;
    const serverBar=status.world?.bar||0;
    if(serverBar>priorBar){
      returnReport={
        bars:serverBar-priorBar,
        pip:Math.max(0,(status.world.understanding?.totalBars?.Pip||0)-priorPip),
        riff:Math.max(0,(status.world.understanding?.totalBars?.Riff||0)-priorRiff)
      };
      returnReportUntil=Date.now()+120000;
    }
    remoteLive=true;remoteOnline=true;remoteSequence=status.seq;
    lastSpeechSequence=status.seq;serverLastBeat=status.beat||0;
    acceptRemoteWorld(status.world);
    lastRemoteWorldAt=Date.now();
    grove.push('The grove now keeps playing when you close the page.');
    saveMemory(grove.snapshot());

    remoteTimer=setInterval(pollLivingServer,450);

    lastServerFailure=String(e?.message||e||'network unavailable').slice(0,110);
    serverMessage='LIVE GROVE NOT CONNECTED · '+lastServerFailure+
      (location.origin!==serverHome?' · TAP OPEN LIVE GROVE':' · RETRYING');

      else if(event.kind==='snare')sound.snare(when,v);
      else if(event.kind==='hat')sound.hat(when,v);
      else if(event.kind==='voice')sound.voice(event.freq,when,v,Number(event.duration)||.5,event.expression||{});
      else if(event.kind==='violin')sound.violin(event.freq,when,v,Number(event.duration)||.95,event.expression||{});
    },
    onNote:(event,when)=>{
      if(tapePlayback||event.source==='Recording')return;
      const name=['Pip','Riff','Murmur'].includes(event.source)?event.source:
        event.kind==='guitar'?'Riff':event.kind==='voice'?'Murmur':'Pip';
      const key=name+'/'+event.bar+'/'+event.beat;
      if(playedKeys.has(key))return;
      playedKeys.add(key);
      // Visible drum strikes and strums belong to the actual sound time.
      pendingVisualNotes.push({name,at:when,beat:event.beat,x:event.x,y:event.y});
      if(pendingVisualNotes.length>240)pendingVisualNotes.splice(0,pendingVisualNotes.length-240);
    }
  });
}
function flushLiveVisuals(){
  if(!remoteLive||!pendingVisualNotes.length)return;
  const ctx=sound.context;
  if(!ctx||ctx.state!=='running'){pendingVisualNotes.length=0;return;}
  const now=ctx.currentTime;
  for(let i=0;i<pendingVisualNotes.length;){
    const note=pendingVisualNotes[i];
    if(note.at>now+.04){i++;continue;}
    pendingVisualNotes.splice(i,1);
    if(note.at>=now-.18)emitVisualNote({agent:note.name,beat:note.beat,x:note.x,y:note.y});
  }
}
async function pollLivingServer(){
  if(!remoteLive||remotePolling)return;
  remotePolling=true;
  try{
    const wantWorld=Date.now()-lastRemoteWorldAt>5000;
    const sendAt=performance.now();
    const data=await serverRequest('/v1/poll?since='+remoteSequence+'&compact=1'+(wantWorld?'&world=1':''));
    const receivedAt=performance.now();
    if(Number.isFinite(data.seq) && data.seq<remoteSequence){
      // Railway restart: sequence numbers roll over to a fresh session.
      remoteSequence=0;lastSpeechSequence=0;
      liveConductor.reset();pendingVisualNotes.length=0;
      lastRemoteWorldAt=0;
    }
    // Spoken words are derived from real onTalk exchanges on Railway.
    // They remain visible even if Safari's audio context is suspended.
    for(const ev of data.events||[]){
      if(ev?.kind!=='speech'||!Number.isSafeInteger(ev.seq)||
         ev.seq<=lastSpeechSequence)continue;
      lastSpeechSequence=ev.seq;
      if(Number.isFinite(ev.atMs)&&Math.abs(data.serverNow-ev.atMs)<10000)
        showSpeech(ev.source,ev.message);
    }
    remoteSequence=data.seq;
    if(data.locations)liveLocations=data.locations;
    serverLastBeat=data.beat||serverLastBeat;
    remoteOnline=true;serverMessage='';
    playLivingEvents(data,sendAt,receivedAt);
    if(data.world){
      lastRemoteWorldAt=Date.now();
      acceptRemoteWorld(data.world);
    }else refreshText();
  }catch(e){
    remoteOnline=false;serverMessage='Connection interrupted; the server keeps its own journal.';
    refreshText();
  }finally{remotePolling=false;}
}
async function deliverRemoteBook(type){
  try{
    if(!serverKey)throw Error('Open your private pairing link to donate books.');
    await serverRequest('/v1/donate',{method:'POST',body:{type},privateAction:true});
    lastRemoteWorldAt=0;
    await pollLivingServer();
  }catch(e){
    grove.push('Book delivery failed: '+e.message);
    refreshText();
  }
}
function onScheduledBeat(beat,time){
  grove.onBeatEvent(beat,time,sound);
  if(beat%4===0)refreshText();
}
async function startAudio(force=false){
  if(serverBase&&!remoteLive){
    // The remote simulation must attach first; otherwise an iOS audio
    // failure could accidentally launch and overwrite an empty local world.
    void attachLivingServer();return;
  }
  if(audioStartPending)return;
  if(started && !force && !soundNeedsRefresh && sound.context?.state==='running')return;
  audioStartPending=true;
  const first=!started;
  const repair=force || soundNeedsRefresh || (started && sound.context?.state==='closed');
  try{
    await sound.start(remoteLive?null:onScheduledBeat,{fresh:repair,chime:repair,passive:remoteLive});
    if(remoteLive){liveConductor.reset();pendingVisualNotes.length=0;}
    started=true;startError='';soundNeedsRefresh=false;
    if(repair)grove.push('The audio engine was reconnected without resetting the musicians.');
    else if(first)grove.push(grove.library.anyBusy()?'The music resumes. Interrupted reading continues.':'Pip and Riff begin playing. Neither has been told to form a band.');
  }catch(err){
    soundNeedsRefresh=true;
    startError='Sound needs attention: '+(err?.message||'tap ↻ AUDIO to retry');
  }finally{
    audioStartPending=false;refreshText();
  }
}
// One-finger panning explores the continuous map. A deliberate camera control
// returns to following a musician. No hidden long-press world reset.
app.canvas.addEventListener('pointerdown',(ev)=>{
  const bounds=app.canvas.getBoundingClientRect();
  const lx=(ev.clientX-bounds.left)/scale,ly=(ev.clientY-bounds.top)/scale;
  if(journalOpen||deliveryOpen||tapesOpen)return;
  const button=ui.audioRect;
  if(button && lx>=button.x && lx<=button.x+button.w &&
     ly>=button.y && ly<=button.y+button.h){startAudio(true);return;}
  // Network and audio failures must not disable camera navigation.
  // An empty local grove must not advance independently of the live band.
  if(!remoteLive&&serverBase)void attachLivingServer();
  else void startAudio(soundNeedsRefresh);
  if(ly>(ui.cameraBand?.y||145)+48 && ly<H-14){
    camera.drag={pointerId:ev.pointerId,x:lx,y:ly,startX:camera.x,startY:camera.y,moved:false};
  }
});
app.canvas.addEventListener('pointermove',(ev)=>{
  const d=camera.drag;if(!d||d.pointerId!==ev.pointerId)return;
  const bounds=app.canvas.getBoundingClientRect();
  const x=(ev.clientX-bounds.left)/scale,y=(ev.clientY-bounds.top)/scale;
  if(Math.hypot(x-d.x,y-d.y)>9)d.moved=true;
  if(d.moved){camera.mode='free';camera.x=d.startX-(x-d.x);camera.y=d.startY-(y-d.y);}
});
['pointerup','pointercancel','pointerleave'].forEach(type=>app.canvas.addEventListener(type,()=>{
  camera.drag=null;
}));
function checkpointAndRecover(){
  if(grove)saveMemory(grove.snapshot());
  // A WebKit AudioContext can remain 'running' but silent after a phone call.
  if(started)soundNeedsRefresh=true;
  if(remoteLive){liveConductor.reset();pendingVisualNotes.length=0;lastRemoteWorldAt=0;}
}
function recoverAudioAfterInterruption(){
  if(!document.hidden && started && sound.context){
    // Reassert playback routing even if WebKit does not report interruption.
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(sound.context.state!=='running'){
      soundNeedsRefresh=true;
      try{sound.context.resume().catch(()=>{});}catch(e){}
    }
  }
  refreshText();
}
window.addEventListener('pagehide',checkpointAndRecover);
document.addEventListener('visibilitychange',()=>{
  // Store the precise current book page before iOS suspends the tab.
  if(document.hidden)checkpointAndRecover();
  else recoverAudioAfterInterruption();
});
window.addEventListener('focus',recoverAudioAfterInterruption,{passive:true});
window.addEventListener('pageshow',recoverAudioAfterInterruption,{passive:true});

window.addEventListener('resize',scheduleViewportSize,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleViewportSize,{passive:true});
window.addEventListener('orientationchange',()=>{
  scheduleViewportSize();
  setTimeout(scheduleViewportSize,170);
  setTimeout(scheduleViewportSize,500);
},{passive:true});
window.addEventListener('pageshow',scheduleViewportSize,{passive:true});
const saved=await (async()=>{await openMemory();return loadMemory();})();
grove=new Grove(saved,saveMemory);
// The offline Web Audio transport resumes at the saved musical beat too.
// A held chord from last visit must never suppress hours of fresh guitar.
sound.beat=Math.max(0,grove.bar*4+grove.beat+1);
grove.onNote=emitVisualNote;
grove.onTalk=showSpeech;
applyViewportSize(true);
// Start movement and camera interactions BEFORE any asynchronous fetch.
app.ticker.add(()=>{
  const t=performance.now();
  flushLiveVisuals();
  playRecordedNotes();
  renderEffects(t);
  redrawAccum+=app.ticker.deltaMS;
  if(redrawAccum>150){redrawAccum=0;refreshText();}
});
// The band keeps playing on Railway while a reconnect is attempted.
void attachLivingServer();
setInterval(()=>{
  if(!remoteLive&&!connectingServer&&!document.hidden)void attachLivingServer();
},6500);
// Inspectable test hooks; not part of the rendered interface.
window.GrooveGroveDebug={get state(){return grove.snapshot();},get library(){return grove.library.snapshot();},get journal(){return grove.understanding.snapshot();},get server(){return {connected:remoteLive,online:remoteOnline,message:serverMessage,beat:serverLastBeat,sequence:remoteSequence,returnReport,url:serverBase,audioBuffer:liveConductor.stats};},journalReport(name){return name==='Murmur'?grove.voiceJournal.report():grove.understanding.report(name==='Riff'?'Riff':'Pip');},get voiceJournal(){return grove.voiceJournal.snapshot();},get disciplines(){return grove.disciplines.snapshot();},get knowledgePlayed(){return {...grove.playedKnowledge};},addBook(type){const result=grove.library.donate(type);if(result.ok){grove.push('A copy of '+LIBRARY_CATALOG[type].title+' was delivered.');saveMemory(grove.snapshot());refreshText();}return result;},get errorSeries(){return [...grove.sessionMeasurements];},get logs(){return grove.logs.map(x=>x.message);},get mode(){return grove.mode;},get audioState(){return sound.context?.state||'not started';},get audioNeedsRefresh(){return soundNeedsRefresh;},get audioError(){return startError;},get lastBeat(){return sound.beat;},repairAudio(){return startAudio(true);},get viewport(){return {width:viewportWidth,height:viewportHeight,landscape,scale};},get camera(){return {...camera,drag:null};},get locations(){return liveLocations||grove.space?.snapshot()?.people;},restart(){grove=new Grove(null,saveMemory);grove.onNote=emitVisualNote;grove.onTalk=showSpeech;saveMemory(grove.snapshot());refreshText();}};
