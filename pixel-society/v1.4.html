<canvas id="world" role="application" aria-label="Pixel Society. A living interface formed by individual pixel agents. WILD enables spontaneous local colony patterns. BREAK introduces damage, HEAL speeds local memory exchange. TRAIN tests relays repeatedly. SELECT enables fitness-weighted local inheritance or switches to neutral DRIFT. RELAY tests colored paths from the left edge to the right edge. TRACE freezes the colony and reveals network distance. PLAST toggles activity-dependent connection strengths. PULSE sends a single stochastic signal and reinforces connections it successfully crosses. Repeat PULSE while TRACE is active to train connections on a frozen structure. PATHS displays strong and weak connections. LEARN starts a fixed batch of pulses, REST weakens unused connections without any stimulus, and LEARN again tests whether preferred routes return. Tap TRACE again to resume. While JOBS is on, tap LEAN to compare path-efficiency rewards with CLASSIC recruiting. Tap the statistics for observer view."></canvas>

      const i=ix(x,y);

  function pulseSourcePick(){

    // the left fringe, not a path instructed to the agents.

    let best=-1,score=-1;

    const wants=[JOB.LINKER,JOB.TEXT,JOB.FORMATTER];

      if(count(type)>=target)continue;

  function jobValue(i,m,type){

  function changeCareer(i,m,to){

  function chainCreate(i){

  function chainContacts(c){

        // its button territory, or its worker must touch this line.

        const near=[x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1];

        if(near.some(j=>j>=0&&clan[j]===m.id&&inLeader(m,j%W,(j/W)|0)))found.add(m.id);

  function chainNormalize(){

      const live=c.members.filter(i=>occupation[i]===JOB.LINKER&&chainIds[i]===c.id&&
        (c.axis===0?((i/W)|0)===c.fixed:i%W===c.fixed));

  function chainAbsorb(a,b){

    if(a.hi+1!==b.lo&&b.hi+1!==a.lo)return false;
    const large=a.members.length>=b.members.length?a:b;
    const small=large===a?b:a;

    for(const i of small.members){chainIds[i]=large.id;jobUse[i]=Math.min(255,jobUse[i]+12);}

  function buttonNeedsWorkers(m){

  function jobCareerReview(){
    if(!marketOn||!jobMode)return;
    jobCensus();
    jobIdle=0;
    // Review a rotating fraction of workers, no centralized matching pass.
    // Each pixel weighs only its clan's bulletin, nearby peers and own work.
    for(let y=region.y+12;y<region.y+region.h-2;y++)for(let x=region.x+2;x<region.x+region.w-2;x++){
      const i=ix(x,y),c=clan[i],old=occupation[i];
      if(!c||old===JOB.BUTTON||old===JOB.FOREMAN)continue;
      const m=leaders[c-1];if(!m)continue;
      jobTenure[i]=Math.min(255,jobTenure[i]+1);
      if(jobUse[i]>0)jobUse[i]-=Math.min(jobUse[i],jobTenure[i]%3===0?2:1);
      if((old===JOB.LINKER||old===JOB.FORMATTER)&&jobUse[i]<8&&jobTenure[i]>6)jobIdle++;
      if(jobTenure[i]<5||random()>.14)continue;
      const current=jobValue(i,m,old)+(old===JOB.TEXT?25:13);
      const choices=[JOB.NONE,JOB.LINKER,JOB.FORMATTER];
      // TEXT jobs cannot be self-appointed. The manager must recruit them.
      let bestType=old,best=current;
      for(const type of choices){
        if(type===old)continue;
        if(type===JOB.FORMATTER&&m.formatTarget===0)continue;
        const score=jobValue(i,m,type)+random()*18-9;
        if(score>best+16){best=score;bestType=type;}
      }
      if(bestType!==old)changeCareer(i,m,bestType);
    }

    // 99%. A border linker can be reassigned even when the regular staffing
    // plan says the group already employs enough linkers.
    if(generations%12===0)for(const m of leaders)reclaimBorderLinkers(m);

    // are encountered. A small sampled review also considers border contacts.
    for(let tries=0;tries<Math.min(60,Math.floor(jobTerritory/9));tries++){
      const x=region.x+3+Math.floor(random()*Math.max(1,region.w-6));
      const y=region.y+13+Math.floor(random()*Math.max(1,region.h-16));
      const i=ix(x,y),c=clan[i];if(!c||occupation[i]===JOB.BUTTON)continue;
      const neighbors=[x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1];
      for(const j of neighbors)if(j>=0&&clan[j]&&clan[j]!==c&&occupation[j]===JOB.LINKER){

      for(const m of leaders){m.recentDeliveries=Math.floor(m.recentDeliveries*.90);

  function tickJobs(){

            occupation[workMentor[i]-1]===JOB.FOREMAN&&clan[workMentor[i]-1]===m.id;

          }

        }
        if(clan[i]!==m.id)continue;
        if(occupation[i]===JOB.BUTTON)continue;

        let support=0;
        if(x>0&&role[i-1]===target)support++;
        if(y>0&&role[i-W]===target)support++;

        const foremanHelp=foremanOn&&border&&workOrder[i]>generations&&workMentor[i]>0&&
          occupation[workMentor[i]-1]===JOB.FOREMAN&&clan[workMentor[i]-1]===m.id;
        const obey=.19+support*.095+obedience[i]/700+(foremanHelp?.24:0);

          role[i]=target;conviction[i]=Math.min(255,conviction[i]+8);

            workOrder[i]=0;workMentor[i]=0;

          if(marketOn&&occupation[i]===JOB.TEXT&&text)jobUse[i]=Math.min(255,jobUse[i]+2);
        }
        else if(random()<.004&&occupation[i]===JOB.NONE){role[i]=R.MIST;conviction[i]=30;}

      const frontier=[];
      for(let y=region.y+12;y<region.y+region.h-2;y++)for(let x=region.x+2;x<region.x+region.w-2;x++){
        const i=ix(x,y);if(occupation[i]===JOB.LINKER)frontier.push(i);
      }
      for(let t=0;t<Math.min(marketOn?110:75,frontier.length);t++){

        if(marketOn){
          // Scouts favor the outward edge of a group; still locally grown.
          let best=-Infinity;
          for(let z=0;z<7;z++){
            const k=frontier[Math.floor(random()*frontier.length)],mm=leaders[clan[k]-1];
            if(!mm)continue;
            const kx=k%W,ky=(k/W)|0;
            const near=leaders.filter(v=>v.id!==mm.id).reduce((a,v)=>Math.min(a,Math.abs(kx-(v.x+v.w/2))+Math.abs(ky-(v.y+v.h/2))),1e8);
            const score=-near+random()*16+(inLeader(mm,kx,ky)?0:6);
            if(score>best){best=score;i=k;}
          }
        }
        const m=leaders[clan[i]-1];if(!m)continue;
        const x=i%W,y=(i/W)|0;
        const directions=[i-1,i+1,i-W,i+W],other=leaders.filter(k=>k.id!==m.id);
        const closest=other.reduce((a,k)=>{

          return !a||Math.abs(cx-x)+Math.abs(cy-y)<a.dist?{m:k,dist:Math.abs(cx-x)+Math.abs(cy-y)}:a;
        },null);
        if(!closest)continue;

        directions.sort((a,b)=>{

        const needLink=!marketOn||m.linkers<m.linkTarget;
        const canSteal=marketOn&&j>=0&&j<N&&clan[j]>0&&clan[j]!==m.id&&
          occupation[j]===JOB.LINKER&&buttonNeedsWorkers(m);
        if(j>=0&&j<N&&isField(j)&&(needLink||canSteal)&&random()<(marketOn?.51:.36)){
          if(clan[j]===0){
            jobRecruitAttempts++;
            if(marketOn&&random()<.20+temperament[j]/700)jobOffersRejected++;
            else if(makeWorker(j,m,JOB.LINKER)){m.linkers++;m.workers++;}
          }else if(marketOn&&clan[j]!==0&&clan[j]!==m.id){
            tryPoach(j,m);
          }else if(clan[j]===m.id&&occupation[j]===JOB.NONE&&random()<(marketOn?.43:.55)){
            // In ECON mode, recruitment has to be useful to the new worker.
            if(!marketOn||jobValue(j,m,JOB.LINKER)>jobValue(j,m,JOB.NONE)+12){
              occupation[j]=JOB.LINKER;role[j]=R.CYAN;flash[j]=100;
              if(marketOn){jobSwitches++;m.careerChanges++;jobTenure[j]=0;jobUse[j]=0;}
              m.linkers++;

          }

      }
    }
    if(chainMode&&marketOn&&generations%4===0)tickChains();

    // an anchored, demonstrably working cross-clan path. No full relay flood
    // gets a reward for sheer size. A disconnected town earns nothing.
    if(marketOn&&leanOn&&generations%90===0){

        recordBridge(m,assessment,true);
      }
    }
    if(marketOn&&generations%12===0)jobCareerReview();
    if(generations%30===0)jobCensus();
  }
  function findEfficientBridge(m){
    // Both LEAN and CLASSIC let a maker address all its own linkers.
    // A remote delivery still requires cardinal adjacency through employed
    // LINKER agents. This keeps the *connectivity test identical* between
    // policies; only credit and staffing incentives differ.
    const distance=new Int16Array(N);distance.fill(-1);
    const parent=new Int32Array(N);parent.fill(-1);
    const queue=new Int32Array(N);let head=0,tail=0;
    for(let y=region.y+12;y<region.y+region.h-2;y++)
      for(let x=region.x+2;x<region.x+region.w-2;x++){
        const i=ix(x,y);
        if(occupation[i]===JOB.LINKER&&clan[i]===m.id){distance[i]=0;queue[tail++]=i;}
      }
    let end=-1;
    while(head<tail){
      const i=queue[head++],x=i%W,y=(i/W)|0;
      if(clan[i]!==m.id){end=i;break;}
      const near=[x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1];
      // A physical receiver inside another button accepts the final hop.
      // Only linkers can propagate beyond that receiver.
      for(const j of near)if(j>=0&&clan[j]&&clan[j]!==m.id&&
        leaderByPosition(j%W,(j/W)|0)?.id===clan[j]){
        parent[j]=i;distance[j]=distance[i]+1;end=j;break;
      }
      if(end>=0)break;
      for(const j of near)if(j>=0&&occupation[j]===JOB.LINKER&&clan[j]&&distance[j]<0){
        parent[j]=i;distance[j]=distance[i]+1;queue[tail++]=j;
      }
    }
    if(end<0)return null;
    const path=[];let own=0;
    for(let i=end;i>=0;i=parent[i]){
      path.push(i);if(clan[i]===m.id)own++;
    }
    path.reverse();
    const hops=path.length-1;
    // The same bridge is less efficient with extra paid but unused linkers.
    // Hops and surplus headcount are explicit costs, rather than arbitrary
    // rewards for number of linked pixels or distant flood coverage.
    const surplus=Math.max(0,m.linkers-own);
    const efficiency=Math.max(1,Math.round(100/(1+hops/35+surplus/16)));
    return {path,hops,own,efficiency,surplus,targetClan:clan[end],visited:tail};
  }
  function recordBridge(m,b,award){
    bridgeTrials++;m.bridgeLast=b?1:0;
    if(!b){m.bridgeScore=0;m.bridgeHops=-1;bridgeShortageEvents++;return;}
    bridgeSuccesses++;m.bridgeHits++;m.bridgeScore=b.efficiency;
    m.bridgeHops=b.hops;m.bridgeWorkers=b.own;m.bridgeUntil=generations+300;
    bridgeBest=Math.max(bridgeBest,b.efficiency);bridgeLastHops=b.hops;
    m.bridgeCost=b.surplus;
    if(award){
      // A lean route earns considerably more per contributing agent.
      // No bonus for other linkers, even though they belong to the team.
      const bonus=Math.max(5,Math.round(8+b.efficiency*.78));
      for(const i of b.path)if(occupation[i]===JOB.LINKER){
        // Both the sender and recipient deserve credit for working a bridge.
        jobUse[i]=Math.min(255,jobUse[i]+bonus);
        bridgeMark[i]=generations;
        flash[i]=Math.max(flash[i],90);
        bridgeRewards++;
      }
    }
  }
  function sendJobMessage(m,format=false){
    if(!jobMode)return {sent:false,reason:'JOBS OFF'};
    jobTaps++;
    // A tap is addressed to a real maker, who needs an employed linker.
    const owned=[];
    for(let y=region.y+12;y<region.y+region.h-2;y++)for(let x=region.x+2;x<region.x+region.w-2;x++){
      const i=ix(x,y);if(occupation[i]===JOB.LINKER&&clan[i]===m.id)owned.push(i);
    }
    if(!owned.length){jobNews='NO LINKER FOR '+m.label;metrics=measure();displayStats();return {sent:false,reason:'NO LINKER'};}
    const fmt=leaders.length&&format;
    const formatters=[];
    if(fmt)for(let y=m.y;y<m.y+m.h;y++)for(let x=m.x;x<m.x+m.w;x++){
      const i=ix(x,y);if(occupation[i]===JOB.FORMATTER&&clan[i]===m.id)formatters.push(i);
    }
    if(fmt&&!formatters.length){jobNews='NO FORMATTER FOR '+m.label;metrics=measure();displayStats();return {sent:false,reason:'NO FORMATTER'};}
    jobMessages++;m.recentMessages++;

    // cardinally adjacent chain of employed linkers. No teleportation.
    const q=new Int32Array(N);let head=0,tail=0,best=-1,bestDistance=0;
    for(const i of owned){jobMessageDist[i]=0;q[tail++]=i;}
    while(head<tail){
      const i=q[head++],d=jobMessageDist[i],x=i%W,y=(i/W)|0;
      if(clan[i]!==m.id&&d>bestDistance){best=i;bestDistance=d;}
      const neighbors=[x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1];
      for(const j of neighbors){
        if(j<0||jobMessageDist[j]>=0)continue;
        if(clan[j]&&clan[j]!==m.id&&leaderByPosition(j%W,(j/W)|0)?.id===clan[j]){
          jobMessageDist[j]=d+1;
          if(d+1>=bestDistance){best=j;bestDistance=d+1;}
          continue; // button worker can receive but cannot forward
        }
        if(occupation[j]===JOB.LINKER){jobMessageDist[j]=d+1;q[tail++]=j;}
      }

      if(efficientRoute){

        best=efficientRoute.path[efficientRoute.path.length-1];
        bestDistance=efficientRoute.hops;

      let erased=0;

        const x=fx+dx,y=fy+dy;if(!inBounds(x,y)||dx*dx+dy*dy>16)continue;
        const i=ix(x,y);

      if(marketOn)for(const f of formatters)jobUse[f]=Math.min(255,jobUse[f]+(erased?38:7));

      if(marketOn&&leanOn&&efficientRoute){
        recordBridge(m,efficientRoute,true);
        jobNews='BRIDGE '+efficientRoute.efficiency+' HOPS '+efficientRoute.hops;
      }else if(marketOn){
        // In CLASSIC mode frontier flooding gets the original reward.
        // Only linkers on the observed transmission frontier gain credit.
        // Credit is local, not automatically given to all group workers.
        const stride=Math.max(1,Math.floor(tail/150));

    }
    else jobNews='SENT LOCAL ONLY';
    metrics=measure();displayStats();
    return {sent:true,delivered:best>=0,target:best>=0?clan[best]:0,
      visited:tail,formatted:fmt};
  }

  function update(){
    generations++;

      const x=i%W,y=(i/W)|0;
      exchange(i,x,y);
      const remembered=(knowledge[i]&16)?testimony[i*9+4]:-1;
      const current=role[i];let next=current,support=0;
      nextGenome[i]=genome[i];
      nextFitness[i]=Math.max(0,fitness[i]-(generations%25===0?1:0));
      if(remembered>=0){
        if(x>0&&role[i-1]===remembered)support++;
        if(x<W-1&&role[i+1]===remembered)support++;
        if(y>0&&role[i-W]===remembered)support++;
        if(y<H-1&&role[i+W]===remembered)support++;
      }
      if(wild&&isField(i)){
        // Wild field ignores inherited witness instructions for appearance;
        // it evolves from peers' *current* states, and records what survives.
        next=weave(i,x,y);
        if(selectionOn&&current===R.VOID&&next>=R.CYAN){
          const parent=pickParent(i,x,y);
          if(parent>=0){
            const inheritedColor=role[parent];
            // A highly rewarded parent can override local majority color.
            if(fitness[parent]>=12)next=inheritedColor;
            let gene=genome[parent];
            if(random()<.055){gene^=(1<<Math.floor(random()*8));mutations++;}

        if(next!==R.VOID&&((generations+genome[i])%17===0)){
          let supporters=0;
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            if(!dx&&!dy)continue;
            if(inBounds(x+dx,y+dy)&&role[ix(x+dx,y+dy)]===next)supporters++;
          }
          if(supporters>=2)rememberInvention(i,next);
        }
        observePeers(i,x,y);
        conviction[i]=next===current?Math.min(255,conviction[i]+2):Math.max(0,conviction[i]-5);
      }else if(damage[i]){
        damage[i]--;if(random()<.16)next=Math.floor(random()*7);
        conviction[i]=Math.max(0,conviction[i]-4);
      }else if(remembered>=0){
        if(current===remembered){
          conviction[i]=Math.min(255,conviction[i]+1+support);
          if(random()<(temperament[i]<25?.001:.00015))next=Math.floor(random()*7);
        }else{
          conviction[i]=Math.max(0,conviction[i]-3);
          const listen=.07+support*.06+(temperament[i]/255)*.05+(repairBoost?.40:0);
          if(random()<listen){next=remembered;conviction[i]=30+support*17;}
        }
      }else{
        conviction[i]=Math.max(0,conviction[i]-2);
        if(random()<.025){const j=x>0&&random()<.5?i-1:y>0?i-W:i;next=role[j];}
      }
      nextRole[i]=next;
      const l=life[i],a=age[i];
      if(!isField(i)){nextLife[i]=0;nextAge[i]=0;}
      else if(l===1){
        if(a>=3+(genome[i]%4)){nextLife[i]=2;nextAge[i]=0;}
        else{nextLife[i]=1;nextAge[i]=a+1;}
      }else if(l===2){
        if(a>=12+(genome[i]%17)){nextLife[i]=0;nextAge[i]=0;}
        else{nextLife[i]=2;nextAge[i]=a+1;}
      }else{
        const neighbors=nearby(i,life);
        if((neighbors>0&&random()<Math.min(.55,neighbors*(.085+(genome[i]%5)*.018)))||random()<.00015){
          nextLife[i]=1;nextAge[i]=0;
        }else{nextLife[i]=0;nextAge[i]=0;}
      }
      if(flash[i])flash[i]=Math.max(0,flash[i]-13);
    }
    [role,nextRole]=[nextRole,role];[life,nextLife]=[nextLife,life];[age,nextAge]=[nextAge,age];
    [genome,nextGenome]=[nextGenome,genome];[fitness,nextFitness]=[nextFitness,fitness];
    if(jobMode&&wild&&generations%2===0)tickJobs();
    if(wild){syncWires();if(training&&generations%60===0){relay();pulse();}}
    if(repairBoost)repairBoost--;
    if(generations%30===0){
      if(wild)census();
      metrics=measure();
      if(trial){
        if(generations>=trial.end){
          if(metrics.falseConsensus>=10)trialReport='FALSE HOLDS';
          else if(metrics.disputes>=10)trialReport='STILL SPLIT';
          else if(metrics.wrongCenters>=10)trialReport='UNRESOLVED';
          else trialReport='REPAIRED';
          trial={...trial,final:metrics,completed:true};
        }else trialReport='RUNNING';
        if(trial.completed){history.push({...trial,policy:POLICIES[policy]});trial=null;}
      }
      displayStats();
    }
  }
  const history=[];
  function testRumor(){
    // Fixed observation window: 180 simulation steps, not a proof of stability.
    if(trial)return;
    metrics=measure();const baseline=metrics;
    rumor();trial={start:generations,end:generations+180,baseline,afterInjection:measure()};
    trialReport='RUNNING';displayStats();
  }
  function measure(){
    // The observerTruth field is a DIAGNOSTIC ONLY. No colony behavior reads it.
    // COUNT only testimony with at least 3 independent witnesses as "agreed".
    // A lack of witnesses never counts as harmony or successful repair.
    let total=0,known=0,wrong=0,visible=0,disputes=0,falseConsensus=0;
    let silent=0,weak=0,coherent=0,contested=0,complete=0,originated=0;
    const counts=new Uint8Array(7);
    for(let y=region.y+12;y<region.y+region.h-2;y++)for(let x=region.x+2;x<region.x+region.w-2;x++){
      const i=ix(x,y);total++;
      if(role[i]===observerTruth[i])visible++;
      if(discovered[i])originated++;
      if(knowledge[i]===possible[i])complete++;
      if(knowledge[i]&16){
        known++;if(testimony[i*9+4]!==observerTruth[i])wrong++;
      }
      counts.fill(0);let voices=0;
      const seenRoots=[];
      // 9 overlapping witnesses, with copied assertions deduplicated by root.
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;if(!inBounds(nx,ny))continue;
        const j=ix(nx,ny),bit=(1-dy)*3+1-dx;
        if(!(knowledge[j]&(1<<bit)))continue;
        const root=source[j*9+bit];
        if(!root||seenRoots.includes(root))continue;
        seenRoots.push(root);counts[testimony[j*9+bit]]++;voices++;
      }
      if(!voices){silent++;continue;}
      if(voices<3){weak++;continue;}
      let best=0,winner=0;
      for(let k=0;k<7;k++)if(counts[k]>best){best=counts[k];winner=k;}
      if(best/voices>=.75){
        coherent++;
        if(winner!==observerTruth[i])falseConsensus++;
      }else{contested++;disputes++;}
    }
    const coverage=total?100*(total-silent)/total:0;
    const agreement=total?100*coherent/total:0;
    const disputeRate=total?100*contested/total:0;
    let state='RECOVERING';
    if(coverage<15)state='AMNESIA';
    else if(coverage<55)state='FRAGMENTS';
    else if(disputeRate>10)state='CONFUSION';
    else if(falseConsensus>Math.max(12,total*.08))state=wild?(lastRelay==='LINKED'?'RELAYING':'DIVERGENCE'):'FALSE UNITY';
    else if(agreement>65&&disputeRate<5)state='CONSENSUS';
    return {total,knownCenters:known,wrongCenters:wrong,
      accuracy:total?100*(known-wrong)/total:0,
      visibleAccuracy:total?100*visible/total:0,
      memoryCompleteness:total?100*complete/total:0,
      disputes,contested,silent,weak,coherent,originated,falseConsensus,
      coverage,agreement,disputeRate,state,patches,responses,misses,generations};
  }
  function render(){
    const data=image.data,t=generations;
    for(let i=0,o=0;i<N;i++,o+=4){
      const r=role[i],p=COLORS[r],gene=genome[i];
      let glow=r===0?.35+(gene/255)*.10:.52+conviction[i]/255*.43;
      glow+=(Math.sin(t*.045+gene*.18)+1)*.028;
      let red=p[0]*glow,green=p[1]*glow,blue=p[2]*glow;
      if(jobMode&&isField(i)){
        const j=occupation[i];
        if(j===JOB.BUTTON){red=255;green=213;blue=122;}
        else if(j===JOB.LINKER){red=36;green=225;blue=235;}
        else if(j===JOB.FORMATTER){red=230;green=102;blue=178;}
        else if(j===JOB.TEXT){red=252;green=225;blue=155;}
        else if(j===JOB.FOREMAN){red=164;green=250;blue=116;}
        else if(clan[i]){red*=1.12;green*=1.09;blue*=1.11;}
      }
      if(jobMode&&isField(i)&&clan[i]===0){red*=.12;green*=.12;blue*=.12;}
      if(!jobMode&&life[i]===1){
        const col=COLORS[3+gene%3],energy=age[i];
        red=col[0]*(.75+.12*energy);green=col[1]*(.75+.12*energy);blue=col[2]*(.75+.12*energy);
      }else if(life[i]===2){
        const f=Math.max(0,.50-age[i]/75);red+=70*f;green+=155*f;blue+=175*f;
      }
      if(!traceActive&&wild&&relayTier[i]&&generations-relayLast<64){
        const wave=(generations-relayLast)*3+1,delta=Math.abs(relayTier[i]-wave);
        if(delta<=3){red+=120;green+=150;blue+=145;}
      }
      if(wild&&selectionOn&&fitness[i]>35&&r>=R.CYAN){
        green+=Math.min(30,fitness[i]*.13);
        blue+=Math.min(28,fitness[i]*.10);
      }
      if(inspect&&!traceActive){
        // This is the observer's view, separate from agents' own perception.
        if(!(knowledge[i]&16)){red+=140;green*=.3;blue+=90;}
        else if(observerTruth[i]!==testimony[i*9+4]){red+=155;green+=30;blue+=90;}
        else if(knowledge[i]!==possible[i]){red+=95;green+=70;blue*=.55;}
        else if(r!==0){green+=20;blue+=9;}
        if(discovered[i]){green+=40;blue+=50;}
      }
      if(flash[i]&&!traceActive){red+=flash[i]*.3;green+=flash[i]*.06;blue+=flash[i]*.32;}
      if(wireView&&wild&&isField(i)){
        const x=i%W,y=(i/W)|0;
        let max=0,sum=0,num=0,ghost=false;
        // Endpoints report the strength of their own cardinal connections;
        // there are no graphical wires laid over the agent image.
        const edges=[x<W-1?i*2:-1,x>0?(i-1)*2:-1,
          y<H-1?i*2+1:-1,y>0?(i-W)*2+1:-1];
        for(const k of edges)if(k>=0){
          const w=wires[k];if(w){max=Math.max(max,w);sum+=w;num++;}
          if(engram[k])ghost=true;
        }
        if(num){
          const v=(max*.6+sum/num*.4)/255;
          // Violet = weak, blue = medium, mint-white = strong.
          red=20+120*v;green=18+215*v*v;blue=35+185*v;
          if(ghost&&cycleStage==='RESTED'){red+=65*(1-v);blue+=40*(1-v);}
          if(ghost&&cycleStage==='RELEARNED'){green+=15;blue+=12;}
        }else{red=3;green=8;blue=15;}
      }
      if(traceActive&&!wireView&&isField(i)){
        const d=traceDist[i];
        if(d<0){
          // Preserve a faint map of other components: their lack of color
          // does not mean they are physically beneath this component.
          red=red*.16;green=green*.18;blue=blue*.21;
        }else if(d>traceLayer){
          red=red*.22;green=green*.24;blue=blue*.29;
        }else{
          // Color = shortest graph distance, never screen depth. Blue near
          // the source; teal mid-way; amber and pink at distant hops.
          const u=traceMax?d/traceMax:0;
          if(u<.45){const a=u/.45;red=22+42*a;green=122+110*a;blue=247-70*a;}
          else if(u<.75){const a=(u-.45)/.30;red=64+190*a;green=232-32*a;blue=177-126*a;}
          else {const a=(u-.75)/.25;red=254-7*a;green=200-127*a;blue=51+108*a;}
          // Single traveling frontier: it reaches each location once.
          if(traceElapsed<traceDuration&&traceLayer-d<=2){red=255;green=255;blue=242;}
        }
        if(i===traceSource){red=255;green=255;blue=255;}
      }
      if(pulseSource>=0&&pulseElapsed<pulseDuration&&isField(i)){
        const layer=Math.floor((pulseElapsed/pulseDuration)*(pulseDepth+4));
        const d=pulseDist[i];
        if(d>=0&&d<=layer){
          if(layer-d<=3){red=252;green=252;blue=236;}
          else {red=Math.min(255,red+18);green=Math.min(255,green+60);blue=Math.min(255,blue+125);}
        }
        if(i===pulseSource){red=255;green=240;blue=210;}
      }
      if(jobMode&&chainMode&&occupation[i]===JOB.LINKER&&chainIds[i]){
        const c=chains.get(chainIds[i]);
        if(c&&c.members.length>=3){
          const glow=Math.min(65,c.members.length*1.6);
          red+=c.done?glow*.75:glow*.18;
          green+=glow*.55;blue+=c.done?glow*.14:glow;
        }
      }
      if(jobMode&&jobMessageElapsed<jobMessageDuration&&isField(i)&&jobMessageDist[i]>=0){
        const hop=Math.floor((jobMessageElapsed/jobMessageDuration)*35),d=jobMessageDist[i];
        if(d<=hop){if(hop-d<=2){red=255;green=255;blue=241;}
          else {red+=28;green+=65;blue+=90;}}
      }
      if(plasticOn&&wild&&isField(i)&&!traceActive&&role[i]>=R.CYAN){
        // The most-used local edges add a subtle, persistent electric glow.
        const x=i%W,y=(i/W)|0;let strength=0;
        if(x<W-1)strength=Math.max(strength,wires[i*2]);
        if(x>0)strength=Math.max(strength,wires[(i-1)*2]);
        if(y<H-1)strength=Math.max(strength,wires[i*2+1]);
        if(y>0)strength=Math.max(strength,wires[(i-W)*2+1]);
        const energy=Math.max(0,strength-125)*.22;
        red+=energy*.30;green+=energy*.65;blue+=energy;
      }
      data[o]=Math.min(255,red)|0;data[o+1]=Math.min(255,green)|0;
      data[o+2]=Math.min(255,blue)|0;data[o+3]=255;
    }
    ctx.putImageData(image,0,0);
  }
  function point(e){const b=canvas.getBoundingClientRect();return {
    x:clamp(Math.floor((e.clientX-b.left)*W/b.width),0,W-1),
    y:clamp(Math.floor((e.clientY-b.top)*H/b.height),0,H-1)
  };}
  function activate(e){
    e.preventDefault();pointerDown=true;held=false;
    const p=point(e),i=ix(p.x,p.y),hit=hotspot[i];
    if(['LEARNING','RESTING','RELEARNING'].includes(cycleStage)&&hit>=2&&hit<=9)return;
    if(hit===13)toggleJobs();
    else if(hit===15)toggleMarket();
    else if(hit===16)toggleLean();
    else if(hit===17)toggleChains();
    else if(hit===14){armWipe();metrics=measure();displayStats();}
    else if(hit===10)toggleWireView();
    else if(hit===18)toggleForemen();
    else if(hit===11)beginRest();
    else if(hit===12)beginLearning();
    else if(hit===7)toggleTrace();
    else if(hit===8)togglePlastic();
    else if(hit===9)pulse();
    else if(traceActive&&isField(i)){traceAt(p.x,p.y);}
    else if(hit===1){if(traceActive)toggleTrace();rewild();}
    else if(hit===2){if(traceActive)toggleTrace();disrupt();}
    else if(hit===3){if(traceActive)toggleTrace();heal();}
    else if(hit===4){if(traceActive)toggleTrace();toggleTraining();}
    else if(hit===5){if(traceActive)toggleTrace();toggleSelection();}
    else if(hit===6){if(traceActive)toggleTrace();relay();}
    else if(p.y>=H-63){if(traceActive)toggleTrace();inspect=!inspect;metrics=measure();displayStats();}
    else if(isField(i)){
      if(jobMode&&leaderByPosition(p.x,p.y))jobTap(p.x,p.y);
      else if(wild){if(!respond(p.x,p.y)){misses++;lastProbe='NO RESPONSE';}}else spark(p.x,p.y,4);
      clearTimeout(holdTimer);
      const hx=p.x,hy=p.y;
      holdTimer=setTimeout(()=>{if(pointerDown&&!held){held=true;erase(hx,hy,5);}},550);
    }else spark(region.x+4+Math.floor(random()*Math.max(1,region.w-8)),region.y+Math.floor(region.h/2),3);
    sx=p.x;sy=p.y;try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  }
  canvas.addEventListener('pointerdown',activate,{passive:false});
  canvas.addEventListener('pointermove',e=>{
    if(!pointerDown||held)return;
    const p=point(e);
    if(traceActive)return;
    if(Math.abs(p.x-sx)+Math.abs(p.y-sy)>3){
      clearTimeout(holdTimer);
      if(isField(ix(p.x,p.y)))spark(p.x,p.y,2);
      sx=p.x;sy=p.y;
    }
  });
  function release(){pointerDown=false;clearTimeout(holdTimer);}
  ['pointerup','pointercancel','lostpointercapture'].forEach(k=>canvas.addEventListener(k,release));
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='1'||k==='g'||k==='w')rewild();if(k==='2'||k==='b')disrupt();
    if(k==='3'||k==='h')heal();if(k==='4'||k==='a')toggleTraining();
    if(k==='5'||k==='s')toggleSelection();if(k==='6'||k==='p')relay();
    if(k==='7'||k==='d')toggleTrace();
    if(k==='8'||k==='i')togglePlastic();
    if(k==='9'||k==='u')pulse();
    if(k==='q')toggleForemen();if(k==='v')toggleWireView();if(k==='o')beginRest();if(k==='k')beginLearning();
    if(k==='j')toggleJobs();if(k==='f')armWipe();if(k==='c')toggleMarket();if(k==='z')toggleLean();if(k==='x')toggleChains();
    if(k==='l')rumor();if(k==='r')changePolicy();
    if(k==='t')testRumor();
    if(k==='m'){inspect=!inspect;metrics=measure();displayStats();}
    if(k==='e')erase(Math.floor(W/2),region.y+Math.floor(region.h/2),5);
  });
  let resizeId=0;
  window.addEventListener('resize',()=>{cancelAnimationFrame(resizeId);resizeId=requestAnimationFrame(create);});
  document.addEventListener('visibilitychange',()=>{last=0;accumulator=0;});
  function frameLoop(now){
    if(!last)last=now;
    const elapsed=Math.min(100,now-last);last=now;accumulator+=elapsed;
    if(!document.hidden){
      advancePulse(elapsed);cycleTick(elapsed);
      jobMessageElapsed=Math.min(jobMessageDuration,jobMessageElapsed+elapsed);
      if(traceActive){accumulator=0;tickTrace(elapsed);}
      else{
        let steps=0;
        while(accumulator>=33.333&&steps<3){update();accumulator-=33.333;steps++;}
      }
      render();
    }
    requestAnimationFrame(frameLoop);
  }
  create();requestAnimationFrame(frameLoop);
  const api={
    get status(){return {
      version:'1.4 foremen',jobs:jobReport(),agents:N,generations,policy:POLICIES[policy],
      observerBlueprintOnly:staging===null,metrics:measure(),
      rumors:lies,glitches,erasures,learnedFragments:learned,revisedBeliefs:revisions,
      activeTrial:trial,trialReport,completedTrials:history.slice(-10),
      wild,awakenings,patches,bestPatch,probes,responses,misses,lastProbe,
      selectionOn,training,relayTries,relayWins,relayReach,lastRelay,relayRecords,
      inherited,mutations,activeCarriers:fitness.reduce((n,x)=>n+(x>25),0),
      memory:{stage:cycleStage,wireView,progress:cycleProgress,target:cycleTarget,
        engramEdges,retention:cycleRetention,overlap:cycleOverlap,
        trainingSuccess:firstWins,relearningSuccess:lastWins,
        trainingMeanReach:cycleFirstReach,relearningMeanReach:cycleLastReach,
        frozen:traceActive,revision:cycleSampleVersion},
      plastic:{enabled:plasticOn,edges:activeWires,meanStrengthPercent:avgWire,
        pulseTries,pulseWins,pulseReach,pulseNodes,pulseDepth,pulseLast,
        reinforcedEdges:reinforced,unusedDecayEvents:unusedFade,
        experiments:pulseRecord,source:pulseSource>=0?{x:pulseSource%W,y:(pulseSource/W)|0}:null},
      trace:{active:traceActive,source:traceSource<0?null:{x:traceSource%W,y:(traceSource/W)|0,color:traceSourceColor},nodes:traceNodes,maxHops:traceMax,spanX:traceSpan,detour:traceDetour,layer:traceLayer,finished:traceElapsed>=traceDuration,last:traceLast},
      note:'PATHS visualizes existing local connection strengths; LEARN trains 24 pulses on a frozen snapshot, REST decays them with no pulses, LEARN again measures recovery and fingerprint overlap. Observer-only snapshots do not influence agents. These are designed plasticity/forgetting rules, not brain activity.' 
    };},
    // Manual deterministic exploration hooks for tests; no direct blueprint editing.
    runSteps(n){n=Math.min(5000,Math.max(0,n|0));if(!traceActive)for(let j=0;j<n;j++)update();render();return this.status;},
    trace:toggleTrace,traceAuto:autoTrace,traceAt,plastic:togglePlastic,pulse,
    jobs:toggleJobs,jobStart:startJobs,jobArmWipe:armWipe,jobMarket:toggleMarket,
    lean:toggleLean,chains:toggleChains,chainReport,foremen:toggleForemen,jobTap,jobReport,
    jobAt(x,y){if(!inBounds(x|0,y|0))return null;const i=ix(x|0,y|0);
      return {job:JOB_NAMES[occupation[i]],clan:clan[i],role:role[i],known:knowledge[i],
        signalHop:jobMessageDist[i],obedience:obedience[i],aptitudes:{worker:jobAptitude(i,JOB.NONE),
          linker:jobAptitude(i,JOB.LINKER),formatter:jobAptitude(i,JOB.FORMATTER),text:jobAptitude(i,JOB.TEXT),foreman:jobAptitude(i,JOB.FOREMAN)},
        performance:jobUse[i],tenure:jobTenure[i],orderUntil:workOrder[i],
        supervisor:workMentor[i]?{x:(workMentor[i]-1)%W,y:Math.floor((workMentor[i]-1)/W)}:null,
        lean:leanOn,chainId:chainIds[i]||0};},
    paths:toggleWireView,rest:beginRest,learn:beginLearning,
    cycleAdvance(ms){cycleTick(clamp(Number(ms)||0,0,1000));render();return this.status.memory;},
    traceDistanceAt(x,y){
      x=x|0;y=y|0;return inBounds(x,y)?traceDist[ix(x,y)]:-1;
    },
    advanceTrace(ms){tickTrace(clamp(Number(ms)||0,0,30000));advancePulse(clamp(Number(ms)||0,0,30000));render();return this.status.trace;},
    wireAt(x,y,dir=0){x=x|0;y=y|0;return inBounds(x,y)?wires[ix(x,y)*2+(dir===1?1:0)]:0;},
    lie:rumor,break:disrupt,heal,rule:changePolicy,test:testRumor,
    wild:rewild,probe,relay,train:toggleTraining,select:toggleSelection,observe:measure,census,reset:create,
    reseed(n){seed=(Number(n)>>>0)||0x7ac58c3e;create();return this.status;}
  };
  Object.defineProperty(window,'pixelSociety',{value:api,configurable:false});
})();
