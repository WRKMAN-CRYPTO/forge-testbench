function pointer(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();let p=pointer(e);drag={...p,t:Date.now(),moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||menu)return;let p=pointer(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){let area={w:W-16,h:H-(H>650?245:197)};let scale=Math.min(area.w/800,area.h/520)*camera.zoom;camera.x=clamp(camera.x-dx/scale,0,800);camera.y=clamp(camera.y-dy/scale,0,520)}drag.x=p.x;drag.y=p.y});canvas.addEventListener('pointerup',e=>{let p=pointer(e);if(drag&&!drag.moved){for(let b of ui.slice().reverse())if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();drag=null;return}if(!menu){let top=H>650?90:75,bottom=H>650?155:122,area={x:8,y:top,w:W-16,h:H-top-bottom},scale=Math.min(area.w/800,area.h/520)*camera.zoom,wx=(p.x-area.x-area.w/2)/scale+camera.x,wy=(p.y-area.y-area.h/2)/scale+camera.y;let nearest=null,d=1e9;for(let a of agents){let q=Math.hypot(wx-a.x,wy-a.y);if(q<d){nearest=a;d=q}}if(d<Math.max(18,22/scale)){selected=nearest;menu='inspect'}}}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=clamp(camera.zoom*(e.deltaY>0?.9:1.1),.65,3)},{passive:false});let touchDist=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDist)camera.zoom=clamp(camera.zoom*d/touchDist,.65,3);touchDist=d;drag=null}},{passive:false});canvas.addEventListener('touchend',()=>touchDist=null);
