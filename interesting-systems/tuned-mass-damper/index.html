<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuned Mass Damper Lab</title><style>body{font-family:system-ui;background:#10130f;color:#f4f0df;margin:0;padding:18px}main{max-width:650px;margin:auto}.box{background:#181d17;border:1px solid #3a4338;border-radius:14px;padding:15px;margin:12px 0}input{width:100%;margin:8px 0 18px}.bar{height:28px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;background:#d7c85a;width:20%}button{width:100%;min-height:48px;background:#22291f;color:#f4f0df;border:1px solid #d7c85a;border-radius:10px;font-weight:700}.muted{color:#aaa98f}b{color:#d7c85a}</style></head><body><main><h1>Tuned Mass Damper Lab</h1><p class="muted">Tune a small secondary oscillator to reduce vibration in a larger structure.</p><div class="box"><label>Forcing frequency <b id="fv">1.00</b>×</label><input id="f" type="range" min="50" max="150" value="100"><label>Damper tuning <b id="tv">1.00</b>×</label><input id="t" type="range" min="50" max="150" value="100"><label>Damper mass <b id="mv">5</b>%</label><input id="m" type="range" min="1" max="20" value="5"><button id="tog">Damper: ON</button></div><div class="box"><p>Main structure motion: <b id="out"></b></p><div class="bar"><div class="fill" id="fill"></div></div><p id="msg" class="muted"></p></div><script>const f=document.getElementById('f'),t=document.getElementById('t'),m=document.getElementById('m'),out=document.getElementById('out'),fill=document.getElementById('fill'),msg=document.getElementById('msg'),tog=document.getElementById('tog');let on=true;function calc(){let r=f.value/100,tu=t.value/100,mu=m.value/100;fv.textContent=r.toFixed(2);tv.textContent=tu.toFixed(2);mv.textContent=m.value;let resonance=1/(.08+Math.abs(1-r));let match=Math.max(0,1-Math.abs(r-tu)*3);let reduction=on?Math.min(.85,match*mu*8):0;let motion=resonance*(1-reduction);out.textContent=motion.toFixed(2)+'×';fill.style.width=Math.min(100,motion*8)+'%';msg.textContent=on?'Move the tuning away from the forcing frequency, then bring it back. The small mass only helps strongly when its rhythm matches the disturbance.':'This is the undamped baseline. Turn the damper on to compare.'}tog.onclick=()=>{on=!on;tog.textContent='Damper: '+(on?'ON':'OFF');calc()};[f,t,m].forEach(x=>x.oninput=calc);calc();</script></main></body></html>
