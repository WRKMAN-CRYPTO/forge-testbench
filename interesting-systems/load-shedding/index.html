<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Load Shedding Lab</title><style>:root{color-scheme:dark;--bg:#10130f;--p:#181d17;--ink:#f4f0df;--muted:#aaa98f;--line:#3a4338;--a:#d7c85a;--bad:#d87965}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,monospace}main{max-width:700px;margin:auto;padding:18px 14px 40px}h1{margin:0 0 5px;font-size:28px}p{color:var(--muted);line-height:1.45}.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:12px 0}input{width:100%;accent-color:var(--a)}button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#22281f;color:var(--ink);padding:8px 13px;font:inherit}.bar{height:18px;background:#252b23;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--a);transition:width .15s}.bad{background:var(--bad)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:9px;background:#121611;border-radius:9px;text-align:center}.big{font-size:21px;font-weight:900}.small{font-size:10px;color:var(--muted)}label{display:block;color:var(--muted);font-size:12px}.switch{display:flex;gap:8px;flex-wrap:wrap}.active{border-color:var(--a);color:var(--a)}</style></head><body><main><h1>LOAD SHEDDING LAB</h1><p>A service has finite capacity. Decide whether overload should queue everything or deliberately discard low-value work to protect important work.</p><div class="panel"><label>Service capacity: <b id="cv">60</b> jobs/tick</label><input id="cap" type="range" min="20" max="100" value="60"><label>Incoming load: <b id="lv">80</b> jobs/tick</label><input id="load" type="range" min="10" max="160" value="80"><label>Critical share: <b id="pv">30</b>%</label><input id="priority" type="range" min="5" max="80" value="30"><div class="switch"><button id="queue" class="active">QUEUE ALL</button><button id="shed">SHED LOW-VALUE</button></div></div><div class="panel"><div class="row"><span>Backlog pressure</span><b id="pressure">0%</b></div><div class="bar"><div id="bar" class="fill" style="width:0%"></div></div><div class="stats" style="margin-top:12px"><div class="stat"><div id="done" class="big">0</div><div class="small">COMPLETED</div></div><div class="stat"><div id="crit" class="big">0</div><div class="small">CRITICAL DONE</div></div><div class="stat"><div id="drop" class="big">0</div><div class="small">DROPPED</div></div></div><p id="msg">Press STEP to feed the system.</p><button id="step">STEP × 1</button><button id="ten">STEP × 10</button><button id="reset">RESET</button></div><script>(()=>{const $=x=>document.getElementById(x),cap=$('cap'),load=$('load'),pri=$('priority');let mode='queue',back=0,done=0,crit=0,drop=0;function labels(){$('cv').textContent=cap.value;$('lv').textContent=load.value;$('pv').textContent=pri.value}function render(){let pressure=Math.min(100,Math.round(back/(+cap.value*5)*100));$('pressure').textContent=pressure+'%';$('bar').style.width=pressure+'%';$('bar').className='fill'+(pressure>70?' bad':'');$('done').textContent=done;$('crit').textContent=crit;$('drop').textContent=drop;$('msg').textContent=mode==='queue'?'Everything is admitted. Overload becomes backlog, so urgent work eventually waits behind old work.':'Low-value excess is rejected first. The service sacrifices completeness to preserve critical throughput.'}function tick(){let C=+cap.value,L=+load.value,P=+pri.value/100,critical=Math.round(L*P),normal=L-critical;if(mode==='queue'){back+=L;let served=Math.min(C,back);done+=served;crit+=Math.round(served*P);back-=served}else{let serveCrit=Math.min(C,critical);let left=C-serveCrit;let serveNormal=Math.min(left,normal);crit+=serveCrit;done+=serveCrit+serveNormal;drop+=L-serveCrit-serveNormal;back=Math.max(0,back-Math.max(0,C-L))}render()}[cap,load,pri].forEach(x=>x.addEventListener('input',()=>{labels();render()}));$('queue').onclick=()=>{mode='queue';$('queue').className='active';$('shed').className='';render()};$('shed').onclick=()=>{mode='shed';$('shed').className='active';$('queue').className='';render()};$('step').onclick=tick;$('ten').onclick=()=>{for(let i=0;i<10;i++)tick()};$('reset').onclick=()=>{back=done=crit=drop=0;render()};labels();render()})();</script></main></body></html>
