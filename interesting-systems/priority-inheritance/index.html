<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Priority Inheritance Lab</title><style>:root{color-scheme:dark;--bg:#10130f;--panel:#181d17;--ink:#f4f0df;--muted:#aaa98f;--line:#3a4338;--accent:#d7c85a;--bad:#d47b68;--good:#78b98b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:720px;margin:auto;padding:18px 14px 40px}h1{font-size:25px;margin:0 0 6px}p{color:var(--muted);line-height:1.45}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap}button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:#20271f;color:var(--ink);padding:9px 12px;font:inherit;font-weight:800}button.primary{border-color:var(--accent);color:var(--accent)}label{display:flex;gap:9px;align-items:center;margin:8px 0}.task{display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center;margin:9px 0}.bar{height:14px;background:#292f27;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .15s}.muted{color:var(--muted);font-size:12px}.log{min-height:118px;white-space:pre-wrap;line-height:1.45}.good{color:var(--good)}.bad{color:var(--bad)}</style></head><body><main><h1>PRIORITY INHERITANCE LAB</h1><p>A scheduler experiment: a low-priority task holds a lock that a high-priority task needs, while a medium task keeps stealing the CPU.</p><section class="panel"><label><input id="inherit" type="checkbox"> Enable priority inheritance</label><div class="row"><button class="primary" id="step">STEP</button><button id="run">RUN 12 TICKS</button><button id="reset">RESET</button></div></section><section class="panel"><div class="task"><b>HIGH</b><div class="bar"><div id="hbar" class="fill"></div></div><span id="hs"></span></div><div class="task"><b>MEDIUM</b><div class="bar"><div id="mbar" class="fill"></div></div><span id="ms"></span></div><div class="task"><b>LOW 🔒</b><div class="bar"><div id="lbar" class="fill"></div></div><span id="ls"></span></div><p class="muted">LOW starts holding the lock. HIGH arrives immediately and blocks on it. MEDIUM needs no lock.</p></section><section class="panel"><b>Scheduler trace</b><div id="log" class="log" aria-live="polite"></div></section><script>(()=>{const $=x=>document.getElementById(x);let s;function reset(){s={tick:0,h:4,m:7,l:4,lock:true,log:[]};render()}function effective(){if($('inherit').checked&&s.lock&&s.h>0)return 'L';if(s.h>0&&!s.lock)return'H';if(s.m>0)return'M';if(s.l>0)return'L';return'-'}function step(){if(!s.h&&!s.m&&!s.l)return;let t=effective();s.tick++;if(t==='H')s.h--;if(t==='M')s.m--;if(t==='L'){s.l--;if(s.l===0){s.lock=false;s.log.push(`t${s.tick}: LOW releases lock`);}}let note=t==='M'&&s.lock?'  ← HIGH waits':t==='L'&&$('inherit').checked&&s.lock?'  ← inherited HIGH priority':'';s.log.push(`t${s.tick}: CPU → ${t}${note}`);render()}function render(){let vals=[['h',4],['m',7],['l',4]];vals.forEach(([x,max])=>{$(x+'bar').style.width=(s[x]/max*100)+'%';$(x+'s').textContent=s[x]?'work '+s[x]:'done'});$('log').textContent=s.log.slice(-9).join('\n')||'Press STEP. Watch who gets the CPU.';if(!s.h)$('log').className='log good';else if(s.tick>=8&&s.lock)$('log').className='log bad';else $('log').className='log'}$('step').onclick=step;$('run').onclick=()=>{for(let i=0;i<12;i++)step()};$('reset').onclick=reset;$('inherit').onchange=render;reset()})();</script></main></body></html>
