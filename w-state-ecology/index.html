function resize(){const r=c.getBoundingClientRect(),d=clamp(devicePixelRatio||1,1,1.3),nw=Math.max(300,Math.round(r.width*d)),nh=Math.max(210,Math.round(r.width*.694*d));if(nw===c.width&&nh===c.height)return;const sx=nw/S.w,sy=nh/S.h;S.w=nw;S.h=nh;c.width=nw;c.height=nh;S.cols=Math.max(1,Math.ceil(S.w/S.cell));S.rows=Math.max(1,Math.ceil(S.h/S.cell));S.head=new Int16Array(S.cols*S.rows);for(const list of[S.a,S.b,S.food,S.waste,S.threat,S.meteor])for(const o of list){o.x*=sx;o.y*=sy;if(o.r)o.r*=(sx+sy)*.5}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function use(x,y){TOOL.get(S.toolW).act(x,y)}c.addEventListener('pointerdown',e=>{const p=pos(e);c.setPointerCapture(e.pointerId);S.pointerW=810100+e.pointerId;S.px=p.x;S.py=p.y;use(p.x,p.y)});c.addEventListener('pointermove',e=>{if(S.pointerW!==810100+e.pointerId||S.toolW===W.TM)return;const p=pos(e),x=p.x-S.px,y=p.y-S.py;if(x*x+y*y<500)return;S.px=p.x;S.py=p.y;use(p.x,p.y)});const rel=e=>{if(S.pointerW===810100+e.pointerId)S.pointerW=W.PN};c.addEventListener('pointerup',rel);c.addEventListener('pointercancel',rel);c.addEventListener('contextmenu',e=>e.preventDefault());
ui.food.addEventListener('click',()=>{S.toolW=W.TF;ui.msg.textContent='Food tool selected.';hud()});ui.threat.addEventListener('click',()=>{S.toolW=W.TT;ui.msg.textContent='Threat tool selected.';hud()});ui.meteor.addEventListener('click',()=>{S.toolW=W.TM;ui.msg.textContent='Meteor selected. Tap a target.';hud()});$('seasonBtn').addEventListener('click',()=>{S.seasonW=S.seasonW===W.BLOOM?W.HEAT:(S.seasonW===W.HEAT?W.FROST:W.BLOOM);ui.msg.textContent='Season changed.';hud()});ui.pause.addEventListener('click',()=>{S.engineW=S.engineW===W.RUN?W.PAUSE:W.RUN;ui.msg.textContent=S.engineW===W.RUN?'Ecology resumed.':'Ecology paused.';hud()});
function reset(){S.a.length=S.b.length=S.food.length=S.waste.length=S.threat.length=S.meteor.length=0;S.cleaned=0;S.destroyed=0;S.engineW=W.RUN;S.seasonW=W.BLOOM;S.toolW=W.TF;S.renderW=W.RF;S.pointerW=W.PN;for(let i=0;i<420;i++)agent(rand(20,S.w-20),rand(20,S.h-20),rand(64,106));for(let i=0;i<48;i++)bottom(rand(20,S.w-20),rand(S.h*.55,S.h-20),rand(62,90));for(let i=0;i<10;i++)addFood(rand(28,S.w-28),rand(28,S.h-28),rand(95,175));for(let i=0;i<5;i++)addWaste(rand(30,S.w-30),rand(S.h*.48,S.h-25),rand(12,26));ui.msg.textContent='Ecology reset.';hud()}$('reset').addEventListener('click',reset);function loop(t){if(!app.isConnected)return;const dt=clamp((t-S.last)/1000,.001,.033);S.last=t;S.ff++;if(t-S.fc>500){S.fps=S.ff*1000/(t-S.fc);S.ff=0;S.fc=t;hud()}ENGINE.get(S.engineW).tick(dt);render();requestAnimationFrame(loop)}new ResizeObserver(resize).observe(c);resize();reset();S.last=performance.now();S.fc=S.last;requestAnimationFrame(loop)})();
