<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WRKMAN Elastic Matter</title><style>*{touch-action:none;user-select:none;-webkit-user-select:none}body{margin:0;background:#08111b;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas></canvas><script>
function lab(kind='chain'){
const bodies=[],nodes=[],springs=[],links=[],M=12,R=4,area0=M*R*R*Math.sin(2*Math.PI/M)/2;let k=.18,bulk=.12,damping=.025,cohesion=.08,tick=0,grab=null,material='elastic',activation=0,axis=0,work=0;
function spring(a,b,rest,list=springs){list.push({a,b,rest,original:rest,angle:Math.atan2(b.y-a.y,b.x-a.x)})}
function body(x,y){let b=[];for(let j=0;j<M;j++){let a=j*2*Math.PI/M,p={x:x+R*Math.cos(a),y:y+R*Math.sin(a),vx:0,vy:0,fx:0,fy:0,id:nodes.length,body:bodies.length};nodes.push(p);b.push(p)}for(let j=0;j<M;j++){let a=b[j],q=b[(j+1)%M];spring(a,q,Math.hypot(a.x-q.x,a.y-q.y));let z=b[(j+6)%M];if(j<6)spring(a,z,2*R)}bodies.push(b)}
let cols=kind==='chain'?10:kind==='sheet'?7:5,rows=kind==='chain'?1:kind==='sheet'?5:5;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(kind==='cluster'&&Math.hypot(x-2,y-2)>2.5)continue;body(50+(x-(cols-1)/2)*9,50+(y-(rows-1)/2)*9)}
function center(b){return {x:b.reduce((s,p)=>s+p.x,0)/M,y:b.reduce((s,p)=>s+p.y,0)/M}}
for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=center(bodies[i]),b=center(bodies[j]);if(Math.hypot(a.x-b.x,a.y-b.y)>9.1)continue;let best=Infinity,p,q;for(let u of bodies[i])for(let v of bodies[j]){let d=Math.hypot(u.x-v.x,u.y-v.y);if(d<best){best=d;p=u;q=v}}spring(p,q,best,links)}
function area(b){return b.reduce((s,p,i)=>{let q=b[(i+1)%M];return s+p.x*q.y-p.y*q.x},0)/2}
function force(s,st){let dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,d=Math.hypot(dx,dy)||1e-9,f=st*(d-s.rest)/d;s.a.fx+=f*dx;s.a.fy+=f*dy;s.b.fx-=f*dx;s.b.fy-=f*dy}
function step(){for(let s of springs){let d=Math.hypot(s.a.x-s.b.x,s.a.y-s.b.y),old=s.rest;if(material==='plastic'&&Math.abs(d-s.rest)>.15*s.rest)s.rest=Math.max(.35*s.original,Math.min(2.5*s.original,s.rest+.008*(d-s.rest)));if(material==='adaptive')s.rest=s.original*(1-.35*activation*Math.cos(s.angle-axis)**2);work+=.5*k*((d-s.rest)**2-(d-old)**2)}for(let p of nodes)p.fx=p.fy=0;for(let s of springs)force(s,k);for(let s of links)force(s,cohesion);for(let b of bodies){let f=bulk*(area0-area(b))/area0;for(let i=0;i<M;i++){let p=b[i],a=b[(i+M-1)%M],q=b[(i+1)%M];p.fx+=f*(q.y-a.y)/2;p.fy+=f*(a.x-q.x)/2}}
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j];if(a.body===b.body)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<1.5){let f=.35*(1.5-d)/d;a.fx-=f*dx;a.fy-=f*dy;b.fx+=f*dx;b.fy+=f*dy}}
if(grab){let p=grab.p;p.fx+=.35*(grab.x-p.x);p.fy+=.35*(grab.y-p.y)}
for(let p of nodes){p.vx=(p.vx+p.fx*.2)*(1-damping*.2);p.vy=(p.vy+p.fy*.2)*(1-damping*.2);p.x+=p.vx*.2;p.y+=p.vy*.2;if(p.x<1||p.x>99){p.x=Math.max(1,Math.min(99,p.x));p.vx*=-.5}if(p.y<1||p.y>99){p.y=Math.max(1,Math.min(99,p.y));p.vy*=-.5}}tick++}
function stats(){let elastic=0,kinetic=0,tension=0,compression=0;for(let s of springs.concat(links)){let d=Math.hypot(s.a.x-s.b.x,s.a.y-s.b.y)-s.rest;elastic+=.5*(springs.includes(s)?k:cohesion)*d*d;if(d>0)tension+=d;else compression-=d}for(let b of bodies)elastic+=.5*bulk*(area(b)-area0)**2/area0;for(let p of nodes)kinetic+=.5*(p.vx*p.vx+p.vy*p.vy);return {tick,elastic,kinetic,tension,compression,work,restChange:springs.reduce((a,s)=>a+Math.abs(s.rest/s.original-1),0)/springs.length}}
function squeeze(f=.75){for(let b of bodies){let c=center(b);for(let p of b){p.x=c.x+(p.x-c.x)*f;p.y=c.y+(p.y-c.y)/f}}}
return {get material(){return material},set material(v){material=v;activation=0;for(let s of springs)s.rest=s.original},get activation(){return activation},set activation(v){activation=v},get axis(){return axis},set axis(v){axis=v},bodies,nodes,springs,links,area,area0,step,stats,squeeze,center,get k(){return k},set k(v){k=v},get bulk(){return bulk},set bulk(v){bulk=v},get damping(){return damping},set damping(v){damping=v},get cohesion(){return cohesion},set cohesion(v){cohesion=v},set grab(v){grab=v},get grab(){return grab}}
}
(function(){let cv=document.querySelector('canvas'),g=cv.getContext('2d'),kind='chain',m=lab(kind),run=false,speed=4,W,H,hit=[],box={},history=[],view=0;function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function txt(s,x,y,z=12,c='#c7dbe6'){g.fillStyle=c;g.font=z+'px system-ui';g.fillText(s,x,y)}function row(items,x,y,w){let a=w/items.length;items.forEach(([s,f],i)=>{let xx=x+i*a;g.fillStyle='#173142';g.fillRect(xx,y,a-3,29);txt(s,xx+5,y+19,11);hit.push({x:xx,y,w:a-3,h:29,f})})}function reset(){m=lab(kind);history=[];run=false}function cycle(k,vals){let i=vals.findIndex(v=>Math.abs(v-m[k])<1e-8);m[k]=vals[(i+1)%vals.length]}function save(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({kind,history,settings:{material:m.material,activation:m.activation,axis:m.axis,k:m.k,bulk:m.bulk,damping:m.damping,cohesion:m.cohesion},nodes:m.nodes,restLengths:m.springs.map(s=>s.rest)})],{type:'application/json'}));a.download='elastic-matter-002.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function draw(){hit=[];g.fillStyle='#08111b';g.fillRect(0,0,W,H);txt('WRKMAN / ELASTIC MATTER 002',8,20,14,'#70dbe3');let wide=W>H,w=wide?Math.min(350,W*.47):W-16,s=Math.max(30,Math.min(wide?W-w-24:W-16,wide?H-40:H-375)),x=wide?8:(W-s)/2,y=wide?32:66,px=wide?W-w:8,py=wide?32:y+s+6;box={x,y,s};row([[run?'Pause':'Run',()=>run=!run],['Reset',reset],[kind,()=>{kind=['chain','sheet','cluster'][(['chain','sheet','cluster'].indexOf(kind)+1)%3];reset()}],['Export',save]],wide?px:8,wide?py:30,w);g.fillStyle='#0d1c28';g.fillRect(x,y,s,s);let X=p=>x+p.x*s/100,Y=p=>y+p.y*s/100;for(let l of m.links){let d=Math.hypot(l.a.x-l.b.x,l.a.y-l.b.y)-l.rest;g.strokeStyle=d>0?'#f5a96a':'#58a8ed';g.lineWidth=1;g.beginPath();g.moveTo(X(l.a),Y(l.a));g.lineTo(X(l.b),Y(l.b));g.stroke()}for(let b of m.bodies){let a=m.area(b)/m.area0;g.fillStyle=view===0?'hsl('+Math.max(0,Math.min(190,190*a))+' 65% 48%)':'#238e9d';g.strokeStyle='#9ee4e7';g.beginPath();b.forEach((p,i)=>i?g.lineTo(X(p),Y(p)):g.moveTo(X(p),Y(p)));g.closePath();g.fill();g.stroke();if(view)for(let p of b){g.fillStyle='#fff';g.fillRect(X(p)-1,Y(p)-1,2,2)}}let t=m.stats(),yy=wide?py+34:py;txt('Tick '+t.tick+' | Elastic '+t.elastic.toFixed(3)+' | Motion '+t.kinetic.toFixed(3),px,yy+13,11);row([['Squeeze',()=>{m.squeeze();run=false}],['Release / run',()=>{m.grab=null;run=true}],['Speed '+speed,()=>speed=speed===16?1:speed*2]],px,yy+20,w);row([['Skin '+m.k,()=>cycle('k',[.08,.18,.35,.6])],['Area '+m.bulk,()=>cycle('bulk',[.04,.12,.3,.6])]],px,yy+52,w);row([['Damp '+m.damping,()=>cycle('damping',[0,.025,.1,.3])],['Cohesion '+m.cohesion,()=>cycle('cohesion',[0,.04,.08,.2])]],px,yy+84,w);row([['View '+(view?'nodes':'area'),()=>view=1-view],['Step',()=>{run=false;m.step()}]],px,yy+116,w);row([[m.material,()=>{m.material=['elastic','plastic','adaptive'][(['elastic','plastic','adaptive'].indexOf(m.material)+1)%3]}],['Act '+Math.round(m.activation*100)+'%',()=>cycle('activation',[0,.25,.5,.75,1])],['Axis '+Math.round(m.axis*180/Math.PI),()=>m.axis=(m.axis+Math.PI/4)%Math.PI]],px,yy+148,w);txt('Rest change '+(100*t.restChange).toFixed(1)+'% | Work '+t.work.toFixed(2),px,yy+193,11);txt('Stretch '+t.tension.toFixed(2)+' | Compression '+t.compression.toFixed(2),px,yy+210,11);txt('Drag membrane points. Act affects adaptive mode.',px,yy+227,11)}
function pos(e){return {x:(e.clientX-box.x)*100/box.s,y:(e.clientY-box.y)*100/box.s}}cv.addEventListener('pointerdown',e=>{let b=hit.find(b=>e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h);if(b){b.f();return}let q=pos(e),p=m.nodes.reduce((a,b)=>Math.hypot(b.x-q.x,b.y-q.y)<Math.hypot(a.x-q.x,a.y-q.y)?b:a);if(Math.hypot(p.x-q.x,p.y-q.y)<7){m.grab={p,...q};run=true;cv.setPointerCapture(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(m.grab)Object.assign(m.grab,pos(e))});for(let e of ['pointerup','pointercancel'])cv.addEventListener(e,()=>m.grab=null);function frame(){if(run)for(let i=0;i<speed;i++){m.step();if((i===0)&&m.stats().tick%20<speed){history.push(m.stats());if(history.length>5000)history.shift()}}draw();requestAnimationFrame(frame)}frame()})();</script></body></html>
