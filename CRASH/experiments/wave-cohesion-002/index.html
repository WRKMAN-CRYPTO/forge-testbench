<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CRASH | Wave Chamber 002</title><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;overflow:hidden;background:#060b13}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas aria-label="Wave chamber"></canvas><script>function engine(seed=1001,count=360){
 const N=96,S=N*N,TAU=Math.PI*2,wrap=(x,n=N)=>((x%n)+n)%n,cl=(v,a,b)=>Math.max(a,Math.min(b,v));let rng=seed>>>0||1;

}
