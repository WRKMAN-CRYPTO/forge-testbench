<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CRASH | Geometry Lab 001</title><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;overflow:hidden;background:#060b13}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas aria-label="Wave chamber"></canvas><script>
function lab(N=96,shape='square',boundary='absorbing',population=0){
if(shape==='circle'&&boundary==='periodic')throw Error('Circular periodic boundary undefined');
const S=N*N,C=(N-1)/2,R=C-1,wrap=x=>(x+N)%N,arr=()=>new Float64Array(S),h=arr(),v=arr(),I=arr(),next=arr(),mask=new Uint8Array(S),loss=arr(),neighbors=new Int32Array(S*4),p=[];let tick=0,seed=1001,amp=.18,freq=.36,phase=0,emit=true,mode='dark',pulse=20;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x,d=shape==='circle'?R-Math.hypot(x-C,y-C):Math.min(x,y,N-1-x,N-1-y);mask[i]=d>=0?1:0;loss[i]=boundary==='absorbing'?.28*Math.max(0,1-d/12)**2:0}
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy],k)=>{let a=x+dx,b=y+dy,j=wrap(a)+N*wrap(b);neighbors[4*i+k]=boundary==='periodic'?j:a>=0&&a<N&&b>=0&&b<N&&mask[j]?j:i})}
for(let i=0;i<population;i++){let a=rand()*Math.PI*2,r=5+15*Math.sqrt(rand());p.push({x:C+r*Math.cos(a),y:C+r*Math.sin(a),vx:0,vy:0})}
function sample(a,x,y){let X=Math.floor(x),Y=Math.floor(y),u=x-X,t=y-Y,s=0;for(let j=0;j<2;j++)for(let k=0;k<2;k++){let i=wrap(X+k)+N*wrap(Y+j);s+=a[i]*(k?u:1-u)*(j?t:1-t)}return s}
function step(){phase+=freq;let source=emit&&(pulse===0||tick<pulse)?amp*Math.sin(phase):0;let c2=.58**2;for(let i=0;i<S;i++){if(!mask[i])continue;let j=i*4;v[i]=(1-.025-loss[i])*v[i]+c2*(h[neighbors[j]]+h[neighbors[j+1]]+h[neighbors[j+2]]+h[neighbors[j+3]]-4*h[i]);next[i]=(h[i]+v[i])*(1-loss[i]*.12)}let X=Math.floor(C),u=C-X;for(let j=0;j<2;j++)for(let k=0;k<2;k++){let i=X+k+N*(X+j),f=source*(k?u:1-u)*(j?u:1-u);v[i]+=f;next[i]+=f}h.set(next);for(let i=0;i<S;i++)I[i]=.97*I[i]+.03*h[i]**2;
for(let a of p){let s=mode==='dark'?-1:1;a.vx=Math.max(-.7,Math.min(.7,.88*a.vx+s*.1*(sample(I,a.x+1,a.y)-sample(I,a.x-1,a.y))/2+(rand()*2-1)*.015));a.vy=Math.max(-.7,Math.min(.7,.88*a.vy+s*.1*(sample(I,a.x,a.y+1)-sample(I,a.x,a.y-1))/2+(rand()*2-1)*.015));let x=a.x+a.vx,y=a.y+a.vy;if(boundary==='periodic'){a.x=wrap(x);a.y=wrap(y)}else if(shape==='circle'?Math.hypot(x-C,y-C)<=R-2:x>=1&&x<N-2&&y>=1&&y<N-2){a.x=x;a.y=y}else{a.vx*=-1;a.vy*=-1}}
tick++}
function stats(){let energy=0,near=0,mean=0,n=0;for(let i=0;i<S;i++)if(mask[i]){let dx=h[neighbors[4*i]]-h[i],dy=h[neighbors[4*i+3]]-h[i],e=.5*(v[i]**2+.58**2*(dx*dx+dy*dy));energy+=e;mean+=h[i];n++;if(Math.hypot(i%N-C,Math.floor(i/N)-C)<8)near+=e}return {tick,energy,near,mean:mean/n,particleRadius:p.length?p.reduce((s,a)=>s+Math.hypot(a.x-C,a.y-C),0)/p.length:0}}
return {N,shape,boundary,h,I,mask,p,step,stats,get tick(){return tick},set amp(x){amp=x},get amp(){return amp},set freq(x){freq=x},get freq(){return freq},set pulse(x){pulse=x},get pulse(){return pulse},set emit(x){emit=x},get emit(){return emit},set mode(x){mode=x},get mode(){return mode}}
}
(function(){const cv=document.querySelector('canvas'),g=cv.getContext('2d'),tex=document.createElement('canvas'),tc=tex.getContext('2d');let N=96,shape='square',boundary='absorbing',pop=0,m=lab(),run=false,speed=4,view=0,W,H,hit=[],history=[],last=0;function reset(){let a=m.amp,f=m.freq,p=m.pulse,mode=m.mode;m=lab(N,shape,boundary,pop);m.amp=a;m.freq=f;m.pulse=p;m.mode=mode;history=[];run=false;tex.width=tex.height=N}reset();function resize(){W=innerWidth;H=innerHeight;let d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function txt(s,x,y,z=12,color='#c7dce8'){g.fillStyle=color;g.font=z+'px system-ui';g.fillText(s,x,y)}function row(items,y){let w=(W-16)/items.length;items.forEach(([s,f],i)=>{let x=8+i*w;g.fillStyle='#142b3b';g.fillRect(x,y,w-3,28);txt(s,x+4,y+18,11);hit.push({x,y,w:w-3,h:28,f})})}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({N,shape,boundary,pop,amp:m.amp,freq:m.freq,pulse:m.pulse,mode:m.mode,history})],{type:'application/json'}));a.download='geometry-lab.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function draw(){hit=[];g.fillStyle='#060b13';g.fillRect(0,0,W,H);txt('WRKMAN / GEOMETRY LAB 001',8,18,14,'#6bd4e4');txt('Tick '+m.tick+' | '+N+' × '+N,8,36);row([[run?'Pause':'Run',()=>run=!run],['Reset',reset],['Step',()=>{run=false;advance()}],['Speed '+speed,()=>speed=speed>=16?1:speed*2]],44);row([[shape,()=>{shape=shape==='square'?'circle':'square';if(shape==='circle'&&boundary==='periodic')boundary='absorbing';reset()}],[boundary,()=>{let b=shape==='circle'?['absorbing','reflective']:['absorbing','reflective','periodic'];boundary=b[(b.indexOf(boundary)+1)%b.length];reset()}],[N+' grid',()=>{N=[96,128,256][([96,128,256].indexOf(N)+1)%3];reset()}],[pop+' probes',()=>{pop=pop?0:72;reset()}]],76);row([[m.pulse?'Pulse 20':'Continuous',()=>{m.pulse=m.pulse?0:20;reset()}],[m.mode,()=>{m.mode=m.mode==='dark'?'bright':'dark';reset()}],[view?'Intensity':'Wave',()=>view=1-view],['Export',exportData]],108);let size=Math.max(40,Math.min(W-16,H-260)),x=(W-size)/2,y=144,im=tc.createImageData(N,N),a=view?m.I:m.h;let scale=.001;for(let i=0;i<a.length;i++)scale=Math.max(scale,Math.abs(a[i]));for(let i=0;i<a.length;i++){let v=a[i]/scale,j=i*4;im.data[j]=m.mask[i]?8+Math.max(0,v)*240:3;im.data[j+1]=m.mask[i]?15+Math.abs(v)*55:5;im.data[j+2]=m.mask[i]?28+Math.max(0,-v)*225:8;im.data[j+3]=255}tc.putImageData(im,0,0);g.drawImage(tex,x,y,size,size);for(let p of m.p){g.fillStyle='#ffd477';g.beginPath();g.arc(x+p.x*size/N,y+p.y*size/N,1.7,0,7);g.fill()}g.fillStyle='#55ddff';g.fillRect(x+size/2-2,y+size/2-2,4,4);let s=m.stats(),yy=y+size;txt('Energy '+s.energy.toExponential(2)+' | Center '+s.near.toExponential(2),8,yy+16,11);txt('Mean '+s.mean.toExponential(2)+' | Probe radius '+s.particleRadius.toFixed(2),8,yy+32,11);row([['Amp −',()=>{m.amp=Math.max(0,m.amp-.03);reset()}],['Amp +',()=>{m.amp=Math.min(.6,m.amp+.03);reset()}],['Freq −',()=>{m.freq=Math.max(.06,m.freq-.06);reset()}],['Freq +',()=>{m.freq=Math.min(.9,m.freq+.06);reset()}]],yy+39);txt('Amplitude '+m.amp.toFixed(2)+' | Frequency '+m.freq.toFixed(2),8,yy+83,11)}
function advance(){m.step();if(m.tick%10===0){history.push(m.stats());if(history.length>10000)history.shift()}}cv.addEventListener('pointerup',e=>{let b=hit.find(b=>e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h);if(b)b.f()});cv.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){if(run&&t-last>30){for(let i=0;i<speed;i++)advance();last=t}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
