<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>HYDROGEN // Emergence Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#070c16;overflow:hidden;overscroll-behavior:none}
#lab{display:block;position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
</style>
</head>
<body><canvas id="lab" aria-label="Interactive hydrogen quantum mechanics laboratory"></canvas>
<script>
'use strict';
(function(){
  // Atomic units: a0 = 1, electron mass = 1, hbar = 1, e = 1.
  // The radial function u(r) = r R(r) obeys
  // [-1/2 d²/dr² + l(l+1)/(2r²) - Z/r] u = E u,
  // u(0)=u(Rmax)=0. Finite differences; ground states by inverse imaginary time,
  // excited 2s by orthogonalization against the computed 1s solution.
  const HARTREE_EV=27.211386245988, BOHR_NM=0.05291772109;
  const PLANCK_EV_FS=4.135667696, HC_EV_NM=1239.841984;
  const N=660, DR=0.045, DT=0.8;
  const canvas=document.getElementById('lab'), g=canvas.getContext('2d',{alpha:false});
  const imgCanvas=document.createElement('canvas');imgCanvas.width=240;imgCanvas.height=240;
  const ig=imgCanvas.getContext('2d'), image=ig.createImageData(240,240);
  const rGrid=new Float32Array(N), baseKinetic=1/(DR*DR), off=-DT*.5/(DR*DR);
  for(let i=0;i<N;i++)rGrid[i]=(i+1)*DR;
  let W=390,H=800,DPR=1,activeHits=[],tab='ATOM',mode='1s',Z=1;
  let timeFs=0,speed=1,running=true,viewRadius=8,contrast=1.05,states=null;
  let dirty=true,lastImageAt=0,lastTime=0,layout={};
  const C={bg:'#070c16',panel:'#0e1729',line:'#26354d',ink:'#e9f3ff',
    muted:'#889bb8',blue:'#74c8ff',mint:'#7febd8',gold:'#f4be6e',violet:'#b5a0ff'};
  try{const saved=JSON.parse(localStorage.getItem('hydrogen-emergence-v1')||'{}');
    if(saved.Z===1||saved.Z===2)Z=saved.Z;
    if(['1s','2s','2p','MIX'].includes(saved.mode))mode=saved.mode;
    if([.25,1,4].includes(saved.speed))speed=saved.speed;
    if(saved.tab==='ATOM'||saved.tab==='SPECTRUM'||saved.tab==='METHOD')tab=saved.tab;
    viewRadius=(mode==='1s'?8:mode==='MIX'?14:20)/Z;
  }catch(e){}
  function save(){try{localStorage.setItem('hydrogen-emergence-v1',JSON.stringify({Z,mode,speed,tab}));}catch(e){}}
  function normalize(u){
    let n=0;for(let i=0;i<N;i++)n+=u[i]*u[i];
    n=Math.sqrt(n*DR);for(let i=0;i<N;i++)u[i]/=n;
  }
  function projectOut(u,v){
    let d=0;for(let i=0;i<N;i++)d+=u[i]*v[i];
    d*=DR;for(let i=0;i<N;i++)u[i]-=d*v[i];
  }
  function solve(l,steps,lower){
    const v=new Float64Array(N),di=new Float64Array(N),den=new Float64Array(N);
    const cp=new Float64Array(N),temp=new Float64Array(N),next=new Float64Array(N);
    let u=new Float64Array(N);
    for(let i=0;i<N;i++){
      const r=rGrid[i];
      v[i]=l*(l+1)/ (2*r*r)-Z/r;
      di[i]=baseKinetic+v[i];
      const d=1+DT*di[i];
      den[i]=i?d-off*cp[i-1]:d;
      cp[i]=off/den[i];
      // A broad initial packet, not a pre-programmed hydrogen orbital.
      u[i]=(l===1?r*r:r)*Math.exp(-Math.pow(r/(lower?8/Z:4/Z),2));
    }
    if(lower)projectOut(u,lower);
    normalize(u);
    for(let step=0;step<steps;step++){
      temp[0]=u[0]/den[0];
      for(let i=1;i<N;i++)temp[i]=(u[i]-off*temp[i-1])/den[i];
      next[N-1]=temp[N-1];
      for(let i=N-2;i>=0;i--)next[i]=temp[i]-cp[i]*next[i+1];
      if(lower)projectOut(next,lower);
      normalize(next);
      const swap=u;u=new Float64Array(next); // keep backward solve buffer independent
    }
    // Fix an arbitrary global wavefunction sign for repeatable interference pictures.
    if(u[2]<0){for(let i=0;i<N;i++)u[i]=-u[i];}
    let energy=0;
    for(let i=0;i<N;i++)energy+=di[i]*u[i]*u[i];
    for(let i=0;i<N-1;i++)energy+=2*(-.5*baseKinetic)*u[i]*u[i+1];
    energy*=DR;
    return {u,E:energy,l};
  }
  function recalc(){
    const s1=solve(0,220,null);
    const s2=solve(0,310,s1.u);
    const p2=solve(1,250,null);
    states={'1s':s1,'2s':s2,'2p':p2};
    timeFs=0;dirty=true;lastImageAt=0;
  }
  function sample(state,r){
    // Interpolate u/r. Use the regular small-r limit for l=0.
    if(r>rGrid[N-1])return 0;
    if(r<DR){
      if(state.l===1)return (state.u[0]/(DR*DR))*r;
      return state.u[0]/DR;
    }
    const x=r/DR-1,i=Math.floor(x),f=x-i;
    const a=state.u[Math.min(N-1,i)],b=state.u[Math.min(N-1,i+1)];
    return (a+(b-a)*f)/r;
  }
  function density(r,costh,phi){
    const t=1/Math.sqrt(4*Math.PI);
    const a=sample(states['1s'],r)*t;
    if(mode==='1s')return a*a;
    const b=sample(states['2s'],r)*t;
    if(mode==='2s')return b*b;
    const p=sample(states['2p'],r)*t*Math.sqrt(3)*costh;
    if(mode==='2p')return p*p;
    return .5*(a*a+p*p)+a*p*Math.cos(phi);
  }
  function rebuildCloud(){
    const size=240,half=size/2,values=new Float32Array(size*size);
    const delta=(states['2p'].E-states['1s'].E)*HARTREE_EV;
    const phase=2*Math.PI*delta*timeFs/PLANCK_EV_FS;
    let peak=0;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const xx=(x-half+.5)/half, yy=(y-half+.5)/half;
      const rr=Math.sqrt(xx*xx+yy*yy),r=rr*viewRadius;
      const d=rr>1?0:density(r,rr>.00001?xx/rr:0,phase);
      const i=y*size+x;values[i]=d;peak=Math.max(peak,d);
    }
    const col=mode==='1s'?[82,174,255]:mode==='2s'?[165,133,255]:mode==='2p'?[104,236,209]:[111,189,255];
    for(let i=0;i<values.length;i++){
      let k=peak>0?Math.pow(values[i]/peak,.52)*contrast:0;
      k=Math.min(1,Math.max(0,k));
      const o=i*4;
      image.data[o]=Math.round(7*(1-k)+col[0]*k);
      image.data[o+1]=Math.round(12*(1-k)+col[1]*k);
      image.data[o+2]=Math.round(24*(1-k)+col[2]*k);
      image.data[o+3]=255;
    }
    ig.putImageData(image,0,0);dirty=false;
  }
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    const rect=canvas.getBoundingClientRect();
    W=Math.max(250,rect.width);H=Math.max(430,rect.height);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    g.setTransform(DPR,0,0,DPR,0,0);dirty=true;
  }
  function round(x,y,w,h,r=10){
    g.beginPath();g.roundRect(x,y,w,h,r);
  }
  function fillRect(x,y,w,h,r,color,stroke){
    round(x,y,w,h,r);g.fillStyle=color;g.fill();
    if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}
  }
  function line(x1,y1,x2,y2,color,width=1){
    g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  }
  function txt(s,x,y,size=12,color=C.ink,align='left',weight=500){
    g.fillStyle=color;g.font=weight+' '+size+'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    g.textAlign=align;g.textBaseline='middle';g.fillText(String(s),x,y);
  }
  function button(x,y,w,h,title,chosen,cb,color){
    const bg=chosen?'#193751':'#111e33', edge=chosen?'#69bced':C.line;
    fillRect(x,y,w,h,9,bg,edge);
    txt(title,x+w/2,y+h/2,Math.min(12,Math.max(10,w/7)),color||(chosen?C.blue:C.ink),'center',700);
    activeHits.push({x,y,w,h,cb});
  }
  function header(){
    txt('HYDROGEN',15,23,17,C.ink,'left',900);
    txt('// EMERGENCE LAB',123,23,10,C.blue,'left',650);
    txt('v0.1',W-15,23,10,C.muted,'right',650);
    line(14,44,W-14,44,C.line);
    const p=14,gap=8,bw=(W-28-16)/3;
    ['ATOM','SPECTRUM','METHOD'].forEach((a,i)=>{
      button(p+i*(bw+gap),53,bw,37,a,tab===a,()=>{tab=a;save();},tab===a?C.mint:null);
    });
  }
  function calcLayout(){
    const top=103;
    const bottomHeight=Math.min(295,Math.max(215,H*.34));
    const vh=Math.max(215,H-top-bottomHeight-10);
    const panelX=13,panelW=W-26;
    layout={x:panelX,y:top,w:panelW,h:vh,bottom:top+vh+9};
  }
  function viewport(){
    const a=layout;
    fillRect(a.x,a.y,a.w,a.h,16,C.panel,C.line);
    g.save();round(a.x+1,a.y+1,a.w-2,a.h-2,15);g.clip();
    const grad=g.createRadialGradient(W*.5,a.y+a.h*.48,10,W*.5,a.y+a.h*.48,a.w*.65);
    grad.addColorStop(0,'#102342');grad.addColorStop(.55,'#0a1628');grad.addColorStop(1,'#0a101e');
    g.fillStyle=grad;g.fillRect(a.x+1,a.y+1,a.w-2,a.h-2);
    for(let xx=a.x+24;xx<a.x+a.w;xx+=35)line(xx,a.y,xx,a.y+a.h,'#17243b',.65);
    for(let yy=a.y+20;yy<a.y+a.h;yy+=35)line(a.x,yy,a.x+a.w,yy,'#17243b',.65);
    g.restore();
  }
  function atomView(now){
    viewport();const a=layout;
    const side=Math.min(a.w-16,a.h-10);
    const cx=W/2,cy=a.y+a.h*.54;
    g.save();round(a.x+1,a.y+1,a.w-2,a.h-2,15);g.clip();
    [0.25,.5,.75,1].forEach(fr=>{
      g.beginPath();g.arc(cx,cy,side*.5*fr,0,Math.PI*2);
      g.strokeStyle=fr===1?'#35506a':'#263c56';g.lineWidth=.75;
      g.setLineDash([3,6]);g.stroke();g.setLineDash([]);
    });
    if(dirty||(mode==='MIX'&&running&&now-lastImageAt>46)){
      rebuildCloud();lastImageAt=now;
    }
    g.imageSmoothingEnabled=true;
    g.drawImage(imgCanvas,cx-side/2,cy-side/2,side,side);
    const glow=g.createRadialGradient(cx,cy,0,cx,cy,16);
    glow.addColorStop(0,'#fff3c1');glow.addColorStop(.18,'#f6bf70');glow.addColorStop(1,'rgba(246,171,70,0)');
    g.fillStyle=glow;g.beginPath();g.arc(cx,cy,16,0,Math.PI*2);g.fill();
    g.fillStyle='#ffecc6';g.beginPath();g.arc(cx,cy,2.1,0,Math.PI*2);g.fill();
    g.restore();
    txt('PROBABILITY DENSITY / CROSS SECTION',a.x+12,a.y+17,9,C.muted);
    const E=mode==='MIX'?(states['1s'].E+states['2p'].E)*.5:states[mode].E;
    txt(mode==='MIX'?'SUPERPOSITION':mode.toUpperCase()+' EIGENSTATE',a.x+12,a.y+35,12,mode==='2s'?C.violet:C.mint,'left',700);
    fillRect(a.x+10,a.y+a.h-47,a.w-20,34,8,'rgba(7,13,25,.85)','#263f57');
    txt('E = '+(E*HARTREE_EV).toFixed(4)+' eV',a.x+20,a.y+a.h-30,12,C.ink,'left',650);
    txt((viewRadius*BOHR_NM).toFixed(2)+' nm view',a.x+a.w-20,a.y+a.h-30,10,C.muted,'right');
  }
  function spectrumView(){
    viewport();const a=layout;
    const sx=a.x+20,ex=a.x+a.w-25, yTop=a.y+66, yBot=a.y+a.h-73;
    const E1=states['1s'].E*HARTREE_EV,E2s=states['2s'].E*HARTREE_EV,E2p=states['2p'].E*HARTREE_EV;
    const gap=E2p-E1,wave=HC_EV_NM/gap;
    txt('SOLVED ENERGY LEVELS',sx,a.y+24,11,C.blue,'left',750);
    const levels=[
      {name:'2p',E:E2p,y:yTop,col:C.mint},
      {name:'2s',E:E2s,y:yTop+42,col:C.violet},
      {name:'1s',E:E1,y:yBot,col:C.blue}
    ];
    levels.forEach(l=>{
      const lineStart=sx+36,lineEnd=Math.min(ex-30,sx+a.w*.58);
      line(lineStart,l.y,lineEnd,l.y,l.col,2);
      txt(l.name,sx,l.y,12,l.col,'left',750);
      txt(l.E.toFixed(4)+' eV',lineEnd+8,l.y,10,C.ink,'left',600);
    });
    if(yBot>yTop+76){
      const arrowX=Math.min(ex-12,sx+a.w*.77);
      line(arrowX,yTop+5,arrowX,yBot-7,C.gold,2);
      line(arrowX,yBot-7,arrowX-5,yBot-18,C.gold,2);
      line(arrowX,yBot-7,arrowX+5,yBot-18,C.gold,2);
    }
    fillRect(a.x+11,a.y+a.h-59,a.w-22,48,10,'#15243b','#34465f');
    txt('2p → 1s  /  ALLOWED E1 TRANSITION',a.x+19,a.y+a.h-43,10,C.gold,'left',700);
    txt(gap.toFixed(4)+' eV   •   '+wave.toFixed(2)+' nm',a.x+19,a.y+a.h-24,12,C.ink,'left',700);
  }
  function wrapped(s,x,y,maxWidth,spacing,size,color){
    const words=s.split(' ');let lineText='',yy=y;
    for(const word of words){
      const test=lineText?lineText+' '+word:word;
      g.font='500 '+size+'px ui-monospace, SFMono-Regular, Menlo, monospace';
      if(g.measureText(test).width>maxWidth&&lineText){
        txt(lineText,x,yy,size,color);yy+=spacing;lineText=word;
      }else lineText=test;
    }
    if(lineText){txt(lineText,x,yy,size,color);yy+=spacing;}
    return yy;
  }
  function methodView(){
    viewport();const a=layout,x=a.x+17,w=a.w-34;
    let y=a.y+24,fs=W<345?10:11,dy=W<345?15:17;
    txt('THE EQUATION, NOT AN ANIMATION',x,y,11,C.mint,'left',800);y+=31;
    y=wrapped('Radial Schrödinger equation in atomic units:',x,y,w,dy,fs,C.ink)+5;
    y=wrapped('H = −½ d²/dr² + l(l+1)/(2r²) − Z/r',x,y,w,dy,fs,C.gold)+13;
    y=wrapped('A finite-difference Hamiltonian evolves broad initial wave packets in imaginary time. No orbital energy or shape is supplied.',x,y,w,dy,fs,C.ink)+13;
    y=wrapped('2s is found by keeping its solution orthogonal to the computed 1s. The display is a two-dimensional slice of |ψ|².',x,y,w,dy,fs,C.ink)+13;
    if(y<a.y+a.h-60){
      txt('GRID: '+N+' RADIAL CELLS  •  Δr = '+DR+' a₀',x,y,10,C.blue);y+=19;
      txt('BOUNDARIES: u(0) = u(Rmax) = 0',x,y,10,C.blue);y+=19;
      txt('Rmax: '+(N+1)*DR+' a₀',x,y,10,C.muted);y+=17;
    }
    const footerH=55;
    fillRect(a.x+10,a.y+a.h-footerH-9,a.w-20,footerH,9,'#18243b','#34415b');
    wrapped('MODEL LIMITS: Fixed nucleus, one electron, nonrelativistic Coulomb field. No proton substructure, QED, photons, or spontaneous emission.',a.x+18,a.y+a.h-footerH+1,a.w-36,14,10,C.gold);
  }
  function controls(){
    const a=layout,y=a.bottom,p=14,gap=7;
    if(tab==='METHOD'){
      txt('EXPERIMENT CONTROLS',p,y+10,11,C.muted,'left',800);
      const rowY=y+26,bw=(W-28-gap*2)/3;
      button(p,rowY,bw,41,'HYDROGEN',Z===1,()=>{Z=1;viewRadius=mode==='1s'?8:18;recalc();save();});
      button(p+bw+gap,rowY,bw,41,'He+ ION',Z===2,()=>{Z=2;viewRadius=mode==='1s'?4:9;recalc();save();});
      button(p+2*(bw+gap),rowY,bw,41,'RETURN',false,()=>{tab='ATOM';save();});
      let ty=rowY+59;
      const es=['1s','2s','2p'];
      es.forEach((s,i)=>{
        const ref=-Z*Z/(2*(s==='1s'?1:4));
        const calc=states[s].E,err=Math.abs((calc-ref)/ref)*100;
        txt(s+': '+(calc*HARTREE_EV).toFixed(5)+' eV',p,ty+i*23,12,s==='1s'?C.blue:s==='2s'?C.violet:C.mint);
        txt('error '+err.toFixed(3)+'%',W-p,ty+i*23,11,C.muted,'right');
      });
      return;
    }
    txt(tab==='ATOM'?'CHOOSE A QUANTUM STATE':'RUN A QUANTUM EXPERIMENT',p,y+10,10,C.muted,'left',800);
    const labels=['1s','2s','2p','MIX'],bw=(W-28-gap*3)/4,rowY=y+24;
    labels.forEach((s,i)=>button(p+i*(bw+gap),rowY,bw,43,s,mode===s,()=>{
      mode=s;viewRadius=(s==='1s'?8:s==='MIX'?14:20)/Z;dirty=true;
      if(s==='MIX'){timeFs=0;running=true;}save();
      if(tab==='SPECTRUM')tab='ATOM';
    }));
    const row2=rowY+52,bw2=(W-28-gap*2)/3;
    button(p,row2,bw2,40,running?'Ⅱ PAUSE':'▶ PLAY',running,()=>{running=!running;});
    button(p+bw2+gap,row2,bw2,40,'RESET t',false,()=>{timeFs=0;dirty=true;});
    button(p+2*(bw2+gap),row2,bw2,40,Z===1?'Z = 1  H':'Z = 2  He+',true,()=>{
      Z=Z===1?2:1;viewRadius=(mode==='1s'?8:mode==='MIX'?14:20)/Z;recalc();save();
    });
    const row3=row2+51,bw3=(W-28-gap*2)/3;
    button(p,row3,bw3,38,'ZOOM −',false,()=>{viewRadius=Math.min(30/Z,viewRadius*1.35);dirty=true;});
    button(p+bw3+gap,row3,bw3,38,'ZOOM +',false,()=>{viewRadius=Math.max(2/Z,viewRadius/1.35);dirty=true;});
    button(p+2*(bw3+gap),row3,bw3,38,'TIME ×'+speed,false,()=>{
      speed=speed===.25?1:speed===1?4:.25;save();
    });
    const row4=row3+50;
    const E=mode==='MIX'?(states['1s'].E+states['2p'].E)*.5:states[mode].E;
    txt('SOLVED E',p,row4,10,C.muted,'left',750);
    txt((E*HARTREE_EV).toFixed(5)+' eV',W-p,row4,12,C.ink,'right',750);
    txt(mode==='MIX'?'COHERENT BEATING • '+timeFs.toFixed(3)+' fs':'NO CLASSICAL ELECTRON ORBIT',p,row4+23,10,C.mint,'left',650);
    if(tab==='SPECTRUM')txt('Photons are not simulated.',W-p,row4+23,9,C.gold,'right');
  }
  function render(now){
    const dt=Math.min(.06,Math.max(0,(now-lastTime)/1000||0));lastTime=now;
    if(running&&mode==='MIX')timeFs+=dt*speed;
    g.clearRect(0,0,W,H);g.fillStyle=C.bg;g.fillRect(0,0,W,H);
    activeHits=[];calcLayout();header();
    if(tab==='ATOM')atomView(now);
    else if(tab==='SPECTRUM')spectrumView();
    else methodView();
    controls();
    requestAnimationFrame(render);
  }
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    for(let i=activeHits.length-1;i>=0;i--){
      const h=activeHits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){
        h.cb();break;
      }
    }
  },{passive:false});
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{lastTime=0;});
  recalc();resize();requestAnimationFrame(render);
})();
</script>
</body>
</html>
