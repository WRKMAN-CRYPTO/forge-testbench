 g.save();g.translate(px,ground-hop*s);g.scale(s*dir,s);const hs=(f.body.name==='Wall'?1.28:f.body.name==='Glass Fang'?.8:1)*Math.pow((f.genome?.frame||1),.31);g.scale(Math.pow(f.genome?.frame||1,.13),Math.pow(f.genome?.legs||1,.10));

 const shape=b.name;
 // rear leg feet

 // mystical crest and ears
 g.fillStyle=bd;
 function ear(ex,rot){g.save();g.translate(ex,-88);g.rotate(rot);g.beginPath();g.moveTo(-12,8);g.quadraticCurveTo(-22,-27,-10,-57*(f.genome?.crest||1));g.quadraticCurveTo(12,-47*(f.genome?.crest||1),14,6);g.fill();g.fillStyle='#ffd8ed77';g.beginPath();g.moveTo(-3,1);g.quadraticCurveTo(-10,-23,-6,-42);g.quadraticCurveTo(5,-30,6,1);g.fill();g.restore();}

 // head
 g.fillStyle=bd;g.beginPath();g.ellipse(23,-74,35,32,-.04,0,TAU);g.fill();

var game=null,rngState=1,ww=0,hh=0,dpr=1,scale=1,ox=0,oy=0,topH=42,bottomH=49,viewportH=200;
var selected=null,modal=null,tab=0,scroll=0,view='world',speedIndex=0,speeds=[1,3,10,30],playing=true;

var geography=null,worldReady=false,frontierToken=0,mapMode='Surface',cloudsVisible=true,worldSaveState='Seeded terrain',worldPaintAt=0;
function startFrontier(seed,restore,callback){
 var token=++frontierToken;worldReady=false;
 geography=window.FrontierWorld.create(seed);
 geography.generate(function(){
  if(token!==frontierToken)return;
  if(restore)restoreHydrology(seed,function(){if(token!==frontierToken)return;geography.buildNav();geography.palette(mapMode);geography.paintClouds();worldReady=true;callback();});
  else{worldReady=true;callback();}
 });
}
function restoreHydrology(seed,done){
 if(typeof indexedDB==='undefined'){worldSaveState='Seed restored · water recalculated';done();return;}
 try{
  let req=indexedDB.open('wrkman-frontier-water',1);
  req.onupgradeneeded=function(){req.result.createObjectStore('water');};
  req.onerror=function(){worldSaveState='Seed restored · offline water cache unavailable';done();};
  req.onsuccess=function(){
   let db=req.result,get=db.transaction('water','readonly').objectStore('water').get('world');
   get.onsuccess=function(){
    let v=get.result;
    if(v&&v.seed===seed&&v.top&&v.top.byteLength===2000000&&v.day<=game.day+.2&&game.day-v.day<4){
     geography.top.set(new Int16Array(v.top));
     if(v.clouds&&v.clouds.byteLength===62500)geography.clouds.set(new Float32Array(v.clouds));
     worldSaveState='Hydrology restored';
    }else worldSaveState='Seed restored · fresh hydrology';
    db.close();done();
   };
   get.onerror=function(){db.close();worldSaveState='Water cache unavailable';done();};
  };
 }catch(e){worldSaveState='Water cache unavailable';done();}
}
function saveHydrology(){
 if(!worldReady||!geography||typeof indexedDB==='undefined')return;
 try{
  let geo=geography,day=game.day,seed=geo.seed,req=indexedDB.open('wrkman-frontier-water',1);
  req.onupgradeneeded=function(){req.result.createObjectStore('water');};
  req.onsuccess=function(){
   let db=req.result,tx=db.transaction('water','readwrite');
   tx.objectStore('water').put({seed,day,top:geo.top.buffer.slice(0),clouds:geo.clouds.buffer.slice(0)},'world');
   tx.oncomplete=function(){worldSaveState='Water state saved';db.close();};
   tx.onerror=function(){worldSaveState='Water save unavailable';db.close();};
  };
 }catch(e){worldSaveState='Water save unavailable';}
}
function terrainTemperature(a){return geography?geography.at(a.x,a.y).temp:15;}
function terrainTraverse(a,tx,ty,ds){
 let ox=a.x,oy=a.y,d=dist(ox,oy,tx,ty);if(d<1)return false;
 let ux=(tx-ox)/d,uy=(ty-oy)/d,old=geography.at(ox,oy).elev;
 let headings=[0,Math.PI/4,-Math.PI/4,Math.PI/2,-Math.PI/2,Math.PI*.75,-Math.PI*.75,Math.PI];
 for(let angle of headings){
  let dx=ux*Math.cos(angle)-uy*Math.sin(angle),dy=ux*Math.sin(angle)+uy*Math.cos(angle);
  let xx=clamp(ox+dx*ds,18,W-18),yy=clamp(oy+dy*ds,18,H-18);
  if(!geography.walk(xx,yy)||Math.abs(geography.at(xx,yy).elev-old)>14)continue;
  a.x=xx;a.y=yy;a.stats.travel+=ds;a.energy=Math.max(0,a.energy-.68*.06);
  a.blocked=0;return true;
 }
 a.blocked=(a.blocked||0)+1;
 if(a.blocked>3){a.nextThink=0;a.blocked=0;}
 return false;
}
function habitatLabel(a){return geography?geography.biome(a.x,a.y):'generating';}

const ECO_DEFAULT={grazerCap:false,ridgeCap:false,rescue:false,spriglets:true};
var pendingEcoKey=null,nextEcoConfig=null;
function ecRules(){return Object.assign({},ECO_DEFAULT,game&&game.ecology?game.ecology.rules:null);}
function trackEcology(force){
 if(!game||!game.ecology)return;
 var e=game.ecology,year=Math.floor(game.day/YEAR_DAYS);
 if(!force&&e.lastYear===year)return;
 var grazers=countKind('grazer'),ridgefangs=countKind('carnivore'),spriglets=countKind('spriglet');
 e.lastYear=year;
 e.maxG=Math.max(e.maxG,grazers);e.maxR=Math.max(e.maxR,ridgefangs);e.maxS=Math.max(e.maxS||0,spriglets);
 if(!grazers&&e.goneG===null){e.goneG=game.day/YEAR_DAYS;addEvent('ecology','All grazers have disappeared',null);}
 if(!ridgefangs&&e.goneR===null){e.goneR=game.day/YEAR_DAYS;addEvent('ecology','All Ridgefangs have disappeared',null);}
 if(e.sprigletsIntroduced&&!spriglets&&e.goneS===null){e.goneS=game.day/YEAR_DAYS;addEvent('ecology','All Spriglets have disappeared',null);}
 e.history.push({year:year,g:grazers,r:ridgefangs,s:spriglets});
 if(e.history.length>400)e.history.shift();
}
function ecologyChart(x,y,w,h){
 var hist=game.ecology.history;
 rr(x,y,w,h,7,'#102323','#436157');
 var left=x+27,right=x+w-9,top=y+26,bottom=y+h-22;
 var max=Math.max(6,...hist.map(q=>Math.max(q.g,q.r,q.s||0))),ceiling=Math.ceil(max/10)*10;
 for(var j=0;j<=4;j++){var yy=top+(bottom-top)*j/4;line(left,yy,right,yy,'#2b4441',1);
  if(j%2===0)txt(''+Math.round(ceiling*(1-j/4)),left-4,yy+2,8,'#90a69a','right');
 }
 var first=hist.length?hist[0].year:0,last=hist.length?hist[hist.length-1].year:0;

  if(!hist.length)return;
  ctx.strokeStyle=color;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.beginPath();
  for(var i=0;i<hist.length;i++){var d=hist[i],xx=first===last?(left+right)/2:left+(right-left)*(d.year-first)/(last-first),
   yy=bottom-(bottom-top)*d[key]/ceiling;
   if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
  }
  if(hist.length===1)ctx.lineTo((left+right)/2+1,bottom-(bottom-top)*hist[0][key]/ceiling);
  ctx.stroke();

 stroke('g','#8ad6b1');stroke('r','#ed9f7a');stroke('s','#e8d687');
 txt('GRAZERS',left,y+13,8,'#8ad6b1','left','700');txt('SPRIGLETS',x+w/2,y+13,8,'#e8d687','center','700');txt('RIDGEFANGS',right,y+13,8,'#ed9f7a','right','700');
 txt('YEAR '+first,left,y+h-8,9,'#8fa69c');txt('YEAR '+last,right,y+h-8,9,'#8fa69c','right');
}
function rand(){rngState=(rngState+0x6D2B79F5)>>>0;var t=rngState;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
function r(a,b){return a+rand()*(b-a);}
function ri(a,b){return Math.floor(r(a,b+1));}
function choice(list){return list[ri(0,list.length-1)];}
function dist(x,y,a,b){return Math.hypot(x-a,y-b);}
function riverX(y){return 505+72*Math.sin(y*.010+0.6)+34*Math.sin(y*.021);}
function waterDist(x,y){return geography?geography.waterDistance(x,y):1e5;}
function pointWater(x,y){return geography?geography.shore(x,y):null;}
function footprint(x,y){let p=geography?geography.safe(x,y):null;return p||{x:clamp(x,20,W-20),y:clamp(y,22,H-22)};}
function logHistory(a,msg){if(!a)return;if(!Array.isArray(a.history))a.history=[];a.history.unshift(msg);if(a.history.length>12)a.history.length=12;}
function addEvent(type,msg,a,b){game.events.unshift({day:round(game.day,1),type:type,text:msg,who:[a&&a.id,b&&b.id].filter(Boolean)});if(game.events.length>95)game.events.pop();logHistory(a,msg);logHistory(b,msg);}

function safeSoulRecord(s){
 if(!s||typeof s!=='object')return null;
 // Normalize old or partially written saves while retaining all intact soul impressions.
 if(!s.im||typeof s.im!=='object')s.im={};
 for(var k of ['social','giving','caution','roaming']){
  if(!Number.isFinite(s.im[k]))s.im[k]=0;
 }
 if(!Array.isArray(s.lifeHistory))s.lifeHistory=[];
 else s.lifeHistory=s.lifeHistory.filter(function(life){return !!life&&typeof life==='object';}).slice(0,9);
 if(!Number.isFinite(s.lives))s.lives=s.lifeHistory.length+1;
 return s;
}
function makeSoul(){var s={id:++game.nextSoul,lives:0,im:{social:0,caution:0,giving:0,roaming:0},lastLife:'',lifeHistory:[]};game.souls[s.id]=s;return s;}

function temper(p,q,s){var o={};['curiosity','sociability','aggression','caution','generosity'].forEach(function(k){o[k]=clamp(p&&q?(p.base[k]+q.base[k])/2+r(-.24,.24):r(.1,.9),0,1);});return o;}

function spawn(s,x,y,p,q,species){var land=footprint(x,y);x=land.x;y=land.y;var id=++game.nextBody;var base=temper(p,q,s),body=bodyTraits(p,q);species=species||(p?kindOf(p):'grazer');
 var family=species==='carnivore'?'Ridgefang':species==='spriglet'?'Spriglet':p&&q?(rand()<.5?p.family:q.family):choice(archetypes);
 if(species==='spriglet'){body.speed=clamp(body.speed+.04,.35,.77);body.senses=clamp(body.senses+.03,0,1);body.strength=clamp(body.strength*.52,0,1);body.resilience=clamp(body.resilience*.55,0,1);base.caution=clamp(base.caution+.15,0,1);base.aggression*=.2;}
 if(species==='carnivore'&&!p){body.speed=clamp(body.speed+.18,0,1);body.strength=clamp(body.strength+.16,0,1);body.senses=clamp(body.senses+.12,0,1);body.resilience=clamp(body.resilience+.18,0,1);}

  if(family==='Duelist')body.senses=clamp(body.senses+.23,0,1);
  if(family==='Pouncer'){body.speed=clamp(body.speed+.14,0,1);body.strength=clamp(body.strength+.12,0,1);}
  if(family==='Trickster'){body.senses=clamp(body.senses+.16,0,1);base.curiosity=clamp(base.curiosity+.13,0,1);}
  if(family==='Glass Fang'){body.strength=clamp(body.strength+.25,0,1);body.resilience=clamp(body.resilience-.18,0,1);}
 }

  txt(m.lifeYearsCount?round(m.lifeYearsTotal/m.lifeYearsCount,1)+' years':'No lives completed on new age scale',x,y,13,'#e9d8af');y+=27;
  y+=paragraph('A year is 30 world days. Natural lifespans are 80–100 years; thirst, hunger or injury may end a life earlier. Historical records from before this update retain their old day units.',x,y,width)+16;y+=paragraph('These observations do not prove friendship, culture, consciousness, or survival benefits.',x,y,width);
 }else if(tab===1){
  txt('SOCIAL MEMORY '+(game.social?'ON':'OFF'),x,y,15,game.social?'#a9dcaf':'#deb49f','left','800');y+=31;
  y+=paragraph('The comparison uses identical terrain and starting random seed. Changing mode restarts the world, so no earlier relationship data leaks across runs.',x,y,width)+21;
  y+=paragraph('ON: individuals recognize others, build trust, remember helpful encounters, share food, tend wounds, approach familiar individuals and may reproduce.',x,y,width)+17;
  y+=paragraph('OFF: individuals forage, drink, rest, wander and age, but social recognition and social actions are disabled. This is an ablation, not a matched random-number trial.',x,y,width)+18;
  y+=paragraph('Track whether repeated contact actually changes behavior, and whether social behaviors have survival costs or benefits. Multiple seeds are needed.',x,y,width)+20;
  txt('SEED '+game.seed,x,y,13,'#dfd2a7');y+=25;
  txt('To change the condition, tap MEMORY at the top.',x,y,11,'#aabeb5');
 }else if(tab===2){
  txt('EXPERIENCE-BASED LEARNING',x,y,14,'#e7d6a7','left','760');y+=28;
  y+=paragraph('An individual may learn whether a remembered food patch is rewarding. Other creatures keep their own histories and temperaments.',x,y,width)+20;
  for(var row of [['Successful food visits',m.foodFinds||0],['Empty food visits',m.foodMisses||0],['Changed food decisions',m.adaptedChoices||0]]){
   txt(row[0],x,y,12,'#bed1c5');txt(row[1],x+width,y,12,'#e9dfb8','right','750');y+=27;
  }
  y+=12;
  var solitary=game.agents.filter(function(a){return a.t.sociability<.35;}).length;
  var outgoing=game.agents.filter(function(a){return a.t.sociability>.65;}).length;
  txt('CURRENT TEMPERAMENT VARIATION',x,y,11,'#e7d6a7','left','760');y+=22;
  txt('Low sociability: '+solitary+'     High sociability: '+outgoing,x,y,11,'#bdd7ca');y+=27;
  y+=paragraph('Temperament diversity is preserved. Learning a food location does not make a solitary creature social.',x,y,width)+19;
  y+=paragraph('Comparisons use the same seed, but subsequent random choices diverge. Repeated seeds, not a single run, are needed to test benefits.',x,y,width)+23;
  button(game.learning?'LEARNING: ON':'LEARNING: OFF',x,y,width,35,function(){modal='learningToggle';scroll=0;},game.learning,'modal');y+=51;
  txt('Changing this setting restarts the valley.',x,y,11,'#a6bcb0');y+=23;
  y+=paragraph('To inspect an individual, tap it in the world and open its LEARN tab.',x,y,width)+9;
 }else if(tab===3){
  var eco=game.ecology,rs=eco.rules,lg=countKind('grazer'),lr=countKind('carnivore');
  txt('FRONTIER · FOOD WEB',x,y,13,'#e7d6a7','left','780');y+=26;
  txt('SEED '+game.seed+' · YEAR '+Math.floor(game.day/YEAR_DAYS),x,y,11,'#a4c8b9');y+=24;
  txt('GRAZERS '+lg,x,y,12,'#8bd3b0','left','760');
  txt('SPRIGLETS '+countKind('spriglet'),x+width*.54,y,12,'#eddb8d','right','760');
  txt('RIDGEFANGS '+lr,x+width,y,12,'#eba281','right','760');y+=17;
  ecologyChart(x,y,width,155);y+=170;
  txt('PEAKS  '+eco.maxG+' G · '+(eco.maxS||0)+' S · '+eco.maxR+' R',x,y,11,'#b4cac0');y+=25;
  txt('Grazers extinct: '+(eco.goneG===null?'not observed':'year '+round(eco.goneG,1)),x,y,11,'#c9d9cf');y+=21;
  txt('Ridgefangs extinct: '+(eco.goneR===null?'not observed':'year '+round(eco.goneR,1)),x,y,11,'#c9d9cf');y+=21;
  txt('Spriglets extinct: '+(eco.goneS===null?'not observed':'year '+round(eco.goneS,1)),x,y,11,'#c9d9cf');y+=26;
  txt('ENVIRONMENT',x,y,11,'#e7d6a7','left','750');y+=22;
  txt('Land '+geography.landCount+' px · water '+geography.waterCount+' px · ice '+geography.iceCount+' px',x,y,10,'#a9c5bf');y+=19;
  txt('Evap '+geography.stats.evap+'  · Rain '+geography.stats.rain+'  · Water flow '+geography.stats.flow,x,y,10,'#a9c5bf');y+=20;
  txt('Water persistence: '+worldSaveState,x,y,10,'#a9c5bf');y+=24;
  txt('TRIAL RULES',x,y,11,'#e7d6a7','left','750');y+=22;
  for(var opt of [['spriglets','SPRIGLETS'],['grazerCap','GRAZER CAP · 38'],['ridgeCap','RIDGEFANG CAP · 4'],['rescue','ARTIFICIAL GRAZER RECOVERY']]){
   (function(key,name){button(name+' : '+(rs[key]?'ON':'OFF'),x,y,width,37,function(){pendingEcoKey=key;modal='ecoRules';scroll=0;},rs[key],'modal');})(opt[0],opt[1]);y+=45;
  }
  y+=paragraph('Every rule is independent. Changing one restarts the SAME seed from Year 0. Replays preserve the selected rules. This test never alters First Valley.',x,y,width)+22;
  if(!lg&&!countKind('spriglet')&&lr)y+=paragraph('All prey extinct. Carnivores may briefly survive on remaining carcasses.',x,y,width,'#e9a991')+17;
  else if(!lg&&!lr&&!countKind('spriglet'))y+=paragraph('Every species extinct. The valley has fallen silent.',x,y,width,'#e9a991')+17;
  y+=10;txt('COMBAT & REPRODUCTION',x,y,11,'#e7d6a7','left','760');y+=24;
  for(var r0 of [['Predator attacks',m.predatorAttacks||0],['Predation deaths',m.predations||0],['Spriglet births',m.sprigletBirths||0],['Spriglet predation deaths',m.sprigletKills||0],['Ridgefang births',m.ridgefangBirths||0],['Defensive strikes',m.defenseHits||0],['Spriglet meat meals',m.sprigletMeals||0],['Total meat meals',m.meatMeals||0]]){
   txt(r0[0],x,y,11,'#bfd0c7');txt(r0[1],x+width,y,11,'#e7dcbc','right','730');y+=23;
  }
  y+=paragraph('Graph samples once each simulated year; latest 400 years are retained. At 160+ creatures the simulation pauses to protect mobile browsers, without blocking new births.',x,y,width)+12;
 }else{
  y=linesEvents(game.events,x,y,width,p.contentEnd);
  if(!game.events.length)txt('No recorded events.',x,y,12,'#aabbaf');
 }
 ctx.restore();scrollLimit=Math.max(0,y+scroll-p.contentEnd+20);
}
function drawConfirm(){
 var isToggle=modal==='toggle',isReplay=modal==='replay',isNew=modal==='new',isLearningToggle=modal==='learningToggle';
 var p=modalBackground(modal==='ecoRules'?'Change ecology rules?':modal==='reinforce'?'Introduce another founder?':modal==='introduce'?'Introduce Ridgefangs?':isToggle?'Change experiment?':isLearningToggle?'Change learning trial?':isReplay?'Replay world?':'Generate new valley?'),x=p.x+17,y=p.y+73,w=p.w-34;
 var s=modal==='ecoRules'?'Turn '+(pendingEcoKey==='spriglets'?'Spriglets':pendingEcoKey==='grazerCap'?'grazer cap 38':pendingEcoKey==='ridgeCap'?'Ridgefang cap 4':'artificial grazer recovery')+' '+(game.ecology.rules[pendingEcoKey]?'OFF':'ON')+'? This restarts the SAME seed and overwrites this Wild Ecology trial. First Valley is preserved.':modal==='reinforce'?'Introduce '+(2-countKind('carnivore'))+' unrelated Ridgefang founder(s)? This changes the experiment without resetting the valley. Reproduction and survival are not guaranteed.':modal==='introduce'?'Bring two meat-eating Ridgefang founders into this existing valley? Their hunting may end lives. Your saved population and relationships will not reset.':isToggle?'Switch social memory '+(game.social?'OFF':'ON')+' and restart with the SAME seed? This creates a comparable starting world.':isLearningToggle?'Switch adaptive food learning '+(game.learning?'OFF':'ON')+' and restart the SAME seed? This replaces current progress; your old seed remains reproducible.':isReplay?'Restart day zero with the SAME seed and experiment settings? Current progress will be replaced.':'Start a new world with a NEW seed? You will leave the current lives behind.';
 y+=paragraph(s,x,y,w,'#c7d8c9')+30;
 button('CANCEL',x,y,w*.46,36,function(){modal=null;},false,'modal');
 button('CONFIRM',x+w*.51,y,w*.49,36,function(){
  if(modal==='ecoRules'){
   nextEcoConfig=Object.assign({},game.ecology.rules);nextEcoConfig[pendingEcoKey]=!nextEcoConfig[pendingEcoKey];
   var seed=game.seed,so=game.social,le=game.learning;
   newWorld(seed,so,le);modal='world';tab=3;scroll=0;return;
  }
  if(modal==='reinforce'){restoreRidgefangFounders();modal=null;return;}
  if(modal==='introduce'){releasePredators();modal=null;return;}
  var seed=isNew?((Date.now()^(Math.random()*0x7fffffff))>>>0):game.seed,social=isToggle?!game.social:game.social,learning=isLearningToggle?!game.learning:game.learning;
  newWorld(seed,social,learning);
 },true,'modal');
}
function drawHelp(){
 var p=modalBackground('Watching the Valley'),x=p.x+17,y=p.y+69-scroll,w=p.w-34;
 ctx.save();ctx.beginPath();ctx.rect(p.x+9,p.y+51,p.w-18,p.contentEnd-p.y-51);ctx.clip();
 var paragraphs=[
 'This is an autonomous simulation. You are an observer, not a controller.',
 'TAP a creature to inspect its life, relationships, soul, learning, and original Soul Crucible body build.',
 'FOLLOW zooms toward the selected life. OVERVIEW restores the full valley.',
 'PAUSE freezes time. The speed button cycles between ×1, ×3, ×10 and ×30.',
 'MEMORY toggles the relationship system. STATS > LEARNING lets you compare food learning ON/OFF with the same seed.',
 'REPLAY restarts the same seed and rule settings. NEW SEED creates a different valley.',
 'Wild Ecology has its own independent browser save and never changes First Valley.',
 'A new Spriglet-enabled seed starts with 24 grazers, 12 Spriglets, and two Ridgefangs. Existing saved worlds keep their original occupants.',
 'Spriglets live 10 to 15 years, mature around age 2, and have small litters only when food, water and local space support it.',
 'Spriglets eat regrowing meadow ground cover. They yield two meat portions; large grazers yield six. Neither species is replenished automatically.',
 'STATS > ECOLOGY lets you toggle Spriglets and compare the same seed with the original two-species world.',
 'STATS > ECOLOGY controls both population caps and artificial grazer recovery independently. A change restarts the same seed.',
 'Artificial grazer recovery ON replenishes only the large grazers. Spriglets have no such recovery rule, even when it is enabled.',
 'At 160 living creatures, the app pauses for mobile safety without limiting future reproduction.',
 'The three ancient clearings are just geography. They are not settlements or destinations imposed by a director.',
 'The calendar uses 30 simulated days per in-world year. Natural lifespans range from 80 to 100 years; other dangers can end life sooner.',
 'Use STATS > COMBAT to inspect attacks, defenses, and introduce two Ridgefang carnivores without resetting your valley.',
 'Ridgefangs hunt grazers or eat their carcasses. They never eat other Ridgefangs.',
 'Souls retain subtle biases after death; minds, places and relationship memories do not survive reincarnation.',
 'Wild Ecology autosaves only in this browser and uses a different save from First Valley.'
 ];
 for(var text0 of paragraphs)y+=paragraph('• '+text0,x,y,w)+19;
 ctx.restore();scrollLimit=Math.max(0,y+scroll-p.contentEnd+15);
}
function overlay(){
 if(!modal)return;scrollLimit=0;
 if(modal==='inspect')drawInspector();
 else if(modal==='world')drawWorldData();
 else if(modal==='help')drawHelp();
 else drawConfirm();
}
function frame(now){
 var dt=Math.min(.14,(now-lastTime)/1000||0);lastTime=now;
 if(playing&&worldReady){acc+=dt*18*speeds[speedIndex];var steps=0;while(acc>=1&&steps<55){tick();acc-=1;steps++;}if(steps===55)acc=Math.min(acc,1);}
 if(worldReady&&geography&&geography.drawPending&&now-worldPaintAt>1300){
  geography.palette(mapMode);geography.paintClouds();worldPaintAt=now;
 }
 taps=[];camera();scene();hud();
 try{overlay();}catch(err){
  // Never let a broken inspector stop time or leave touch controls unusable.
  console.error('First Valley inspector error',err);
  modal=null;scroll=0;announce('Inspector issue · world continues');
 }
 if(game.agents.length>=160&&playing){playing=false;announce('160 creatures reached · paused to protect Safari · no breeding cap');save();}
 if(now-lastSave>12000&&worldReady){lastSave=now;save();}
 requestAnimationFrame(frame);
}
function onDown(e){e.preventDefault();dragStart={x:e.clientX,y:e.clientY,scroll:scroll,time:performance.now()};try{C.setPointerCapture(e.pointerId);}catch(_){}}
function onMove(e){if(!dragStart)return;if(modal&&['inspect','world','help'].indexOf(modal)>=0){var dy=e.clientY-dragStart.y;scroll=clamp(dragStart.scroll-dy,0,Math.max(0,scrollLimit));}}
function onUp(e){
 e.preventDefault();if(!dragStart)return;
 var pos={x:e.clientX,y:e.clientY},moved=dist(pos.x,pos.y,dragStart.x,dragStart.y)>13;dragStart=null;
 if(moved)return;
 for(var i=taps.length-1;i>=0;i--){var h=taps[i];if(modal&&h.layer!=='modal')continue;if(pos.x>=h.x&&pos.x<=h.x+h.w&&pos.y>=h.y&&pos.y<=h.y+h.h){h.fn();return;}}
 if(modal){return;}
 var near=null,nd=Infinity;for(var p of screenPos){var dd=dist(pos.x,pos.y,p.x,p.y);if(dd<(p.radius||25)&&dd<nd){nd=dd;near=p.id;}}
 if(near){selected=near;modal='inspect';tab=0;scroll=0;save();}
}
C.addEventListener('pointerdown',onDown,{passive:false});C.addEventListener('pointermove',onMove,{passive:false});C.addEventListener('pointerup',onUp,{passive:false});
C.addEventListener('pointercancel',function(){dragStart=null;});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){if(document.hidden){playing=false;save();}});
window.addEventListener('pagehide',save);
if(!load())newWorld(((Date.now()^0x51f00d)>>>0),true);else startFrontier(game.seed,true,function(){announce('Frontier resumed · '+Math.floor(game.day/YEAR_DAYS)+' years of history');});
resize();requestAnimationFrame(frame);
})();
</script></body></html>
