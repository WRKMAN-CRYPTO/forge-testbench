function triadSignals(f){
 const im=f.soul.im||{},hurt=clamp(1-f.hp/Math.max(1,f.maxHp),0,1),fatigue=clamp(1-f.stamina/100,0,1);

 const soul=clamp(.18+affect*.50+hurt*.26,0,1);
 const active=f.action==='strike'||f.action==='heavy'||f.action==='lunge'||f.attack?1:f.action==='guard'||f.action==='evade'?.75:.42;
 const mind=clamp(.22+active*.40+hurt*.20+Math.min(1,(f.mind.experience||0)/120)*.13,0,1);
 const body=clamp(.15+hurt*.52+fatigue*.20+(f.hitFlash>0?.30:0)+(f.attack?.16:0),0,1);

}

const FEEL_EVENTS=['Force answered','Impact endured','Relief in motion','Shelter held','Effort unanswered','Energy spent in silence','Life extinguished','Still standing'];
function newEmotionRow(){return {n:0,positive:0,negative:0,neutral:0,up:0,down:0,delta:0,absDelta:0,targetSum:0};}
function ensureEmotionLedger(s){
 const o=s.obs||(s.obs=freshObserver());
 if(!o.emotionLedger)o.emotionLedger={since:round,events:{},axes:{}};
 const l=o.emotionLedger;
 for(const a of AXES)if(!l.axes[a.key])l.axes[a.key]=newEmotionRow();
 return l;
}
function logFeeling(s,k,tone,felt,before,after){
 const l=ensureEmotionLedger(s),name=FEEL_EVENTS.includes(tone)?tone:'Other';
 if(!l.events[name])l.events[name]={};
 if(!l.events[name][k])l.events[name][k]=newEmotionRow();
 const delta=after-before;
 for(const row of [l.axes[k],l.events[name][k]]){
  row.n++;row.targetSum+=felt;
  if(felt>0.01)row.positive++;else if(felt<-.01)row.negative++;else row.neutral++;
  if(delta>1e-9)row.up++;else if(delta< -1e-9)row.down++;
  row.delta+=delta;row.absDelta+=Math.abs(delta);
 }
}
// Soul Divergence Monitor: cumulative per-soul experience composition and felt targets.
// All counters are observational. No RNG, action scores, learning, or combat changes.
function ensureDivergence(s){
 const o=s.obs||(s.obs=freshObserver());
 if(!o.divergence)o.divergence={since:round,events:{},feelings:{},samples:0};
 const d=o.divergence;
 if(!d.events)d.events={};if(!d.feelings)d.feelings={};
 if(!Number.isFinite(d.samples))d.samples=0;
 return d;
}
function logDivergence(s,event,axis,felt){
 const d=ensureDivergence(s),e=d.events[event]||(d.events[event]={n:0});
 // Event incidence counts once per feeling call, not once per affected attribute.
 if(!d.feelings[event])d.feelings[event]={};
 const a=d.feelings[event][axis]||(d.feelings[event][axis]={n:0,sum:0,sumSq:0});
 a.n++;a.sum+=felt;a.sumSq+=felt*felt;
 // Event incidence is incremented on the first axis of each event.
 if(!d._eventOpen)d._eventOpen=null;
}
function divergenceDistance(a,b){
 return Math.sqrt(AXES.reduce((sum,k)=>sum+Math.pow((a.im[k.key]||0)-(b.im[k.key]||0),2),0)/AXES.length);
}

function frame(ms){
 if(!w)resize();const elapsed=last?Math.min(.10,(ms-last)/1000):0;last=ms;
 if(running){
  // A requested 10,000× is a workload target, not a claim that the phone can achieve it.
  // Bound catch-up debt so an overloaded phone never freezes trying to repay minutes of work.
  accum=Math.min(speed>=300?(headless?120:8):3.5,accum+elapsed*speed);
  const begin=performance.now();let ticks=0;
  // Keep the same 60Hz simulation and combat rules at every speed.
  // At extreme speeds devote a slightly larger, bounded slice to simulation.
  const budgetMs=headless?12:(speed>=300?17:12), maxTicks=headless?48000:(speed>=300?1200:480);
  while(accum>=FIXED_DT&&ticks<maxTicks){
   if(tournament)tournamentStep(FIXED_DT);else step(FIXED_DT);accum-=FIXED_DT;ticks++;
   if((ticks&31)===0&&performance.now()-begin>budgetMs)break;
  }
  perf.frames++;perf.ticks+=ticks;perf.stepMs+=performance.now()-begin;
  speedSampleWall+=elapsed;speedSampleSim+=ticks*FIXED_DT;
  if(speedSampleWall>=1.2){actualSpeed=Math.round(speedSampleSim/speedSampleWall);speedSampleWall=0;speedSampleSim=0;}
 }
 // Draw at most ~15fps at extreme speeds, leaving time for simulation and touch events.
 if(!running||ms-lastRenderAt>=(headless?400:speed>=300?65:0)){const renderStart=performance.now();draw();perf.drawMs+=performance.now()-renderStart;lastRenderAt=ms;}
 perfReport(ms);
 requestAnimationFrame(frame);
}

function xy(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
canvas.addEventListener('pointerdown',e=>{const p=xy(e);observerTouch=observerOpen&&p.y>132?{y:p.y,scroll:observerScroll,moved:false}:null;});
canvas.addEventListener('pointermove',e=>{if(!observerOpen||!observerTouch)return;const p=xy(e);if(Math.abs(p.y-observerTouch.y)>6)observerTouch.moved=true;if(observerTouch.moved){e.preventDefault();observerScroll=clamp(observerTouch.scroll+observerTouch.y-p.y,0,observerMaxScroll);}});
canvas.addEventListener('pointerup',e=>{const wasMoving=observerTouch?.moved;observerTouch=null;if(!wasMoving)pointer(e);});
canvas.addEventListener('pointercancel',()=>observerTouch=null);
