function impact(f,o){const at=f.attack;if(!at||at.hit)return;at.hit=true;const dist=Math.abs(f.x-o.x),reachable=dist<at.reach+28;let success=false;
 if(reachable){let dodge=o.evade>0.06&&Math.random()<.66;let defending=o.guard>.06; if(dodge){floatText(o.x,'DODGE','#9de6fa');o.stat.dodges++;o.soul.obs.successfulDodges++;learn(o,.17); imprint(o.soul,'defense',.0005);}

function spawnHit(px,py,c){for(let i=0;i<10;i++)particles.push({x:arena.x+(px/1000)*arena.w,y:py,vx:rand(-100,100),vy:rand(-110,18),life:rand(.24,.5),max:.5,c,r:rand(2,5)});}

 if(observerMaxScroll>0){rr(w-6,top,3,bottom-top,2,'#55608066');const thumb=(bottom-top)*Math.max(.10,(bottom-top)/(bottom-top+observerMaxScroll));rr(w-6,top+(bottom-top-thumb)*(observerScroll/observerMaxScroll),3,thumb,2,'#bed6eb');}
}
function draw(){drawBg();layout();if(observerOpen){drawObserver();return;}drawHeader();drawArena();drawFighterBars();drawButtons();drawDuelSnapshot();if(w>520&&!arena.portrait)text('TAP CREATURE TO INSPECT • OPEN OBSERVE TO EXPLORE PATTERNS',w/2,h-60,9,'#b9b1d4','center','700');}
function resize(){const rect=canvas.getBoundingClientRect();w=rect.width;h=rect.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);layout();}
function frame(ms){if(!w)resize();const elapsed=last?Math.min(.055,(ms-last)/1000):0;last=ms;if(running){accum=Math.min(.25,accum+elapsed*speed);let iter=0;while(accum>=1/60&&iter++<12){step(1/60);accum-=1/60;}}draw();requestAnimationFrame(frame);}
function pointer(e){e.preventDefault();const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*w/rect.width,y=(e.clientY-rect.top)*h/rect.height;
 if(observerOpen){if(y<69&&x>w-89){observerOpen=false;return;}
  if(y>=78&&y<127){const gap=6,tw=(w-26-gap*3)/4;const i=Math.floor((x-13)/(tw+gap));if(i>=0&&i<4){observerTab=i;observerScroll=0;}return;}return;
 }
 if(x>=10&&x<=43&&y>=11&&y<=53){if(confirm('Reset souls and all incarnation history?')){localStorage.removeItem(KEY);load();begin();selected=0;save();}return;}
 for(let i=0;i<buttons.length;i++){const b=buttons[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){if(i===0){running=!running;last=0;}else if(i===1)speed=speed===1?3:1;else if(i===2){observerOpen=true;observerTab=0;observerScroll=0;}return;}}
 if(y>=arena.y&&y<arena.y+arena.h){const wx=((x-arena.x)/arena.w)*1000;selected=Math.abs(wx-fighters[0].x)<Math.abs(wx-fighters[1].x)?0:1;return;}
 if(arena.portrait&&y>arena.y+arena.h+57)selected=1-selected;
}
function xy(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
canvas.addEventListener('pointerdown',e=>{const p=xy(e);observerTouch=observerOpen&&p.y>132?{y:p.y,scroll:observerScroll,moved:false}:null;});
canvas.addEventListener('pointermove',e=>{if(!observerOpen||!observerTouch)return;const p=xy(e);if(Math.abs(p.y-observerTouch.y)>6)observerTouch.moved=true;if(observerTouch.moved){e.preventDefault();observerScroll=clamp(observerTouch.scroll+observerTouch.y-p.y,0,observerMaxScroll);}});
canvas.addEventListener('pointerup',e=>{const wasMoving=observerTouch?.moved;observerTouch=null;if(!wasMoving)pointer(e);});
canvas.addEventListener('pointercancel',()=>observerTouch=null);
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();running=!running;}
 if(e.key==='Digit1')selected=0;if(e.key==='Digit2')selected=1;if(e.key==='KeyS')speed=speed===1?3:1;
 if(e.key==='KeyL'||e.key==='Escape'){observerOpen=!observerOpen;observerScroll=0;}
 if(e.key==='ArrowDown'&&observerOpen){observerScroll=clamp(observerScroll+80,0,observerMaxScroll);e.preventDefault();}
 if(e.key==='ArrowUp'&&observerOpen){observerScroll=clamp(observerScroll-80,0,observerMaxScroll);e.preventDefault();}
 if(e.key==='KeyR'&&e.shiftKey){if(confirm('Reset all souls and incarnation history?')){localStorage.removeItem(KEY);load();begin();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;last=0;save();}});
load();begin();resize();requestAnimationFrame(frame);
// Tiny explicit debug surface for browser automation / development without influencing combat.
window.__soulCrucible={state:()=>({round,running,speed,souls:JSON.parse(JSON.stringify(souls)),fighters:fighters.map(f=>({name:f.name,hp:f.hp,maxHp:f.maxHp,body:f.body.name,action:f.action,impressions:f.soul.im})),observer:{open:observerOpen,tab:observerTab,scroll:observerScroll}}),reset:()=>{localStorage.removeItem(KEY);load();begin();},advance:(seconds=10)=>{for(let i=0;i<seconds*60;i++)step(1/60);},render:()=>draw(),showObserver:(tab=0)=>{observerOpen=true;observerTab=tab;observerScroll=0;}};
})();
</script>
