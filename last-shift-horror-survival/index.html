<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080a0b">
<title>Last Shift: Blackout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090a;overscroll-behavior:none}body{padding:0}#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07090a}.archive{position:fixed;z-index:20;left:50%;bottom:calc(154px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(84vw,330px);min-height:45px;border:1px solid #6a5833;border-radius:8px;background:linear-gradient(#282216,#17140e);color:#f2d58e;font:950 .7rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em;text-align:center;text-decoration:none;padding:14px 10px;box-shadow:0 6px 22px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.archive:active{transform:translateX(-50%) scale(.985)}.archive.hidden{display:none}@media(min-width:700px){.archive{bottom:172px}}
</style>
</head>
<body>
<iframe id="gameFrame" title="Last Shift: Blackout" allow="autoplay"></iframe>
<a id="archiveBtn" class="archive hidden" href="monster-gallery.html">VIEW NUMBERED SPECIMENS</a>
<script>
(()=>{'use strict';
const frame=document.getElementById('gameFrame'),btn=document.getElementById('archiveBtn');let timer=0;
function patchBehavior(source){
 source=source.replace(/function spawnEnemy\(type\)\{.*?\}\nfunction spawnBoss/s,`function spawnEnemy(type){const def=ENEMIES[type],edge=Math.floor(Math.random()*4),pad=35;let x,y;if(edge===0){x=Math.random()*W;y=-pad}else if(edge===1){x=W+pad;y=Math.random()*H}else if(edge===2){x=Math.random()*W;y=H+pad}else{x=-pad;y=Math.random()*H}const scale=1+(state.sector-1)*.1+Math.max(0,state.threat-1)*.025;state.enemies.push({type,x,y,r:def.r,hp:def.hp*scale,maxHp:def.hp*scale,speed:def.speed*(1+(state.sector-1)*.035),damage:def.damage,hit:0,attackCd:.5+Math.random(),shotCd:1+Math.random(),burn:0,dead:false,dashCd:1.1+Math.random()*2.8,dashT:0,dodgeCd:.7+Math.random()*2.4,dodgeT:0,dodgeDir:0,hazeCd:Math.random()*.12});}\nfunction spawnBoss`);
 source=source.replace(/function updateEnemies\(dt\)\{.*?state\.enemyShots=state\.enemyShots\.filter\(s=>s\.life>0&&s\.x>-20&&s\.x<W\+20&&s\.y>-20&&s\.y<H\+20\);\}/s,`function spookyBurst(e,n=5,force=46){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=8+Math.random()*force;state.particles.push({x:e.x+(Math.random()-.5)*e.r,y:e.y+(Math.random()-.5)*e.r,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,t:.32+Math.random()*.48,r:1.2+Math.random()*2.7,color:Math.random()<.35?'#9688a3':'#5c5868'});}}\nfunction updateEnemies(dt){const p=state.player;for(const e of state.enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);e.attackCd-=dt;e.shotCd-=dt;e.burn=Math.max(0,e.burn-dt);if(e.burn>0){e.hp-=8*dt;if(e.hp<=0){killEnemy(e);continue}}const d=Math.hypot(p.x-e.x,p.y-e.y)||1,dx=(p.x-e.x)/d,dy=(p.y-e.y)/d;if(e.type==='shambler'){e.dashCd-=dt;e.dodgeCd-=dt;e.dashT=Math.max(0,e.dashT-dt);e.dodgeT=Math.max(0,e.dodgeT-dt);e.hazeCd-=dt;if(e.hazeCd<=0){e.hazeCd=.075+Math.random()*.11;state.particles.push({x:e.x+(Math.random()-.5)*e.r*1.4,y:e.y+(Math.random()-.5)*e.r*1.4,vx:(Math.random()-.5)*13,vy:-7-Math.random()*13,t:.42+Math.random()*.42,r:1+Math.random()*2.2,color:Math.random()<.3?'#9a8aa8':'#514d5b'});}if(e.dashCd<=0&&d>82&&d<270&&Math.random()<dt*.72){e.dashT=.22+Math.random()*.09;e.dashCd=2.6+Math.random()*3.5;e.dodgeT=0;spookyBurst(e,8,65);}else if(e.dodgeCd<=0&&d>68&&d<245&&Math.random()<dt*.62){e.dodgeT=.22+Math.random()*.13;e.dodgeDir=Math.random()<.5?-1:1;e.dodgeCd=2.0+Math.random()*3.0;spookyBurst(e,5,42);}}if(ENEMIES[e.type].ranged&&d<260){if(d<150){e.x-=dx*e.speed*.7*dt;e.y-=dy*e.speed*.7*dt}else if(d>225){e.x+=dx*e.speed*.55*dt;e.y+=dy*e.speed*.55*dt}if(e.shotCd<=0){e.shotCd=1.65+Math.random()*.45;state.enemyShots.push({x:e.x,y:e.y,vx:dx*205,vy:dy*205,r:5,life:2.2,damage:e.damage});queueSound('spit')}}else if(e.type==='shambler'&&e.dashT>0){e.x+=dx*e.speed*4.4*dt;e.y+=dy*e.speed*4.4*dt;if(Math.random()<dt*22)spookyBurst(e,1,25)}else if(e.type==='shambler'&&e.dodgeT>0){const side=e.dodgeDir;e.x+=(dx*.35-dy*side)*e.speed*2.7*dt;e.y+=(dy*.35+dx*side)*e.speed*2.7*dt;if(Math.random()<dt*16)spookyBurst(e,1,18)}else{e.x+=dx*e.speed*dt;e.y+=dy*e.speed*dt}if(d<p.r+e.r+1&&e.attackCd<=0){e.attackCd=.8;hurt(e.damage,e.x,e.y)}}state.enemies=state.enemies.filter(e=>!e.dead);for(const s of state.enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r){s.life=0;hurt(s.damage,s.x,s.y)}}state.enemyShots=state.enemyShots.filter(s=>s.life>0&&s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);}`);
 return source;
}
function sync(){try{const d=frame.contentDocument,start=d&&d.getElementById('startOverlay');btn.classList.toggle('hidden',!start||start.classList.contains('hidden'));}catch(_){btn.classList.add('hidden')}}
function installChosenMonsters(){try{const w=frame.contentWindow,P=w.CanvasRenderingContext2D&&w.CanvasRenderingContext2D.prototype;if(!P||P.__lastShiftChosenMonsters)return;const arc=P.arc,TAU=Math.PI*2;P.arc=function(x,y,r,a0,a1,ccw){const full=Math.abs(Math.abs(a1-a0)-TAU)<.01,fill=String(this.fillStyle).toLowerCase(),enemy=['#687b66','#9b6659','#72714e','#73514b','#414b50','#8b3f3b','#e4ddd2'].includes(fill);if(!full||x!==0||y!==0||r<10||r>36||!enemy)return arc.call(this,x,y,r,a0,a1,ccw);const deer=fill==='#687b66'||fill==='#73514b'||fill==='#8b3f3b'||(fill==='#e4ddd2'&&r>=14);if(deer){this.moveTo(-.58*r,-.95*r);this.lineTo(-.98*r,-.58*r);this.lineTo(-.67*r,-.62*r);this.bezierCurveTo(-.58*r,-1.3*r,.45*r,-1.5*r,.67*r,-.67*r);this.lineTo(1.02*r,-.76*r);this.lineTo(.73*r,-.36*r);this.lineTo(.92*r,.18*r);this.lineTo(.55*r,1.08*r);this.lineTo(.12*r,1.34*r);this.lineTo(-.54*r,1.03*r);this.lineTo(-.91*r,.17*r);this.closePath();}else{this.moveTo(-.28*r,-1.24*r);this.bezierCurveTo(.05*r,-1.48*r,.52*r,-1.18*r,.48*r,-.72*r);this.lineTo(.88*r,-.23*r);this.lineTo(1.23*r,.44*r);this.lineTo(.55*r,.24*r);this.lineTo(.78*r,1.16*r);this.lineTo(.18*r,1.38*r);this.lineTo(-.2*r,.72*r);this.lineTo(-.72*r,1.18*r);this.lineTo(-.55*r,.25*r);this.lineTo(-1.18*r,.54*r);this.lineTo(-.83*r,-.34*r);this.lineTo(-.5*r,-.7*r);this.closePath();}};P.__lastShiftChosenMonsters=true;}catch(_){}}
frame.addEventListener('load',()=>{installChosenMonsters();sync();clearInterval(timer);timer=setInterval(sync,180)});document.addEventListener('visibilitychange',()=>{if(!document.hidden){installChosenMonsters();sync()}});
fetch('game.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load');return r.text()}).then(source=>{frame.srcdoc=patchBehavior(source)}).catch(()=>{frame.src='game.html'});
})();
</script>
</body>
</html>
