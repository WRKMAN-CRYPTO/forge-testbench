<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Forge PDF Bench</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101317;color:#eef2f5;font-family:system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}
header{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#171b20;border-bottom:1px solid #2a3037}
button,.fileBtn{border:1px solid #343b44;background:#222830;color:#f4f6f8;border-radius:9px;min-width:40px;height:38px;padding:0 11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.fileBtn{margin-right:auto}.fileBtn input{display:none}button:disabled{opacity:.35}
#pageInfo{font-variant-numeric:tabular-nums;font-size:13px;min-width:54px;text-align:center}
#fit{min-width:54px;font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;touch-action:pan-x pan-y;background:#0c0f12}
#sheet{position:relative;min-width:100%;min-height:100%;padding:16px}
#canvasWrap{width:max-content;height:max-content;margin:0 auto}
canvas{display:block;background:white;box-shadow:0 4px 22px #0008}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#8f9aa6;pointer-events:none}
#empty strong{display:block;color:#dce2e8;font-size:20px;margin-bottom:8px}
#status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border-radius:8px;background:#171b20e8;color:#d5dce3;font-size:12px;display:none;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<header>
<label class="fileBtn">Open PDF<input id="file" type="file" accept="application/pdf,.pdf"></label>
<button id="prev" aria-label="Previous page">‹</button>
<span id="pageInfo">0 / 0</span>
<button id="next" aria-label="Next page">›</button>
<button id="fit" aria-label="Fit page">Fit</button>
<button id="full" aria-label="Fullscreen">⛶</button>
</header>
<div id="stage">
<div id="sheet"><div id="canvasWrap"><canvas id="pdf"></canvas></div></div>
<div id="empty"><div><strong>Forge PDF Bench</strong>Open a PDF to begin.<br>Phase 1: render, page, zoom, pan.</div></div>
</div>
<div id="status"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const $=s=>document.querySelector(s);
const file=$('#file'),canvas=$('#pdf'),ctx=canvas.getContext('2d',{alpha:false});
const stage=$('#stage'),canvasWrap=$('#canvasWrap'),empty=$('#empty'),info=$('#pageInfo'),status=$('#status');
const prev=$('#prev'),next=$('#next'),fit=$('#fit'),full=$('#full');

const MAX_ZOOM=10;
const MAX_BACKING_PIXELS=10000000;
const MAX_BACKING_SIDE=8192;

let doc=null,pageNum=1,zoom=1,scale=1,fitScale=1,baseViewport=null,renderTask=null;
let pinch=null,lastStageWidth=stage.clientWidth;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function flash(msg){
 status.textContent=msg;
 status.style.display='block';
 clearTimeout(flash.t);
 flash.t=setTimeout(()=>status.style.display='none',1200);
}
function zoomLabel(){return zoom===1?'Fit':zoom.toFixed(zoom<2?1:0)+'×'}
function controls(){
 info.textContent=doc?pageNum+' / '+doc.numPages:'0 / 0';
 prev.disabled=!doc||pageNum<=1;
 next.disabled=!doc||pageNum>=doc.numPages;
 fit.disabled=!doc;
 fit.textContent=doc?zoomLabel():'Fit';
}
function cssSize(){
 return {
  w:baseViewport?baseViewport.width*scale:0,
  h:baseViewport?baseViewport.height*scale:0
 };
}
function applyCssSize(){
 const {w,h}=cssSize();
 canvas.style.width=w+'px';
 canvas.style.height=h+'px';
 canvasWrap.style.width=w+'px';
 canvasWrap.style.height=h+'px';
}
function safeOutputScale(viewport){
 const desired=Math.min(devicePixelRatio||1,2);
 const byArea=Math.sqrt(MAX_BACKING_PIXELS/Math.max(1,viewport.width*viewport.height));
 const bySide=Math.min(MAX_BACKING_SIDE/Math.max(1,viewport.width),MAX_BACKING_SIDE/Math.max(1,viewport.height));
 return Math.max(.1,Math.min(desired,byArea,bySide));
}
async function render(){
 if(!doc)return;
 if(renderTask){try{renderTask.cancel()}catch{}}
 const page=await doc.getPage(pageNum);
 baseViewport=page.getViewport({scale:1});
 fitScale=Math.max(.01,(stage.clientWidth-32)/baseViewport.width);
 scale=fitScale*zoom;

 const viewport=page.getViewport({scale});
 const out=safeOutputScale(viewport);
 const bw=Math.max(1,Math.floor(viewport.width*out));
 const bh=Math.max(1,Math.floor(viewport.height*out));

 canvas.width=bw;
 canvas.height=bh;
 applyCssSize();

 renderTask=page.render({
  canvasContext:ctx,
  viewport,
  transform:[out,0,0,out,0,0]
 });
 try{
  await renderTask.promise;
 }catch(e){
  if(e?.name!=='RenderingCancelledException')throw e;
 }
 controls();
}
async function fitPage(){
 if(!doc)return;
 zoom=1;
 await render();
 stage.scrollTo(0,0);
 flash('Fit · 1×');
}
async function changePage(delta){
 if(!doc)return;
 const target=clamp(pageNum+delta,1,doc.numPages);
 if(target===pageNum)return;
 pageNum=target;
 await fitPage();
}

file.addEventListener('change',async()=>{
 const picked=file.files[0];
 if(!picked)return;
 try{
  flash('Loading…');
  const data=new Uint8Array(await picked.arrayBuffer());
  doc=await pdfjsLib.getDocument({data}).promise;
  pageNum=1;
  zoom=1;
  empty.style.display='none';
  await render();
  stage.scrollTo(0,0);
  flash(picked.name);
 }catch(e){
  console.error(e);
  flash('Could not open PDF');
 }
});

prev.onclick=()=>changePage(-1);
next.onclick=()=>changePage(1);
fit.onclick=fitPage;
full.onclick=async()=>{
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch{
  flash('Fullscreen unavailable');
 }
};

// Mobile Safari changes viewport height as its browser chrome moves.
// Only refit if the usable WIDTH actually changed.
window.addEventListener('resize',()=>{
 const w=stage.clientWidth;
 if(doc&&Math.abs(w-lastStageWidth)>2){
  lastStageWidth=w;
  fitPage();
 }
});

const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
function midpoint(t){
 const r=stage.getBoundingClientRect();
 return {
  x:(t[0].clientX+t[1].clientX)/2-r.left,
  y:(t[0].clientY+t[1].clientY)/2-r.top
 };
}

stage.addEventListener('touchstart',e=>{
 if(!doc||e.touches.length!==2||!baseViewport)return;
 const m=midpoint(e.touches);
 const {w,h}=cssSize();
 pinch={
  d:dist(e.touches),
  z:zoom,
  ax:clamp((stage.scrollLeft+m.x-16)/Math.max(1,w),0,1),
  ay:clamp((stage.scrollTop+m.y-16)/Math.max(1,h),0,1)
 };
},{passive:true});

stage.addEventListener('touchmove',e=>{
 if(!pinch||e.touches.length!==2)return;
 e.preventDefault();

 const m=midpoint(e.touches);
 zoom=clamp(pinch.z*(dist(e.touches)/pinch.d),1,MAX_ZOOM);
 scale=fitScale*zoom;
 applyCssSize();

 const {w,h}=cssSize();
 stage.scrollLeft=16+pinch.ax*w-m.x;
 stage.scrollTop=16+pinch.ay*h-m.y;
 controls();
},{passive:false});

stage.addEventListener('touchend',e=>{
 if(!pinch||e.touches.length>=2)return;
 pinch=null;
 render()
  .then(()=>flash(zoomLabel()))
  .catch(err=>{console.error(err);flash('Render recovered');});
},{passive:true});

controls();
</script>
</body>
</html>
