<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Forge PDF Bench</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101317;color:#eef2f5;font-family:system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}
header{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#171b20;border-bottom:1px solid #2a3037}
button,.fileBtn{border:1px solid #343b44;background:#222830;color:#f4f6f8;border-radius:9px;min-width:40px;height:38px;padding:0 11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.fileBtn{margin-right:auto}.fileBtn input{display:none}button:disabled{opacity:.35}
#pageInfo{font-variant-numeric:tabular-nums;font-size:13px;min-width:54px;text-align:center}
#fit{min-width:54px;font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;touch-action:pan-x pan-y;background:#0c0f12}
#sheet{position:relative;min-width:100%;min-height:100%;padding:16px}
#canvasWrap{position:relative;width:max-content;height:max-content;margin:0 auto}
#pdf{display:block;background:white;box-shadow:0 4px 22px #0008}
#detail{position:absolute;display:none;pointer-events:none;background:white;box-shadow:none;z-index:2}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#8f9aa6;pointer-events:none}
#empty strong{display:block;color:#dce2e8;font-size:20px;margin-bottom:8px}
#status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border-radius:8px;background:#171b20e8;color:#d5dce3;font-size:12px;display:none;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<header>
<label class="fileBtn">Open PDF<input id="file" type="file" accept="application/pdf,.pdf"></label>
<button id="prev" aria-label="Previous page">‹</button>
<span id="pageInfo">0 / 0</span>
<button id="next" aria-label="Next page">›</button>
<button id="fit" aria-label="Fit page">Fit</button>
<button id="full" aria-label="Fullscreen">⛶</button>
</header>
<div id="stage">
<div id="sheet"><div id="canvasWrap"><canvas id="pdf"></canvas><canvas id="detail"></canvas></div></div>
<div id="empty"><div><strong>Forge PDF Bench</strong>Open a PDF to begin.<br>Phase 1.5: fast navigation + sharp viewport.</div></div>
</div>
<div id="status"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const $=s=>document.querySelector(s);
const file=$('#file');
const canvas=$('#pdf'),ctx=canvas.getContext('2d',{alpha:false});
const detail=$('#detail'),detailCtx=detail.getContext('2d',{alpha:false});
const stage=$('#stage'),sheet=$('#sheet'),canvasWrap=$('#canvasWrap');
const empty=$('#empty'),info=$('#pageInfo'),status=$('#status');
const prev=$('#prev'),next=$('#next'),fit=$('#fit'),full=$('#full');

const MAX_ZOOM=10;
const BASE_MAX_PIXELS=10000000;
const BASE_MAX_SIDE=8192;
const DETAIL_MAX_PIXELS=6000000;
const DETAIL_MAX_SIDE=4096;
const DETAIL_MARGIN=96;
const DETAIL_DELAY=140;

let doc=null,currentPage=null,pageNum=1;
let zoom=1,scale=1,fitScale=1,baseViewport=null;
let baseRenderTask=null,detailRenderTask=null,detailTimer=0,detailGeneration=0;
let pinch=null,lastStageWidth=stage.clientWidth;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function flash(msg){
 status.textContent=msg;
 status.style.display='block';
 clearTimeout(flash.t);
 flash.t=setTimeout(()=>status.style.display='none',1200);
}
function zoomLabel(){return zoom===1?'Fit':zoom.toFixed(zoom<2?1:0)+'×'}
function controls(){
 info.textContent=doc?pageNum+' / '+doc.numPages:'0 / 0';
 prev.disabled=!doc||pageNum<=1;
 next.disabled=!doc||pageNum>=doc.numPages;
 fit.disabled=!doc;
 fit.textContent=doc?zoomLabel():'Fit';
}
function cssSize(){
 return {
  w:baseViewport?baseViewport.width*scale:0,
  h:baseViewport?baseViewport.height*scale:0
 };
}
function applyCssSize(){
 const {w,h}=cssSize();
 canvas.style.width=w+'px';
 canvas.style.height=h+'px';
 canvasWrap.style.width=w+'px';
 canvasWrap.style.height=h+'px';
}
function safeScale(viewport,maxPixels,maxSide,desired){
 const byArea=Math.sqrt(maxPixels/Math.max(1,viewport.width*viewport.height));
 const bySide=Math.min(maxSide/Math.max(1,viewport.width),maxSide/Math.max(1,viewport.height));
 return Math.max(.1,Math.min(desired,byArea,bySide));
}
function hideDetail(cancel=false){
 clearTimeout(detailTimer);
 detailTimer=0;
 detailGeneration++;
 detail.style.display='none';
 if(cancel&&detailRenderTask){
  try{detailRenderTask.cancel()}catch{}
  detailRenderTask=null;
 }
}
function scheduleDetail(delay=DETAIL_DELAY){
 if(!doc||!currentPage||zoom<=1.02)return;
 clearTimeout(detailTimer);
 detailTimer=setTimeout(()=>renderDetail(),delay);
}
function visiblePageRect(){
 const sr=stage.getBoundingClientRect();
 const pr=canvasWrap.getBoundingClientRect();
 const left=Math.max(sr.left,pr.left);
 const top=Math.max(sr.top,pr.top);
 const right=Math.min(sr.right,pr.right);
 const bottom=Math.min(sr.bottom,pr.bottom);
 if(right<=left||bottom<=top)return null;

 const pageW=pr.width,pageH=pr.height;
 let x0=clamp(left-pr.left-DETAIL_MARGIN,0,pageW);
 let y0=clamp(top-pr.top-DETAIL_MARGIN,0,pageH);
 let x1=clamp(right-pr.left+DETAIL_MARGIN,0,pageW);
 let y1=clamp(bottom-pr.top+DETAIL_MARGIN,0,pageH);

 return {x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)};
}
async function renderDetail(){
 if(!currentPage||zoom<=1.02)return;
 const rect=visiblePageRect();
 if(!rect)return;

 const generation=++detailGeneration;
 if(detailRenderTask){
  try{detailRenderTask.cancel()}catch{}
 }
 detail.style.display='none';

 const viewport=currentPage.getViewport({scale});
 const desired=Math.min(devicePixelRatio||1,2.5);
 const pseudoViewport={width:rect.w,height:rect.h};
 const out=safeScale(pseudoViewport,DETAIL_MAX_PIXELS,DETAIL_MAX_SIDE,desired);

 detail.width=Math.max(1,Math.floor(rect.w*out));
 detail.height=Math.max(1,Math.floor(rect.h*out));
 detail.style.left=rect.x+'px';
 detail.style.top=rect.y+'px';
 detail.style.width=rect.w+'px';
 detail.style.height=rect.h+'px';

 detailRenderTask=currentPage.render({
  canvasContext:detailCtx,
  viewport,
  transform:[out,0,0,out,-rect.x*out,-rect.y*out],
  background:'#fff'
 });

 try{
  await detailRenderTask.promise;
  if(generation!==detailGeneration)return;
  detail.style.display='block';
 }catch(e){
  if(e?.name!=='RenderingCancelledException')console.error(e);
 }
}
async function renderBase(){
 if(!doc)return;
 hideDetail(true);
 if(baseRenderTask){
  try{baseRenderTask.cancel()}catch{}
 }

 currentPage=await doc.getPage(pageNum);
 baseViewport=currentPage.getViewport({scale:1});
 fitScale=Math.max(.01,(stage.clientWidth-32)/baseViewport.width);
 scale=fitScale*zoom;

 // The navigation layer is always rendered at Fit resolution.
 // Zooming stretches it instantly; the detail layer sharpens only what is visible.
 const viewport=currentPage.getViewport({scale:fitScale});
 const desired=Math.min(devicePixelRatio||1,2);
 const out=safeScale(viewport,BASE_MAX_PIXELS,BASE_MAX_SIDE,desired);

 canvas.width=Math.max(1,Math.floor(viewport.width*out));
 canvas.height=Math.max(1,Math.floor(viewport.height*out));
 applyCssSize();

 baseRenderTask=currentPage.render({
  canvasContext:ctx,
  viewport,
  transform:[out,0,0,out,0,0],
  background:'#fff'
 });

 try{
  await baseRenderTask.promise;
 }catch(e){
  if(e?.name!=='RenderingCancelledException')throw e;
 }
 controls();
 scheduleDetail(40);
}
function resetToFit(){
 if(!doc)return;
 hideDetail(true);
 zoom=1;
 scale=fitScale;
 applyCssSize();
 stage.scrollTo(0,0);
 controls();
 flash('Fit · 1×');
}
async function fitPage(){
 if(!doc)return;
 resetToFit();
}
async function changePage(delta){
 if(!doc)return;
 const target=clamp(pageNum+delta,1,doc.numPages);
 if(target===pageNum)return;
 pageNum=target;
 zoom=1;
 await renderBase();
 stage.scrollTo(0,0);
 flash('Fit · 1×');
}

file.addEventListener('change',async()=>{
 const picked=file.files[0];
 if(!picked)return;
 try{
  hideDetail(true);
  flash('Loading…');
  const data=new Uint8Array(await picked.arrayBuffer());
  doc=await pdfjsLib.getDocument({data}).promise;
  pageNum=1;
  zoom=1;
  empty.style.display='none';
  await renderBase();
  stage.scrollTo(0,0);
  flash(picked.name);
 }catch(e){
  console.error(e);
  flash('Could not open PDF');
 }
});

prev.onclick=()=>changePage(-1);
next.onclick=()=>changePage(1);
fit.onclick=fitPage;
full.onclick=async()=>{
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch{
  flash('Fullscreen unavailable');
 }
};

// Safari browser chrome changes viewport height while scrolling.
// Rebuild only when the usable width actually changes.
window.addEventListener('resize',()=>{
 const w=stage.clientWidth;
 if(doc&&Math.abs(w-lastStageWidth)>2){
  lastStageWidth=w;
  renderBase().catch(console.error);
 }
});

let scrollTimer=0;
stage.addEventListener('scroll',()=>{
 if(!doc||pinch)return;
 clearTimeout(scrollTimer);
 scrollTimer=setTimeout(()=>scheduleDetail(0),DETAIL_DELAY);
},{passive:true});

const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
function midpoint(t){
 const sr=stage.getBoundingClientRect();
 return {
  clientX:(t[0].clientX+t[1].clientX)/2,
  clientY:(t[0].clientY+t[1].clientY)/2,
  x:(t[0].clientX+t[1].clientX)/2-sr.left,
  y:(t[0].clientY+t[1].clientY)/2-sr.top
 };
}

stage.addEventListener('touchstart',e=>{
 if(!doc||e.touches.length!==2||!baseViewport)return;
 hideDetail(true);
 const m=midpoint(e.touches);
 const wr=canvasWrap.getBoundingClientRect();
 pinch={
  d:dist(e.touches),
  z:zoom,
  ax:clamp((m.clientX-wr.left)/Math.max(1,wr.width),0,1),
  ay:clamp((m.clientY-wr.top)/Math.max(1,wr.height),0,1)
 };
},{passive:true});

stage.addEventListener('touchmove',e=>{
 if(!pinch||e.touches.length!==2)return;
 e.preventDefault();

 const m=midpoint(e.touches);
 zoom=clamp(pinch.z*(dist(e.touches)/pinch.d),1,MAX_ZOOM);
 scale=fitScale*zoom;
 applyCssSize();

 const {w,h}=cssSize();
 const pageLeft=canvasWrap.offsetLeft;
 const pageTop=canvasWrap.offsetTop;
 stage.scrollLeft=pageLeft+pinch.ax*w-m.x;
 stage.scrollTop=pageTop+pinch.ay*h-m.y;
 controls();
},{passive:false});

stage.addEventListener('touchend',e=>{
 if(!pinch||e.touches.length>=2)return;
 pinch=null;
 flash(zoomLabel());
 scheduleDetail(60);
},{passive:true});

controls();
</script>
</body>
</html>
