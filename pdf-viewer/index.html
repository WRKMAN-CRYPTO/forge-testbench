<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Forge Blueprint Engine</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101317;color:#eef2f5;font-family:system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}
header{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#171b20;border-bottom:1px solid #2a3037}
button,.fileBtn{border:1px solid #343b44;background:#222830;color:#f4f6f8;border-radius:9px;min-width:40px;height:38px;padding:0 11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.fileBtn{margin-right:auto}.fileBtn input{display:none}button:disabled{opacity:.35}
#pageInfo{font-variant-numeric:tabular-nums;font-size:13px;min-width:54px;text-align:center}
#fit{min-width:54px;font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;overflow:auto;-webkit-overflow-scrolling:auto;overscroll-behavior:none;touch-action:none;background:#0c0f12;user-select:none;-webkit-user-select:none}
#sheet{position:relative;min-width:100%;min-height:100%;padding:16px}
#pageWrap{position:relative;width:max-content;height:max-content;margin:0 auto;background:#fff;box-shadow:0 4px 22px #0008}
#overview{display:block;background:white}
#tiles{position:absolute;inset:0;pointer-events:none;z-index:2}
.tile{position:absolute;display:block;background:white;pointer-events:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#8f9aa6;pointer-events:none}
#empty strong{display:block;color:#dce2e8;font-size:20px;margin-bottom:8px}
#status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border-radius:8px;background:#171b20e8;color:#d5dce3;font-size:12px;display:none;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<header>
<label class="fileBtn">Open PDF<input id="file" type="file" accept="application/pdf,.pdf"></label>
<button id="prev" aria-label="Previous page">‹</button>
<span id="pageInfo">0 / 0</span>
<button id="next" aria-label="Next page">›</button>
<button id="fit" aria-label="Fit page">Fit</button>
<button id="full" aria-label="Fullscreen">⛶</button>
</header>
<div id="stage">
<div id="sheet">
  <div id="pageWrap">
    <canvas id="overview"></canvas>
    <div id="tiles"></div>
  </div>
</div>
<div id="empty"><div><strong>Forge Blueprint Engine</strong>Open a PDF to begin.<br>Tile engine prototype.</div></div>
</div>
<div id="status"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const $=s=>document.querySelector(s);
const file=$('#file');
const overview=$('#overview'),overviewCtx=overview.getContext('2d',{alpha:false});
const stage=$('#stage'),pageWrap=$('#pageWrap'),tilesEl=$('#tiles');
const empty=$('#empty'),info=$('#pageInfo'),status=$('#status');
const prev=$('#prev'),next=$('#next'),fit=$('#fit'),full=$('#full');

const MAX_ZOOM=10;

// Whole-page safety net. This is never our deep-zoom source of truth.
const OVERVIEW_MAX_PIXELS=14000000;
const OVERVIEW_MAX_SIDE=7168;

// High-resolution moving tile neighborhood.
const TILE_SIZE=384;
const TILE_PRELOAD_X=1.15;
const TILE_PRELOAD_Y=.8;
const TILE_KEEP_X=2.0;
const TILE_KEEP_Y=1.5;
const TILE_MAX_COUNT=30;
const TILE_CONCURRENCY=2;
const TILE_OUTPUT_NORMAL=2.0;
const TILE_OUTPUT_DEEP=2.25;
const TILE_MAX_PIXELS=900000;
const TILE_MAX_SIDE=1024;

// Pan braking retained from the previous build.
const INERTIA_MS=670;
const MIN_FLING_SPEED=90;
const MAX_FLING_SPEED=4200;

let doc=null,currentPage=null,pageNum=1;
let zoom=1,scale=1,fitScale=1,baseViewport=null;
let overviewTask=null,overviewGeneration=0;

let pinch=null,pan=null,inertiaRaf=0,lastStageWidth=stage.clientWidth;

// Tile state.
const tileMap=new Map();
let tileQueue=[];
let tileWorkers=0;
let tileEpoch=1;
let tileUpdateRaf=0;
let motionVX=0,motionVY=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function flash(msg){
 status.textContent=msg;
 status.style.display='block';
 clearTimeout(flash.t);
 flash.t=setTimeout(()=>status.style.display='none',1100);
}
function zoomLabel(){return zoom===1?'Fit':zoom.toFixed(zoom<2?1:0)+'×'}
function controls(){
 info.textContent=doc?pageNum+' / '+doc.numPages:'0 / 0';
 prev.disabled=!doc||pageNum<=1;
 next.disabled=!doc||pageNum>=doc.numPages;
 fit.disabled=!doc;
 fit.textContent=doc?zoomLabel():'Fit';
}
function cssSize(){
 return {
  w:baseViewport?baseViewport.width*scale:0,
  h:baseViewport?baseViewport.height*scale:0
 };
}
function applyCssSize(){
 const {w,h}=cssSize();
 overview.style.width=w+'px';
 overview.style.height=h+'px';
 pageWrap.style.width=w+'px';
 pageWrap.style.height=h+'px';
 tilesEl.style.width=w+'px';
 tilesEl.style.height=h+'px';
}
function safeScale(viewport,maxPixels,maxSide,desired){
 const byArea=Math.sqrt(maxPixels/Math.max(1,viewport.width*viewport.height));
 const bySide=Math.min(maxSide/Math.max(1,viewport.width),maxSide/Math.max(1,viewport.height));
 return Math.max(.1,Math.min(desired,byArea,bySide));
}
function overviewOversample(){
 if(zoom>=8)return 5.5;
 if(zoom>=5)return 4.75;
 if(zoom>=3)return 3.75;
 return 2.5;
}
function tileOutputScale(w,h){
 const desired=Math.min(devicePixelRatio||1,zoom>=5?TILE_OUTPUT_DEEP:TILE_OUTPUT_NORMAL);
 return safeScale({width:w,height:h},TILE_MAX_PIXELS,TILE_MAX_SIDE,desired);
}
function stopInertia(){
 if(inertiaRaf){
  cancelAnimationFrame(inertiaRaf);
  inertiaRaf=0;
 }
}
function setScroll(x,y){
 const maxX=Math.max(0,stage.scrollWidth-stage.clientWidth);
 const maxY=Math.max(0,stage.scrollHeight-stage.clientHeight);
 const nx=clamp(x,0,maxX);
 const ny=clamp(y,0,maxY);
 stage.scrollLeft=nx;
 stage.scrollTop=ny;
 return {x:nx,y:ny,hitX:nx!==x,hitY:ny!==y};
}

async function renderOverview(reloadPage=false){
 if(!doc)return;
 const generation=++overviewGeneration;
 if(overviewTask){try{overviewTask.cancel()}catch{}}

 if(reloadPage||!currentPage)currentPage=await doc.getPage(pageNum);
 const page=currentPage;
 baseViewport=page.getViewport({scale:1});
 fitScale=Math.max(.01,(stage.clientWidth-32)/baseViewport.width);
 scale=fitScale*zoom;
 applyCssSize();

 const viewport=page.getViewport({scale:fitScale*overviewOversample()});
 const out=safeScale(viewport,OVERVIEW_MAX_PIXELS,OVERVIEW_MAX_SIDE,1);

 const temp=document.createElement('canvas');
 temp.width=Math.max(1,Math.floor(viewport.width*out));
 temp.height=Math.max(1,Math.floor(viewport.height*out));
 const tempCtx=temp.getContext('2d',{alpha:false});

 overviewTask=page.render({
  canvasContext:tempCtx,
  viewport,
  transform:[out,0,0,out,0,0],
  background:'#fff'
 });

 try{
  await overviewTask.promise;
  if(generation!==overviewGeneration)return;
  overview.width=temp.width;
  overview.height=temp.height;
  overviewCtx.drawImage(temp,0,0);
  applyCssSize();
  controls();
 }catch(e){
  if(e?.name!=='RenderingCancelledException')throw e;
 }
}

/* ---------------- TILE ENGINE ---------------- */

function clearTiles(){
 tileEpoch++;
 tileQueue=[];
 for(const tile of tileMap.values()){
  if(tile.task){try{tile.task.cancel()}catch{}}
  tile.canvas.remove();
 }
 tileMap.clear();
 tileWorkers=0;
 tilesEl.style.display='block';
}

function pageVisibleRect(){
 const sr=stage.getBoundingClientRect();
 const pr=pageWrap.getBoundingClientRect();
 const left=Math.max(sr.left,pr.left);
 const top=Math.max(sr.top,pr.top);
 const right=Math.min(sr.right,pr.right);
 const bottom=Math.min(sr.bottom,pr.bottom);
 if(right<=left||bottom<=top)return null;
 return {
  x:left-pr.left,
  y:top-pr.top,
  w:right-left,
  h:bottom-top,
  pageW:pr.width,
  pageH:pr.height
 };
}

function tileRange(rect,mx,my){
 const speed=Math.hypot(motionVX,motionVY);
 const look=Math.min(1.15,speed/2200);
 const dirX=speed?motionVX/speed:0;
 const dirY=speed?motionVY/speed:0;
 const leadX=dirX*stage.clientWidth*look;
 const leadY=dirY*stage.clientHeight*look;
 const x0=clamp(rect.x-stage.clientWidth*mx+Math.min(0,leadX),0,rect.pageW);
 const y0=clamp(rect.y-stage.clientHeight*my+Math.min(0,leadY),0,rect.pageH);
 const x1=clamp(rect.x+rect.w+stage.clientWidth*mx+Math.max(0,leadX),0,rect.pageW);
 const y1=clamp(rect.y+rect.h+stage.clientHeight*my+Math.max(0,leadY),0,rect.pageH);
 return {
  c0:Math.max(0,Math.floor(x0/TILE_SIZE)),
  r0:Math.max(0,Math.floor(y0/TILE_SIZE)),
  c1:Math.max(0,Math.floor(Math.max(0,x1-1)/TILE_SIZE)),
  r1:Math.max(0,Math.floor(Math.max(0,y1-1)/TILE_SIZE))
 };
}
function inRange(c,r,range){
 return c>=range.c0&&c<=range.c1&&r>=range.r0&&r<=range.r1;
}
function tileKey(c,r){return tileEpoch+':'+c+':'+r}

function queueTile(c,r,priority,pageW,pageH){
 const key=tileKey(c,r);
 if(tileMap.has(key))return;

 const x=c*TILE_SIZE,y=r*TILE_SIZE;
 const w=Math.min(TILE_SIZE,pageW-x);
 const h=Math.min(TILE_SIZE,pageH-y);
 if(w<=0||h<=0)return;

 const canvas=document.createElement('canvas');
 canvas.className='tile';
 canvas.style.left=x+'px';
 canvas.style.top=y+'px';
 canvas.style.width=w+'px';
 canvas.style.height=h+'px';
 canvas.style.visibility='hidden';
 tilesEl.appendChild(canvas);

 const tile={key,c,r,x,y,w,h,canvas,priority,state:'queued',task:null,epoch:tileEpoch,lastUse:performance.now()};
 tileMap.set(key,tile);
 tileQueue.push(tile);
}

function pruneTiles(keep,centerC,centerR){
 const candidates=[];
 for(const [key,tile] of tileMap){
  if(tile.epoch!==tileEpoch)continue;
  tile.lastUse=performance.now();
  if(!inRange(tile.c,tile.r,keep)){
   const d=Math.hypot(tile.c-centerC,tile.r-centerR);
   candidates.push([d,key,tile]);
  }
 }
 candidates.sort((a,b)=>b[0]-a[0]);

 const removeTile=tile=>{
  if(tile.task){try{tile.task.cancel()}catch{}}
  tile.state='dead';
  tile.canvas.remove();
  tileMap.delete(tile.key);
 };

 for(const [,key,tile] of candidates){
  if(tileMap.size<=TILE_MAX_COUNT && inRange(tile.c,tile.r,keep))continue;
  if(tileMap.has(key))removeTile(tile);
 }

 if(tileMap.size>TILE_MAX_COUNT){
  const all=[...tileMap.values()].sort((a,b)=>{
   const da=Math.hypot(a.c-centerC,a.r-centerR);
   const db=Math.hypot(b.c-centerC,b.r-centerR);
   return db-da;
  });
  for(const tile of all){
   if(tileMap.size<=TILE_MAX_COUNT)break;
   removeTile(tile);
  }
 }

 tileQueue=tileQueue.filter(t=>t.state==='queued'&&tileMap.has(t.key));
}

function scheduleTileUpdate(){
 if(!doc||!currentPage||zoom<=1.05||pinch)return;
 if(tileUpdateRaf)return;
 tileUpdateRaf=requestAnimationFrame(()=>{
  tileUpdateRaf=0;
  updateTiles();
 });
}

function updateTiles(){
 if(!doc||!currentPage||zoom<=1.05||pinch)return;
 const rect=pageVisibleRect();
 if(!rect)return;

 const need=tileRange(rect,TILE_PRELOAD_X,TILE_PRELOAD_Y);
 const keep=tileRange(rect,TILE_KEEP_X,TILE_KEEP_Y);
 const visible=tileRange(rect,0,0);
 const centerC=(rect.x+rect.w/2)/TILE_SIZE;
 const centerR=(rect.y+rect.h/2)/TILE_SIZE;
 const speed=Math.hypot(motionVX,motionVY);
 const ux=speed?motionVX/speed:0;
 const uy=speed?motionVY/speed:0;

 // A long flick invalidates yesterday's work. Cancel any in-flight tile
 // that is no longer in the new neighborhood so PDF.js can serve what
 // is actually on screen now.
 if(speed>700){
  for(const tile of tileMap.values()){
   if(tile.state==='rendering'&&!inRange(tile.c,tile.r,need)&&tile.task){
    try{tile.task.cancel()}catch{}
    tile.state='dead';
    tile.canvas.remove();
    tileMap.delete(tile.key);
   }
  }
 }

 for(let r=need.r0;r<=need.r1;r++){
  for(let c=need.c0;c<=need.c1;c++){
   const tileCx=(c+.5)*TILE_SIZE;
   const tileCy=(r+.5)*TILE_SIZE;
   const dx=(tileCx-(rect.x+rect.w/2))/Math.max(1,stage.clientWidth);
   const dy=(tileCy-(rect.y+rect.h/2))/Math.max(1,stage.clientHeight);
   const ahead=dx*ux+dy*uy;
   const onScreen=inRange(c,r,visible);
   // Visible tiles always win. After that, reward tiles in the direction
   // of travel and only then care about raw distance.
   const priority=(onScreen?-100:0)+(dx*dx+dy*dy)-Math.max(0,ahead)*1.6;
   const key=tileKey(c,r);
   const existing=tileMap.get(key);
   if(existing&&existing.state==='queued')existing.priority=priority;
   else queueTile(c,r,priority,rect.pageW,rect.pageH);
  }
 }

 pruneTiles(keep,centerC,centerR);
 tileQueue.sort((a,b)=>a.priority-b.priority);
 pumpTileQueue();
}

function pumpTileQueue(){
 while(tileWorkers<TILE_CONCURRENCY && tileQueue.length){
  const tile=tileQueue.shift();
  if(!tile||tile.state!=='queued'||!tileMap.has(tile.key))continue;
  renderTile(tile);
 }
}

async function renderTile(tile){
 tileWorkers++;
 tile.state='rendering';
 const epoch=tile.epoch;
 const page=currentPage;
 const viewport=page.getViewport({scale});
 const out=tileOutputScale(tile.w,tile.h);

 tile.canvas.width=Math.max(1,Math.ceil(tile.w*out));
 tile.canvas.height=Math.max(1,Math.ceil(tile.h*out));
 const tctx=tile.canvas.getContext('2d',{alpha:false});

 tile.task=page.render({
  canvasContext:tctx,
  viewport,
  transform:[out,0,0,out,-tile.x*out,-tile.y*out],
  background:'#fff'
 });

 try{
  await tile.task.promise;
  if(epoch===tileEpoch&&tileMap.has(tile.key)){
   tile.state='ready';
   tile.task=null;
   tile.canvas.style.visibility='visible';
  }
 }catch(e){
  if(e?.name!=='RenderingCancelledException')console.error(e);
 }finally{
  tileWorkers=Math.max(0,tileWorkers-1);
  pumpTileQueue();
 }
}

/* ---------------- PAGE / FILE ---------------- */

async function fitPage(){
 if(!doc)return;
 stopInertia();
 pan=null;
 pinch=null;
 zoom=1;
 scale=fitScale;
 clearTiles();
 applyCssSize();
 stage.scrollTo(0,0);
 controls();
 flash('Fit · 1×');
}
async function changePage(delta){
 if(!doc)return;
 const target=clamp(pageNum+delta,1,doc.numPages);
 if(target===pageNum)return;

 stopInertia();
 clearTiles();
 pageNum=target;
 zoom=1;
 currentPage=await doc.getPage(pageNum);
 await renderOverview(false);
 stage.scrollTo(0,0);
 flash('Fit · 1×');
}

file.addEventListener('change',async()=>{
 const picked=file.files[0];
 if(!picked)return;
 try{
  stopInertia();
  clearTiles();
  flash('Loading…');
  const data=new Uint8Array(await picked.arrayBuffer());
  doc=await pdfjsLib.getDocument({data}).promise;
  pageNum=1;
  zoom=1;
  currentPage=await doc.getPage(1);
  empty.style.display='none';
  await renderOverview(false);
  stage.scrollTo(0,0);
  flash(picked.name);
 }catch(e){
  console.error(e);
  flash('Could not open PDF');
 }
});

prev.onclick=()=>changePage(-1);
next.onclick=()=>changePage(1);
fit.onclick=fitPage;
full.onclick=async()=>{
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch{
  flash('Fullscreen unavailable');
 }
};

window.addEventListener('resize',()=>{
 const w=stage.clientWidth;
 if(doc&&Math.abs(w-lastStageWidth)>2){
  lastStageWidth=w;
  clearTiles();
  renderOverview(false)
   .then(()=>scheduleTileUpdate())
   .catch(console.error);
 }
});

/* ---------------- CUSTOM PAN PHYSICS ---------------- */

function beginPan(t){
 stopInertia();
 motionVX=0;motionVY=0;
 const now=performance.now();
 pan={
  x:t.clientX,y:t.clientY,
  sx:stage.scrollLeft,sy:stage.scrollTop,
  samples:[{x:t.clientX,y:t.clientY,t:now}]
 };
 scheduleTileUpdate();
}
function movePan(t){
 if(!pan)return;
 const x=pan.sx+(pan.x-t.clientX);
 const y=pan.sy+(pan.y-t.clientY);
 setScroll(x,y);

 const now=performance.now();
 pan.samples.push({x:t.clientX,y:t.clientY,t:now});
 while(pan.samples.length>2&&now-pan.samples[0].t>110)pan.samples.shift();
 if(pan.samples.length>1){
  const a=pan.samples[0],b=pan.samples[pan.samples.length-1];
  const dt=Math.max(16,b.t-a.t)/1000;
  motionVX=(a.x-b.x)/dt;
  motionVY=(a.y-b.y)/dt;
 }
 scheduleTileUpdate();
}
function finishPan(){
 if(!pan)return;
 const samples=pan.samples;
 const last=samples[samples.length-1];
 let first=samples[0];
 for(const s of samples){
  if(last.t-s.t<=90){first=s;break}
 }
 const dt=Math.max(16,last.t-first.t)/1000;
 let vx=(first.x-last.x)/dt;
 let vy=(first.y-last.y)/dt;
 pan=null;

 const speed=Math.hypot(vx,vy);
 if(speed<MIN_FLING_SPEED){
  motionVX=0;motionVY=0;
  scheduleTileUpdate();
  return;
 }
 const factor=Math.min(1,MAX_FLING_SPEED/speed);
 vx*=factor;vy*=factor;
 motionVX=vx;motionVY=vy;
 startInertia(vx,vy);
}
function startInertia(vx,vy){
 stopInertia();
 const start=performance.now();
 const sx=stage.scrollLeft,sy=stage.scrollTop;
 const T=INERTIA_MS/1000;

 const frame=now=>{
  const u=clamp((now-start)/INERTIA_MS,0,1);
  const travel=T*(u-u*u/2);
  const pos=setScroll(sx+vx*travel,sy+vy*travel);
  scheduleTileUpdate();

  if(u<1&&!(pos.hitX&&pos.hitY)){
   inertiaRaf=requestAnimationFrame(frame);
  }else{
   inertiaRaf=0;
   motionVX=0;motionVY=0;
   scheduleTileUpdate();
  }
 };
 inertiaRaf=requestAnimationFrame(frame);
}

/* ---------------- PINCH ---------------- */

const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
function midpoint(t){
 const sr=stage.getBoundingClientRect();
 return {
  clientX:(t[0].clientX+t[1].clientX)/2,
  clientY:(t[0].clientY+t[1].clientY)/2,
  x:(t[0].clientX+t[1].clientX)/2-sr.left,
  y:(t[0].clientY+t[1].clientY)/2-sr.top
 };
}
function beginPinch(touches){
 stopInertia();
 motionVX=0;motionVY=0;
 pan=null;
 tilesEl.style.display='none';
 const m=midpoint(touches);
 const wr=pageWrap.getBoundingClientRect();
 pinch={
  d:dist(touches),
  z:zoom,
  ax:clamp((m.clientX-wr.left)/Math.max(1,wr.width),0,1),
  ay:clamp((m.clientY-wr.top)/Math.max(1,wr.height),0,1)
 };
}
function movePinch(touches){
 if(!pinch)return;
 const m=midpoint(touches);
 zoom=clamp(pinch.z*(dist(touches)/pinch.d),1,MAX_ZOOM);
 scale=fitScale*zoom;
 applyCssSize();

 const {w,h}=cssSize();
 const pageLeft=pageWrap.offsetLeft;
 const pageTop=pageWrap.offsetTop;
 setScroll(
  pageLeft+pinch.ax*w-m.x,
  pageTop+pinch.ay*h-m.y
 );
 controls();
}
function finishPinch(remainingTouch=null){
 pinch=null;
 flash(zoomLabel());

 clearTiles();
 tilesEl.style.display='block';

 // Build the visible sharp neighborhood first.
 scheduleTileUpdate();

 // Then quietly improve the whole-page fallback beneath it.
 renderOverview(false)
  .then(()=>scheduleTileUpdate())
  .catch(e=>console.error(e));

 if(remainingTouch)beginPan(remainingTouch);
}

/* ---------------- TOUCH ROUTING ---------------- */

stage.addEventListener('touchstart',e=>{
 if(!doc)return;
 if(e.touches.length===1&&!pinch){
  e.preventDefault();
  beginPan(e.touches[0]);
 }else if(e.touches.length===2){
  e.preventDefault();
  beginPinch(e.touches);
 }
},{passive:false});

stage.addEventListener('touchmove',e=>{
 if(!doc)return;
 if(e.touches.length===2){
  e.preventDefault();
  if(!pinch)beginPinch(e.touches);
  movePinch(e.touches);
 }else if(e.touches.length===1&&pan&&!pinch){
  e.preventDefault();
  movePan(e.touches[0]);
 }
},{passive:false});

stage.addEventListener('touchend',e=>{
 if(!doc)return;
 if(pinch&&e.touches.length<2){
  const remaining=e.touches.length===1?e.touches[0]:null;
  finishPinch(remaining);
  return;
 }
 if(pan&&e.touches.length===0)finishPan();
},{passive:true});

stage.addEventListener('touchcancel',()=>{
 pinch=null;
 pan=null;
 stopInertia();
 tilesEl.style.display='block';
 scheduleTileUpdate();
},{passive:true});

controls();
</script>
</body>
</html>
