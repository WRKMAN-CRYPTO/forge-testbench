<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11130f"><title>Last Time</title><style>
*{box-sizing:border-box}body{margin:0;background:#11130f;color:#f4f0e4;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 110px}header{display:flex;align-items:end;justify-content:space-between;margin:8px 2px 24px}h1{font-size:34px;line-height:.95;margin:0;letter-spacing:-1.5px}.sub{color:#9da18f;font-size:13px;margin-top:7px}.count{font-size:12px;color:#777d6d}.add{display:flex;gap:8px;background:#1a1d17;border:1px solid #30352a;border-radius:18px;padding:8px;margin-bottom:22px;position:sticky;top:8px;z-index:3;box-shadow:0 8px 28px #0007}.add input{min-width:0;flex:1;background:transparent;border:0;color:#fff;font-size:17px;padding:10px;outline:0}.add button,.done{border:0;background:#d6ff6b;color:#172000;font-weight:800;border-radius:12px;padding:0 16px;font-size:15px}.empty{color:#737868;text-align:center;padding:70px 20px}.card{background:#191c16;border:1px solid #2b3026;border-radius:19px;padding:17px;margin:10px 0}.top{display:flex;gap:12px;align-items:start}.name{font-size:19px;font-weight:750;flex:1;overflow-wrap:anywhere}.when{font-size:13px;color:#a7ac98;margin-top:5px}.age{font-variant-numeric:tabular-nums;color:#d6ff6b;font-weight:800;font-size:13px}.actions{display:flex;gap:8px;margin-top:15px}.done{height:42px;flex:1}.more{height:42px;width:44px;border-radius:12px;border:1px solid #353b2e;background:#20241c;color:#aeb49e;font-size:20px}.history{display:none;border-top:1px solid #30352a;margin-top:14px;padding-top:10px;color:#949a87;font-size:13px}.history.open{display:block}.histrow{padding:6px 0}.hint{font-size:12px;color:#686d60;text-align:center;margin-top:25px}button{touch-action:manipulation}button:active{transform:scale(.97)}
</style></head><body><main><header><div><h1>LAST TIME</h1><div class="sub">You do the thing. I remember when.</div></div><div class="count" id="count"></div></header><form class="add" id="add"><input id="input" autocomplete="off" maxlength="80" placeholder="What do you want to remember?" aria-label="Thing to remember"><button type="submit">ADD</button></form><section id="list"></section><div class="hint">No schedules. No nagging. Just memory.</div></main><script>
(function(){
const KEY='last-time-v1';let items=[];try{const raw=localStorage.getItem(KEY);items=raw?JSON.parse(raw):[];if(!Array.isArray(items))items=[]}catch(e){items=[]}
const addForm=document.getElementById('add'),input=document.getElementById('input'),list=document.getElementById('list'),count=document.getElementById('count');
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function ago(t){if(!t)return'Never logged';const m=Math.floor((Date.now()-t)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const day=Math.floor(h/24);if(day<30)return day+'d ago';const mo=Math.floor(day/30.44);if(mo<12)return mo+'mo ago';return Math.floor(day/365.25)+'y ago'}
function exact(t){return new Date(t).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function render(){items.sort((a,b)=>(a.last||0)-(b.last||0));count.textContent=items.length?items.length+' remembered':'';if(!items.length){list.innerHTML='<div class="empty">Nothing to remember yet.<br>Add something above.</div>';return}list.innerHTML=items.map(x=>'<article class="card" data-id="'+x.id+'"><div class="top"><div class="name">'+esc(x.name)+'</div><div class="age">'+ago(x.last)+'</div></div><div class="when">'+(x.last?'Last: '+exact(x.last):'Tap DID IT the first time you do it.')+'</div><div class="actions"><button type="button" class="done" data-do="done">DID IT</button><button type="button" class="more" data-do="more" aria-label="History">···</button></div><div class="history">'+((x.history||[]).length?'<b>History</b>'+x.history.slice().reverse().map(t=>'<div class="histrow">'+exact(t)+'</div>').join(''):'No older history yet.')+'<div class="histrow"><button type="button" data-do="delete" style="margin-top:8px;background:none;border:0;color:#8e756f;padding:5px 0">Delete this memory</button></div></div></article>').join('')}
addForm.addEventListener('submit',function(e){e.preventDefault();const n=input.value.trim();if(!n)return;items.push({id:Date.now(),name:n,last:null,history:[]});input.value='';save();render();input.focus()});
list.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const card=b.closest('.card');if(!card)return;const id=Number(card.dataset.id),x=items.find(v=>v.id===id);if(!x)return;if(b.dataset.do==='done'){const now=Date.now();if(x.last)x.history=(x.history||[]).concat(x.last);x.last=now;save();render();if(navigator.vibrate)navigator.vibrate(18)}else if(b.dataset.do==='more'){card.querySelector('.history').classList.toggle('open')}else if(b.dataset.do==='delete'&&confirm('Forget “'+x.name+'”?')){items=items.filter(v=>v.id!==id);save();render()}});
render();setInterval(function(){document.querySelectorAll('.card').forEach(function(c){const x=items.find(v=>v.id===Number(c.dataset.id));if(x)c.querySelector('.age').textContent=ago(x.last)})},60000);
})();
</script></body></html>
