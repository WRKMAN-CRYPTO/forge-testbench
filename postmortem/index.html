{title:'The Final Set',subtitle:'A singer falls silent behind the curtain.',name:'Nina Hart',age:31,found:'01:16 AM • backstage dressing room',detail:'A singer collapsed after finishing a sold-out set. A syringe on the floor and a bitter argument earlier that evening have the crew whispering murder.',cause:'Anaphylaxis',manner:'Accident',hints:['A dramatic object at a scene is not necessarily the lethal one. Examine the neck and the medical history.','The combination of airway findings and a food exposure warrants an allergy-focused laboratory investigation.'],debrief:'Severe peanut exposure triggered a fatal anaphylactic reaction. Airway swelling, history, elevated postmortem tryptase, and allergen detection support the conclusion together. The syringe was an emergency epinephrine auto-injector, not a murder weapon.',lesson:'A single laboratory marker rarely tells the entire story. Read the scene, history, and autopsy as one set of evidence.',scene:[

{title:'Mile Marker 19',subtitle:'A long drive. A sudden ending.',name:'Sasha Reed',age:45,found:'03:08 AM • truck stop parking lot',detail:'A long-haul driver was found collapsed beside her cab. A bruise on her arm and a bottle of sedatives have prompted rumors of an overdose or assault.',cause:'Pulmonary thromboembolism',manner:'Natural',hints:['One painful or swollen limb can point to a lethal process somewhere else.','Examine the legs and pulmonary arteries. An antemortem thrombus is the key distinction.'],debrief:'A deep-vein thrombosis in the leg embolized to the pulmonary arteries, causing a fatal pulmonary thromboembolism. The medication bottle and arm puncture were misleading context; the puncture was associated with attempted resuscitation.',lesson:'Prolonged immobility can contribute to venous thrombosis. A clot in the lungs is a cause; the manner here is natural.',scene:[
['Driving records','The route log shows unusually long stretches of driving with very few stops over two days.',true,'▤'],['Earlier phone call','Sasha told her sister that her left calf felt sore and swollen. She planned to rest after one more delivery.',true,'✉'],['Pill bottle','A prescribed sleep medication is in the cab. Its presence does not establish an overdose.',false,'◈'],['Emergency response','Paramedics made several attempts to establish IV access during unsuccessful resuscitation.',false,'✚']],
exam:{head:['Head','No skull injury or intracranial bleeding.',false],neck:['Neck','No signs of assault or compression.',false],chest:['Pulmonary arteries','A large thromboembolus obstructs the main pulmonary arteries. Right ventricular strain is evident.',true],abdomen:['Abdominal organs','No lethal abdominal pathology.',false],arms:['Arm mark','A recent puncture and small bruise match the documented emergency intervention.',false],legs:['Left calf','Deep-vein thrombosis is present in a swollen calf vein.',true]},
labs:[['Clot histopathology',2,'Assess whether the pulmonary clot formed before death.','Findings support a true antemortem thromboembolus rather than a postmortem clot.',true],['Leg-vein dissection',2,'Trace the origin of the venous thrombus.','A deep calf thrombus is documented, consistent with the embolic source.',true],['Drug toxicology',2,'Measure the sedative and other drugs.','The prescribed sedative is present at a nonlethal concentration.',false],['Cardiac histology',1,'Look for myocardial infarction.','No acute infarction detected.',false],['Pulmonary tissue sampling',1,'Examine surrounding lung for other disease.','No competing cause sufficient to explain the sudden collapse.',false]],budget:7},
{title:'A Bitter Harvest',subtitle:'Not every poison comes in a bottle.',name:'Victor Hale',age:53,found:'10:23 PM • botanical conservatory',detail:'The conservatory owner was found dead after an evening meeting. He had a heated business dispute, but the only item beside him was a cup of herbal tea.',cause:'Cardiac glycoside poisoning',manner:'Homicide',hints:['The greenhouse is full of harmless plants and a few very dangerous ones. Examine the tea and stomach contents.','The toxic compound explains the mechanism. Establishing homicide also requires evidence that someone deliberately administered it.'],debrief:'Oleander-derived cardiac glycosides were detected in the drink and stomach contents. Security footage, reviewed with the laboratory results, shows the business partner intentionally adding plant material to Victor’s tea. Together these support poisoning as the cause and homicide as the manner.',lesson:'Cause describes the fatal physiological process. Manner describes the circumstances, so toxicology alone cannot prove murder.',scene:[
['The tea cup','A partially consumed cup of homemade herbal tea rests beside the chair. It has been retained for testing.',true,'♨'],['Plant inventory','Several ornamental oleander shrubs are kept in the conservatory. All parts of the plant are toxic.',true,'✿'],['Business dispute','Victor was negotiating a sale with partner Leon. The meeting turned hostile according to nearby staff.',false,'✉'],['Camera system','A camera faces the preparation counter. Footage is available for forensic review.',true,'◉']],

{title:'The Glass Stair',subtitle:'An obvious fall. A less obvious beginning.',name:'Ada Monroe',age:68,found:'08:51 AM • family residence',detail:'A retired architect lies at the foot of a glass staircase. An overturned stool suggests a disastrous fall, but the first clues may be misleading.',cause:'Subarachnoid hemorrhage',manner:'Natural',hints:['Could a medical emergency have happened before the fall? Investigate the brain and the witness timeline.','Blood at the base of the brain with an identifiable ruptured aneurysm supports a spontaneous subarachnoid hemorrhage.'],debrief:'Ada suffered a spontaneous aneurysmal subarachnoid hemorrhage and then fell. Blood at the brain’s base and a ruptured intracranial aneurysm establish a natural death. The minor injuries from the fall were not fatal.',lesson:'Distinguish a collapse that causes a fall from a fall that causes a death. The sequence changes the conclusion.',scene:[
['Neighbor account','Minutes before the fall, Ada phoned a neighbor and said she had the worst headache of her life.',true,'✉'],['Staircase scene','A stool is overturned at the foot of the stairs. There is little damage to the glass or surrounding rail.',false,'▥'],['Health notes','A home blood-pressure log shows repeatedly high readings over recent weeks.',false,'▤'],['Home entry log','Smart-lock records show no other entries around the time of the event. This is supportive context, not proof of manner.',false,'⚿']],

labs:[['Cerebral vascular dissection',2,'Identify the source of intracranial bleeding.','A ruptured saccular aneurysm is found in an intracranial artery.',true],['Head imaging review',2,'Review scans and correlate with autopsy findings.','Blood distribution is typical for aneurysmal subarachnoid hemorrhage; no major traumatic brain lesion.',true],['Drug toxicology',2,'Evaluate an intoxicant or medication-related explanation.','No toxic drug concentrations identified.',false],['Blood-pressure record analysis',1,'Review clinical history for relevant risk factors.','Sustained hypertension is documented. This is a risk factor, not proof of cause.',false],['Skeletal examination',1,'Assess for significant traumatic injury.','Only minor injuries are identified; none would explain the death.',false]],budget:7}
];
const STORAGE='postmortem_night_shift_v1';
const fresh=()=>({caseIndex:0,tab:'scene',records:CASES.map(c=>({viewed:[],budget:c.budget,notes:'',cause:'',manner:'',cited:[],hint:0,submissions:0,completed:false,best:0})),unlocked:1});
let game;
try{game=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!game||!Array.isArray(game.records)||game.records.length!==CASES.length)game=fresh();}catch(e){game=fresh()}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(game))}catch(e){}};
const state=()=>game.records[game.caseIndex];
const CASE=()=>CASES[game.caseIndex];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let modal=null,toastTimer;
function toast(message){const x=document.getElementById('toast');x.textContent=message;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2400)}
function findEvidence(id){const c=CASE();if(id.startsWith('s')){let i=Number(id.split('-')[1]);let d=c.scene[i];return d&&{id,title:d[0],text:d[1],key:d[2],type:'SCENE'}}if(id.startsWith('e')){let k=id.split('-')[1];let d=c.exam[k];return d&&{id,title:d[0],text:d[1],key:d[2],type:'EXAM'}}if(id.startsWith('l')){let i=Number(id.split('-')[1]);let d=c.labs[i];return d&&{id,title:d[0],text:d[3],key:d[4],type:'LAB'}}return null}
function addEvidence(id){let r=state();if(!r.viewed.includes(id)){r.viewed.push(id);save();toast('Finding added to evidence ledger')}else toast('Finding already recorded');render()}
function render(){const c=CASE(),r=state(),num=String(game.caseIndex+1).padStart(2,'0');document.getElementById('screen').innerHTML=`<section class="hero"><div><div class="micro">CASE ${num} / ${String(CASES.length).padStart(2,'0')} &nbsp;·&nbsp; ACTIVE INVESTIGATION</div><h1>Every body <em>tells a story.</em></h1><p class="intro">Investigate the scene, examine the remains, order the right tests, and determine what actually happened. Your verdict goes on the permanent record.</p></div><div class="case-stamp">MEDICAL EXAMINER<strong>${num}</strong>CASE FILE</div></section><div class="workbench"><main class="main-panel"><div class="panel-heading"><div><div class="micro">RECORD #ME-${2026+game.caseIndex}-${String(814+game.caseIndex*31)}</div><h2 class="case-name">${c.title}</h2><div class="case-meta">${c.name} • ${c.age} years • ${c.found}</div></div><span class="pill">${r.completed?'Closed':'Open case'}</span></div><nav class="tabs" aria-label="Investigation sections">${[['scene','01 Scene'],['exam','02 Autopsy'],['lab','03 Lab'],['report','04 Verdict']].map(([id,label])=>`<button type="button" class="tab ${game.tab===id?'active':''}" data-action="tab" data-id="${id}" aria-current="${game.tab===id?'page':'false'}">${label}</button>`).join('')}</nav><div class="stage">${renderStage()}</div></main><aside class="side-panel"><div class="side-head"><div class="micro">PERSONAL FIELD JOURNAL</div><h3>Evidence ledger</h3><p>Only examined findings can support a verdict.</p></div><div class="side-body"><div class="stat-row"><div class="stat"><b>${r.viewed.length}</b><span>Findings logged</span></div><div class="stat"><b>${r.budget}</b><span>Lab credits left</span></div></div><div class="ledger-title"><span>Collected evidence</span><span>${String(r.viewed.length).padStart(2,'0')}</span></div>${r.viewed.length?`<div class="ledger" aria-live="polite">${[...r.viewed].reverse().map(id=>{const e=findEvidence(id);return e?`<div class="finding"><div class="finding-top"><span class="finding-type">${e.type}</span><strong>${escapeHTML(e.title)}</strong></div><p>${escapeHTML(e.text)}</p></div>`:''}).join('')}</div>`:'<div class="empty-ledger">Nothing logged yet.<br>Open a scene item or examine the body to begin.</div>'}<div class="notes-title">Examiner's private notes</div><textarea class="notepad" maxlength="2000" placeholder="Your theory, contradictions, suspects..." aria-label="Examiner notes" id="notes"></textarea><div class="bottomtools"><button class="linkbtn" data-action="hint">Need a nudge? (${r.hint}/2)</button><button class="linkbtn" data-action="archive">All case files ↗</button></div>${r.hint?`<div class="hint-msg">${escapeHTML(c.hints[r.hint-1])}</div>`:''}</div></aside></div>`;
const notes=document.getElementById('notes');notes.value=r.notes;notes.addEventListener('input',e=>{r.notes=e.target.value;save()});renderModal()}
function renderStage(){let c=CASE(),r=state();if(game.tab==='scene')return `<div class="stage-label">SCENE INVESTIGATION / 01</div><h3>What happened here?</h3><p class="stage-desc">${escapeHTML(c.detail)}<br><strong style="color:#d0ded8">Select items to read their reports.</strong></p><div class="scene-grid">${c.scene.map((d,i)=>`<button class="evidence-card ${r.viewed.includes('s-'+i)?'viewed':''}" data-action="inspect" data-id="s-${i}"><span class="card-icon" aria-hidden="true">${d[3]}</span><div><div class="card-num">EXHIBIT 0${i+1}</div><div class="card-title">${d[0]}</div></div><div class="card-status">${r.viewed.includes('s-'+i)?'✓ Recorded in ledger':'⊕ Tap to examine'}</div></button>`).join('')}</div>`;
if(game.tab==='exam')return `<div class="stage-label">EXTERNAL & INTERNAL EXAMINATION / 02</div><h3>Examine the remains</h3><p class="stage-desc">Select a region on the figure, or use the labeled controls, to reveal the findings. The illustration is intentionally nongraphic.</p><div class="inspect-body"><div class="body-diagram" role="group" aria-label="Clickable anatomical examination regions"><svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="figure" x1="0" x2="1"><stop stop-color="#476972"/><stop offset=".6" stop-color="#7eaaa5"/><stop offset="1" stop-color="#34505c"/></linearGradient></defs><g fill="url(#figure)" stroke="#b3d4c2" stroke-width="1.1"><ellipse cx="150" cy="72" rx="35" ry="44"/><path d="M130 111 L128 128 Q102 130 91 151 L81 238 104 257 113 330 110 400 138 400 151 278 162 400 190 400 184 328 195 257 219 236 210 151 Q198 131 174 128 L169 111Z"/><path d="M92 145 Q65 151 54 187 L26 269 Q23 281 37 286 Q48 289 55 277 L93 207Z"/><path d="M208 145 Q236 151 247 187 L274 269 Q278 282 265 286 Q253 289 247 277 L207 207Z"/></g><g stroke="#9bdac8" fill="none" opacity=".48" stroke-width="1.4"><path d="M151 122V281 M115 175 Q149 190 186 175 M110 200 Q149 219 190 200 M112 225 Q150 239 189 225 M127 257 Q150 269 173 257"/><path d="M151 157 C104 137 109 209 150 211 C191 209 196 137 151 157Z"/><path d="M132 321 L127 388 M168 321 L175 388"/></g><g stroke="#99d1bf" opacity=".16" stroke-dasharray="3 7"><path d="M0 72 H300 M0 188 H300 M0 316 H300"/></g></svg><div class="scanlines"></div>${REGIONS.map(([id,label,symbol,x,y])=>`<button class="hotspot ${r.viewed.includes('e-'+id)?'viewed':''}" data-action="inspect" data-id="e-${id}" style="left:${x}%;top:${y}%" title="Examine ${label}" aria-label="Examine ${label}">${r.viewed.includes('e-'+id)?'✓':'+'}</button>`).join('')}</div><div><div class="micro" style="margin-bottom:11px">EXAMINATION AREAS</div><div class="region-list">${REGIONS.map(([id,label])=>`<button class="region-btn ${r.viewed.includes('e-'+id)?'viewed':''}" data-action="inspect" data-id="e-${id}"><strong>${label}</strong><span>${r.viewed.includes('e-'+id)?'✓ Examined':'Open exam →'}</span></button>`).join('')}</div><p class="exam-note">Clinical findings may be suggestive, but the strongest conclusions draw on the scene and supporting tests.</p><button class="ghost" data-action="tab" data-id="lab" style="margin-top:8px">Continue to laboratory →</button></div></div>`;
if(game.tab==='lab')return `<div class="stage-label">LABORATORY REQUESTS / 03</div><h3>Spend your lab credits wisely</h3><p class="stage-desc">Tests return immediately. Not all results are useful, and the budget is limited. Pick what could confirm or challenge your theory.</p><div class="lab-top"><span class="micro">AVAILABLE INVESTIGATIONS</span><span class="budget">◈ ${r.budget} CREDITS REMAINING</span></div><div class="lab-list">${c.labs.map((d,i)=>{let used=r.viewed.includes('l-'+i);return `<div class="lab-entry ${used?'ran':''}"><div style="min-width:0;flex:1"><h4>${d[0]}</h4><p>${used?escapeHTML(d[3]):escapeHTML(d[2])}</p></div><div style="text-align:right"><div class="lab-price">${d[1]} ◈</div><button class="lab-run" data-action="lab" data-id="${i}" ${used||r.budget<d[1]?'disabled':''}>${used?'✓ Done':'Run test'}</button></div></div>`}).join('')}</div><div class="lab-controls">An exhausted budget does not prevent you from filing a verdict.</div>`;
return `<div class="stage-label">FORMAL CASE CONCLUSION / 04</div><h3>Sign the death certificate</h3><p class="stage-desc">Determine both the medical cause and the circumstances of death. Select at least two pieces of collected evidence to defend your conclusion.</p><div class="report-grid"><section><div class="select-heading">I. Cause of death</div><div class="choice-list">${CAUSES.map(x=>`<button class="choice ${r.cause===x?'selected':''}" data-action="cause" data-id="${x}" aria-pressed="${r.cause===x}">${x}</button>`).join('')}</div></section><section><div class="select-heading">II. Manner of death</div><div class="choice-list">${MANNERS.map(x=>`<button class="choice ${r.manner===x?'selected':''}" data-action="manner" data-id="${x}" aria-pressed="${r.manner===x}">${x}</button>`).join('')}</div><div class="sep"></div><p class="hint-small"><strong style="color:#cbd8d5">Cause</strong> = the medical condition or injury that killed them.<br><br><strong style="color:#cbd8d5">Manner</strong> = natural, accident, homicide, suicide, or undetermined.</p></section></div><div class="cite-box"><div class="select-heading">III. Evidence cited <span class="faded">(choose 2–3)</span></div>${r.viewed.length?`<div class="cite-options">${r.viewed.map(id=>{const e=findEvidence(id);return e?`<label class="cite-option ${r.cited.includes(id)?'selected':''}"><input type="checkbox" data-evidence="${id}" ${r.cited.includes(id)?'checked':''} /><span>${escapeHTML(e.title)} <span class="faded">(${e.type})</span></span></label>`:''}).join('')}</div>`:'<p class="hint-small">No evidence yet. Start with the scene or autopsy examination.</p>'}</div><div class="file-verdict"><div class="hint-small">${r.submissions?'Previous sign-offs: '+r.submissions+' • ':''}Your signature closes this review.<br>Wrong conclusions can be re-investigated.</div><button class="primary" data-action="verdict" ${!r.cause||!r.manner||r.cited.length<2?'disabled':''}>File final verdict ↗</button></div>`
}
function updateModal(content){modal=content;renderModal()}
function renderModal(){const root=document.getElementById('overlay');if(!modal){root.innerHTML='';return}if(modal.kind==='evidence'){const d=findEvidence(modal.id);if(!d){modal=null;root.innerHTML='';return}root.innerHTML=`<div class="shade" data-action="dismiss-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><button class="close" data-action="dismiss" aria-label="Close">×</button><div class="stage-label">${d.type} / EVIDENCE ANALYSIS</div><h2 id="m-title">${escapeHTML(d.title)}</h2><p class="long-text">${escapeHTML(d.text)}</p><div class="modal-foot"><span class="pill">✓ Filed in journal</span><button class="primary" data-action="dismiss">Back to investigation</button></div></div></div>`;return}
if(modal.kind==='archive'){root.innerHTML=`<div class="shade" data-action="dismiss-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><button class="close" data-action="dismiss" aria-label="Close">×</button><div class="stage-label">POSTMORTEM • CASE ARCHIVE</div><h2 id="m-title">The night shift never ends.</h2><p>Five fictional deaths. Five very different stories. Investigate in order, or revisit a case to improve your report.</p><div class="archive-list">${CASES.map((c,i)=>{let r=game.records[i],locked=i>=game.unlocked;return `<button class="archive-item ${i===game.caseIndex?'active':''}" data-action="open-case" data-id="${i}" ${locked?'disabled':''}><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${c.title}</strong><small>${c.subtitle}</small></span><span class="archive-status">${locked?'⌑ LOCKED':r.completed?'✓ '+r.best+' pts':r.submissions?'Reviewed':'Open →'}</span></button>`}).join('')}</div><div class="modal-foot" style="justify-content:space-between"><button class="linkbtn" data-action="reset-confirm">Reset progress</button><button class="primary" data-action="dismiss">Return to case</button></div></div></div>`;return}
if(modal.kind==='reset'){root.innerHTML=`<div class="shade"><div class="modal" role="dialog" aria-modal="true"><div class="stage-label">CONFIRMATION</div><h2>Wipe the archive?</h2><p>This removes local progress and notes for all five cases. The evidence stays safely in the game's fictional universe.</p><div class="modal-foot"><button class="ghost" data-action="archive">Cancel</button><button class="primary" data-action="reset">Erase casebook</button></div></div></div>`;return}
if(modal.kind==='result'){const c=CASE(),r=state(),correct=modal.correct;const points=modal.score;root.innerHTML=`<div class="shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="result-mark ${correct?'':'wrong'}">${correct?'✓':'×'}</div><div class="stage-label">OFFICIAL MEDICAL EXAMINER'S REPORT</div><h2 id="m-title">${correct?'Case closed.':'The evidence disagrees.'}</h2><div class="result-score"><b style="color:${correct?'var(--mint)':'var(--red)'}">${points}</b><span>Investigation score / 100</span></div><div class="result-box ${correct?'':'wrong'}"><strong>Cause: ${c.cause}</strong><p>Manner: ${c.manner}</p></div><p class="long-text">${escapeHTML(c.debrief)}</p><p><strong style="color:var(--amber)">Examiner's note:</strong> ${escapeHTML(c.lesson)}</p>${!correct?`<p class="hint-small">Your report stated <strong>${escapeHTML(modal.submittedCause)}</strong> / <strong>${escapeHTML(modal.submittedManner)}</strong>. You can review this case and try again for a better score.</p>`:''}<div class="modal-foot"><button class="ghost" data-action="dismiss">Review evidence</button><button class="primary" data-action="next-case">${game.caseIndex+1<CASES.length?'Next case →':'Browse case archive ↗'}</button></div></div></div>`;return}}
function submitVerdict(){const r=state(),c=CASE();if(!r.cause||!r.manner||r.cited.length<2){toast('Select a cause, manner and at least two findings');return}const correct=r.cause===c.cause&&r.manner===c.manner;const critical=r.cited.filter(id=>findEvidence(id)?.key).length;const score=correct?Math.max(50,Math.min(100,65+Math.min(critical,3)*7+r.budget*2-(r.hint*5)-(r.submissions*8))):Math.max(5,Math.round(20+critical*5-r.hint*3));const submittedCause=r.cause,submittedManner=r.manner;r.submissions++;if(correct){r.completed=true;r.best=Math.max(r.best,score)}game.unlocked=Math.min(CASES.length,Math.max(game.unlocked,game.caseIndex+2));save();updateModal({kind:'result',correct,score,submittedCause,submittedManner})}
function nextCase(){modal=null;if(game.caseIndex+1<CASES.length){game.caseIndex++;game.tab='scene';save();render();window.scrollTo({top:0,behavior:'smooth'})}else{updateModal({kind:'archive'})}}
function goCase(i){if(i<0||i>=game.unlocked)return;game.caseIndex=i;game.tab='scene';modal=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function changeStage(id){if(!['scene','exam','lab','report'].includes(id))return;game.tab=id;save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='dismiss-bg'&&e.target!==b)return;if(a==='dismiss'||a==='dismiss-bg'){modal=null;renderModal()}else if(a==='archive')updateModal({kind:'archive'});else if(a==='reset-confirm')updateModal({kind:'reset'});else if(a==='reset'){game=fresh();save();modal=null;render();toast('Casebook cleared')}
else if(a==='tab')changeStage(id);else if(a==='open-case')goCase(Number(id));else if(a==='inspect'){addEvidence(id);updateModal({kind:'evidence',id})}else if(a==='lab'){const i=Number(id),r=state(),test=CASE().labs[i];if(!test||r.viewed.includes('l-'+i)||r.budget<test[1])return;r.budget-=test[1];addEvidence('l-'+i);updateModal({kind:'evidence',id:'l-'+i})}else if(a==='cause'){state().cause=id;save();render()}else if(a==='manner'){state().manner=id;save();render()}else if(a==='hint'){const r=state();if(r.hint<2){r.hint++;save();render();toast('Hint revealed • 5-point score penalty')}else toast('All hints have been revealed')}else if(a==='verdict')submitVerdict();else if(a==='next-case')nextCase()});
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-evidence]'))return;let r=state(),id=el.dataset.evidence;if(el.checked){if(r.cited.length>=3){el.checked=false;toast('Choose up to three findings');return}r.cited.push(id)}else r.cited=r.cited.filter(x=>x!==id);save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}});
render();
</script>
