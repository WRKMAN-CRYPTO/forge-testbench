<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>CHRONO//VALE</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f7f0d8;background:#10141a}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141a}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:7px}.hud{display:flex;justify-content:space-between;gap:7px;font-size:11px}.card{background:#1b2029;border:1px solid #46505e;border-radius:11px;padding:7px;box-shadow:0 4px 18px #0005}.screen{position:relative;flex:1;min-height:0}.screen canvas{width:100%;height:100%;display:block;border-radius:13px;background:#1b2831;border:1px solid #46505e;image-rendering:pixelated}.msg{position:absolute;left:7px;right:7px;bottom:7px;background:#11151be8;border:1px solid #596674;border-radius:9px;padding:7px;font-size:11px;min-height:38px}.controls{display:grid;grid-template-columns:1.1fr .9fr;gap:7px}.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,43px);justify-content:center}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{font:inherit;font-weight:700;color:#f9f4df;background:#29313d;border:1px solid #657182;border-radius:11px;min-height:42px;padding:6px}button:active{transform:scale(.975);background:#394455}button:disabled{opacity:.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.battle{position:absolute;inset:0;display:none;flex-direction:column;padding:7px;background:linear-gradient(#17212df7,#10151df8)}.battle.show{display:flex}.arena{position:relative;height:42%;min-height:120px;border:1px solid #455260;border-radius:11px;background:linear-gradient(#263642,#18242d);overflow:hidden}.ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:#28372d;border-top:1px solid #536653}.unit{position:absolute;transform:translate(-50%,-50%);text-align:center;transition:left .18s ease,top .18s ease}.unit .sprite{font-size:32px;filter:drop-shadow(0 3px 2px #0008)}.unit .name{font-size:9px;background:#10151dcc;border-radius:6px;padding:2px 4px;white-space:nowrap}.unit.enemy .name{color:#ffd4d4}.intent{font-size:9px;color:#ffd879;min-height:11px}.timeline{margin-top:6px;padding:6px}.track{position:relative;height:38px;border-radius:8px;background:#0f141b;border:1px solid #4b5664;overflow:hidden}.track:before{content:"";position:absolute;left:66%;top:0;bottom:0;border-left:2px solid #e2bf56}.track:after{content:"";position:absolute;right:2px;top:0;bottom:0;border-left:2px solid #ff806e}.labels{display:flex;justify-content:space-between;font-size:9px;opacity:.7;margin-bottom:3px}.tick{position:absolute;top:5px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:15px;transform:translateX(-50%);border:1px solid #fff7;background:#24303d;transition:left .06s linear}.tick.ready{box-shadow:0 0 0 2px #ffe07c}.tick.enemy{background:#472c31}.panel{margin-top:6px;display:flex;flex-direction:column;gap:6px;min-height:0}.battlelog{font-size:10px;line-height:1.3;min-height:39px;max-height:52px;overflow:hidden}.who{font-size:11px;font-weight:700;color:#ffe18a}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.menu button{min-height:41px;font-size:10px}.sub{display:block;font-size:8px;font-weight:400;opacity:.72;margin-top:2px}.targeting{display:none;grid-template-columns:repeat(2,1fr);gap:6px}.targeting.show{display:grid}.tiny{font-size:9px;opacity:.72}.good{color:#9ef0b4}.bad{color:#ffaaa1}.flash{animation:flash .2s 2}@keyframes flash{50%{filter:brightness(2)}}.shake{animation:shake .18s 2}@keyframes shake{50%{transform:translate(-54%,-50%)}} </style></head><body><div class="app">
<div class="hud"><div class="card" id="stats"></div><div class="card" id="quest"></div></div>
<div class="screen"><canvas id="game" width="320" height="360"></canvas><div class="msg" id="msg">Reach the clocktower beyond the vale.</div>
<div class="battle" id="battle"><div class="arena" id="arena"><div class="ground"></div></div><div class="timeline card"><div class="labels"><span>WAIT</span><span>COMMAND</span><span>ACT</span></div><div class="track" id="track"></div></div><div class="panel card"><div class="battlelog" id="battleLog"></div><div class="menu" id="menu"><button data-act="combo">COMBO<span class="sub">fast · 2 hits · small delay</span></button><button data-act="break">BREAK<span class="sub">slow · cancels casting</span></button><button data-act="spark">SPARK<span class="sub">3 MP · ranged · mastery</span></button><button data-act="guard">GUARD<span class="sub">brace · timeline boost</span></button></div><div class="targeting" id="targets"></div><div class="tiny" id="mastery"></div></div></div></div>
<div class="controls"><div class="dpad"><button data-move="0,-1">▲</button><button data-move="-1,0">◀</button><button id="talk">◎</button><button data-move="1,0">▶</button><button data-move="0,1" style="grid-column:2;grid-row:3">▼</button></div><div class="actions"><button id="save">SAVE</button><button id="rest">REST</button><button id="sound">SOUND</button><button id="reset">NEW</button></div></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),SAVE='chrono-vale-v1';let audio=null,last=0;
const map=['################','#......TT......#','#..H...TT..N...#','#......TT......#','#..............#','#..TTTT..TT....#','#..T......T....#','#..T..~~~~T....#','#.....~~~~.....#','#..TT....TT....#','#...........C..#','#..............#','#......TT......#','#......TT......#','#..............#','################'];
let s={px:2,py:2,hp:42,maxHp:42,mp:10,maxMp:10,lv:1,xp:0,gold:0,potions:2,steps:0,boss:false,sound:true,battle:null,msg:'Reach the clocktower beyond the vale.',mastery:{spark:0,break:0}};
const foes=[{n:'Vale Mite',i:'🪲',hp:23,atk:5,spd:15,x:76,y:54,xp:7,g:4},{n:'Rookling',i:'🐦',hp:28,atk:6,spd:13,x:78,y:48,xp:9,g:6},{n:'Moss Fang',i:'🐺',hp:34,atk:7,spd:11,x:80,y:56,xp:11,g:8}];
function tone(f=440,d=.05){if(!s.sound)return;try{audio||(audio=new AudioContext());if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function tile(ch,px,py){const col={'#':'#48515a','.':'#55704b','T':'#263a2d','~':'#284f6a','H':'#816746','N':'#685779','C':'#78574c'}[ch]||'#333';ctx.fillStyle=col;ctx.fillRect(px,py,20,20);if(ch==='T'){ctx.fillStyle='#35523c';ctx.fillRect(px+5,py+2,10,14)}if(ch==='H'){ctx.fillStyle='#d4b468';ctx.fillRect(px+3,py+5,14,11)}if(ch==='N'){ctx.fillStyle='#ead8b9';ctx.fillRect(px+6,py+5,8,10)}if(ch==='C'){ctx.fillStyle='#d6b46d';ctx.fillRect(px+5,py+2,10,16);ctx.fillStyle='#382e29';ctx.fillRect(px+9,py+4,2,10)}}
function draw(){ctx.clearRect(0,0,c.width,c.height);for(let y=0;y<16;y++)for(let q=0;q<16;q++)tile(map[y][q],q*20,y*20);ctx.fillStyle='#ffd76b';ctx.beginPath();ctx.arc(s.px*20+10,s.py*20+10,7,0,7);ctx.fill();ctx.fillStyle='#49311f';ctx.fillRect(s.px*20+7,s.py*20+3,6,4);renderHud()}
function renderHud(){$('stats').innerHTML=`L${s.lv} HP ${s.hp}/${s.maxHp}<br>MP ${s.mp}/${s.maxMp} · XP ${s.xp}/${s.lv*14}`;$('quest').innerHTML=`${s.gold}G · 🧪${s.potions}<br>${s.boss?'Clocktower quiet':'Clocktower sealed'}`;$('msg').textContent=s.msg}
function walkable(ch){return ch!=='#'&&ch!=='T'&&ch!=='~'}
function move(dx,dy){if(s.battle)return;const nx=s.px+dx,ny=s.py+dy;if(!walkable(map[ny][nx])){s.msg='Blocked.';tone(140);draw();return}s.px=nx;s.py=ny;s.steps++;tone(260,.025);const t=map[ny][nx];if(t==='C'&&!s.boss){startBattle([{n:'Hour Warden',i:'🗿',hp:72,atk:9,spd:12,x:78,y:50,xp:35,g:28,boss:true},{n:'Bell Wisp',i:'🔔',hp:28,atk:5,spd:16,x:72,y:68,xp:12,g:7}]);return}if(t==='.'&&s.steps>3&&Math.random()<.14){const e={...foes[Math.floor(Math.random()*foes.length)]};startBattle(Math.random()<.35?[e,{...foes[0],n:'Small Mite',hp:17,spd:17,x:82,y:68,xp:5,g:3}]:[e]);return}s.msg=t==='N'?'A pathfinder watches the road. Tap ◎ to speak.':'The vale ticks softly underfoot.';draw()}
function talk(){if(s.battle)return;let found=false;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if(map[s.py+oy]?.[s.px+ox]==='N'){found=true;s.msg='Pathfinder: “Watch the line. A glowing enemy is committed. Break them before ACT.”'}if(map[s.py][s.px]==='H'||map[s.py-1]?.[s.px]==='H'){found=true;rest()}if(!found)s.msg='Only the clock-grass answers.';draw()}
function makeHero(){return{id:'hero',n:'Kestrel',i:'⚔️',enemy:false,hp:s.hp,maxHp:s.maxHp,spd:15+s.lv,ip:18,queued:null,guard:false,x:23,y:61,alive:true}}
function startBattle(list){const units=[makeHero(),...list.map((e,j)=>({...e,id:'e'+j,enemy:true,maxHp:e.hp,ip:10+j*7,queued:null,guard:false,alive:true}))];s.battle={units,paused:false,selecting:null,pendingAct:null,log:'Enemies intercept you.',ended:false};$('battle').classList.add('show');$('menu').style.display='grid';$('targets').classList.remove('show');renderBattle();tone(110,.09);last=performance.now();requestAnimationFrame(loop)}
function battleUnits(){return s.battle?.units||[]}
function hero(){return battleUnits().find(u=>u.id==='hero')}
function livingEnemies(){return battleUnits().filter(u=>u.enemy&&u.alive)}
function loop(t){if(!s.battle)return;const dt=Math.min(.05,(t-last)/1000||0);last=t;tickBattle(dt);renderBattle();if(s.battle)requestAnimationFrame(loop)}
function tickBattle(dt){const b=s.battle;if(!b||b.paused||b.ended)return;for(const u of b.units){if(!u.alive)continue;if(u.ip<66){u.ip+=u.spd*dt;if(u.ip>=66){u.ip=66;if(u.enemy)enemyChoose(u);else openCommand(u)}}else if(u.queued){u.ip+=u.queued.rate*dt;if(u.ip>=100){u.ip=100;resolveAction(u)}}}}
function openCommand(u){const b=s.battle;b.paused=true;b.selecting=u.id;b.log=`${u.n} is ready. Choose before the enemy reaches ACT.`;$('menu').style.display='grid';$('targets').classList.remove('show');}
function enemyChoose(u){const target=hero();if(!target?.alive)return;const heavy=Math.random()<.32;u.queued=heavy?{type:'crush',name:'HEAVY CRUSH',rate:12,target:'hero'}:{type:'jab',name:'CLAW',rate:22,target:'hero'};s.battle.log=`${u.n} prepares ${u.queued.name}.`;}
function chooseAction(type){const b=s.battle,u=hero();if(!b||!u||b.selecting!=='hero')return;if(type==='guard'){u.guard=true;u.queued={type:'guard',name:'GUARD',rate:60,target:'hero'};b.selecting=null;b.paused=false;b.log='Kestrel braces and recovers tempo.';return}if(type==='spark'&&s.mp<3){b.log='Not enough MP.';tone(120);return}b.pendingAct=type;showTargets()}
function showTargets(){const b=s.battle;$('menu').style.display='none';const box=$('targets');box.innerHTML='';for(const e of livingEnemies()){const bt=document.createElement('button');bt.innerHTML=`${e.i} ${e.n}<span class="sub">HP ${Math.max(0,e.hp)}/${e.maxHp} · IP ${Math.floor(e.ip)}</span>`;bt.onpointerdown=ev=>{ev.preventDefault();queuePlayer(e.id)};box.appendChild(bt)}const cancel=document.createElement('button');cancel.textContent='BACK';cancel.onpointerdown=ev=>{ev.preventDefault();b.pendingAct=null;box.classList.remove('show');$('menu').style.display='grid'};box.appendChild(cancel);box.classList.add('show')}
function queuePlayer(targetId){const b=s.battle,u=hero(),type=b.pendingAct;if(!u||!type)return;const dist=Math.abs((livingEnemies().find(e=>e.id===targetId)?.x||70)-u.x);let q;if(type==='combo')q={type,name:'COMBO',rate:25-Math.min(7,dist*.05),target:targetId};if(type==='break')q={type,name:'BREAK',rate:15+Math.min(8,s.mastery.break*.45),target:targetId};if(type==='spark'){s.mp-=3;q={type,name:'SPARK',rate:20+Math.min(10,s.mastery.spark*.5),target:targetId}}u.queued=q;b.pendingAct=null;b.selecting=null;b.paused=false;$('targets').classList.remove('show');$('menu').style.display='grid';b.log=`Kestrel commits to ${q.name}.`;tone(360,.04);renderHud()}
function shove(u,n){u.ip=Math.max(8,u.ip-n);if(u.ip<66)u.queued=null}
function resolveAction(u){const b=s.battle;if(!b||!u.alive)return;const q=u.queued;u.queued=null;if(q.type==='guard'){u.ip=20;return}const target=b.units.find(v=>v.id===q.target&&v.alive);if(!target){u.ip=18;return}if(!u.enemy){let dmg=0,push=0,cancel=false;if(q.type==='combo'){const a=5+s.lv+Math.floor(Math.random()*4),d=4+s.lv+Math.floor(Math.random()*4);dmg=a+d;push=7;b.log=`Combo lands twice for ${a}+${d}.`}else if(q.type==='break'){s.mastery.break++;dmg=7+s.lv*2+Math.floor(Math.random()*5);push=20;cancel=!!target.queued&&target.ip>=66;b.log=cancel?`BREAK! ${target.n}'s ${target.queued.name} is cancelled.`:`Break hits for ${dmg} and hammers the timeline.`}else if(q.type==='spark'){s.mastery.spark++;dmg=11+s.lv*2+Math.floor(Math.random()*5);push=10;b.log=`Spark arcs across the field for ${dmg}.`}target.hp-=dmg;if(cancel){target.queued=null;target.ip=34}else shove(target,push);animateUnit(target.id,'shake');tone(cancel?850:560,.07);if(target.hp<=0)killUnit(target);u.ip=16;checkWin()}else{let dmg=Math.max(1,u.atk+Math.floor(Math.random()*4)-s.lv);if(hero().guard){dmg=Math.max(1,Math.floor(dmg*.4));hero().guard=false;b.log=`Guard catches ${u.n}'s ${q.name}. ${dmg} damage.`}else b.log=`${u.n}'s ${q.name} hits for ${dmg}.`;s.hp=Math.max(0,s.hp-dmg);hero().hp=s.hp;shove(hero(),q.type==='crush'?18:8);animateUnit('hero','shake');tone(160,.08);u.ip=15;if(s.hp<=0)loseBattle();}}
function animateUnit(id,cls){const el=document.getElementById('unit-'+id);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function killUnit(u){u.alive=false;u.hp=0;u.ip=0;u.queued=null;s.battle.log+=` ${u.n} falls.`}
function checkWin(){const b=s.battle;if(!b||livingEnemies().length)return;const defeated=b.units.filter(u=>u.enemy);let xp=defeated.reduce((a,e)=>a+e.xp,0),g=defeated.reduce((a,e)=>a+e.g,0);s.xp+=xp;s.gold+=g;if(defeated.some(e=>e.boss))s.boss=true;let out=`Victory! +${xp} XP · +${g}G.`;while(s.xp>=s.lv*14){s.xp-=s.lv*14;s.lv++;s.maxHp+=7;s.maxMp+=2;s.hp=s.maxHp;s.mp=s.maxMp;out+=` LEVEL ${s.lv}!`}b.ended=true;b.paused=true;b.log=out;renderBattle();tone(900,.15);setTimeout(()=>{endBattle();s.msg=s.boss?'The Hour Warden is broken. The clocktower doors open.':'You learned the rhythm. Keep moving.';save();draw()},900)}
function loseBattle(){const b=s.battle;b.ended=true;b.paused=true;b.log='The timeline goes dark. You wake at the vale house.';tone(90,.18);setTimeout(()=>{s.hp=s.maxHp;s.mp=s.maxMp;s.px=2;s.py=2;s.gold=Math.max(0,s.gold-3);endBattle();s.msg='Recovered at the house. A few coins are gone.';draw()},950)}
function endBattle(){s.battle=null;$('battle').classList.remove('show')}
function renderBattle(){const b=s.battle;if(!b)return;const arena=$('arena');arena.querySelectorAll('.unit').forEach(e=>e.remove());for(const u of b.units){if(!u.alive)continue;const el=document.createElement('div');el.className='unit '+(u.enemy?'enemy':'');el.id='unit-'+u.id;el.style.left=u.x+'%';el.style.top=u.y+'%';el.innerHTML=`<div class="intent">${u.queued?u.queued.name:''}</div><div class="sprite">${u.i}</div><div class="name">${u.n} ${u.enemy?Math.max(0,u.hp)+'/'+u.maxHp:s.hp+'/'+s.maxHp}</div>`;arena.appendChild(el)}const track=$('track');track.innerHTML='';for(const u of b.units){if(!u.alive)continue;const t=document.createElement('div');t.className='tick '+(u.enemy?'enemy ':'')+(u.ip>=66?'ready':'');t.style.left=Math.max(2,Math.min(98,u.ip))+'%';t.textContent=u.i;t.title=u.n;track.appendChild(t)}$('battleLog').innerHTML=`${b.selecting?'<span class="who">YOUR COMMAND</span><br>':''}${b.log}`;$('mastery').textContent=`Mastery · BREAK ${s.mastery.break} · SPARK ${s.mastery.spark} · repeated use shortens commit time`;renderHud()}
function rest(){if(s.battle)return;s.hp=s.maxHp;s.mp=s.maxMp;s.msg='You rest. HP and MP restored.';tone(620,.08);draw()}
function save(){localStorage.setItem(SAVE,JSON.stringify({...s,battle:null}));if(!s.battle){s.msg='Game saved locally.';draw()}}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE));if(v)s={...s,...v,battle:null,mastery:{spark:0,break:0,...v.mastery}}}catch{}draw()}
function reset(){localStorage.removeItem(SAVE);location.reload()}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...b.dataset.move.split(',').map(Number))}));document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();chooseAction(b.dataset.act)}));$('talk').onclick=talk;$('save').onclick=save;$('rest').onclick=rest;$('reset').onclick=reset;$('sound').onclick=()=>{s.sound=!s.sound;s.msg=`Sound ${s.sound?'on':'off'}.`;tone(440);draw()};document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pointerdown',()=>{if(audio?.state==='suspended')audio.resume()},{once:false});load();
</script></body></html>
