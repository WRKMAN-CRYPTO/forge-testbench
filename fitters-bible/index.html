const SC_SOURCES = [

 {id:'scbc7',name:'2021 SC Building Code · Chapter 7',kind:'ADOPTED CODE',url:'https://codes.iccsafe.org/content/SCBC2021P1/chapter-7-fire-and-smoke-protection-features',desc:'Fire-resistance-rated assemblies, penetrations and firestopping in §714.'},
 {id:'scfc9',name:'2021 SC Fire Code · Chapter 9',kind:'ADOPTED CODE',url:'https://codes.iccsafe.org/content/SCFC2021P1/chapter-9-fire-protection-and-life-safety-systems',desc:'Fire protection and sprinkler systems under the South Carolina Fire Code.'},
 {id:'nfpa',name:'NFPA 13 · official standards portal',kind:'REFERENCED STANDARD',url:'https://www.nfpa.org/codes-and-standards/nfpa-standard-development-process/13',desc:'Use the 2019 edition for the 2021-code baseline unless the approved project specifies otherwise. Chapters 17 and 18.'},
 {id:'icc',name:'ICC · 2021 IBC rated-wall training',kind:'ICC EDUCATION',url:'https://www.iccsafe.org/wp-content/uploads/2021-IBC-Inspection-of-Fire-Resistance-Rated-Walls.pdf',desc:'ICC guidance on the requirements and inspection of fire-rated wall penetrations.'},
 {id:'ifc',name:'International Firestop Council · seismic clearance',kind:'TECHNICAL GUIDANCE',url:'https://firestop.org/wp-content/uploads/2025/09/NFPA-13-seismic-protection-requirements-rev-2025.pdf',desc:'Chapter 18 clearance summary and explanation of firestop interactions for the 2019/2022 editions.'},
 {id:'charleston',name:'Charleston County · code schedule',kind:'LOCAL / TRANSITION',url:'https://charlestoncounty.gov/departments/building-inspection-services/ordinances.php',desc:'Confirms the 2021 cycle and upcoming 2024 code implementation on January 1, 2027.'},
 {id:'hanger',name:'NFPA public-input reference · hanger table',kind:'BACKGROUND / NOT CODE',url:'https://docinfofiles.nfpa.org/files/AboutTheCodes/13/13_A2024_AUT_HBS_PIReport.pdf',desc:'Historical public-input document showing the table layout. Not adopted code; confirm data against NFPA 13-2019.'},
 {id:'nfpa13d',name:'NFPA 13D · official portal',kind:'RESIDENTIAL STANDARD',url:'https://www.nfpa.org/codes-and-standards/1/3/d/nfpa-13d',desc:'One- and two-family dwellings and manufactured homes; separate scope from NFPA 13.'},
 {id:'law',name:'SC Code §40-10-240',kind:'STATE / LEGISLATION',url:'https://law.justia.com/codes/south-carolina/title-40/chapter-10/section-40-10-240/',desc:'State law addressing design and installation in accordance with adopted building and fire codes.'}
];
const SC_CATEGORIES = {
 seismic:{number:'01',title:'Seismic',subtitle:'Movement, restraint & sway bracing',intro:'From flexible couplings to four-way bracing: understand the purpose of each assembly, where it belongs, and what the design must verify.',color:'amber',symbol:'⌁',hint:'NFPA 13 (2019) · CHAPTER 18',kinds:['All','Design basis','Bracing','Flexibility','Restraint']},
 hangers:{number:'02',title:'Hangers',subtitle:'Pipe support & structural attachments',intro:'Hanger spacing is only the first question. The load path from pipe to structure, attachment type, and unsupported lengths matter just as much.',color:'blue',symbol:'⌑',hint:'NFPA 13 (2019) · CHAPTER 17',kinds:['All','Spacing','Attachments','Special cases']},
 penetrations:{number:'03',title:'Penetrations',subtitle:'Walls, floors, ceilings & firestopping',intro:'A hole in a rated assembly is part of a tested system. Match the wall or floor, penetrant, annular space and firestop listing before closing it.',color:'green',symbol:'◎',hint:'2021 SC BUILDING CODE · §714',kinds:['All','Wall','Floor','Ceiling','Systems']}
};
function guide(id,cat,title,kind,summary,codes,steps,verify,avoid,sources){return {id,cat,title,kind,summary,codes,steps,verify,avoid,sources};}
const SC_GUIDES = [
 guide('s-design','seismic','Does seismic bracing apply?','Design basis','Check the approved seismic design before deciding which system sections require bracing. South Carolina location alone is not a substitute for the building-specific criteria.',
 ['SCBC Chapter 16 (structural design)','NFPA 13-2019 §18.1','SCBC §903.3.1.1'],
 ['Find the approved seismic/bracing notes, structural seismic criteria, design seismic coefficient, and NFPA 13 edition.','Identify wet, dry, preaction or other systems and the permitted piping materials and support systems.','Confirm the engineer’s delegated bracing design, loads and structural attachment approval.','Coordinate seismic bracing with hangers, trades, structural steel and rated penetrations before drilling.'],
 ['Approved plans establish whether seismic provisions apply.','Bracing and attachment calculation package is available.','Actual installation conditions match the approved design.'],
 ['Assuming the entire state has identical seismic demands.','Adding a brace to an unverified structural member.'],['bcc','scbc9','nfpa']),
 guide('s-lateral','seismic','Lateral sway bracing','Bracing','Resists movement across the pipe axis. A lateral brace is different from a standard gravity hanger.',
 ['NFPA 13-2019 §§18.5.5, 18.5.9','NFPA 13-2019 §18.6'],
 ['Locate the approved lateral braces on feed and cross mains regardless of nominal pipe size; check branch lines 2½ in. and larger.','Confirm the brace angle, orientation, listed fittings, force capacity and calculated zone of influence.','Follow the approved spacing layout; 40 ft on center is a common upper limit, not an automatic permitted spacing.','Check the last brace to pipe end and any changes in direction against the plan and detailed Chapter 18 rules.'],
 ['Brace resists force perpendicular to main.','Pipe clamp and structural fitting are rated for the calculated load.','Branch lines not laterally braced have required restraint, if applicable.'],
 ['Using 40 ft as a universal design without checking load tables.','Mistaking a hanger rod for a sway brace.'],['nfpa']),
 guide('s-longitudinal','seismic','Longitudinal sway bracing','Bracing','Resists movement along the length of the pipe. Generally applied to feed and cross mains as required by the seismic design.',
 ['NFPA 13-2019 §18.5.6','NFPA 13-2019 §18.5.9'],
 ['Read the longitudinal brace locations on the approved drawings.','Identify pipe run direction and install the force path parallel to the main.','Check end distances, directional changes and whether a qualifying brace can serve more than one direction.','Verify loads and anchor capacities independently of the regular hanger layout.'],
 ['Correct force direction and geometry.','Spacing and end distances match Chapter 18 and design.','No unapproved substitutions of brace components.'],
 ['Assuming lateral bracing covers longitudinal demand.','Copying a brace arrangement onto a different structural connection.'],['nfpa']),
 guide('s-riser','seismic','Four-way bracing at risers','Bracing','Controls riser movement in multiple horizontal directions. Especially important at vertical runs and riser transitions.',
 ['NFPA 13-2019 §18.5.8'],
 ['Identify system risers and vertical sections shown for four-way restraint.','Check the rule for tops of risers over 3 ft and the specific exceptions for certain short risers or riser nipples.','Locate listed brace assemblies and the structural anchor points on the approved drawings.','Include vertical and horizontal loads as required when the four-way assembly attaches to horizontal pipe.'],
 ['Top-of-riser bracing is evaluated, not assumed unnecessary.','Brace location and supported riser length comply with the design.','Riser can move as intended at floor penetrations without breaking the firestop.'],
 ['Omitting riser bracing because intermediate floors seem tight.','Using a ceiling-grid connection as structural support.'],['nfpa','ifc']),
 guide('s-flex','seismic','Flexible couplings & movement','Flexibility','Allow piping and building components to move differently. A rigid-type grooved coupling is not automatically a seismic flexible coupling.',
 ['NFPA 13-2019 §18.2'],
 ['Identify structural separations, riser transitions and other required movement points on the plan.','Use couplings whose listing actually provides the needed angular or axial movement.','Confirm fitting orientations, groove dimensions and manufacturer assembly requirements.','Account for additional sway bracing when more flexible couplings are used than required.'],
 ['Flexible versus rigid designation is verified from listing.','Locations match the approved drawing.','Couplings and gaskets are assembled per the manufacturer.'],
 ['Substituting rigid couplings because they look similar.','Adding flex couplings without reviewing bracing impact.'],['nfpa']),
 guide('s-separation','seismic','Building seismic separation joints','Flexibility','Piping crossing a seismic separation joint needs an approved movement assembly, not simply an oversized penetration hole.',
 ['NFPA 13-2019 §18.3'],
 ['Identify every building seismic joint crossed by sprinkler piping.','Use the approved seismic separation assembly configuration with the needed multidirectional displacement capacity.','Provide required bracing on either side per the engineered arrangement.','Coordinate joint cover, fire-rated joint system and pipe access with the architect and firestop trade.'],
 ['Movement capacity is documented.','Brace locations do not restrain the movement assembly.','Rated joint or barrier continuity is maintained.'],
 ['Crossing a building joint with rigid piping and no movement design.','Attaching bracing directly to a movement assembly unless specifically approved.'],['nfpa','scbc7']),
 guide('s-clearance','seismic','Seismic clearance at penetrations','Flexibility','When Chapter 18 seismic clearance is required, the opening must permit movement while retaining the required fire and smoke protection.',
 ['NFPA 13-2019 §§18.4.1–18.4.10','2021 SCBC §714'],
 ['Confirm that seismic provisions apply and check the listed exceptions in §18.4.','For nominal 1 through 3½ in. pipe, the general hole-diameter allowance is 2 in. larger than pipe; for 4 in. and larger, 4 in. larger. These are diameter additions, not radial gaps.','Check sleeve alternatives, approved material flexibility and firestop listing for rated construction.','Keep required clearance clear of hard mortar, rigid grout or other unapproved restraint.'],
 ['Hole/sleeve meets the applicable clearance detail.','Firestop is listed for the actual assembly and movement condition.','Pipe and sleeve are not accidentally locked together.'],
 ['Misreading a 2 in. diameter increase as 2 in. clearance on every side.','Using the nonrated-gypsum exception on a rated wall under NFPA 13-2019.'],['nfpa','ifc','scbc7']),
 guide('s-restraint','seismic','Small branch-line restraint','Restraint','Branch lines not assigned lateral sway bracing may still require restraint against differential movement.',
 ['NFPA 13-2019 §18.6','NFPA 13-2019 §18.5.5.1.1'],
 ['Identify branch lines not equipped with lateral braces.','Check the restraints and permitted hanger arrangements on the approved plan.','Confirm the restraint attaches to a structural element or approved support, not solely to ceiling finish.','Maintain sprinkler position and clearance from ceiling or obstructions.'],
 ['Restraint detail is approved for the pipe and geometry.','Restraint does not replace gravity hanging.','No conflict with seismic separation or firestop.'],
 ['Treating “no brace required” as “no restraint required.”','Improvised wire ties substituted for a listed restraint.'],['nfpa']),
 guide('s-hardware','seismic','Brace fittings, fasteners & anchors','Bracing','The weakest connection controls the sway-brace load path. Geometry and capacity must match the engineered configuration.',
 ['NFPA 13-2019 §§18.5, 18.5.9','NFPA 13-2019 §17.2'],
 ['Compare the actual brace tube, clamp, structural fitting and anchorage with the schedule and listing.','Verify base material, embedment, edge distances, installation torque and substrate condition for anchor approval.','Keep documented load path to the structural frame.','Resolve deck, joist or structural conflicts with the design professional before relocating a brace.'],
 ['Approved clamp, member and anchor combination.','Geometry and load orientation match design.','Fasteners installed and documented per their listing.'],
 ['Mixing unlisted parts from incompatible seismic kits.','Attaching to roof deck, purlins or other material without verified capacity.'],['nfpa']),
 guide('s-coordination','seismic','Obstructions & trade coordination','Design basis','Braces must not compromise sprinkler discharge patterns, access, ceilings or other systems.',
 ['NFPA 13-2019 §18.1.3','NFPA 13-2019 Chapters 10–14'],
 ['Review brace routes against sprinkler obstruction criteria.','Check conflicts with ducts, lighting, cable tray, ceiling supports and expansion joints.','Ask for a coordinated approved relocation when the designed brace cannot be installed.','Reinspect connections and sprinkler clearances after other trades complete their work.'],
 ['No sprinkler spray obstruction.','Approved coordination changes are reflected in as-builts.','Other trades have not displaced or loaded the brace.'],
 ['Field-moving a brace without revising calculations.','Using fire sprinkler piping to support foreign equipment.'],['nfpa']),

 guide('h-steel','hangers','Steel pipe spacing','Spacing','Common maximum intervals under Table 17.4.2.1 for ordinary steel piping. The maximum is not a substitute for branch-line placement rules.',
 ['NFPA 13-2019 Table 17.4.2.1(a)','NFPA 13-2019 §§17.4.2–17.4.4'],
 ['Determine nominal pipe size and whether it is threaded lightwall steel.','For ordinary steel except threaded lightwall: 1 in. and 1¼ in. commonly have a 12 ft table maximum; 1½ in. and larger commonly have 15 ft.','For threaded lightwall steel 1–3 in., the common table maximum is 12 ft.','Next check individual pipe sections, end-of-line unsupported lengths and any exceptions.'],
 ['Correct pipe material and schedule identified.','Hanger count and end lengths checked in addition to span.','Attachment capacity matches the complete loaded assembly.'],
 ['Measuring 15 ft across every size and material.','Ignoring the unsupported last sprinkler while checking midspan only.'],['nfpa','hanger']),
 guide('h-copper','hangers','Copper tube spacing','Spacing','Copper requires shorter distances for smaller sizes. Confirm tube type and connection details.',
 ['NFPA 13-2019 Table 17.4.2.1(a)','NFPA 13-2019 §17.4.3.4'],
 ['Confirm copper tube is approved for the system and piping installation method.','Reference common table values: ¾–1 in. = 8 ft; 1¼–1½ in. = 10 ft; 2–3 in. = 12 ft; 3½ in. and larger = 15 ft.','Check special shorter unsupported end-sprinkler distances for copper.','Use supports suitable for copper and the actual environmental/corrosion conditions.'],
 ['All spacing measured along pipe run.','End sprinkler unsupported length checked.','No unapproved contact, galvanic or fitting interference.'],
 ['Using steel pipe end-length allowances on copper.','Treating general plumbing hanger rules as NFPA sprinkler hanger rules.'],['nfpa','hanger']),
 guide('h-cpvc','hangers','CPVC & listed nonmetallic pipe','Spacing','The specific pipe and fitting listing determines permitted support spacing, restraint details and compatibility.',
 ['NFPA 13-2019 §17.4.2.2','NFPA 13-2019 Chapter 7'],
 ['Identify manufacturer, system listing and nominal pipe size.','Use the pipe manufacturer’s published hanger/spacing chart and approved support types, not a steel quick chart.','Check temperature, chemical compatibility, insulation contact and exposure limitations.','Coordinate seismic restraint only under the applicable NFPA 13 and listing requirements.'],
 ['Manufacturer instructions are available on site.','Support placement matches the listed product system.','Supports do not crush or abrade pipe.'],
 ['Applying steel-pipe spacing to CPVC.','Using incompatible sealants, adhesives or support liners.'],['nfpa']),
 guide('h-branch','hangers','Branch lines & individual pipe sections','Spacing','Table maxima do not eliminate requirements for where hangers actually land relative to outlets and sections.',
 ['NFPA 13-2019 §17.4.3'],
 ['Map branch-line sections, outlets, armovers and last heads.','Apply the general at-least-one-hanger-per-section rule, then examine the explicit exceptions in §17.4.3.2.','Locate the last hanger in relation to the end sprinkler using the material and size limits.','Confirm the hanger does not conflict with an upright sprinkler deflector or fitting.'],
 ['Each section has required support or a permitted exception.','End-of-line support verified separately.','Sprinkler coverage is not obstructed.'],
 ['Assuming a 12 ft span automatically permits two unsupported pipe sections.','Hangers interfering with an upright head.'],['nfpa']),
 guide('h-end','hangers','End sprinklers & unsupported lengths','Special cases','The last hanger-to-end-sprinkler distance can control even when the hanger spacing table is satisfied.',
 ['NFPA 13-2019 §17.4.3.4'],
 ['Measure the horizontal unsupported distance from last hanger to end sprinkler.','Common steel limits: 1 in. = 36 in.; 1¼ in. = 48 in.; 1½ in. or larger = 60 in.','Common copper limits: 1 in. = 18 in.; 1¼ in. = 24 in.; 1½ in. or larger = 30 in.','Review tighter rules for high-pressure pendent configurations and other special conditions.'],
 ['Material and pipe size match the chosen limit.','Measurement uses the appropriate points on the actual assembly.','Additional hanger added where required.'],
 ['Using steel allowances for copper.','Ignoring special high-pressure and drop/armover limits.'],['nfpa']),
 guide('h-anchors','hangers','Concrete anchors & inserts','Attachments','Concrete attachments must carry the full sprinkler-system load and meet anchor approval and installation criteria.',
 ['NFPA 13-2019 §17.2.2'],
 ['Identify sound concrete, thickness, reinforcement, cracks and any prohibited materials.','Select the approved cast-in insert or post-installed anchor for the application and loading.','Verify drill size, hole cleaning, edge distance, embedment, installation direction and torque against the listing.','Do not substitute a general-purpose wedge, screw or adhesive anchor without confirming approval.'],
 ['Substrate and anchor match approval.','Installation conditions and orientation meet the listing.','Loads are transmitted to structural concrete, not an unsupported finish.'],
 ['Using anchors in gypsum or similar soft ceiling material.','Anchoring into uncertain hollow fill or damaged concrete.'],['nfpa']),
 guide('h-steelstructure','hangers','Structural steel, beam clamps & trapeze','Attachments','A hanger assembly includes pipe clamp, rod, connection hardware and structural support. Each component matters.',
 ['NFPA 13-2019 §§17.2–17.4'],
 ['Confirm structural member is permitted to carry the proposed load.','Choose listed beam clamp, rod and pipe attachment compatible with member thickness and geometry.','For trapeze arrangements, check channel/strut span, deflection, combined pipe loads and connection capacity on the approved detail.','Lock/clamp and orient fittings exactly as the listing and design require.'],
 ['Beam or joist is structural and approved.','Every component meets the load requirement.','Trapeze does not contact or damage other services.'],
 ['Clamping to deck, ceiling grid or unsupported sheet metal.','Assuming a generic strut channel can support any number of mains.'],['nfpa']),
 guide('h-wood','hangers','Wood framing & engineered members','Attachments','Wood attachment details depend on actual member type and fastener geometry, not just visible board thickness.',
 ['NFPA 13-2019 §17.2'],
 ['Confirm solid sawn versus engineered lumber and the structural attachment requirements.','Use approved wood screws, lag screws, eye rods or other attachment types in the configuration required.','Respect fastener penetration, edge distances and prohibited drilling/notching locations.','Obtain engineering approval before modifying trusses or engineered joists.'],
 ['Correct structural lumber identified.','Specified attachment is installed in sound wood.','No unauthorized cuts or holes in engineered structural members.'],
 ['Installing into blocking or sheathing assumed to be structural.','Drilling through truss chords without authorization.'],['nfpa']),
 guide('h-flexdrop','hangers','Flexible sprinkler drops & ceilings','Special cases','Flexible hose assemblies may rely on a listed mounting bracket, but that does not mean ceiling systems can support any load.',
 ['NFPA 13-2019 Chapter 17','NFPA 13-2019 sprinkler/hose listings'],
 ['Identify the listed flexible sprinkler hose and bracket combination.','Check hose length, bend radius, mounting layout and allowable ceiling or bracket type.','Verify the grid or other assembly meets the hose listing and structural requirements.','Maintain the correct head location, deflector elevation and accessible adjustment.'],
 ['Hose and bracket listings are compatible.','Head is stable at its specified elevation.','No hoses kinked or overstressed.'],
 ['Supporting rigid sprinkler mains from the ceiling grid.','Assuming any hose bracket works with any ceiling.'],['nfpa']),
 guide('h-pressure','hangers','High-pressure pendent lines & armovers','Special cases','Some above-ceiling branch lines supplying pendent heads need additional uplift restraint and shorter unsupported lengths.',
 ['NFPA 13-2019 §17.4.3.4.4','NFPA 13-2019 §17.4.3.5'],
 ['Check maximum static or flowing pressure at the sprinkler, excluding FDC pressure as applicable.','Where the special condition exceeds 100 psi and has pendents below the ceiling, apply the additional hanger/uplift and armover requirements.','Verify the exact steel/copper/nonmetallic arrangement under the applicable edition and listing.','Check for movement under discharge or test pressure.'],
 ['Pressure condition documented.','Uplift restraint is provided when required.','Tighter allowable end/armover lengths are satisfied.'],
 ['Using normal low-pressure allowances without checking pressures.','Treating a long unsupported armover as a harmless offset.'],['nfpa']),

 guide('p-identity','penetrations','Identify the rated assembly first','Systems','Before choosing any firestop product, determine what wall, floor or ceiling system you are actually penetrating.',
 ['2021 SCBC §§703, 714','2021 SCBC §§714.4–714.6'],
 ['Read approved life-safety, architectural and rated-assembly drawings.','Identify the rated assembly type, required rating, construction materials and thickness.','Classify the opening as a through-penetration, membrane penetration, joint or nonrated condition.','Find a tested system matching the actual assembly, pipe and opening.'],
 ['Assembly type and rating recorded.','Actual opening dimensions match chosen system limits.','Penetrant material is explicitly allowed by listing.'],
 ['Calling every red-painted wall rated.','Choosing a firestop product by color or brand instead of a listing.'],['scbc7','icc']),
 guide('p-wall','penetrations','Fire-rated drywall partitions','Wall','Gypsum stud partitions require a matching wall-specific penetration firestop system, including the number of layers and stud construction.',
 ['2021 SCBC §§714.2–714.4','ASTM E814 / UL 1479'],
 ['Identify the UL/other approved wall construction and rating.','Match penetrating pipe material, size, insulation and sleeve arrangement to an approved system.','Set annular gap, backing material, mineral wool compression and sealant depth exactly as tested.','Firestop each required side and document the system number before concealment.'],
 ['System F rating meets the required wall rating.','Penetrating pipe and insulation match listing.','Required firestop depth and side of application are verified.'],
 ['Assuming any red caulk makes a compliant system.','Using the NFPA 13 nonrated-gypsum seismic exception for rated drywall.'],['scbc7','icc','ifc']),
 guide('p-masonry','penetrations','Concrete & CMU walls','Wall','Concrete and masonry walls can have different approved methods and exceptions. Do not assume an unlisted mortar patch qualifies.',
 ['2021 SCBC §714.4.1','2021 SCBC §714.3'],
 ['Confirm rated wall thickness, concrete or masonry composition, pipe material and opening size.','Select an approved through-penetration system or confirm the precise code exception applies.','Where sleeves are used, protect both pipe-to-sleeve and sleeve-to-wall spaces as required.','Coordinate earthquake movement and firestop flexibility before rigidly packing annular space.'],
 ['Wall rating restored per the applicable method.','Opening and penetrant fall within code exception, if relied upon.','Seismic clearance remains functional where required.'],
 ['Blanket application of a concrete/grout exception to plastic pipe.','Rigidly grouting a pipe that needs seismic movement.'],['scbc7','ifc']),
 guide('p-smoke','penetrations','Smoke barriers & smoke partitions','Wall','Smoke control may require more than an F rating. Determine whether a listed L-rated system is necessary.',
 ['2021 SCBC §714.5.4','2021 SCBC §714.4'],
 ['Confirm whether the partition is a smoke barrier versus another rated assembly.','Review required leakage criteria and select a firestop system with documented L rating when applicable.','Coordinate movement gaps and other smoke paths around sleeves and coverings.','Inspect the completed system for continuous sealing.'],
 ['Specified leakage criteria meet the assembly requirements.','Listing includes the actual pipe, material and opening.','Smoke-sealing work remains intact after pipe adjustments.'],
 ['Treating F rating as proof of smoke-leakage performance.','Leaving sleeve-to-wall path unsealed.'],['scbc7','icc']),
 guide('p-floor','penetrations','Fire-rated concrete floors','Floor','Horizontal penetrations often require both F and T ratings. Floor-specific listings are not interchangeable with wall systems.',
 ['2021 SCBC §§714.5.1–714.5.2','ASTM E814 / UL 1479'],
 ['Identify slab construction, thickness, fire rating and any corrugated deck profile.','Choose a tested floor-penetration system for the pipe size and penetrant material.','Check F and T ratings and any applicable exceptions; do not infer them from wall listings.','Install required backing, annular gap and fill depth, including bottom-side treatment when listed.'],
 ['F and T ratings satisfy the applicable floor provision or approved exception.','Sleeve, insulation and deck profile match listing.','Opening remains sealed around full circumference.'],
 ['Using a wall-only firestop system through a floor.','Assuming a collar is optional on combustible penetrants.'],['scbc7']),
 guide('p-ceiling','penetrations','Rated floor/ceiling membranes','Ceiling','Penetrating only the ceiling membrane is different from penetrating an entire floor assembly.',
 ['2021 SCBC §714.5.2','2021 SCBC §714.5.1'],
 ['Determine if the ceiling is part of a listed fire-resistance-rated floor/ceiling or roof/ceiling assembly.','Classify the pipe, head, escutcheon, trim and insulation as a membrane penetration.','Use a listed system or an actual code exception that covers the condition.','Check head deflector elevation and firestop compatibility with the listed assembly.'],
 ['Rated assembly identification verified.','Exception or protection method documented.','No altered ceiling components that invalidate the assembly.'],
 ['Assuming every decorative escutcheon is a firestop.','Using a ceiling head exception for a full pipe through-penetration.'],['scbc7','icc']),
 guide('p-unrated','penetrations','Non-rated walls & floors','Floor','An unrated opening is not automatically unrestricted. Smoke, draft, acoustic and vertical-opening controls may still apply.',
 ['2021 SCBC §714.6','2021 SCBC §713','Local approved plans'],
 ['Verify construction is actually non-rated from the plans.','Determine whether the opening creates a connection between stories or crosses a smoke-controlled area.','Provide approved sealing or shaft protection wherever required by the applicable provisions.','Coordinate sleeves, weatherproofing and trade responsibilities.'],
 ['No overlooked shaft, occupancy separation or smoke barrier.','Penetrating item permitted in the location.','Any required fire/smoke seal present.'],
 ['Treating an unrated floor as permission to leave a continuous open chase.','Assuming a wall is nonrated based on finish appearance.'],['scbc7']),
 guide('p-plastic','penetrations','Plastic pipe & combustible penetrants','Systems','CPVC and other nonmetallic piping frequently require tested systems that account for how the pipe reacts in fire.',
 ['2021 SCBC §714','ASTM E814 / UL 1479','Pipe/firestop product listings'],
 ['Confirm pipe resin, manufacturer, schedule/SDR, diameter and fitting details.','Find a tested listing allowing that specific plastic pipe, assembly and insulation.','Install collars, wrap strips or other intumescent elements only as specified by the listed design.','Check chemical compatibility between firestop materials and sprinkler pipe.'],
 ['Listed material and diameter match actual penetrant.','Any collar, wrap or fastener count follows the listing.','Manufacturer compatibility approval is documented.'],
 ['Using a metal-pipe sealant detail on CPVC.','Assuming any intumescent collar is interchangeable.'],['scbc7','nfpa']),
 guide('p-sleeves','penetrations','Sleeves, gaps & annular space','Systems','A sleeve changes the firestop assembly: two separate spaces may need protection, and seismic movement can govern the detail.',

 ['Sleeve attachment and material comply with system.','Annular gap falls within tested range everywhere required.','Neither sleeve nor firestop unintentionally restrains pipe.'],
 ['Packing a required seismic gap with hard grout.','Sizing a sleeve only by nominal pipe size without checking actual dimensions.'],['scbc7','ifc']),
 guide('p-detail','penetrations','Firestop submittals & inspection','Systems','The inspection-ready deliverable is a verifiable listed system, installed as tested, not just a tube of sealant.',
 ['2021 SCBC §§714.2–714.5','UL 1479 / ASTM E814'],
 ['Record system identifier, test/listing source, wall/floor design and F/T/L ratings as applicable.','Record pipe type, insulation, opening dimensions, sleeve, backing and sealant/collar product.','Photograph before concealment, including depth and installation-side requirements.','Mark or log discrepancies and request an approved detail rather than improvising.'],
 ['Listing is accessible to installer and inspector.','Actual assembly matches every relevant listing variable.','Penetrations can be traced to location and inspection records.'],
 ['Mixing elements from two different tested assemblies.','Closing walls before penetration details are verified.'],['scbc7','icc'])
];

  <script>
/* Fitter's Bible SC | standalone offline-first field reference.
   Guidance summarizes code-navigation topics, never substitutes the adopted publications. */
(() => {
  'use strict';
  const $ = (s, p=document) => p.querySelector(s);
  const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));
  const storage = {
    get(k, fallback) { try { const v = localStorage.getItem('fbsc_' + k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem('fbsc_' + k, JSON.stringify(v)); } catch { toast('Storage unavailable: browser may be in private mode.'); } }
  };
  let route = 'home';
  let query = '';
  let filter = 'All';
  let showSavedOnly = false;
  let openGuide = null;
  let favorites = new Set(storage.get('favorites', []));
  let checks = storage.get('checks', {});
  let notes = storage.get('notes', {project:'',ahj:'',edition:'2021 IBC / 2021 IFC + NFPA 13-2019',details:''});
  let changedTimer;
  const view = $('#view');
  const modalRoot = $('#modal-root');

  const escapeHTML = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const source = id => SC_SOURCES.find(s => s.id === id);
  const links = (ids) => ids.map(id => source(id)).filter(Boolean).map(s => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHTML(s.name)}</a>`).join('');
  const guideFor = id => SC_GUIDES.find(g => g.id === id);
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(changedTimer); changedTimer = setTimeout(() => el.classList.remove('show'), 2600); }
  function navigate(to) {
    closeModal();
    route = ['home','seismic','hangers','penetrations','tools','notes','sources'].includes(to) ? to : 'home';
    query = ''; filter='All'; showSavedOnly=false;
    if (window.location.hash.slice(1) !== route) { try { history.replaceState(null, '', '#' + route); } catch { /* restricted in some local-file viewers */ } }
    render();
    window.scrollTo({top:0,behavior:'instant'});
  }
  function navState() {
    $$('[data-route]').forEach(el => {
      const on = el.dataset.route === route;
      el.classList.toggle('active', on);
      el.classList.toggle('selected', on);
      if (el.tagName === 'BUTTON') el.setAttribute('aria-current', on ? 'page' : 'false');
    });
    $('#breadcrumb').innerHTML = 'SOUTH CAROLINA <span>/</span> ' + escapeHTML(route === 'home' ? 'DASHBOARD' : (SC_CATEGORIES[route]?.title || route).toUpperCase());
    ['seismic','hangers','penetrations'].forEach(c => { const el = $('#count-' + c); if (el) el.textContent = String(SC_GUIDES.filter(g=>g.cat===c).length).padStart(2,'0'); });
  }
  function graphic(type='seismic') {
    const common = `viewBox="0 0 520 258" class="diagram" role="img"`;
    if(type==='hangers') return `<svg ${common} aria-label="Pipe with three hanger rods attached to a structural beam"><defs><linearGradient id="pipeA" x1="0" x2="1"><stop stop-color="#ffa16c"/><stop offset="1" stop-color="#cf6739"/></linearGradient></defs><g stroke="#365b65" stroke-width="1" opacity=".6"><path d="M20 30H500M20 75H500M20 120H500M20 165H500M20 210H500" stroke-dasharray="3 8"/></g><rect x="42" y="37" width="435" height="27" rx="4" fill="#405d68"/><path d="M42 64H477" stroke="#8eb0af" stroke-width="3"/><g stroke="#aad0d2" stroke-width="5"><path d="M108 60V146M258 60V146M408 60V146"/></g><g fill="#718d92" stroke="#b6d8d8" stroke-width="2"><rect x="93" y="57" width="30" height="16" rx="3"/><rect x="243" y="57" width="30" height="16" rx="3"/><rect x="393" y="57" width="30" height="16" rx="3"/></g><path d="M34 151H490" stroke="url(#pipeA)" stroke-width="26" stroke-linecap="round"/><path d="M42 146H487" stroke="#ffd0ac" opacity=".65" stroke-width="3"/><g fill="none" stroke="#a8c1c1" stroke-width="6"><path d="M93 138v19q15 19 30 0v-19M243 138v19q15 19 30 0v-19M393 138v19q15 19 30 0v-19"/></g><text x="35" y="235">STRUCTURE</text><text x="364" y="235">LOAD PATH ↓</text></svg>`;
    if(type==='penetrations') return `<svg ${common} aria-label="Pipe crossing fire-rated wall with firestop annular seal"><g stroke="#365b65" stroke-width="1" opacity=".6"><path d="M20 30H500M20 75H500M20 120H500M20 165H500M20 210H500" stroke-dasharray="3 8"/></g><rect x="195" y="18" width="122" height="219" rx="3" fill="#4b636b"/><rect x="207" y="18" width="98" height="219" fill="#29434f"/><g stroke="#62818b" opacity=".5"><path d="M212 28l88 88M212 71l88 88M212 113l88 88M212 155l64 64"/></g><rect x="175" y="95" width="161" height="68" rx="7" fill="#e18454"/><rect x="185" y="105" width="143" height="48" rx="4" fill="#eeb47b"/><path d="M29 129H484" stroke="#cae1dc" stroke-width="36" stroke-linecap="round"/><path d="M29 118H484" stroke="#ffffff" stroke-width="4" opacity=".65" stroke-linecap="round"/><path d="M185 104H328M185 153H328" stroke="#ff915a" stroke-width="8"/><text x="23" y="55">SPRINKLER PIPE</text><text x="338" y="92">TESTED SEAL</text><path d="M354 99L330 113" stroke="#ffa477" stroke-width="2"/><text x="330" y="226">RATED WALL</text></svg>`;
    return `<svg ${common} aria-label="Sprinkler main with diagonal sway brace to structural steel"><g stroke="#365b65" stroke-width="1" opacity=".55"><path d="M20 30H500M20 75H500M20 120H500M20 165H500M20 210H500" stroke-dasharray="3 8"/></g><rect x="28" y="31" width="463" height="28" rx="3" fill="#496671"/><path d="M28 59H491" stroke="#acc8c7" stroke-width="4"/><path d="M120 59L246 167" stroke="#f3a06a" stroke-width="15" stroke-linecap="round"/><path d="M124 60L249 169" stroke="#ffd6af" stroke-width="3"/><g stroke="#a3bbc0" stroke-width="5"><path d="M335 58V168M415 58V168"/></g><g stroke="#ebb084" stroke-width="3" fill="#47606a"><circle cx="120" cy="59" r="10"/><circle cx="246" cy="167" r="11"/></g><path d="M27 177H491" stroke="#c9e1dd" stroke-width="31" stroke-linecap="round"/><path d="M33 166H485" stroke="#fff" stroke-width="3" opacity=".6"/><g fill="none" stroke="#b2cacc" stroke-width="6"><path d="M321 164v16q14 19 28 0v-16M401 164v16q14 19 28 0v-16"/></g><text x="24" y="236">MAIN PIPE</text><text x="343" y="115">SWAY BRACE</text></svg>`;
  }
  function title(label, head, description) { return `<div class="eyebrow">${label}</div><h1 class="headline">${head}</h1><p class="lede">${description}</p>`; }
  function transition() { return `<div class="transition"><b>CODE CYCLE ALERT</b> · As of Oct 28, 2026, SC uses the 2021 IBC/IFC with state modifications (typically NFPA 13-2019 for NFPA 13 systems). The 2024 IBC/IFC cycle starts <b>Jan 1, 2027</b>. Confirm the project's permit basis and AHJ before applying any section or table. <a href="https://llr.sc.gov/BCC/BCAdoption.aspx" target="_blank" rel="noopener noreferrer" style="color:#ffd0a4">State adoption ↗</a></div>`; }
  function renderHome() {
    const saved = favorites.size;
    view.innerHTML = `<div class="hero-top"><div class="hero-content">${title('SOUTH CAROLINA // FIELD GUIDE','Fire protection.<br><span class="light">At your fingertips.</span>','A practical installer’s reference for seismic protection, pipe hangers and wall / floor / ceiling penetrations. Built for finding the right detail before the pipe goes up.')}<div class="pill-row"><span class="pill hot">30 INSTALLATION GUIDES</span><span class="pill">NFPA 13 · 2019 BASELINE</span><span class="pill">OFFLINE LIBRARY</span></div><div class="tools-nudge"><button class="btn" data-route="seismic">Explore the Bible ↗</button><button class="btn secondary" data-route="tools">Quick field lookups</button></div></div><div class="hero-graphic"><div class="graphic-label">FIG 01 / FIELD INSTALLATION SYSTEM</div>${graphic('seismic')}<div class="graphic-index">FB—SC // 001</div></div></div><div class="hairline"></div><div class="section-head"><h2>Choose your chapter</h2><span class="meta">THREE CORE CATEGORIES · 30 GUIDES</span></div><div class="home-grid">${Object.entries(SC_CATEGORIES).map(([k,v]) => `<button class="category-card" data-cat="${k}" data-route="${k}"><div class="category-number">CHAPTER ${v.number} <span style="float:right">${SC_GUIDES.filter(g=>g.cat===k).length} TOPICS</span></div><div class="category-symbol">${v.symbol}</div><h3>${v.title}</h3><p>${v.subtitle}</p><div class="category-footer">BROWSE FIELD GUIDES <span class="arrow">↗</span></div></button>`).join('')}</div>${transition()}<div class="info-row"><div class="info-card"><div class="title-mini">YOUR FIELD KIT</div><h3>${saved} saved guides</h3><p>Star important guides to build a personal quick-reference list. Checklists remember your progress on this device.</p><button class="btn secondary small" data-route="notes">Job notes ↗</button></div><div class="info-card future"><div class="title-mini">IMPORTANT / READ THIS</div><h3>Know your governing documents.</h3><p>This is a curated field guide and code index, not the complete NFPA/IBC text, a stamped design, listing, or permission to change an engineered installation. Follow the approved plans, manufacturer's listing and AHJ instructions.</p><button class="btn secondary small" data-route="sources">Official sources ↗</button></div></div>`;
  }
  function card(g) {
    const favorite = favorites.has(g.id);
    return `<article class="guide-card"><div class="guide-row"><span class="guide-kind">${escapeHTML(g.kind)}</span><span class="guide-id">${escapeHTML(g.id.toUpperCase())}</span></div><h3>${escapeHTML(g.title)}</h3><p>${escapeHTML(g.summary)}</p><div class="guide-bottom"><span class="code-label">${escapeHTML(g.codes[0])}</span><button class="star ${favorite?'saved':''}" data-star="${g.id}" title="${favorite?'Remove saved guide':'Save guide'}" aria-label="${favorite?'Remove saved guide':'Save guide'}">${favorite?'★':'☆'}</button><button class="read-link" data-guide="${g.id}">OPEN GUIDE ↗</button></div></article>`;
  }
  function renderCategory(cat) {
    const c=SC_CATEGORIES[cat], entries=SC_GUIDES.filter(g=>g.cat===cat);
    const matching=entries.filter(g=>(filter==='All'||g.kind===filter) && (!showSavedOnly||favorites.has(g.id)) && ([g.title,g.summary,g.kind,...g.codes,...g.steps].join(' ').toLowerCase().includes(query.toLowerCase())));
    view.innerHTML = `<div class="category-hero"><div>${title('CHAPTER '+c.number+' // '+c.hint,escapeHTML(c.title),escapeHTML(c.intro))}<div class="code-hint">CODE NAVIGATION: ${escapeHTML(c.hint)}</div></div><div class="hero-graphic"><div class="graphic-label">FIELD DETAIL // ${c.number}</div>${graphic(cat)}<div class="graphic-index">CH ${c.number} // SC</div></div></div>${transition()}<div class="guide-tools"><label class="search-wrap"><span>⌕</span><input class="search" id="search" autocomplete="off" type="search" placeholder="Search ${c.title.toLowerCase()}, code, installation detail…" value="${escapeHTML(query)}" aria-label="Search guides"></label><button class="filter-toggle ${showSavedOnly?'on':''}" id="saved-only">${showSavedOnly?'★ SAVED ONLY':'☆ SAVED ONLY'}</button></div><div class="filter-bar" role="group" aria-label="Filter guide type">${c.kinds.map(k=>`<button class="chip ${filter===k?'active':''}" data-filter="${escapeHTML(k)}">${escapeHTML(k)}</button>`).join('')}</div><div class="section-head"><h2>Installation guides</h2><span class="meta" id="match-count">${matching.length} OF ${entries.length} TOPICS</span></div><div class="guide-grid" id="guide-results">${matching.map(card).join('')||'<div class="empty"><b>No guides found.</b><p>Try another search or turn off Saved Only.</p><button class="btn secondary small" id="clear-filters">Clear filters</button></div>'}</div><div class="tools-nudge"><button class="mini-chip" data-route="tools">⊞ Hanger & clearance quick lookups</button><button class="mini-chip" data-route="sources">↗ Official references</button></div>`;
  }
  function renderModal(g) {
    if(!g) return;
    const count = (checks[g.id] || []).filter(Boolean).length;
    const checked = checks[g.id] || [];
    modalRoot.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="guide-heading"><div class="modal-head"><div class="eyebrow">${escapeHTML(SC_CATEGORIES[g.cat].title.toUpperCase())} / ${escapeHTML(g.kind.toUpperCase())} / ${escapeHTML(g.id.toUpperCase())}</div><button class="close-modal" id="modal-close" aria-label="Close guide">×</button><h2 id="guide-heading">${escapeHTML(g.title)}</h2><p>${escapeHTML(g.summary)}</p><div class="modal-code">${g.codes.map(v=>`<span class="code-tag">${escapeHTML(v)}</span>`).join('')}</div></div><div class="modal-body"><section class="detail-section"><h3 class="detail-title">INSTALLATION WALKTHROUGH</h3><ol class="install-list">${g.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol></section><section class="detail-section"><h3 class="detail-title">FIELD VERIFICATION · <span id="check-progress">${count}/${g.verify.length}</span></h3><div>${g.verify.map((s,i)=>`<label class="checkline"><input type="checkbox" data-check="${g.id}" data-index="${i}" ${checked[i]?'checked':''}><span>${escapeHTML(s)}</span></label>`).join('')}</div></section><section class="detail-section"><h3 class="detail-title">WATCH FOR THESE FAILURES</h3>${g.avoid.map(s=>`<div class="warning-item"><span class="warning-icon">⚠</span><span>${escapeHTML(s)}</span></div>`).join('')}</section><section class="detail-section"><h3 class="detail-title">OPEN CODE & REFERENCE MATERIAL</h3><div class="reference-links">${links(g.sources)}</div><p class="details-note">Field guidance only, paraphrased and selective. This guide does not reproduce the full adopted standard, code exceptions, tables, amendments, or tested product approvals. Verify against the adopted edition, approved submittals and the AHJ before installation. Online links require internet.</p></section></div><div class="modal-actions"><button class="btn secondary small" id="modal-star">${favorites.has(g.id)?'★ Saved':'☆ Save guide'}</button><button class="btn secondary small" id="modal-print">▤ Print / PDF</button><button class="btn secondary small" id="clear-checks">↺ Reset checks</button><button class="btn small end" id="modal-done">Done ✓</button></div></section></div>`;
    document.body.style.overflow='hidden';
    $('#modal-close')?.focus({preventScroll:true});
  }
  function openModal(id) { const g = guideFor(id); if (!g) return; openGuide=id; renderModal(g); }
  function closeModal(clear=true){ if(clear) openGuide=null; modalRoot.replaceChildren(); document.body.style.overflow=''; }
  function flipFavorite(id) { if(favorites.has(id)) favorites.delete(id); else favorites.add(id); storage.set('favorites', [...favorites]); if(openGuide){renderModal(guideFor(openGuide));} else { render(); } }
  const sizes = ['0.75','1','1.25','1.5','2','2.5','3','3.5','4','5','6','8'];
  const sizeStr = {'0.75':'¾','1':'1','1.25':'1¼','1.5':'1½','2':'2','2.5':'2½','3':'3','3.5':'3½','4':'4','5':'5','6':'6','8':'8'};
  const steelTable = {'1':12,'1.25':12,'1.5':15,'2':15,'2.5':15,'3':15,'3.5':15,'4':15,'5':15,'6':15,'8':15};
  const thinTable = {'1':12,'1.25':12,'1.5':12,'2':12,'2.5':12,'3':12};
  const copperTable = {'0.75':8,'1':8,'1.25':10,'1.5':10,'2':12,'2.5':12,'3':12,'3.5':15,'4':15,'5':15,'6':15,'8':15};
  const selectSize = (id, first='1') => `<select id="${id}">${sizes.map(v=>`<option value="${v}" ${v===first?'selected':''}>${sizeStr[v]} in.</option>`).join('')}</select>`;
  function renderTools() {
    view.innerHTML = `${title('TOOLS // FIELD LOOKUPS','Measure twice.<br><span class="light">Check the code.</span>','Fast reference tools for routine questions. These lookups do not design an attachment, replace a listed assembly or account for exceptions on a particular project.')}${transition()}<div class="tools-grid"><div class="tool-card"><div class="tool-index">01 / NFPA 13-2019 TABLE 17.4.2.1(a)</div><h3>Hanger spacing lookup</h3><p>Common maximum span for material and nominal pipe size. Not permission to omit hangers at individual sections or ends.</p><div class="form-row"><div class="field"><label for="hanger-material">PIPE TYPE</label><select id="hanger-material"><option value="steel">Steel (not threaded lightwall)</option><option value="thin">Threaded lightwall steel</option><option value="copper">Copper tube</option><option value="cpvc">CPVC / other listed nonmetallic</option></select></div><div class="field"><label for="hanger-size">NOMINAL SIZE</label>${selectSize('hanger-size')}</div></div><div class="tool-output" id="hanger-result"></div><p class="tool-disclaimer">Confirm NFPA 13 §17.4 and the manufacturer listing. The selected table does not cover uplift, end support, special seismic conditions or engineered deviations.</p><button class="btn secondary small" data-guide="h-branch">Open placement rules ↗</button></div><div class="tool-card"><div class="tool-index">02 / NFPA 13-2019 §18.4</div><h3>Seismic clearance lookup</h3><p>Nominal minimum hole-diameter increase, where Chapter 18 clearance applies and no exception is valid.</p><div class="form-row"><div class="field"><label for="clear-size">NOMINAL PIPE SIZE</label>${selectSize('clear-size','2')}</div><div class="field"><label for="clear-condition">INSTALLATION</label><select id="clear-condition"><option value="hole">Un-sleeved opening</option><option value="sleeve">Pipe sleeve</option></select></div></div><div class="tool-output" id="clear-result"></div><p class="tool-disclaimer">Nominal diameter increase, not a radial annular-gap dimension. For unsleeved openings compare to actual pipe outside diameter. Check the §18.4 exceptions, movement accommodation and the tested firestop listing.</p><button class="btn secondary small" data-guide="s-clearance">See all exceptions ↗</button></div><div class="tool-card full"><div class="tool-index">03 / PENETRATION DECISION PATH</div><h3>Firestop system finder</h3><p>Determine the type of listed assembly you need. This tool deliberately does not nominate a UL system number without knowing the exact tested assembly and product.</p><div class="form-row"><div class="field"><label for="pen-location">PENETRATION LOCATION</label><select id="pen-location"><option value="wall">Wall</option><option value="floor">Floor / slab</option><option value="ceiling">Ceiling membrane</option></select></div><div class="field"><label for="pen-rating">ASSEMBLY CLASSIFICATION</label><select id="pen-rating"><option value="rated">Fire-resistance rated</option><option value="smoke">Smoke barrier / control</option><option value="unrated">Non-rated (confirmed)</option><option value="unknown">Not sure</option></select></div></div><div class="form-row"><div class="field"><label for="pen-material">PENETRATING PIPE</label><select id="pen-material"><option value="metal">Steel / copper</option><option value="plastic">CPVC / plastic</option><option value="insulated">Insulated pipe</option></select></div><div class="field"><label for="pen-type">PENETRATION TYPE</label><select id="pen-type"><option value="through">Through-penetration</option><option value="membrane">Membrane-only opening</option></select></div></div><div class="tool-output wizard-results" id="pen-result"></div><button class="btn secondary small" data-guide="p-detail">Inspection checklist ↗</button></div></div>`;
    updateTools();
  }
  function updateTools() {
    const hMat=$('#hanger-material')?.value, size=$('#hanger-size')?.value;
    if(hMat && size){
      const table = hMat==='steel'?steelTable:hMat==='thin'?thinTable:hMat==='copper'?copperTable:{};
      const val = table[size];
      $('#hanger-result').innerHTML=`<div class="result-label">COMMON TABLE MAXIMUM</div><div class="result-big">${val?val+' ft':'LOOK UP'}</div><div class="result-small">${val?`Nominal ${sizeStr[size]} in. ${hMat==='steel'?'steel':hMat==='thin'?'threaded lightwall steel':'copper'} · NFPA 13-2019 Table 17.4.2.1(a).`:'No general value shown for that selection; use the listed manufacturer instructions and adopted NFPA 13 table.'}</div>`;
    }
    const s=$('#clear-size')?.value, c=$('#clear-condition')?.value;
    if(s && c){const v = parseFloat(s) <= 3.5 ? 2 : 4;$('#clear-result').innerHTML=`<div class="result-label">NOMINAL DIAMETER INCREASE</div><div class="result-big">+${v} in.</div><div class="result-small">${c==='sleeve'?'Nominal sleeve diameter':'Opening diameter'} compared with nominal pipe size ${sizeStr[s]} in., subject to §18.4 exceptions and any listed firestop system. Do <b>not</b> interpret as ${v} in. clearance on each side.</div>`;}
    const loc=$('#pen-location')?.value, rating=$('#pen-rating')?.value, mat=$('#pen-material')?.value, type=$('#pen-type')?.value;
    if(loc){
      const items=[];
      if(rating==='unknown') items.push('STOP: get the approved life-safety / architectural assembly rating before selecting firestop.');
      else if(rating==='unrated') items.push('Confirm the assembly is truly non-rated, then check smoke, draft, shafts and story-to-story opening rules.');
      else {items.push(`Find a tested ${loc==='wall'?'wall':loc==='floor'?'floor':'ceiling membrane'} system compatible with the actual rated construction and required duration.`);items.push(`Check F rating; ${loc==='floor'?'verify T rating unless a code exception applies':loc==='wall'?'verify any additional smoke-leakage requirement':'verify membrane-penetration criteria / exception'}.`);}
      if(rating==='smoke') items.push('Check applicable L-rated leakage criteria and sealing of the entire annular path.');
      if(mat==='plastic') items.push('Confirm the tested system explicitly allows the plastic sprinkler pipe and any intumescent collar / wrap configuration.');
      if(mat==='insulated') items.push('Match the insulation type, thickness and whether it passes continuously through the assembly.');
      if(type==='membrane') items.push('Membrane-only openings are evaluated differently from through-penetrations. Check whether a specific sprinkler exception applies.');
      items.push('Document the listed system number, opening size, backing, application side, sealant depth, assembly thickness and inspection photos.');
      items.push('If seismic provisions apply, coordinate a flexible penetration/firestop system and the required §18.4 clearance.');
      $('#pen-result').innerHTML=`<div class="result-label">WHAT TO VERIFY</div><ul>${items.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ul>`;
    }
  }
  function renderNotes() {
    view.innerHTML = `${title('TOOLBOX // JOB NOTES','Keep the details.<br><span class="light">Lose the guesswork.</span>','A private, on-device scratchpad for inspections, measurements and the authority having jurisdiction. Nothing is sent to a server. Export your notes before clearing browser data.')}${transition()}<div class="notes-grid"><div class="notes-card"><h3>Project identity</h3><div class="field"><label for="note-project">PROJECT / LOCATION</label><input id="note-project" placeholder="Project or site name" value="${escapeHTML(notes.project)}"></div><div class="field" style="margin-top:14px"><label for="note-ahj">AHJ / INSPECTOR / PERMIT</label><input id="note-ahj" placeholder="Jurisdiction and permit notes" value="${escapeHTML(notes.ahj)}"></div><div class="field" style="margin-top:14px"><label for="note-edition">APPROVED CODE EDITION</label><input id="note-edition" placeholder="Confirm with stamped plans" value="${escapeHTML(notes.edition)}"></div><p class="note-guidance">The baseline shown is a starting reference. Change it to match your specific approved project.</p></div><div class="notes-card"><h3>Saved guide shortcuts</h3><div class="note-save">${favorites.size} FAVORITES ON THIS DEVICE</div>${[...favorites].map(id=>guideFor(id)).filter(Boolean).map(g=>`<button class="mini-chip" data-guide="${g.id}" style="display:block;width:100%;text-align:left;margin:7px 0">★ ${escapeHTML(g.title)} ↗</button>`).join('')||'<p class="note-guidance">Browse Seismic, Hangers or Penetrations and tap ☆ to save a field guide.</p>'}</div><div class="notes-card full"><h3>Field log</h3><div class="field"><label for="note-details">MEASUREMENTS / LISTING NUMBERS / OPEN ITEMS</label><textarea id="note-details" placeholder="Ex: Building B, level 2. Firestop system W-L-____ pending approval. Confirm seismic brace attachment on grid C4…">${escapeHTML(notes.details)}</textarea></div><div class="notes-action"><button class="btn" id="save-notes">Save notes</button><button class="btn secondary" id="export-notes">↓ Export .txt</button><button class="btn secondary" id="copy-notes">Copy notes</button></div><p class="note-guidance">Stored locally in this browser. Export the log as a backup. Not a substitute for contract-approved records or AHJ inspection documents.</p></div></div>`;
  }
  function readNotes(){return {project:$('#note-project')?.value||'',ahj:$('#note-ahj')?.value||'',edition:$('#note-edition')?.value||'',details:$('#note-details')?.value||''};}
  function notesText(n){return `FITTER'S BIBLE / SOUTH CAROLINA\nProject: ${n.project}\nAHJ / permit: ${n.ahj}\nGoverning edition: ${n.edition}\nSaved guides: ${[...favorites].map(id=>guideFor(id)?.title).filter(Boolean).join('; ')}\n\nFIELD LOG\n${n.details}\n\nReference compiled Oct 28, 2026. Confirm approved drawings, listing, adopted codes and AHJ.`;}
  function renderSources() {
    view.innerHTML = `${title('REFERENCE DESK // SOURCES','Find the rule.<br><span class="light">Confirm the edition.</span>','Government adoption pages, the referenced NFPA standard, and technical guidance. External full code text may require an account, subscription or online access.')}${transition()}<div class="section-head"><h2>Reference library</h2><span class="meta">${SC_SOURCES.length} SOURCES / DIRECT LINKS</span></div><div class="source-grid">${SC_SOURCES.map(s=>`<article class="source-card"><div class="eyebrow">${escapeHTML(s.kind)}</div><h3>${escapeHTML(s.name)}</h3><p>${escapeHTML(s.desc)}</p><a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">VIEW ORIGINAL SOURCE ↗</a></article>`).join('')}</div><div class="info-card future" style="margin-top:21px"><div class="title-mini">HOW TO USE THIS APP SAFELY</div><h3>Four documents beat one shortcut.</h3><p>Always reconcile <b>the project-approved drawings</b>, <b>South Carolina-adopted code and modifications</b>, <b>product listings / manufacturer instructions</b>, and <b>the AHJ's requirements</b>. If they conflict, stop and seek a documented approved resolution instead of choosing the easier detail.</p></div>`;
  }
  function render(){ navState(); if (route === 'home') renderHome(); else if(SC_CATEGORIES[route]) renderCategory(route); else if(route === 'tools') renderTools(); else if(route === 'notes') renderNotes(); else renderSources(); }
  function download(name, content){ const b = new Blob([content],{type:'text/plain;charset=utf-8'}), u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000); }
  document.addEventListener('click', e => {
    const routeBtn=e.target.closest('[data-route]'); if(routeBtn){ e.preventDefault(); navigate(routeBtn.dataset.route); return; }
    const star=e.target.closest('[data-star]'); if(star){flipFavorite(star.dataset.star);return;}
    const guide=e.target.closest('[data-guide]'); if(guide){openModal(guide.dataset.guide);return;}
    const tag=e.target.closest('[data-filter]'); if(tag){filter=tag.dataset.filter; renderCategory(route); $('#search')?.focus({preventScroll:true}); return;}
    if(e.target.closest('#saved-only')){showSavedOnly=!showSavedOnly;renderCategory(route);return;}
    if(e.target.closest('#clear-filters')){query='';filter='All';showSavedOnly=false;renderCategory(route);return;}
    if(e.target.id==='modal-close'||e.target.id==='modal-done'||e.target.id==='modal-backdrop'){closeModal();return;}
    if(e.target.closest('#modal-star')){flipFavorite(openGuide);return;}
    if(e.target.closest('#modal-print')){window.print();return;}
    if(e.target.closest('#clear-checks')) { checks[openGuide]=[]; storage.set('checks',checks); renderModal(guideFor(openGuide)); toast('Checklist reset.'); return; }
    if(e.target.closest('#save-notes')){notes=readNotes();storage.set('notes',notes);toast('Saved on this device.');return;}
    if(e.target.closest('#export-notes')){notes=readNotes();storage.set('notes',notes);download('fitters-bible-job-notes.txt',notesText(notes));return;}
    if(e.target.closest('#copy-notes')){notes=readNotes();storage.set('notes',notes); const str=notesText(notes); if(navigator.clipboard?.writeText){navigator.clipboard.writeText(str).then(()=>toast('Copied notes.'),()=>toast('Clipboard permission denied.'));}else toast('Clipboard unavailable; use Export instead.');return;}
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='search' && SC_CATEGORIES[route]){
      query=e.target.value;const cat=route;const items=SC_GUIDES.filter(g=>g.cat===cat && (filter==='All'||g.kind===filter) && (!showSavedOnly||favorites.has(g.id)) && ([g.title,g.summary,g.kind,...g.codes,...g.steps].join(' ').toLowerCase().includes(query.toLowerCase())));
      $('#guide-results').innerHTML=items.map(card).join('')||'<div class="empty"><b>No guides found.</b><p>Try another term or another filter.</p></div>';
      $('#match-count').textContent=`${items.length} OF ${SC_GUIDES.filter(g=>g.cat===cat).length} TOPICS`;
    }
    if(['note-project','note-ahj','note-edition','note-details'].includes(e.target.id)){notes=readNotes();storage.set('notes',notes);}
  });
  document.addEventListener('change',e=>{
    if(e.target.matches('[data-check]')) { const id=e.target.dataset.check, index=Number(e.target.dataset.index); checks[id]??=[]; checks[id][index]=e.target.checked; storage.set('checks',checks);const count=checks[id].filter(Boolean).length;$('#check-progress').textContent=`${count}/${guideFor(id).verify.length}`;return; }
    if(['hanger-material','hanger-size','clear-size','clear-condition','pen-location','pen-rating','pen-material','pen-type'].includes(e.target.id)){updateTools();}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && openGuide)closeModal();
    if(e.key==='Tab' && openGuide){const el=$('.modal');if(el){const focusables=$$('button,[href],input,[tabindex]:not([tabindex="-1"])',el).filter(el=>!el.disabled);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}
  });
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==route)navigate(next);});
  window.addEventListener('online',updateNetwork);
  window.addEventListener('offline',updateNetwork);
  function updateNetwork(){const el=$('#network-indicator');if(!el)return;el.textContent=navigator.onLine?'FIELD EDITION':'OFFLINE MODE';}
  const initial=location.hash.slice(1);
  navigate(['home','seismic','hangers','penetrations','tools','notes','sources'].includes(initial)?initial:'home');
  updateNetwork();
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
</body>
</html>
