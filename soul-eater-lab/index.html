<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#11182b"><title>Soul Eater | Crucible Test Bench</title><style>html,body{margin:0;background:#11182b;color:#e9e5ff;overflow:hidden;touch-action:manipulation}canvas{display:block;width:100vw;height:100dvh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
(()=>{'use strict';const cv=document.getElementById('c'),g=cv.getContext('2d');let W=400,H=800,dpr=1,run=true,speed=1,mode=0,duels=0,won=0,lost=0,captures=0,releases=0,peak=0,collapse=0,history=[],soulId=0;const MAX=Infinity,N=32;let souls=[],eater=null,challenger=null,phase=0,buttons=[],tick=0,flash=0;
const colors=['#b8a1ed','#93e5d3','#ffb2bf','#ffd39c','#98c3ff','#d6e88d'];
function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[Math.random()*a.length|0]}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function newSoul(){return{id:++soulId,color:pick(colors),drive:rand(-1,1),caution:rand(-1,1),state:'free',holder:null,life:0}}
function reset(){souls=Array.from({length:N},newSoul);duels=won=lost=captures=releases=peak=collapse=0;history=[];eater={id:'EATER',soul:newSoul(),captives:[],hp:100,streak:0};souls.push(eater.soul);eater.soul.state='eater';challenger=null;phase=0;nextChallenger();run=true;speed=1;flash=0}
function nextChallenger(){const free=souls.filter(s=>s.state==='free');if(!free.length){collapse++;challenger=null;run=false;log('NO FREE SOULS: population collapse');return}const s=pick(free);s.state='active';s.life++;challenger={soul:s,hp:100,power:rand(.75,1.25),streak:0};phase=0}
function log(t){history.unshift(t);history=history.slice(0,5)}
function releaseAll(){if(!eater.captives.length)return;for(const s of eater.captives){s.state='free';s.holder=null}releases+=eater.captives.length;log(eater.captives.length+' souls freed on defeat');eater.captives=[]}
function collective(){const voices=[eater.soul,...eater.captives];const drive=voices.reduce((a,s)=>a+s.drive,0)/voices.length;const caution=voices.reduce((a,s)=>a+s.caution,0)/voices.length;const disagreement=Math.sqrt(voices.reduce((a,s)=>a+(s.drive-drive)**2+(s.caution-caution)**2,0)/voices.length);return {drive,caution,disagreement,voices:voices.length}}
function duel(){if(!challenger)return;duels++;const mind=collective();const decision=clamp(.52+.26*mind.drive-.20*mind.caution-.08*mind.disagreement+.02*eater.streak/(eater.streak+10),.18,.80);const win=Math.random()<decision/challenger.power;
 if(win){won++;eater.streak++;challenger.hp=0;const s=challenger.soul;if(true){s.state='bound';s.holder=eater.soul.id;eater.captives.push(s);captures++;log('S'+s.id+' bound • '+eater.captives.length+' / UNLIMITED')}else{s.state='free';log('S'+s.id+' escaped • vessel full')}eater.hp=clamp(eater.hp+rand(2,10),1,100);flash=1}
 else{lost++;releaseAll();eater.streak=0;challenger.soul.state='free';eater.hp=100;log('Eater defeated by S'+challenger.soul.id);flash=-1}
 peak=Math.max(peak,eater.captives.length);if(duels%100===0)log('Duel '+duels+' • '+souls.filter(s=>s.state==='free').length+' free');nextChallenger()}
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function txt(s,x,y,size=13,color='#eae5ff',align='left',weight=700){g.fillStyle=color;g.font=weight+' '+size+'px system-ui,Arial';g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y)}
function button(label,x,y,w,h,fn,active=false){rr(x,y,w,h,11,active?'#53486e':'#283455','#6e7a9e');txt(label,x+w/2,y+h/2,12,'#eee8ff','center',800);buttons.push({x,y,w,h,fn})}
function gauge(x,y,w,v,color){rr(x,y,w,8,4,'#11192e');rr(x,y,Math.max(2,w*clamp(v,0,1)),8,4,color)}
function drawCreature(x,y,r,col,ears=2){g.fillStyle='#00000044';g.beginPath();g.ellipse(x,y+r*.78,r*.95,r*.22,0,0,Math.PI*2);g.fill();g.fillStyle=col;for(let i=0;i<ears;i++){g.beginPath();g.ellipse(x+(i?1:-1)*r*.37,y-r*.67,r*.19,r*.5,(i?-.22:.22),0,Math.PI*2);g.fill()}g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x+r*.35,y-r*.10,r*.16,0,Math.PI*2);g.fill();g.fillStyle='#1a2441';g.beginPath();g.arc(x+r*.4,y-r*.1,r*.07,0,Math.PI*2);g.fill()}
function render(){buttons=[];g.fillStyle='#11182b';g.fillRect(0,0,W,H);const pad=14,wide=W-28,top=22;rr(pad,top,wide,65,15,'#202b48','#5c688a');txt('✧ SOUL EATER LAB',pad+15,top+23,18,'#f2e2ff');txt('ISOLATED EXPERIMENT • NO SAVED POPULATION',pad+15,top+47,9,'#9fe6cf');
const arenaY=102,arenaH=Math.min(270,H*.33);rr(pad,arenaY,wide,arenaH,18,'#2a3459','#6b77a4');g.fillStyle='#3b456c';g.fillRect(pad+2,arenaY+arenaH*.73,wide-4,arenaH*.26);
const cx=pad+wide*.29,cy=arenaY+arenaH*.57,ex=pad+wide*.75;const t=performance.now()*.001;
for(let i=0;i<eater.captives.length;i++){const a=t*.7+i*Math.PI*2/Math.max(1,eater.captives.length),ox=cx+Math.cos(a)*54,oy=cy+Math.sin(a)*43;g.beginPath();g.arc(ox,oy,9,0,7);g.fillStyle=eater.captives[i].color;g.shadowBlur=16;g.shadowColor=eater.captives[i].color;g.fill();g.shadowBlur=0}
drawCreature(cx,cy,38,'#ad89da');if(challenger)drawCreature(ex,cy,31,challenger.soul.color);txt('SOUL EATER',cx,arenaY+23,11,'#e3c9ff','center');txt(challenger?'S'+challenger.soul.id+' • CHALLENGER':'NO CHALLENGER',ex,arenaY+23,10,'#b4efdf','center');txt('STREAK '+eater.streak,cx,arenaY+arenaH-17,11,'#ffcf9b','center');txt('BOUND '+eater.captives.length+' / ∞',ex,arenaY+arenaH-17,11,'#f3c4e6','center');
let y=arenaY+arenaH+13;const bw=(wide-8)/3;button(run?'Ⅱ PAUSE':'▶ RUN',pad,y,bw,43,()=>{run=!run},run);button(speed+'× SPEED',pad+bw+4,y,bw,43,()=>{speed=[1,10,100,1000][([1,10,100,1000].indexOf(speed)+1)%4]},speed>1);button('RESET',pad+2*(bw+4),y,bw,43,reset);y+=55;
rr(pad,y,wide,113,13,'#202b48','#56658a');txt('POPULATION HEALTH',pad+13,y+19,12,'#f4e9ff');const free=souls.filter(s=>s.state==='free').length, bound=souls.filter(s=>s.state==='bound').length,active=souls.filter(s=>s.state==='active').length;txt('FREE '+free,pad+13,y+48,13,'#9ce8d4');txt('BOUND '+bound,pad+wide*.5,y+48,13,'#e4ade6');txt('ACTIVE '+active,pad+13,y+77,11,'#a8c9ff');txt('SAFE RELEASES '+releases,pad+wide*.5,y+77,11,'#ffc59c');gauge(pad+13,y+99,wide-26,(free+active)/(N+1),'#91e6d6');y+=125;
rr(pad,y,wide,101,13,'#202b48','#56658a');txt('EXPERIMENT COUNTERS',pad+13,y+18,12,'#f4e9ff');txt('DUELS '+duels,pad+13,y+43,13);txt('CAPTURES '+captures,pad+wide*.52,y+43,13,'#e3b0e8');txt('EATER WINS '+won,pad+13,y+73,11,'#9ce8d4');txt('DEFEATS '+lost,pad+wide*.52,y+73,11,'#ffb6c4');y+=113;
rr(pad,y,wide,Math.max(68,H-y-21),13,'#202b48','#56658a');txt('SOUL INFLUENCE & EVENTS',pad+13,y+18,12,'#f4e9ff');const mind=collective();txt(mind.voices+' VOICES • DRIVE '+(mind.drive>=0?'+':'')+mind.drive.toFixed(2)+' • CAUTION '+mind.caution.toFixed(2),pad+13,y+43,10,mind.drive>=0?'#9ce8d4':'#ffb5c4');txt('DISAGREEMENT '+mind.disagreement.toFixed(2)+' • ALL VOICES COUNT',pad+13,y+61,9,'#d7b8f2');history.slice(0,Math.max(0,Math.floor((H-y-94)/19))).forEach((t,i)=>txt(t,pad+13,y+82+i*19,10,'#c1cde8'));if(flash){g.fillStyle=flash>0?'#f7d7ff09':'#ff777713';g.fillRect(0,0,W,H);flash=0}
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);render()}let last=0,acc=0;function loop(ts){const dt=Math.min(.1,(ts-last)/1000||0);last=ts;if(run){acc+=dt*speed;let n=0;while(acc>.20&&n<1200){duel();acc-=.20;n++}}render();requestAnimationFrame(loop)}
cv.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;for(const b of buttons)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();break}});window.addEventListener('resize',resize);reset();resize();requestAnimationFrame(loop);
})();
</script></body></html>
