<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WRKMAN | Agent-Language Time Machine</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#090e17;color:#e9f3ff}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #26364a;background:#101b2b}.brand{font-weight:900;letter-spacing:.16em;color:#7be7c9}.sub{font-size:11px;color:#96a9c1;letter-spacing:.15em}button,select,input,a.control{font:inherit;color:#dceaff;background:#1b2a40;border:1px solid #3a5069;border-radius:9px;padding:10px;cursor:pointer;text-decoration:none}button:hover,a.control:hover{background:#28445a}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7be7c9}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0d1725}.controls select{flex:1;min-width:125px}.controls input{width:140px;max-width:35vw}.active{font-weight:700;color:#7be7c9}.stage{height:calc(100dvh - 133px);min-height:360px;position:relative;background:#03070e}iframe{height:100%;width:100%;border:0;background:#080e15}.hint{font-size:12px;color:#93a6bf;margin-left:auto}.pill{background:#13392f;color:#8df4ce;border:1px solid #286d57;border-radius:30px;padding:5px 9px;font-size:11px}@media(max-width:650px){header{padding:9px 12px}.controls{padding:8px}.controls input{width:100px}.stage{height:calc(100dvh - 168px)}.hint{display:none}button,select,input,a.control{padding:9px 7px;font-size:13px}}
</style></head><body><header><div><div class="brand">WRKMAN <span style="color:#fff">/ AGENT-LANGUAGE</span></div><div class="sub">THE TIME MACHINE · ORIGINAL BUILDS, UNMODIFIED</div></div><span class="pill">56 archived entry points</span><span class="hint">Independent worlds · switch versions instantly</span></header><div class="controls"><button id="prev" aria-label="Previous build">◀ Prev</button><select id="build" aria-label="Choose build"></select><button id="next" aria-label="Next build">Next ▶</button><input id="jump" placeholder="Jump to # e.g. 47" inputmode="numeric" aria-label="Jump to build number"><button id="go">Go</button><a class="control" id="external" target="_blank" rel="noopener">↗ Fullscreen</a></div><main class="stage"><iframe id="world" title="Selected Agent-Language experiment" allow="fullscreen"></iframe></main><script>
